</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Deep learning: A revolution in Artificial Intelligence"><div class="titlepage"><div><div><h1 class="title"><a id="ch01lvl1sec9"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Deep learning: A revolution in Artificial Intelligence</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">An extensive history of deep learning is beyond the scope of this book. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">However, to get an interest in and cognizance of this subject, some basic context of the background is essential.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">In the introduction, we already talked a little about how deep learning occupies a space in the perimeter of Artificial Intelligence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">This section will detail more on how machine learning and deep learning are correlated or different from each other. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">We will also discuss how the trend has varied for these two topics in the last decade or so.</span></p><div class="blockquote"><table border="0" width="100%" cellspacing="0" cellpadding="0" class="blockquote" summary="Block quote"><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> </span></td><td valign="top"><p>

<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">"Deep Learning waves have lapped at the shores of computational linguistics for several years now, but 2015 seems like the year when the full force of the tsunami hit the major Natural Language Processing (NLP) conferences."</span></em></span>
</p></td><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> </span></td></tr><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> </span></td><td colspan="2" align="right" valign="top" style="text-align: center"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">--</span><span class="attribution"><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Dr. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">Christopher D. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">Manning, Dec 2015</span></em></span></span></td></tr></table></div><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"><img src="graphics/B05883_01_17.jpg" alt="Deep learning: A revolution in Artificial Intelligence"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Figure 1.9: Figure depicts that deep learning was in the initial phase approximately 10 years back. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">However, machine learning was somewhat a trending topic in the researcher's community.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Deep learning is rapidly expanding its territory in the field of Artificial Intelligence, and continuously surprising many researchers with its astonishing empirical results. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">Machine learning and deep learning both represent two different schools of thought. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.3">Machine learning can be treated as the most fundamental approach for AI, where as deep learning can be considered as the new, giant era, with some added functionalities of the subject.</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1"><img src="graphics/B05883_01_18-1.jpg" alt="Deep learning: A revolution in Artificial Intelligence"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Figure 1.10: Figure depicts how deep learning is gaining in popularity these days, and trying to reach the level of machine learning</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">However, machine learning has often failed in completely solving many crucial problems of AI, mainly speech recognition, object recognition, and so on.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">The performance of traditional algorithms seems to be more challenging while working with high-dimensional data, as the number of random variables keeps on increasing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">Moreover, the procedures used to attain the generalization in traditional machine-learning approaches are not sufficient to learn complicated obligations in high-dimensional spaces, which generally impel more computational costs of the overall model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">The development of deep learning was mostly motivated by the collapse of the fundamental algorithms of machine learning on such functions, and also to overcome the afore mentioned obstacles.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">A large proportion of researchers and data scientists believe that, in the course of time, deep learning will occupy a major portion of Artificial Intelligence, and eventually make machine learning algorithms obsolete. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2">To get a clear idea of this, we looked at the current Google trend of these two fields and came to the following conclusion:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">The curve of machine learning has always been the growing stage from the past decade. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">Deep learning is new, but growing faster than machine learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.3">When trends are closely observed, one will find that the growth rate is faster for deep learning compared to machine learning.</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Both of the preceding </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Figure 1.9</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1"> and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Figure 1.10</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1"> depict the visualizations of the Google trend.</span></p><div class="section" title="Motivations for deep learning"><div class="titlepage"><div><div><h2 class="title"><a id="ch01lvl2sec8"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Motivations for deep learning</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">One of the biggest-known problems that machine learning algorithms face is the </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">curse of dimensionality</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1"> [12] [13] [14]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">This refers to the fact that certain learning algorithms may behave poorly when the number of dimensions in the dataset is high. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.3">In the next section, we will discuss how deep learning has given sufficient hope to this problem by introducing new features. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.4">There are many other related issues where deep architecture has shown a significant edge over traditional architectures. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.5">In this part of the chapter, we would like to introduce the more pronounced challenges as a separate topic.</span></p><div class="section" title="The curse of dimensionality"><div class="titlepage"><div><div><h3 class="title"><a id="ch01lvl3sec3"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">The curse of dimensionality</span></h3></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">The curse of dimensionality can be defined as the phenomena which arises during the analysis and organization of data in high-dimensional spaces (in the range of thousands or even higher dimensions). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">Machine learning problems face extreme difficulties when the number of dimensions in the dataset is high. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.3">High dimensional data are difficult to work with because of the following reasons:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">With the increasing number of dimensions, the number of features will tend to increase exponentially, which eventually leads to an increase in noise.</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">In standard practice, we will not get a high enough number of observations to generalize the dataset.</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">A straightforward explanation for the curse of dimensionality could be </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">combinatorial explosion</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">As per combinatorial explosion, with the collection of a number of variables, an enormous combination could be built. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.3">For example, with </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">n</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"> binary variables, the number of possible combinations would be </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">O (2</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">n</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.2">So, in high-dimensional spaces, the total number of configurations is going to be almost uncountable, much larger than our number of examples available - most of the configurations will not have such training examples associated with them. </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Figure 1.11</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1"> shows a pictorial representation of a similar phenomenon for better understanding.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">Therefore, this situation is cumbersome for any machine learning model, due to the difficulty in the training. </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Hughes effect</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"> [15] states the following:</span></p><div class="blockquote"><blockquote class="blockquote"><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">"With a fixed number of training samples, the predictive power reduces as the dimensionality increases."</span></em></span>
</p></blockquote></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">Hence, the achievable precision of the model almost collapses as the number of explanatory variables increases.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">To cope with this scenario, we need to increase the size of the sample dataset fed to the system to such an extent that it can compete with the scenario. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.2">However, as the complexity of data also increases, the number of dimensions almost reaches one thousand. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.3">For such cases, even a dataset with hundreds of millions of images will not be sufficient.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Deep learning, with its deeper network configuration, shows some success in partially solving this problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">This contribution is mostly attributed to the following reasons:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">Now, the researchers are able to manage the model complexity by redefining the network structure before feeding the sample for training</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Deep convolutional networks focus on the higher level features of the data rather than the fundamental level information, which extensively further reduces the dimension of features</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">Although deep learning networks have given some insights to deal with the curse of dimensionality, they are not yet able to completely conquer the challenge. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.2">In Microsoft's recent research on super deep neural networks, they have come up with 150 layers; as a result, the parameter space has grown even bigger. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.3">The team has explored the research with even deep networks almost reaching to 1000 layers; however, the result was not up to the mark due to </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">overfitting</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1"> of the model!</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note6"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">Note</span></h3><p>
</p><p>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Over-fitting in machine learning</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">: The phenomenon when a model is over-trained to such an extent that it gives a negative impact to its performance is termed as over-fitting of the model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.2">This situation occurs when the model learns the random fluctuations and unwanted noise of the training datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.3">The consequences of these phenomena are unsatisfactory--the model is not able to behave well with the new dataset, which negatively impacts the model's ability to generalize.</span></p><p>
</p><p>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">Under-fitting in machine learning</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">: This refers to a situation when the model is neither able to perform with the current dataset nor with the new dataset. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.2">This type of model is not suitable, and shows poor performance with the dataset.</span></p><p>
</p></div></div><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1"><img src="graphics/B05883_01_11.jpg" alt="The curse of dimensionality"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">Figure 1.11: Figure shows that with the increase in the number of dimensions from one to three, from top to bottom, the number of random variables might increase exponentially. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.2">Image reproduced with permission from Nicolas Chapados from his article DataMining Algorithms for Actuarial Ratemaking.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">In the 1D example (top) of the preceding figure, as there are only 10 regions of interest, it should not be a tough task for the learning algorithm to generalize correctly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.2">However, with the higher dimension 3D example (bottom), the model needs to keep track of all the </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">10*10*10=1000</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1"> regions of interest, which is much more cumbersome (or almost going to be an impossible task for the model). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.2">This can be used as the simplest example of the curse of dimensionality.</span></p></div><div class="section" title="The vanishing gradient problem"><div class="titlepage"><div><div><h3 class="title"><a id="ch01lvl3sec4"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">The vanishing gradient problem</span></h3></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">The vanishing gradient problem [16] is the obstacle found while training the Artificial neural networks, which is associated with some gradient-based method, such as Backpropagation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.2">Ideally, this difficulty makes learning and training the previous layers really hard. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.3">The situation becomes worse when the number of layers of a deep neural network increases aggressively.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">The gradient descent algorithms particularly update the weights by the negative of the gradient multiplied by small scaler value (lies between </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">0</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1"> and </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">1</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">).</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">                </span></p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1"><img src="graphics/Capture-6.jpg" alt="The vanishing gradient problem"/></span></div><p>
</p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1"><img src="graphics/B05883_01_24.jpg" alt="The vanishing gradient problem"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">As shown in the preceding equations, we will repeat the gradient until it reaches zero. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.2">Ideally, though, we generally set some hyper-parameter for the maximum number of iterations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.3">If the number of iterations is too high, the duration of the training will also be longer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.4">On the other hand, if the number of iterations becomes imperceptible for some deep neural network, we will surely end up with inaccurate results.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">In the vanishing gradient problem, the gradients of the network's output, with respect to the parameters of the previous layers, become extremely small. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.2">As a result, the resultant weight will not show any significant change with each iteration. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.3">Therefore, even a large change in the value of parameters for the earlier layers does not have a significant effect on the overall output. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.4">As a result of this problem, the training of the deep neural networks becomes infeasible, and the prediction of the model becomes unsatisfactory. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.5">This phenomenon is known as the vanishing gradient problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.6">This will result in some elongated cost function, as shown in next </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">Figure 1.12</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1"><img src="graphics/image_01_020.jpg" alt="The vanishing gradient problem"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">Figure 1.12: Image of a flat gradient and an elongated cost function</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">An example with large gradient is also shown in the following </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">Figure 1.13</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">, where the gradient descent can converge quickly:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1"><img src="graphics/image_01_021.jpg" alt="The vanishing gradient problem"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">Figure 1.13: Image of a larger gradient cost function; hence the gradient descent can converge much more quickly</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">This is a substantial challenge in the success of deep learning, but now, thanks to various different techniques, this problem has been overcome to some extent. </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">Long short-term memory</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">LSTM</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">) network was one of the major breakthroughs which nullified this problem in 1997. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.2">A detailed description is given in </span><a class="link" href="ch04.html" title="Chapter 4. Recurrent Neural Network"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">Chapter 4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">Recurrent Neural Network</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.2">Also, some researchers have tried to resolve the problem with different techniques, with feature preparation, activation functions, and so on.</span></p></div><div class="section" title="Distributed representation"><div class="titlepage"><div><div><h3 class="title"><a id="ch01lvl3sec5"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">Distributed representation</span></h3></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">All the deep networks are mostly based on the concept of distributed representations, which is the heart of theoretical advantage behind the success of deep learning algorithms. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.2">In the context of deep learning, distributed representations are multiscale representations, and are closely related to multiscale modelling of theoretical chemistry and physics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.3">The basic idea behind a distributed representation is that the perceived feature is the result of multiple factors, which work as a combination to produce the desired results. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.4">A daily life example could be the human brain, which uses distributed representation for disguising the objects in the surroundings.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">An Artificial neural network, in this kind of representation, will be built in such a way that it will have numerous features and layers required to represent our necessary model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.2">The model will describe the data, such as speech, video, or image, with multiple interdependent layers, where each of the layers will be responsible for describing the data at a different level of scale. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.3">In this way, the representation will be distributed across many layers, involving many scales. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.4">Hence, this kind of representation is termed as distributed representation.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note7"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">A distributed representation is dense in nature. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.2">It follows a many-to-many relationship between two types of representations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.3">One concept can be represented using more than one neuron. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.4">On the other hand, one neuron depicts more than one concept.</span></p></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">The traditional clustering algorithms that use non-distributed representation, such as nearest-neighbor algorithms, decision trees, or Gaussian mixtures, all require </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">O(N)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1"> parameters to distinguish </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">O(N)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1"> input regions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.2">At one point of time, one could hardly have believed that any other algorithm could behave better than this! </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.3">However, the deep networks, such as sparse coding, RBM, multi-layer neural networks, and so on, can all distinguish as many as </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">O(2</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">k</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1"> number of input regions with only </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">O(N)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1"> parameters (where </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1"> represents the total number of non-zero elements in sparse representation, and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">k=N</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1"> for other non-sparse RBMs and dense representations).</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">In these kinds of operations, either same clustering is applied on different parts of the input, or several clustering takes place in parallel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.2">The generalization of clustering to distributed representations is termed as multi-clustering.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">The exponential advantage of using distributed representation is due to the reuse of each parameter in multiple examples, which are not necessarily near to each other. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.2">For example, Restricted Boltzmann machine could be an appropriate example in this case. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.3">However, with local generalization, non-identical regions in the input space are only concerned with their own private set of parameters.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">The key advantages are as follows:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">The representation of the internal structure of data is robust in terms of damage resistance and graceful degradation</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">They help to generalize the concepts and relations among the data, hence enabling the reasoning abilities.</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">The following </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">Figure 1.14</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1"> represents a real-time example of distributed representations:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1"><img src="graphics/B05883_01_14-2.jpg" alt="Distributed representation"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">Figure 1.14: Figure shows how distributed representation helped the model to distinguish among various types of expressions in the images</span></p></div></div></div></div></div></body></html>
