</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Summary"><div class="titlepage"><div><div><h1 class="title"><a id="ch04lvl1sec31"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Summary</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">RNNs are special compared to other traditional deep neural networks because of their capability to work over long sequences of vectors, and to output different sequences of vectors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">RNNs are unfolded over time to work like a feed-forward neural network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">The training of RNNs is performed with backpropagation of time, which is an extension of the traditional backpropagation algorithm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">A special unit of RNNs, called Long short-term memory, helps to overcome the limitations of the backpropagation of time algorithm.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">We also talked about the bidirectional RNN, which is an updated version of the unidirectional RNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">Unidirectional RNNs sometimes fail to predict correctly because of lack of future input information. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">Later, we discussed distribution of deep RNNs and their implementation with Deeplearning4j. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.4">Asynchronous stochastic gradient descent can be used for the training of the distributed RNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.5">In the next chapter, we will discuss another model of deep neural network, called the Restricted Boltzmann machine.</span></p></div></div></div></body></html>
