</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Deeplearning4j - an open source distributed framework for deep learning"><div class="titlepage"><div><div><h1 class="title"><a id="ch02lvl1sec15"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Deeplearning4j - an open source distributed framework for deep learning</span></h1></div></div></div><p>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Deeplearning4j</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">DL4J</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">) [82] is an open source deep learning framework which is written for JVM, and mainly used for commercial grade. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">The framework is written entirely in Java, and thus, the name '4j' is included. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.3">Because of its use with Java, Deeplearning4j has started to earn popularity with a much wider audience and range of practitioners.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">This framework is basically composed of a distributed deep learning library that is integrated with Hadoop and Spark. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">With the help of Hadoop and Spark, we can very easily distribute the model and Big datasets, and run multiple GPUs and CPUs to perform parallel operations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">Deeplearning4j has primarily shown substantial success in performing pattern recognition in images, sound, text, time series data, and so on. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.4">Apart from that, it can also be applied for various customer use cases such as facial recognition, fraud detection, business analytics, recommendation engines, image and voice search, and predictive maintenance with the sensor data.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">The following</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"> Figure 2.7</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> shows a generic high-level architectural block diagram of Deeplearning4j:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"><img src="graphics/B05883_02_07-1.jpg" alt="Deeplearning4j - an open source distributed framework for deep learning"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Figure 2.7: High level architectural block diagram of Deeplearning4j [82]</span></p><div class="section" title="Major features of Deeplearning4j"><div class="titlepage"><div><div><h2 class="title"><a id="ch02lvl2sec19"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Major features of Deeplearning4j</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Deeplearning4j comes with various attractive features, which completely distinguishes it from other existing deep learning tools like Theano, Torch, and so on.</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Distributed architecture</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">: Training in Deeplearning4j can be performed in two ways - with distributed, multi-threaded deep-learning, or with traditional, normal single-threaded deep-learning techniques. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">The training is carried out in clusters of commodity nodes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.3">Therefore, Deeplearning4j is able to process any amount of data quickly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.4">The neural networks are trained in parallel using the iterative reduce method, which works on Hadoop YARN and Spark. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.5">It also integrates with Cuda kernels to conduct pure GPU operations, and works with distributed GPUs.</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Deeplearning4j operations can be run on Hadoop YARN or Spark as a job. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">In Hadoop, Iterative Reduce workers work on every block of HDFS, and synchronously process the data in parallel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">As the processing completes, they push the transformed parameters back to their master, where the average of the parameters are taken and the model of each worker's node is updated.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">In Deeplearning4j, the distributed runtimes are interchangeable, where they act like a directory in a huge modular architecture, which can be swapped in or out.</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Data parallelism</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">: There are two ways in which the neural networks can be trained in a distributed manner: one is data parallelism, and the other is model parallelism. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">Deeplearning4j follows data parallelism for training. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.3">In data parallelism, we can split the large dataset into chunks of smaller datasets, and distribute those to parallel models running on different servers to train in parallel.</span></li></ul></div><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Scientific computing capability for the JVM</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">: For scientific computing in Java and Scala, Deeplearning4j includes an N-dimensional array class using </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">N-Dimensional Arrays for Java</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">ND4J</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">The functionality of ND4J is much faster than what Numpy provides to Python, and its mostly written in C++. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.3">It's effectively based on a library for matrix manipulation and linear algebra in a production environment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.4">Most of the routines of ND4J are designed to run fast with minimum RAM requirements.</span></li><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Vectorization tool for machine learning</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">: For vectorization of various file formats and data types, Canova has been merged with Deeplearning4j. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">Canova performs vectorization using an input/output system similar to how Hadoop uses Map-Reduce. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.3">Canova is primarily designed to vectorize text, CSVs, images, sounds, videos, and so on from the </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">command line interface</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">CLI</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">).</span></li></ul></div></div><div class="section" title="Summary of functionalities of Deeplearning4j"><div class="titlepage"><div><div><h2 class="title"><a id="ch02lvl2sec20"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">Summary of functionalities of Deeplearning4j</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">The following are summary of functionalities of Deeplearning4j:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">Deeplearning4j can be claimed as the most complete, production-ready, open source deep learning library ever built</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Compared to Theano-based tools, it has many more features specially designed for deep networks</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Deeplearning4j is very easy to use; even non-specialists can apply its conventions to solve computationally intensive problems</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">The tools provide a wide range of applicability, hence, the networks work equally well with image, sound, text, and time-series</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">It is completely distributed and can run multiple GPUs in parallel, unlike Theano [84], which is not distributed, and Torch7 [85], which has not automated its distribution like DL4J</span></li></ul></div></div></div></div></div></body></html>
