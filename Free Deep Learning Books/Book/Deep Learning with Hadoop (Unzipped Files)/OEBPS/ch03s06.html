</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Summary"><div class="titlepage"><div><div><h1 class="title"><a id="ch03lvl1sec23"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Summary</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">CNNs, although not a new concept, has gained immense popularity in the last half a decade. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">The network primarily finds its application in the field of vision. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">The last few years have seen some major research on CNN by various technological companies such as Google, Microsoft, Apple, and the like, and also from various eminent researchers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">Starting from the beginning, this chapter talked about the concept of convolution, which is the backbone of this type of network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">Going forward, the chapter introduced the various layers of this network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.6">Then it provided in-depth explanations for every associated layer of the deep CNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.7">After that, the various hyperparameters and their relations with the network were explained, both theoretically and mathematically. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.8">Later, the chapter talked about the approach of how to distribute the deep CNN across various machines with the help of Hadoop and its YARN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.9">The last part discussed how to implement this network using Deeplearning4j for every worker working on each block of Hadoop.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">In the next chapter, we will discuss another popular deep neural network called recurrent neural network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">Recurrent neural network has recently gained immense popularity mainly for its ability to model the sequences of variable length. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">Till now, this network is successfully implemented in different problems such as language modeling, handwriting recognition, speech recognition, and so on.</span></p></div></div></div></body></html>
