</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Distributed deep RNNs"><div class="titlepage"><div><div><h1 class="title"><a id="ch04lvl1sec29"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Distributed deep RNNs</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">As you now have an understanding of a RNN, its applications, features, and architecture, we can now move on to discuss how to use this network as distributed architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Distributing RNN is not an easy task, and hence, only a few researchers have worked on this in the past. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Although the primary concept of data parallelism is similar for all the networks, distributing RNNs among multiple servers requires some brainstorming and a bit tedious work too.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Recently, one work from Google [119] has tried to distribute recurrent networks in many servers in a speech recognition task. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">In this section, we will discuss this work on distributed RNNs with the help of Hadoop.</span></p><p>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Asynchronous stochastic gradient descent</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">ASGD</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">) can be used for large-scale training of a RNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">ASGD has particularly shown success in sequence discriminative training of the deep neural networks.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">A two-layer deep Long short-term memory RNN is used to build the Long short-term memory network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">Each Long short-term memory consists of 800 memory cells. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">The paper uses 13 million parameters for the LSTM network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.4">For cell input and output units tan h (hyperbolic tangent activation) is used, and for the write, read, and forget gates, the logistic sigmoid function is used.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">For training purposes, the input speech training data can be split and randomly shuffled across multiple DataNodes of the Hadoop framework. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">The Long short-term memory is put across all these DataNodes, and distributed training is performed on those datasets in parallel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">Asynchronous stochastic gradient descent is used for this distributed training. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.4">One parameter server, dedicated for maintaining the current state of all model parameters, is used.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">To implement this procedure on Hadoop, each DataNode has to perform asynchronous stochastic gradient descent operations on the partitioned data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">Each worker, running on each block of the DataNodes works on the partitions, one utterance at a time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">For each utterance of the speech, the model parameter </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">P</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1"> is fetched from the parameter server mentioned earlier. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">The workers compute the current state of every frame; decipher the speech utterance to calculate the final outer gradients. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.3">The updated parameter is then sent back to the parameter server. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.4">The workers then repeatedly request the parameter server to provide the latest parameters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.5">Backpropagation through time is then performed to calculate the updated parameter gradient for the next set of frames, which is again sent back to the parameter server.</span></p></div></div></div></body></html>
