</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Convolutional Restricted Boltzmann machines"><div class="titlepage"><div><div><h1 class="title"><a id="ch05lvl1sec35"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Convolutional Restricted Boltzmann machines</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Very high dimensional inputs, such as images or videos, put immense stress on the memory, computation, and operational requirements of traditional machine learning models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">In </span><a class="link" href="ch03.html" title="Chapter 3.  Convolutional Neural Network"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">
Chapter 3
</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Convolutional Neural Network</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">, we have shown how replacing the matrix multiplication by discrete convolutional operations with small kernel resolves these problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">Going forward, Desjardins and Bengio [123] have shown that this approach also works fine when applied to RBMs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">In this section, we will discuss the functionalities of this model.</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"><img src="graphics/B05883_05_07-266x300.jpg" alt="Convolutional Restricted Boltzmann machines"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Figure 5.7 : Figure shows the observed variables or the visible units of an RBM can be associated with mini batches of image to a compute the final result. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">The weight connections represents a set of filters</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Further, in normal RBMs, the visible units are directly related to all the hidden variables through different parameters and weights. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">To describe an image in terms of spatially local features ideally needs fewer parameters, which can be generalized better. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">This helps in detecting and extracting the identical and local features from a high dimensional image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.4">Therefore, using an RBM to retrieve all the global features from an image for object detection is not so encouraging, especially for high dimensional images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.5">One simple approach is to train the RBM on mini batches sampled from the input image, placed in blocks on Hadoop's Datanodes to generate the local features. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.6">The representation of this approach, termed as patch-based RBM is shown in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Figure 5.7</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">This, however, has some potential limitations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">The patch-based RBM, used in the distributed environment on Hadoop, does not follow the spatial relationship of mini batches, and sees each image's mini batches as independent patches from the nearby patches. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.4">This makes the feature extracted from the neighboring patches independent and somewhat significantly redundant.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">To handle such a situation, a </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Convolutional Restricted Boltzmann machine</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">CRBM</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">) is used, which is an extension of the traditional RBM model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">The CRBM is structurally almost similar to RBM, a two-layer model in which the visible and hidden random variables are structured as matrices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">Hence, in CRBM, the locality and neighborhood can be defined for both visible and hidden units. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.4">In CRBM, the visible matrix represents the image and the small windows of the matrix define the mini batches of the image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.5">The hidden units of CRBM are partitioned into different feature maps to locate the presence of multiple features at multiple positions of the visible units. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.6">Units within a feature map represent the same feature at different locations of the visible unit. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.7">The hidden-visible connections of CRBM are completely local, and weights are generally split across the clusters of hidden units.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">The CRBM's hidden units are used to extract features from the overlapping mini batches of visible units. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2">Moreover, the features of neighboring mini batches complement each other and collaborate to model the input image.</span></p><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Figure 5.8</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1"> shows a CRBM with a matrix of visible units </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">V</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1"> and a matrix of hidden units </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">H</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">, which are connected with </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">K 3*3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1"> filters, namely, </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">W</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">1</span></sub></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">, </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">W</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">2</span></sub></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">, </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">W</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">3</span></sub></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">,...</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">W</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">K</span></sub></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.2">The hidden units in the figure are split into </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">K</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1"> submatrices called feature map, </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">H</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">1</span></sub></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">, </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">H</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">2</span></sub></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">,...</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">H</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">K</span></sub></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.2">Each hidden unit </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">H</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">i</span></sub></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1"> signifies the presence of a particular feature at a </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">3*3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1"> neighborhood of visible units.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">A CRBM, unlike a patch-based RBM, is trained on the whole input image or a large region of the image, to learn the local features and exploit the spatial relationship of the overlapping mini batches, processed in a distributed manner on Hadoop. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.2">The hidden units of overlapping mini batches depend and cooperate with each other in a CRBM. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.3">Therefore, one hidden unit, once explained, does not need to be explained again in the neighborhood overlapping mini batch. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.4">This in turn helps in reducing the redundancy of the features.</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"><img src="graphics/B05883_05_08-267x300.jpg" alt="Convolutional Restricted Boltzmann machines"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Figure 5.8: The computation involved in a CRBM is shown in the figure</span></p><div class="section" title="Stacked Convolutional Restricted Boltzmann machines"><div class="titlepage"><div><div><h2 class="title"><a id="ch05lvl2sec49"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">Stacked Convolutional Restricted Boltzmann machines</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">CRBMs can be stacked together to form deep neural networks. </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">Stacked Convolutional Restricted Boltzmann machines </span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">(</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">Stacked CRBMs</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">) can be trained layer wise, with a bottom-up approach, similar to the layer wise training of fully connected neural networks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.2">After each CRBM filtering layer, in a stacked network, a deterministic subsampling method is implemented. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.3">For subsampling the features, max-pooling is performed in non-overlapping image regions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.4">The pooling layer, as explained in </span><a class="link" href="ch03.html" title="Chapter 3.  Convolutional Neural Network"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">
Chapter 3
</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">Convolutional Neural Network</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">, helps to minimize the dimensionality of the features. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.2">On top of that, it makes the feature robust to small shifts and helps to propagate the higher-level feature to grow over regions of the input image.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">Deep CRBMs require a pooling operation, so that the spatial size of each successive layer decreases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.2">Although, most of the traditional convolutional models work fine with inputs of a variety of spatial size, for Boltzmann machines it becomes somewhat difficult to change the input sizes, mainly due to a couple of reasons. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.3">Firstly, the partition function of the energy function changes with the size of input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.4">Secondly, convolutional networks attain the size invariance by increasing the size of the pooling function proportional to the input size. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.5">However, scaling the pooling regions for Boltzmann machines is very difficult to achieve.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">For CRBMs, the pixels residing at the boundary of the image also impose difficulty, which is worsened by the fact that Boltzmann machines are symmetric in nature. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.2">This can be nullified by implicitly zero-padding the input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.3">Bear in mind that, zero-padding the input is often driven by lesser input pixels, which may not be activated when needed.</span></p></div></div></div></div></body></html>
