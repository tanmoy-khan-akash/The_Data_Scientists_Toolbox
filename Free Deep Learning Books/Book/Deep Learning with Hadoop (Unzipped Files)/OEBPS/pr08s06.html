</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Customer support"><div class="titlepage"><div><div><h1 class="title"><a id="pf11lvl1sec6"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Customer support</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Now that you are the proud owner of a Packt book, we have a number of things to help you to get the most from your purchase.</span></p><div class="section" title="Downloading the example code"><div class="titlepage"><div><div><h2 class="title"><a id="pf11lvl2sec1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Downloading the example code</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">You can download the example code files for this book from your account at </span><a class="ulink" href="http://www.packtpub.com"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">http://www.packtpub.com</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">If you purchased this book elsewhere, you can visit </span><a class="ulink" href="http://www.packtpub.com/support"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">http://www.packtpub.com/support</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">  and register to have the files e-mailed directly to you.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">You can download the code files by following these steps:</span></p><div class="orderedlist"><ol class="orderedlist arabic"><li class="listitem"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Log in or register to our website using your e-mail address and password.</span></li><li class="listitem"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Hover the mouse pointer on the </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">SUPPORT</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1"> tab at the top.</span></li><li class="listitem"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Click on </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Code Downloads &amp; Errata</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">.</span></li><li class="listitem"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Enter the name of the book in the </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Search</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1"> box.</span></li><li class="listitem"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Select the book for which you're looking to download the code files.</span></li><li class="listitem"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Choose from the drop-down menu where you purchased this book from.</span></li><li class="listitem"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Click on </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Code Download</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">.</span></li></ol></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Once the file is downloaded, please make sure that you unzip or extract the folder using the latest version of:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">WinRAR / 7-Zip for Windows</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Zipeg / iZip / UnRarX for Mac</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">7-Zip / PeaZip for Linux</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">The code bundle for the book is also hosted on GitHub at </span><a class="ulink" href="https://github.com/PacktPublishing/Deep-Learning-with-Hadoop"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">https://github.com/PacktPublishing/Deep-Learning-with-Hadoop</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">We also have other code bundles from our rich catalog of books and videos available at </span><a class="ulink" href="https://github.com/PacktPublishing/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">https://github.com/PacktPublishing/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">Check them out!</span></p></div><div class="section" title="Downloading the color images of this book"><div class="titlepage"><div><div><h2 class="title"><a id="pf11lvl2sec2"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">Downloading the color images of this book</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">We also provide you with a PDF file that has color images of the screenshots/diagrams used in this book. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.2">The color images will help you better understand the changes in the output. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.3">You can download this file from </span><a class="ulink" href="https://www.packtpub.com/sites/default/files/downloads/DeepLearningwithHadoop_ColorImages.pdf"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">https://www.packtpub.com/sites/default/files/downloads/DeepLearningwithHadoop_ColorImages.pdf</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">.</span></p></div><div class="section" title="Errata"><div class="titlepage"><div><div><h2 class="title"><a id="pf11lvl2sec3"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">Errata</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">Although we have taken every care to ensure the accuracy of our content, mistakes do happen. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">If you find a mistake in one of our books-maybe a mistake in the text or the code-we would be grateful if you could report this to us. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.3">By doing so, you can save other readers from frustration and help us improve subsequent versions of this book. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.4">If you find any errata, please report them by visiting </span><a class="ulink" href="http://www.packtpub.com/submit-errata"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">http://www.packtpub.com/submit-errata</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">, selecting your book, clicking on the </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">Errata Submission Form</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1"> link, and entering the details of your errata. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">Once your errata are verified, your submission will be accepted and the errata will be uploaded to our website or added to any list of existing errata under the Errata section of that title.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">To view the previously submitted errata, go to </span><a class="ulink" href="https://www.packtpub.com/books/content/support"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">https://www.packtpub.com/books/content/support</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1"> and enter the name of the book in the search field. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.2">The required information will appear under the </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">Errata</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1"> section.</span></p></div><div class="section" title="Piracy"><div class="titlepage"><div><div><h2 class="title"><a id="pf11lvl2sec4"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Piracy</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">Piracy of copyrighted material on the Internet is an ongoing problem across all media. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.2">At Packt, we take the protection of our copyright and licenses very seriously. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.3">If you come across any illegal copies of our works in any form on the Internet, please provide us with the location address or website name immediately so that we can pursue a remedy.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Please contact us at </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">copyright@packtpub.com</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1"> with a link to the suspected pirated material.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">We appreciate your help in protecting our authors and our ability to bring you valuable content.</span></p></div><div class="section" title="Questions"><div class="titlepage"><div><div><h2 class="title"><a id="pf11lvl2sec5"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">Questions</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">If you have a problem with any aspect of this book, you can contact us at </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">questions@packtpub.com</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">, and we will do our best to address the problem.</span></p></div></div></div></div></body></html>
