</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Denoising autoencoder"><div class="titlepage"><div><div><h1 class="title"><a id="ch06lvl1sec43"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Denoising autoencoder</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The reconstruction of output from input does not always guarantee the desired output, and can sometimes end up in simply copying the input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">To prevent such a situation, in [134], a different strategy has been proposed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">In that proposed architecture, rather than putting some constraints in the representation of the input data, the reconstruction criteria is built, based on cleaning the partially corrupted input.</span></p><div class="blockquote"><blockquote class="blockquote"><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">"A good representation is one that can be obtained robustly from a corrupted input and that will be useful for recovering the corresponding clean input."</span></em></span>
</p></blockquote></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">A denoising autoencoder is a type of autoencoder which takes corrupted data as input, and the model is trained to predict the original, clean, and uncorrupted data as its output. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">In this section, we will explain the basic idea behind designing a denoising autoencoder.</span></p><div class="section" title="Architecture of a Denoising autoencoder"><div class="titlepage"><div><div><h2 class="title"><a id="ch06lvl2sec60"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Architecture of a Denoising autoencoder</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">The primary idea behind a denoising autoencoder is to introduce a corruption process, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Q (k</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">/</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> | k)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">, and reconstruct the output </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">r</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1"> from the corrupted input </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">k</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">/</span></sup></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">. </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Figure 6.6</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1"> shows the overall representation of a denoising autoencoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2">In a denoising autoencoder, for every minibatch of training data </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">, the corresponding corrupted </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">k</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">/</span></sup></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1"> should be generated using </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Q (k</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">/</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1"> | k)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.2">From there, if we consider the initial input as the corrupted input </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">k</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">/</span></sup></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">, then the whole model can be considered as a form of a basic encoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">The corrupted input </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">k</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">/ </span></sup></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">is mapped to generate the hidden representation </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">h</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Therefore, we get the following:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"><img src="graphics/image_06_013.jpg" alt="Architecture of a Denoising autoencoder"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">From this hidden representation, the reconstructed output, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">r</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">, can be derived using </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">r = g (h)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.2">Denoising autoencoder reorganizes the data, and then tries to learn about the data for the reconstruction of the output. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.3">This reorganization of the data or shuffling of the data generates the noise, and the model learns the features from the noise, which allows categorizing the input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.4">During training of the network, it produces a model, which computes the distance between that model and the benchmark through a loss function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.5">The idea is to minimize the average reconstruction error over a training set to make the output r as close as possible to the original uncorrupted input </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">.</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1"><img src="graphics/B05883_06_06.jpg" alt="Architecture of a Denoising autoencoder"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">Figure 6.6: The steps involved in designing a denoising autoencoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">The original input is k; corrupted input derived from k is denoted as k</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">/</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.2">The final output is denoted as r.</span></p></div><div class="section" title="Stacked denoising autoencoders"><div class="titlepage"><div><div><h2 class="title"><a id="ch06lvl2sec61"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">Stacked denoising autoencoders</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">The basic concept of building a stacked denoising autoencoder to initialize a deep neural network is similar to stacking a number of Restricted Boltzmann machines to build a Deep Belief network or a traditional deep autoencoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">The generation of corrupted input is only needed for the initial denoising training of each of the individual layers to help in learning the useful features extraction.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">Once we know the encoding function </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">f</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1"> to reach the hidden state, it is used on the original, uncorrupted data to reach the next level. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.2">In general, no corruption or noise is put to generate the representation, which will act as an uncorrupted input for training the next layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.3">A key function of a stacked denoising autoencoder is its layer-by-layer unsupervised pre-training as the input is fed through. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.4">Once a layer is pre-trained to perform the feature selection and extraction on the input from the preceding layer, the next stages of supervised fine tuning can follow, just as in case of the traditional deep autoencoders.</span></p><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">Figure 6.7</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1"> shows the detailed representation to design a stacked denoising autoencoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.2">The overall procedure for learning and stacking multiple layers of a denoising autoencoder is shown in the following figure:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"><img src="graphics/B05883_06_07-1.jpg" alt="Stacked denoising autoencoders"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Figure 6.7: The representation of a stacked denoising autoencoder</span></p></div><div class="section" title="Implementation of a stacked denoising autoencoder using Deeplearning4j"><div class="titlepage"><div><div><h2 class="title"><a id="ch06lvl2sec62"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">Implementation of a stacked denoising autoencoder using Deeplearning4j</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">Stacked denoising autoencoders can be built using Deeplearning4j by creating a </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">MultiLayerNetwork</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1"> that possesses autoencoders as its hidden layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.2">The autoencoders have some </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">corruptionLevel</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">, which is denoted as noise.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">Here we set the initial configuration needed to set up the model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.2">For illustration purposes, a </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">batchSize</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1"> of </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">1024</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"> numbers of examples is taken. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.2">The input number and output number is taken as </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">1000</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1"> and </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">2</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1"> respectively.</span></p><pre class="programlisting"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">int outputNum = 2;
int inputNum = 1000;
int iterations = 10;
int seed = 123;
int batchSize = 1024;
</span></pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">The loading of the input dataset is the same as explained in the deep autoencoder section. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.2">Therefore, we will directly jump to how to build the stack denoising autoencoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.3">We have taken a five-hidden-layer deep model to illustrate the method:</span></p><pre class="programlisting">
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">log.info ("Build model....");</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">MultiLayerConfiguration conf = new NeuralNetConfiguration.Builder ()</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">.seed(seed)</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">.gradientNormalization(GradientNormalization
  .ClipElementWiseAbsoluteValue)</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">.gradientNormalizationThreshold (1.0)</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">.iterations(iterations)</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">.updater(Updater.NESTEROVS)</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">.momentum(0.5)</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">.momentumAfter(Collections.singletonMap(3, 0.9))</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">.optimizationAlgo(OptimizationAlgorithm.CONJUGATE_GRADIENT)</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">.list()</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">.layer(0, new AutoEncoder.Builder()</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">.nIn(inputNum)</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">.nOut(500)</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">.weightInit(WeightInit.XAVIER)</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">.lossFunction(LossFunction.RMSE_XENT)</span></strong></span>
</pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">The following code denotes how much input data is to be corrupted:</span></p><pre class="programlisting">
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">.corruptionLevel (0.3)</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">
    .build())
  .layer(1, new AutoEncoder.Builder()
    .nIn(500)
    .nOut(250)
    .weightInit(WeightInit.XAVIER).lossFunction
    (LossFunction.RMSE_XENT)
    .corruptionLevel(0.3)
    .build())
  .layer(2, new AutoEncoder.Builder()
    .nIn(250)
    .nOut(125)
    .weightInit(WeightInit.XAVIER).lossFunction         
    (LossFunction.RMSE_XENT)
    .corruptionLevel(0.3)
    .build())
  .layer(3, new AutoEncoder.Builder()
     .nIn(125)
     .nOut(50)
     .weightInit(WeightInit.XAVIER).lossFunction
     (LossFunction.RMSE_XENT)
     .corruptionLevel(0.3)
     .build())
   .layer(4, new OutputLayer.Builder   
   (LossFunction.NEGATIVELOGLIKELIHOOD)
    </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1"> .activation("softmax")</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">
     .nIn(75)
     .nOut(outputNum)
     .build())
   </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">.pretrain(true)</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">.backprop(false)</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">.build();</span></strong></span>
</pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">Once the model is built, it is trained by calling the </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">fit()</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1"> method:</span></p><pre class="programlisting"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">try {
    </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1"> model.fit(iter);</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">
    } 
catch(Exception ex)
   {
     ex.printStackTrace();
   }
</span></pre></div></div></div></div></body></html>
