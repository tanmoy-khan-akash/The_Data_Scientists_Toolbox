</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="chapter" title="Chapter 2.  Distributed Deep Learning for Large-Scale Data"><div class="titlepage"><div><div><h1 class="title"><a id="ch02"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Chapter 2.  Distributed Deep Learning for Large-Scale Data </span></h1></div></div></div><div class="blockquote"><table border="0" width="100%" cellspacing="0" cellpadding="0" class="blockquote" summary="Block quote"><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1"> </span></td><td valign="top"><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">"In God we trust, all others must bring data"</span></em></span>
</p></td><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> </span></td></tr><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> </span></td><td colspan="2" align="right" valign="top" style="text-align: center"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">--</span><span class="attribution"><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">W. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">Edwards Deming</span></em></span></span></td></tr></table></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">In this exponentially growing digital world, big data and deep learning are the two hottest technical trends. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">Deep learning and big data are two interrelated topics in the world of data science, and in terms of technological growth, both are critically interconnected and equally significant.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Digital data and cloud storage follow a generic law, termed as Moore's law [50], which roughly states that the world's data are doubling every two years; however, the cost of storing that data decreases at approximately the same rate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">This profusion of data generates more features and verities, hence, to extract all the valuable information out of it, better deep learning models should be built.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">This voluminous availability of data helps to bring huge opportunities for multiple sectors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">Moreover, big data, with its analytic part, has produced lots of challenges in the field of data mining, harnessing the data, and retrieving the hidden information out of it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">In the field of Artificial Intelligence, deep learning algorithms provide their best output with large-scale data during the learning process. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.4">Therefore, as data are growing faster than ever before, deep learning also plays a crucial part in delivering all the big data analytic solutions.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">This chapter will give an insight into how deep learning models behave with big data, and reveal the associated challenges. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">The later part of the chapter will introduce Deeplearning4j, an open source distributed framework, with a provision for integration with Hadoop and Spark, used to deploy deep learning for large-scale data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">The chapter will provide examples to show how basic deep neural networks can be implemented with Deeplearning4j, and its integration to Apache Spark and Hadoop YARN.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">The following are the important topics that will be covered in this chapter:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Deep learning for massive amounts of data</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Challenges of deep learning for big data</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Distributed deep learning and Hadoop</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Deeplearning4j: An open source distributed framework for deep learning</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Setting up Deeplearning4j on Hadoop YARN</span></li></ul></div><div class="section" title="Deep learning for massive amounts of data"><div class="titlepage"><div><div><h1 class="title"><a id="ch02lvl1sec12"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Deep learning for massive amounts of data</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">In this Exa-Byte scale era, the data are increasing at an exponential rate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">This growth of data are analyzed by many organizations and researchers in various ways, and also for so many different purposes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.3">According to the survey of </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">International Data Corporation</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">IDC</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">), the Internet is processing approximately 2 Petabytes of data every day [51]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.2">In 2006, the size of digital data was around 0.18 ZB, whereas this volume has increased to 1.8 ZB in 2011. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.3">Up to 2015, it was expected to reach up to 10 ZB in size, and by 2020, its volume in the world will reach up to approximately 30 ZB to 35 ZB. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.4">The timeline of this data mountain is shown in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Figure 2.1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">These immense amounts of data in the digital world are formally termed as big data.</span></p><div class="blockquote"><table border="0" width="100%" cellspacing="0" cellpadding="0" class="blockquote" summary="Block quote"><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"> </span></td><td valign="top"><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">"The world of Big Data is on fire"</span></em></span>
</p></td><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1"> </span></td></tr><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1"> </span></td><td colspan="2" align="right" valign="top" style="text-align: center"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">--</span><span class="attribution"><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">The Economist, Sept 2011</span></em></span></span></td></tr></table></div><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"><img src="graphics/image_02_001-1.jpg" alt="Deep learning for massive amounts of data"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">Figure 2.1: Figure shows the increasing trend of data for a time span of around 20 years</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">Facebook has almost 21 PB in 200M objects [52], whereas Jaguar ORNL has more than 5 PB data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">These stored data are growing so rapidly that Exa-Byte scale storage systems are likely to be used by 2018 to 2020.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">This explosion of data certainly poses an immediate threat to the traditional data-intensive computations, and points towards the need for some distributed and scalable storage architecture for querying and analysis of the large-scale data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.2">A generic line of thought for big data is that raw data is extremely complex, sundry, and increasingly growing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.3">An ideal Big dataset consists of a vast amount of unsupervised raw data, and with some negligible amount of structured/categorized data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.4">Therefore, while processing these amounts of non-stationary structured data, the conventional data-intensive computations often fail. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.5">As a result, big data, having unrestricted diversity, requires sophisticated methods and tools, which could be implemented to extract patterns and analyze the large-scale data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.6">The growth of big data has mostly been caused by an increasing computational processing power and the capability of the modern systems to store data at lower cost.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Considering all these features of big data, it can be broken into four distinct dimensions, often referred to as the four Vs: </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">Volume</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">, </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">Variety</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">, </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Velocity</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">, and </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">Veracity</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.2">Following </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">figure 2.2</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1"> shows the different characteristics of big data by providing all the 4Vs of data:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1"><img src="graphics/B05883_02_02-1.jpg" alt="Deep learning for massive amounts of data"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">Figure 2.2: Figure depicts the visual representation of 4Vs of big data</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">In this current data-intensive technology era, the velocity of the data, the escalating rate at which the data are collected and obtained is as significant as the other parameters of the big data, that is, </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">Volume</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1"> and </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">Variety</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.2">With the given pace, at which this data is getting generated, if it is not collected and analyzed sensibly, there is a huge risk of important data loss. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.3">Although, there is an option to retain this rapid-moving data into bulk storage for batch processing at a later period, the genuine importance in tackling this high velocity data lies in how quickly an organization can convert the raw data to a structured and usable format. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.4">Specifically, time-sensitive information such as flight fare, hotel fare, or some e-commerce product's price, and so on would become obsolete if the data is not immediately retained and processed in a systemic manner. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.5">The parameter veracity in big data is concerned with the accuracy of the results obtained after the data analysis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.6">As data turns more complex each day, sustaining trust in the hidden information of big data throws a significant challenge.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">To extract and analyze such critically complex data, a better, well-planned model is desired. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.2">In ideal cases, a model should perform better dealing with big data compared to data with small sizes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.3">However, this is not always the case. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.4">Here, we will show one example to discuss more on this point.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">As illustrated in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Figure 2.3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">, with a small size dataset, the performance of the best algorithm is </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">n%</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1"> better than the worst one. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.2">However, as the size of the dataset increases (big data), the performance also enhances exponentially to some </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">k % &gt;&gt; n %</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.2">Such kind of traces can well be found from [53], which clearly shows the effect of a large-scale training dataset in the performance of the model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.3">However, it would be completely misleading that with any of the simplest models, one can achieve the best performance only using Big dataset.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">From [53] we can see that algorithm 1 is basically a Naive Bayes model, algorithm 2 belongs to a memory-based model, and algorithm 3 corresponds to Winnow. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.2">The following graph shows, with a small dataset, that the performance of Winnow is less that the memory-based one. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.3">Whereas when dealing with Big dataset, both the Naive Bayes and Winnow show better performance than the memory-based model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.4">So, looking at the </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">Figure 2.3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">, it would be really difficult to infer on what basis any one of these simple models work better in an environment of large dataset. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.2">An intuitive explanation for the relatively poor performance of the memory-based method with large datasets is that the algorithm suffered due to the latency of loading a huge amount of data to its memory. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.3">Hence, it is purely a memory related issue, and only using big data would not resolve that. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.4">Therefore, a primary reason for the performance should be how sophisticated the models are. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.5">Hence, the importance of deep learning model comes into play.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note9"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">Big data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.2">Small Minds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.3">No Progress! </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.4">Big data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.5">Big Brains. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.6">Breakthrough! </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.7">[54]</span></p></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">Deep learning stands in contrast to big data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.2">Deep learning has triumphantly been implemented in various industry products and widely practiced by various researchers by taking advantage of this large-scale digital data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.3">Famous technological companies such as Facebook, Apple, and Google collect and analyze this voluminous amount of data on a daily basis, and have been bellicosely going forward with various deep learning related projects over the last few years.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">Google deploys deep learning algorithms on the massive unstructured data collected from various sources including Google's Street view, image search engine, Google's translator, and Android's voice recognition.</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1"><img src="graphics/image_02_003.jpg" alt="Deep learning for massive amounts of data"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">Figure 2.3: Variation of percentage of accuracy of different types of algorithms with increasing size of datasets</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">Apple's Siri, a virtual personal assistant for iPhones, provides a bulk of different services, such as sport news, weather reports, answers to users' questions, and so on. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.2">The entire application of Siri is based on deep learning, which collects data from different Apple services and obtains its intelligence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.3">Other industries, mainly Microsoft and IBM, are also using deep learning as their major domain to deal with this massive amount of unstructured data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.4">IBM's brain-like computer, Watson, and Microsoft's Bing search engine primarily use deep learning techniques to leverage the big data.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">Current deep learning architectures comprise of millions or even billions of data points. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.2">Moreover, the scale at which the data is growing prevents the model from the risk of overfitting. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.3">The rapid increase in computation power too has made the training of advanced models much easier.</span></p><p>

<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">NVIDIA GTX 280 1 GB GPU.</span></p>

<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">1 million images.</span></p>

</td></tr></tbody></table></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">Table 2.1: Recent research progress of large-scale deep learning models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.2">Partial information taken from [55]</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">Deep learning algorithms, with the help of a hierarchical learning approach, are basically used to extract meaningful generic representations from the input raw data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.2">Basically, at a higher level, more complex and abstract representations of the data are learnt from the previous layers and the less abstracted data of the multi-level learning model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.3">Although deep learning can also learn from massive amounts of labelled (categorized) data, the models generally look attractive when they can learn from unlabeled/uncategorized data [56], and hence, help in generating some meaningful patterns and representation of the big unstructured data.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">While dealing with large-scale unsupervised data, deep learning algorithms can extract the generic patterns and relationships among the data points in a much better way than the shallow learning architectures. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.2">The following are a few of the major characteristics of deep learning algorithms, when trained with large-scale unlabeled data:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">From the higher level of abstractions and representation, semantics and relational knowledge of the big data can be obtained from the deep learning models</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">Even a simple linear model can perform effectively with the knowledge obtained from excessively complex and more abstract representations of the huge dataset</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">This huge variety of data representation from the unsupervised data opens its door for learning other data types such as textual, audio, video, image, and the like</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">Therefore, it can be surely concluded that deep learning will become an essential ingredient for providing big data sentiment analysis, predictive analysis, and so on, particularly with the enhanced processing power and advancement in the </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">graphics processing unit</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">GPU</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">) capacity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.2">The aim of this chapter is not to extensively cover big data, but to represent the relationship between big data and deep learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.3">The subsequent sections will introduce the key concepts, applications, and challenges of deep learning while working with large-scale uncategorized data.</span></p></div></div></div></div></body></html>
