</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Deep learning terminologies"><div class="titlepage"><div><div><h1 class="title"><a id="ch01lvl1sec8"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Deep learning terminologies</span></h1></div></div></div><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Deep Neural Network</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">DNN</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">): This can be defined as a multilayer perceptron with many hidden layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">All the weights of the layers are fully connected to each other, and receive connections from the previous layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.3">The weights are initialized with either supervised or unsupervised learning.</span></li><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Recurrent Neural Networks</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">RNN</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">): RNN is a kind of deep learning network that is specially used in learning from time series or sequential data, such as speech, video, and so on. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">The primary concept of RNN is that the observations from the previous state need to be retained for the next state. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">The recent hot topic in deep learning with RNN is </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Long short-term memory</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">LSTM</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">).</span></li><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Deep belief network</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">DBN</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">): This type of network [9] [10] [11] can be defined as a probabilistic generative model with visible and multiple layers of latent variables (hidden). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2">Each hidden layer possesses a statistical relationship between units in the lower layer through learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.3">The more the networks tend to move to higher layers, the more complex relationship becomes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.4">This type of network can be productively trained using greedy layer-wise training, where all the hidden layers are trained one at a time in a bottom-up fashion.</span></li><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Boltzmann machine</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">BM</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">): This can be defined as a network that is a symmetrically connected, neuron-like unit, which is capable of taking stochastic decisions about whether to remain on or off. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">BMs generally have a simple learning algorithm, which allows them to uncover many interesting features that represent complex regularities in the training dataset.</span></li><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Restricted Boltzmann machine</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">RBM</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">): RBM, which is a generative stochastic Artificial Neural Network, is a special type of Boltzmann Machine. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">These types of networks have the capability to learn a probability distribution over a collection of datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.3">An RBM consists of a layer of visible and hidden units, but with no visible-visible or hidden-hidden connections.</span></li><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Convolutional neural networks</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">: Convolutional neural networks are part of neural networks; the layers are sparsely connected to each other and to the input layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">Each neuron of the subsequent layer is responsible for only a part of the input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.3">Deep convolutional neural networks have accomplished some unmatched performance in the field of location recognition, image classification, face recognition, and so on.</span></li><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Deep auto-encoder</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">: A deep auto-encoder is a type of auto-encoder that has multiple hidden layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">This type of network can be pre-trained as a stack of single-layered auto-encoders. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.3">The training process is usually difficult: first, we need to train the first hidden layer to restructure the input data, which is then used to train the next hidden layer to restructure the states of the previous hidden layer, and so on.</span></li><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Gradient descent</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">GD</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">): This is an optimization algorithm used widely in machine learning to determine the coefficient of a function (</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">f</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">), which reduces the overall cost function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.2">Gradient descent is mostly used when it is not possible to calculate the desired parameter analytically (for example, linear algebra), and must be found by some optimization algorithm.</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">In gradient descent, weights of the model are incrementally updated with every single iteration of the training dataset (epoch).</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">The cost function, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">J (w)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">, with the sum of the squared errors can be written as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1"><img src="graphics/B05883_01_19-1.jpg" alt="Deep learning terminologies"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">The direction of magnitude of the weight update is calculated by taking a step in the reverse direction of the cost gradient, as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1"><img src="graphics/Capture-3.jpg" alt="Deep learning terminologies"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">In the preceding equation, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">η</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"> is the learning rate of the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">Weights are updated incrementally after every epoch with the following rule:</span></p><pre class="programlisting"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">                         for one or more epochs, 
                           for each weight i, 
                             w</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">:= w + ∆w</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1"> 
                           end  
                         end 
</span></pre><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1"><img src="graphics/Capture-12.jpg" alt="Deep learning terminologies"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">Popular examples that can be optimized using gradient descent are Logistic Regression and Linear Regression.</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">Stochastic Gradient Descent</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">SGD</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">): Various deep learning algorithms, which operated on a large amount of datasets, are based on an optimization algorithm called stochastic gradient descent. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.2">Gradient descent performs well only in the case of small datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.3">However, in the case of very large-scale datasets, this approach becomes extremely costly . </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.4">In gradient descent, it takes only one single step for one pass over the entire training dataset; thus, as the dataset's size tends to increase, the whole algorithm eventually slows down. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.5">The weights are updated at a very slow rate; hence, the time it takes to converge to the global cost minimum becomes protracted.</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">Therefore, to deal with such large-scale datasets, a variation of gradient descent called stochastic gradient descent is used. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.2">Unlike gradient descent, the weight is updated after each iteration of the training dataset, rather than at the end of the entire dataset.</span></p><pre class="programlisting"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">                     until cost minimum is reached 
                       for each training sample j: 
                         for each weight i 
                           w</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">:= w + ∆w</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1"> 
                         end 
                       end 
                     end 
</span></pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1"> </span></p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1"><img src="graphics/Capture-13.jpg" alt="Deep learning terminologies"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">In the last few years, deep learning has gained tremendous popularity, as it has become a junction for research areas of many widely practiced subjects, such as pattern recognition, neural networks, graphical modelling, machine learning, and signal processing.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">The other important reasons for this popularity can be summarized by the following points:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">In recent years, the ability of </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">GPU</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">Graphical Processing Units</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">) has increased drastically</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">The size of data sizes of the dataset used for training purposes has increased significantly</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">Recent research in machine learning, data science, and information processing has shown some serious advancements</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">Detailed descriptions of all these points will be provided in an upcoming topic in this chapter.</span></p></div></div></div></body></html>
