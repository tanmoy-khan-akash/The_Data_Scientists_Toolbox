</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Convolutional layer using Deeplearning4j"><div class="titlepage"><div><div><h1 class="title"><a id="ch03lvl1sec22"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Convolutional layer using Deeplearning4j</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">This section of the chapter will provide the basic idea on how to write the code for CNN using Deeplearning4j. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">You'll be able to learn the syntax for using the various hyperparameters mentioned in this chapter.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">To implement CNN using Deeplearning4j, the whole idea can be split into three core phases: loading data or preparation of the data, network configuration, and training and evaluation of the model.</span></p><div class="section" title="Loading data"><div class="titlepage"><div><div><h2 class="title"><a id="ch03lvl2sec34"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Loading data</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">For CNNs, generally, we only work on the image data to train the model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">In Deeplearning4j, the images can be read using </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">ImageRecordReader</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">The following code snippet shows how to load </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">16Ã16</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> color images for the model:</span></p><pre class="programlisting"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">RecordReader imageReader = new ImageRecordReader(16, 16, false);
imageReader.initialize(new FileSplit(new      
File(System.getProperty("user.home"), "image_location")));</span></pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">After that, using </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">CSVRecordReader</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">, we can load all the image labels from the input CSV files, as follows:</span></p><pre class="programlisting"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">int numLinesToSkip = 0;
String delimiter = ",";
RecordReader labelsReader = new    
CSVRecordReader((numLinesToSkip,delimiter);
labelsReader.initialize(new FileSplit(new   
File(System.getProperty("user.home"),"labels.csv_file_location"))</span></pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">To combine both the images and labels data, we can use </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">ComposableRecordReader</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">. </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">ComposableRecordReader</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1"> can also be beneficial in cases where we need to merge data from multiple sources:</span></p><pre class="programlisting">
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">ComposableRecordReader(imageReader,labelsReader);</span></strong></span>
</pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Similarly, instead of imageset, in some cases, if someone needs to load MNIST datasets into the model; for that, we can use the following part. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">This example uses a random number seed of </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">12345</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">:</span></p><pre class="programlisting"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">DataSetIterator mnistTrain = new      
MnistDataSetIterator(batchSize,true,12345);
DataSetIterator mnistTest = new     
MnistDataSetIterator(batchSize,false,12345);</span></pre></div><div class="section" title="Model configuration"><div class="titlepage"><div><div><h2 class="title"><a id="ch03lvl2sec35"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Model configuration</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">The next part of the operation is to configure the CNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.2">Deeplearning4j provides a simple builder to define the deep neural network layer by layer, setting the different desired hyperparameters:</span></p><pre class="programlisting">
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">MultiLayerConfiguration conf = new NeuralNetConfiguration.Builder() MultiLayerConfiguration.Builder builder = new  
NeuralNetConfiguration.Builder()
</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">.seed(seed)
</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">.iterations(iterations)</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">.regularization(true)
.l2(0.0005)
</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">.learningRate(0.01)</span></strong></span>
</pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">The first layer, Convolutional layer, can be called using the </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">ConvolutionLayer.Builder</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1"> method. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">The </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">.build()</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"> function is used to build the layer. </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">.stride()</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1"> is used to set the amount of stride for this Convolutional layer:</span></p><pre class="programlisting">
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">.layer(0, new ConvolutionLayer.Builder(5, 5)</span></strong></span>
</pre><p>
<code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">nIn</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"> and </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">nOut</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1"> signify the depth. </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">nIn</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"> here is </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">nChannels</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">, and </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">nOut</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"> is the number of filters to be applied for the convolution:</span></p><pre class="programlisting">
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">.nIn(nChannels)</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">.stride(1, 1)</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">.nOut(20)</span></strong></span>
</pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">To add the identity function as the activation function, we will define it in this way:</span></p><pre class="programlisting">
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">.activation("identity")</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">.build())</span></strong></span>
</pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">To add a Pooling layer of type Max-pooling, we will call the </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">SubsamplingLayer.Builder()</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1"> method after the first layer:</span></p><pre class="programlisting"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">.layer(1, new SubsamplingLayer.Builder(SubsamplingLayer.PoolingType
.MAX)
</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">.kernelSize(2,2)</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">.stride(2,2)</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">
.build())</span></pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">The</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1"> Rectifier Linear Unit</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">ReLU</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">) layer can be added by calling new </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">DenseLayer.Builder().activation("relu")</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">:</span></p><pre class="programlisting">
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">.layer(4, new DenseLayer.Builder().activation("relu")</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">
.nOut(500).build())</span></pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">The model can be initialized by calling the </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">init()</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1"> method as follows:</span></p><pre class="programlisting">
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">MultiLayerNetwork model = new MultiLayerNetwork(getConfiguration());</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">model.init();</span></strong></span>
</pre></div><div class="section" title="Training and evaluation"><div class="titlepage"><div><div><h2 class="title"><a id="ch03lvl2sec36"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">Training and evaluation</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">As mentioned in the earlier section, for the training part, we need to divide the whole big dataset into a number of batches. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.2">The model will then work on those batches one by one in Hadoop. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.3">Let's say we divide the dataset into 5,000 batches, each batch of size 1024 examples. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.4">The 1024 examples will then split into multiple numbers of blocks where the workers will work in parallel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.5">The split operation of the big dataset is done using the </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">RecordReaderDataSetIterator()</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1"> method. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.2">Let's first initialize the parameters needed to call the method as follows:</span></p><pre class="programlisting">
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">int batchSize = 1024;  </span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">int seed = 123;</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">int labelIndex = 4; </span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">int iterations = 1</span></strong></span>
</pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">Let the total number of classes in the image be </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">10</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">:</span></p><pre class="programlisting">
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">int numClasses = 10;</span></strong></span>
</pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">Now, as we have set the number of parameters for </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">RecordReaderDataSetIterator()</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">, we can call the method to set up the training platform:</span></p><pre class="programlisting">
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">DataSetIterator iterator = new RecordReaderDataSetIterator(recordReader,batchSize,labelIndex,numClasses);</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">DataSet batchData= iterator.next();</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">batchData.shuffle();</span></strong></span>
</pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">In the training phase, we can randomly split the batch into train and test datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.2">If we want 70 samples for the training set and the rest 30 for the test set, we can set this configuration by using the following:</span></p><pre class="programlisting">
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">SplitTestAndTrain testAndTrain = batchData.splitTestAndTrain(0.70);  </span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">
DataSet trainingData = testAndTrain.getTrain();
DataSet testData = testAndTrain.getTest();
        
trainAndTest =batchData.splitTestAndTrain(0.70);
trainInput = trainAndTest.getTrain();                

testInput.add(trainAndTest.getTest().getFeatureMatrix());</span></pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">When the model is fully trained, for each batch, the test data can be saved so as to validate the model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.2">Hence, by defining only one object of the </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">Evaluation</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1"> class, we will be able to collect the statistics of the entire dataset:</span></p><pre class="programlisting">
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">Evaluation eval = new Evaluation(numOfClasses);</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">for (int i = 0; i &lt; testInput.size(); i++) 
{</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">    INDArray output = model.output(testInput.get(i));</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">    eval.eval(testLabels.get(i), output);</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">}</span></strong></span>
</pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">The model is now completely ready to be trained. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.2">This can be done by calling the </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">fit()</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1"> method as follows:</span></p><pre class="programlisting">
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">model.fit(trainInput);</span></strong></span>
</pre></div></div></div></div></body></html>
