</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="preface" title="About the Reviewers"><div class="titlepage"><div><div><h1 class="title"><a id="pref05"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">About the Reviewers</span></h1></div></div></div><p>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Shashwat Shriparv</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> has more than 7 years of IT experience. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">He has worked with various technologies on his career path, such as Hadoop and subprojects, Java, .NET, and so on. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">He has experience in technologies such as Hadoop, HBase, Hive, Pig, Flume, Sqoop, Mongo, Cassandra, Java, C#, Linux, Scripting, PHP, C++, C, Web technologies, and various real-life use cases in BigData technologies as a developer and administrator. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.4">He likes to ride bikes, has interest in photography, and writes blogs when not working. </span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">He has worked with companies such as CDAC, Genilok, HCL, UIDAI(Aadhaar), Pointcross; he is currently working with CenturyLink Cognilytics.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">He is the author of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Learning HBase</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">, Packt Publishing, the reviewer of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Pig Design Pattern</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> book, Packt Publishing, and the reviewer of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Hadoop Real-World Solution </span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">cookbook, 2nd edition.</span></p><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">I would like to take this opportunity to thank everyone who have somehow made my life better and appreciated me at my best and bared with me and supported me during my bad times.</span></em></span>
</p><p>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Wissem El Khlifi</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1"> is the first Oracle ACE in Spain and an Oracle Certified Professional DBA with over 12 years of IT experience.
</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">He earned the Computer Science Engineer degree from FST Tunisia, Masters in Computer Science from the UPC Barcelona, and Masters in Big Data Science from the UPC Barcelona.
</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.3">His area of interest include Cloud Architecture, Big Data Architecture, and Big Data Management &amp; Analysis.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">His career has included the roles of: Java analyst / programmer, Oracle Senior DBA, and big data scientist. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">He currently works as Senior Big Data and Cloud Architect for Schneider Electric / APC.
</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.3">He writes numerous articles on his website </span><a class="ulink" href="http://www.oracle-class.com"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">http://www.oracle-class.com</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1"> and his twitter handle is </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">@orawiss</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">.</span></p></div></div></div></body></html>
