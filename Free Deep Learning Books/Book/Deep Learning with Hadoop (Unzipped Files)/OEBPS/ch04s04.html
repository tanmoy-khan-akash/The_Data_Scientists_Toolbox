</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Long short-term memory"><div class="titlepage"><div><div><h1 class="title"><a id="ch04lvl1sec27"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Long short-term memory</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">In this section, we will discuss a special unit called </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Long short-term memory</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">LSTM</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">), which is integrated into RNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">The main purpose of LSTM is to prevent a significant problem of RNN, called the vanishing gradient problem.</span></p><div class="section" title="Problem with deep backpropagation with time"><div class="titlepage"><div><div><h2 class="title"><a id="ch04lvl2sec41"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Problem with deep backpropagation with time</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Unlike the traditional feed forward network, due to unrolling of a RNN with narrow time steps, the feed forward network generated this way could be aggressively deep. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">This sometimes makes it extremely difficult to train via backpropagation through the time procedure.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">In the first chapter, we discussed the vanishing gradient problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">An unfolded RNN suffers from the vanishing gradient problem of exploding while performing backpropagation through time.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Every state of a RNN depends on its input and its previous output multiplied by the current hidden state vector. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">The same operations happen to the gradient in the reverse direction during backpropagation through time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">The layers and numerous time steps of the unfolded RNN relate to each other through multiplication, hence the derivatives are susceptible to vanish with every pass.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">On the other hand, a small gradient tends to get smaller, while a large gradient gets even larger while passing through every time step. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">This creates the vanishing or exploding gradient problem respectively for a RNN.</span></p></div><div class="section" title="Long short-term memory"><div class="titlepage"><div><div><h2 class="title"><a id="ch04lvl2sec42"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Long short-term memory</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">In the mid-90s, an updated version of RNNs with a special unit, called </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Long short-term memory</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">LSTM</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">) units, was proposed by German researchers Sepp Hochreiter and Juergen Schmidhuber [116] to protect against the exploding or vanishing gradient problem.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">LSTM helps to maintain a constant error, which can be propagated though time and through each layer of the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">This preservation of constant error allows the unrolled recurrent networks to learn on an aggressively deep network, even unrolled by a thousand time steps. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.3">This eventually opens a channel to link the causes of effects remotely.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">The architecture of LSTM maintains a constant error flow through the internal state of special memory units. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">The following figure (</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Figure 4.6</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">) shows a basic block diagram of a LSTM for easy understanding:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1"><img src="graphics/image_04_015.jpg" alt="Long short-term memory"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Figure 4.6: The figure shows a basic model of the Long-short term memorys</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">As shown in the preceding figure, an LSTM unit is composed of a memory cell that primarily stores information for long periods of time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.2">Three specialized gate neurons-- write gate, read gate, and forget gate-protect the access to this memory cell. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.3">Unlike the digital storage of computers, the gates are analog in nature, with a range of 0 to 1. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.4">Analog devices have an added advantage over digital ones, as they are differentiable, and hence, serve the purpose for the backpropagation method. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.5">The gate cell of LSTM, instead of forwarding the information as inputs to the next neurons, sets the associated weights connecting the rest of the neural network to the memory cell. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.6">The memory cell is, basically, a self-connected linear neuron. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.7">When the forget cell is reset (turned </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">0</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">), the memory cell writes its content to itself and remembers the last content of the memory. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.2">For a memory write operation though, the forget gate and write get should be set (turned </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">1</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">Also, when the forget gate outputs something close to </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">1</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">, the memory cell effectively forgets all the previous contents that it had stored. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">Now, when the write gate is set, it allows any information to write into its memory cell. Similarly, when the read gate outputs a </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">1</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">, it will allow the rest of the network to read from its memory cell.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">As explained earlier, the problem with computing the gradient descent for traditional RNNs is that the error gradient vanishes rapidly while propagating through the time steps in the unfolded network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">Adding an LSTM unit, the error values when backpropagated from the output are collected in the memory cell of the LSTM units. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.3">This phenomenon is also known as </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">error carousel</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.2">We will use the following example to describe how LSTM overcomes the vanishing gradient problem for RNNs:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"><img src="graphics/B05883_04_07-2.jpg" alt="Long short-term memory"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">Figure 4.7: The figure shows a Long-short term memory unfolded in time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.2">It also depicts how the content of the memory cell is protected with the help of three gates.</span></p><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">Figure 4.7</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1"> shows a Long short-term memory unit unrolled through time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">We will start with initializing the value of the forget gate to </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">1</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"> and write gate to </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">1</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">As shown in the preceding figure, this will write an information </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">K</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"> into the memory cell. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">After writing, this value is retained in the memory cell by setting the value of the forget gate to </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">0</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.2">We then set the value of the read gate as </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">1</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">, which reads and outputs the value </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">K</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1"> from the memory cell. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.2">From the point of loading </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">K</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1"> into the memory cell to the point of reading the same from the memory cell backpropagation through time is followed.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">The error derivatives received from the read point backpropagate through the network with some nominal changes, until the write point. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.2">This happens because of the linear nature of the memory neuron. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.3">Thus, with this operation, we can maintain the error derivatives over hundreds of steps without going into the trap of the vanishing gradient problems.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">So there are many reasons for why Long short-term memory outperforms standard RNNs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">LSTM was able to achieve the best known result in unsegmented connected handwriting recognition [117]; also, it is equally successfully applied to automated speech recognition. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.3">As of now, the major technological companies such as Apple, Microsoft, Google, Baidu, and so on have started to widely use LSTM networks as a primary component for their latest products [118].</span></p></div></div></div></div></body></html>
