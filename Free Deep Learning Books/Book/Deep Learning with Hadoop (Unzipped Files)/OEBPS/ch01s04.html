</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Classification of deep learning networks"><div class="titlepage"><div><div><h1 class="title"><a id="ch01lvl1sec10"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Classification of deep learning networks</span></h1></div></div></div><p>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Artificial neural networks</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> in machine learning are often termed as new generation neural networks by many researchers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">Most of the learning algorithms that we hear about were essentially built so as to make the system learn exactly the way the biological brain learns. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">This is how the name </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Artificial neural networks</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> came about! </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">Historically, the concept of deep learning emanated from </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Artificial neural networks</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">ANN</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">The practice of deep learning started back in the 1960s, or possibly even earlier. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">With the rise of deep learning, ANN, has gained more popularity in the research field.</span></p><p>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Multi-Layer Perceptron</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">MLP</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">) or feed-forward neural networks with many hidden intermediate layers which are referred to as </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">deep neural networks</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">DNN</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">), are some good examples of the deep architecture model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2">The first popular deep architecture model was published by Ivakhnenko and Lapa in 1965 using supervised deep feed-forward multilayer perceptron [17].</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1"><img src="graphics/B05883_01_15-1.jpg" alt="Classification of deep learning networks"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Figure 1.15: The GMDH network has four inputs (the component of the input vector x), and one output y ,which is an estimate of the true function y= f(x) = y</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Another paper from Alexey Ivakhnenko, who was working at that time on a better prediction of fish population in rivers, used the </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">group method of data handling algorithm</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">GMDH</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">), which tried to explain a type of deep network with eight trained layers, in 1971. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.2">It is still considered as one of most popular papers of the current millennium[18]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.3">The preceding </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Figure 1.15</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"> shows the GMDH network of four inputs.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Going forward, </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Backpropagation</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">BP</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">), which was a well-known algorithm for learning the parameters of similar type of networks, found its popularity during the 1980s. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">However, networks having a number of hidden layers are difficult to handle due to many reasons, hence, BP failed to reach the level of expectation [8] [19]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.3">Moreover, backpropagation learning uses the gradient descent algorithm, which is based on local gradient information, and these operations start from some random initial data points. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.4">While propagating through the increasing depth of networks, these often get collected in some undesired local optima; hence, the results generally get stuck in poor solutions.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">The </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">optimization constraints</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1"> related to the deep architecture model were pragmatically reduced when an efficient, unsupervised learning algorithm was established in two papers [8] [20]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">The two papers introduced a class of deep generative models known as a </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Deep belief network</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">DBN</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">).</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">In 2006, two more unsupervised deep models with non-generative, non-probabilistic features were published, which became immensely popular with the researcher community. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">One is an energy-based unsupervised model [21], and the other is a variant of auto-encoder with subsequent layer training, much like the previous DBN training [3]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.3">Both of these algorithms can be efficiently used to train a deep neural network, almost exactly like the DBN.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">Since 2006, the world has seen a tremendous explosion in the research of deep learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.2">The subject has seen continuous exponential growth, apart from the traditional shallow machine learning techniques.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Based on the learning techniques mentioned in the previous topics of this chapter, and depending on the use case of the techniques and architectures used, deep learning networks can be broadly classified into two distinct groups.</span></p><div class="section" title="Deep generative or unsupervised models"><div class="titlepage"><div><div><h2 class="title"><a id="ch01lvl2sec9"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">Deep generative or unsupervised models</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">Many deep learning networks fall under this category, such as Restricted Boltzmann machine, Deep Belief Networks, Deep Boltzmann machine, De-noising Autoencoders, and so on. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">Most of these networks can be used to engender samples by sampling within the networks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.3">However, a few other networks, for example sparse coding networks and the like, are difficult to sample, and hence, are, not generative in nature.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">A popular deep unsupervised model is the </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">Deep Boltzmann machine</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">DBM</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">) [22] [23] [24] [25]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.2">A traditional DBM contains many layers of hidden variables; however, the variables within the same layer have no connections between them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.3">The traditional </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Boltzmann machine</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">BM</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">), despite having a simpler algorithm, is too much complex to study and very slow to train. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.2">In a DBM, each layer acquires higher-order complicated correlations between the responses of the latent features of the previous layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.3">Many real-life problems, such as object and speech recognition, which require learning complex internal representations, are much easier to solve with DBMs.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">A DBM with one hidden layer is termed as a </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">Restricted Boltzmann machine</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">RBM</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.2">Similar to a DBM, an RBM does not have any hidden-to-hidden and visible-to-visible connections. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.3">The crucial property of an RBM is reflected in constituting many RBMs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.4">With numerous latent layers formed, the feature activation of a previous RBM acts as the input training data for the next. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.5">This kind of architecture generates a different kind of network named </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">Deep belief network</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">DBN</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.2">Various applications of the Restricted Boltzmann machine and Deep belief network are discussed in detail in </span><a class="link" href="ch05.html" title="Chapter 5.  Restricted Boltzmann Machines"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">
Chapter 5
</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Restricted Boltzmann Machines</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">A primary component of DBN is a set of layers, which reduces its time complexity linear of size and depth of the networks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.2">Along with DBN property, which could overcome the major drawback of BP by starting the training from some desired initialization data points, it has other attractive catching characteristics too. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.3">Some of them are listed as follows:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">DBN can be considered as a probabilistic generative model.</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">With hundreds of millions of parameters, DBNs generally undergo the over-fitting problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.2">Also, the deep architecture, due to its voluminous dataset, often experiences the under-fitting problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.3">Both of these problems can be effectively diminished in the pre-training step.</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">Effective uses of unlabeled data are practiced by DBN.</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">One more deep generative network, which can be used for unsupervised (as well as supervised) learning is the </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">sum-product network</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">SPN</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">) [26], [27]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.2">SPNs are deep networks, which can be viewed as directed acyclic graphs, where the leaves of the graph are the observed variables, and the internal nodes are the sum and product operations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.3">The 'sum' nodes represent the mixture models, and the 'product' nodes frame the feature hierarchy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.4">SPNs are trained using the expectation-maximization algorithm together with Back propagation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.5">The major hindrance in learning SPNs is that the gradient rapidly diminishes when moving towards the deep layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.6">Specifically, the standard gradient descent of the regular deep neural networks generated from the derivative of the conditional likelihood, goes through the tribulation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.7">A solution to reduce this problem is to substitute the marginal inference with the most probable state of the latent variables, and then disseminate the gradient through this. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.8">An exceptional outcome on small-scale image recognition was presented by Domingo and Gens in [28]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.9">The following </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">Figure 1.16</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1"> shows a sample SPN network for better understanding. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.2">It shows a block diagram of the sum-product network:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1"><img src="graphics/image_01_024.jpg" alt="Deep generative or unsupervised models"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">Figure 1.16: Block diagram of sum-product network</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">Another type of popular deep generative network, which can be used as unsupervised (as well as supervised) learning, is the </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">Recurrent neural network</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">RNN</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.2">The depth of this type of network directly depends on the length of the input data sequence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.3">In the unsupervised RNN model, experiences from previous data samples are used to predict the future data sequence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.4">RNNs have been used as an excellent powerful model for data sequencing text or speech, however, their popularity has recently decreased due to the rise of vanishing gradient problems [29] [16]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.5">Using stochastic curvature estimates, Hessian-free optimization [30] has somewhat overcome the limitations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.6">Recently, Bengio et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.7">[31] and Sutskever [32] have come out with different variations to train the generating RNNs, which outperform the Hessian-free optimization models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.8">RNN is further elucidated in this book in </span><a class="link" href="ch04.html" title="Chapter 4. Recurrent Neural Network"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">
Chapter 4
</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">Recurrent Neural Network</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">Among the other subclasses of unsupervised deep networks, the energy-based deep models are mostly known architecture [33] [34]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.2">A typical example of the unsupervised model category of deep networks is deep autoencoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.3">Most of the variants of deep autoencoder are generative in nature; however, the properties and implementations generally vary from each other. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.4">Popular examples are predictive sparse coders, Transforming Autoencoder, De-noising Autoencoder and their stacked versions, and so on. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.5">Auto-encoders are explained in detail in </span><a class="link" href="ch06.html" title="Chapter 6.  Autoencoders"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">
Chapter 6
</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">Autoencoders</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">.</span></p></div><div class="section" title="Deep discriminate models"><div class="titlepage"><div><div><h2 class="title"><a id="ch01lvl2sec10"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">Deep discriminate models</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">Most of the discriminative techniques used in supervised learning are shallow architectures such as Hidden Marcov models [35], [36], [37], [38], [39], [40], [41] or conditional random fields. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.2">However, recently, a deep-structured conditional random field model has evolved, by passing the output of every lower layer as the input of the higher layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.3">There are multiple versions of deep-structured conditional random fields which have been successfully accomplished to for natural language processing, phone recognition, language recognition, and so on. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.4">Although discriminative approaches are successful for deep-architectures, they have not been able to reach the expected outcome yet.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">As mentioned in the previous section, RNNs have been used for unsupervised learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.2">However, RNNs can also be used as a discriminative model and trained with supervised learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.3">In this case, the output becomes a label sequence related to the input data sequence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.4">Speech recognition techniques have already seen such discriminative RNNs a long time ago, but with very little success. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.5">Paper [42] shows that a Hidden Marcov Model was used to mutate the RNN classification outcome into a labelled sequence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.6">But unfortunately, the use of Hidden Marcov model for all these reasons did not take enough advantage of the full capability of RNNs.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">A few other methods and models have recently been developed for RNNs, where the fundamental idea was to consider the RNN output as some conditional distributions, and distribute all over the possible input sequences [43], [44],[45],[46]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.2">This helped RNNs to undergo sequence classification while embedding the long-short-term-memory to its model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.3">The major benefit was that it neither required the pre-segmentation of the training dataset, nor the post-processing of the outputs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.4">Basically, the segmentation of the dataset is automatically performed by the algorithm, and one differentiable objective function could be derived for optimization of the conditional distributions across the label sequence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.5">The effectiveness of this type of algorithm is extensively applicable for handwriting recognition operations.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">One more popular type of discriminative deep architecture is the </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">convolutional neural network</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">CNN</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.2">In CNN, each module comprises of a convolutional layer and one pooling layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.3">To form a deep model, the modules are generally stacked one on top of the other, or with a deep neural network on the top of it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.4">The convolutional layer helps to share many weights, and the pooling layer segregates the output of the convolutional later, minimizing the rate of data from the previous layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.5">CNN has been recognized as a highly efficient model, especially for tasks like image recognition, computer vision, and so on. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.6">Recently, with specific modifications in CNN design, it has also been found equally effective in speech recognition too. </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">Time-delay neural network</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">TDNN</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">) [47] [48], originated for early speech recognition, is a special case for convolutional neural network, and can also be considered its predecessor.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">In this type of model, the weight sharing is limited to only time dimension, and no pooling layer is present. </span><a class="link" href="ch03.html" title="Chapter 3.  Convolutional Neural Network"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">
Chapter 3
</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">Convolutional Neural Networks</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1"> discusses the concept and applications of CNNs in depth.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">Deep learning, with its many models, has a wide range of applications too. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.2">Many of the top technology companies, such as Facebook, Microsoft, Google, Adobe, IBM, and so on are extensively using deep learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.3">Apart from computer science, deep learning has also provided valuable contributions to other scientific fields as well.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">Modern CNNs used for object recognition have given a major insight into visual processing, which even neuroscientists can explore further. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.2">Deep learning also provides the necessary functional tools for processing large-scale data, and to make predictions in scientific fields. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.3">This field is also very successful in predicting the behaviors of molecules in order to enhance the pharmaceutical researches.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">To summarize, deep learning is a sub-field of machine learning, which has seen exceptional growth in usefulness and popularity due to its much wider applicability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.2">However, the coming years should be full of challenges and opportunities to ameliorate deep learning even further, and explore the subject for new data enthusiasts.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note8"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">To help the readers to get more insights into deep learning, here are a few other excellent and frequently updated reading lists available online:
