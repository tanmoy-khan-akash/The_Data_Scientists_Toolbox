</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Basic layers of CNN"><div class="titlepage"><div><div><h1 class="title"><a id="ch03lvl1sec20"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Basic layers of CNN</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">A CNN is composed of a sequence of layers, where every layer of the network goes through a differentiable function to transform itself from one volume of activation to another. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Four main types of layers are used to build a CNN: Convolutional layer, Rectified Linear Units layer, Pooling layer, and Fully-connected layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">All these layers are stacked together to form a full CNN.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">A regular CNN could have the following architecture:</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">[INPUT - CONV - RELU - POOL - FC]</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">However, in a deep CNN, there are generally more layers interspersed between these five basic layers.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">A classic deep neural network will have the following structure:</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Input -&gt; Conv-&gt;ReLU-&gt;Conv-&gt;ReLu-&gt;Pooling-&gt;ReLU-&gt;Conv-&gt;ReLu-&gt;Pooling-&gt;Fully Connected</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">AlexNet, as mentioned in the earlier section, can be taken as a perfect example for this kind of structure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">The architecture of AlexNet is shown in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Figure 3.4</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">After every layer, an implicit ReLU non-linearity has been added. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">We will explain this in detail in the next section.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">One might wonder, why do we need multiple layers in a CNN? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">The next section of this chapter shall explain this as well:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1"><img src="graphics/image_03_008.jpg" alt="Basic layers of CNN"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Figure 3.4: An illustration of the depth and weight of the AlexNet is shown in the figure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">The number inside the curly braces denotes the number of filters with dimensions written above.</span></p><div class="section" title="Importance of depth in a CNN"><div class="titlepage"><div><div><h2 class="title"><a id="ch03lvl2sec25"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Importance of depth in a CNN</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">In the paper [96], the author has put forward a few statistics, to show how deep networks help in gaining more accuracy of the output. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">As noted, the Architecture of Krizhevsky et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.3">model uses eight layers, which are trained on ImageNet. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.4">When the fully connected top layer (7th layer) is removed, it drops approximately 16 million parameters with a performance drop of 1.1%. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.5">Furthermore, when the top two layers (6th and 7th) are removed, nearly 50 million parameters get reduced along with a 5.7% drop in performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.6">Similarly, when the upper feature extractor layers (3rd and 4th) are removed, it results in a drop of around 1 million parameters with a performance drop of 3.0%. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.7">To get a better insight of the scenario, when the upper feature extractor layers and the fully connected (3rd, 4th, 6th, and 7th) layers are removed, the model was left with only four layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.8">In that case, a 33.5% drop in performance is experienced.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Therefore, it can be easily concluded that we need deep convolutional network to increase the performance of the model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">However, as already stated, a deep network is extremely difficult to manage in a centralized system due to limitations of memory and performance management. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">So, a distributed way of implementing deep CNN is required. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.4">In the subsequent sections of this chapter, we will explain how to implement this with the help of Deeplearning4j, and integrating the processing with Hadoop's YARN.</span></p></div><div class="section" title="Convolutional layer"><div class="titlepage"><div><div><h2 class="title"><a id="ch03lvl2sec26"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Convolutional layer</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">As illustrated in the architecture overview, the main purpose of convolution is to allow the model to work with a limited number of inputs at a particular time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">Moreover, convolution supports three most important features, which substantially help in improving the performance of a deep learning model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.3">The features are listed as follows:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Sparse connectivity</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Parameter sharing</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Equivariant representations</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">We will now describe each of these features in turn.</span></p><div class="section" title="Sparse connectivity"><div class="titlepage"><div><div><h3 class="title"><a id="ch03lvl3sec6"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Sparse connectivity</span></h3></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">As already explained, the traditional network layers use matrix multiplication by a matrix of parameters with a different parameter describing the interaction between each output unit and input unit. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.2">On the other hand, CNNs use sparse connectivity, sometimes referred to as sparse interactions or sparse weights, for this purpose. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.3">This idea is attained by keeping the size of the kernel smaller than the input, which helps in reducing the time complexity of the algorithm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.4">For example, for a large image dataset, the image could have thousands or millions of pixels; however, we can identify the small, significant features of the image, such as edges and contours from the kernels, which only have hundreds or tens of the whole pixels. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.5">Therefore, we need to keep only a small number of parameters, which, in turn, helps in the reduction of memory requirements of the models and datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.6">The idea also alleviates the number of operations, which could enhance the overall computing power. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.7">This, in turn, decreases the running time complexity of the computation in a huge manner, which eventually ameliorates its efficiency. </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Figure 3.5</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"> diagrammatically shows, how with the sparse connectivity approach, we can reduce the number of receptive fields of each neuron.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note13"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Each neuron in a Convolutional layer renders the response of the filters applied in the previous layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">The main purpose of these neurons is to pass the responses through some non-linearity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.3">The total area of the previous layers, where that filter was applied, is termed as the receptive field of that neuron. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.4">So, the receptive field is always equivalent to the size of the filter.</span></p></div></div><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1"><img src="graphics/B05883_03_05.jpg" alt="Sparse connectivity"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Figure 3.5: The figure shows how the input units of M affect the output unit N3 with sparse connectivity.Unlike matrix multiplication, the number of receptive fields in the sparse connectivity approach reduce from five to three (M2, M3, and M4). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">The arrows indicate the parameter sharing approach too. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.3">The connections from one neuron are shared with two neurons in the model</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">Therefore, with the sparse connectivity approach, the receptive fields for each layer are smaller than the receptive fields using the matrix multiplication approach. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">However, it is to be noted that for deep CNNs, the receptive field of the units is virtually larger than the receptive fields of the corresponding shallow networks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.3">The reason is that all the units in the deep networks are indirectly connected to almost all the neurons of the network. </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">Figure 3.6</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1"> shows a visual representation of such a scenario:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1"><img src="graphics/B05883_03_06.jpg" alt="Sparse connectivity"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Figure 3.6: Representation of sparse connectivity for deep layers of convolution neural networks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.2">Unlike Figure 3.5, where unit N3 had three receptive fields, here the number of receptive fields of N3 has increased to five.</span></p><div class="section" title="Improved time complexity"><div class="titlepage"><div><div><h4 class="title"><a id="ch03lvl4sec0"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Improved time complexity</span></h4></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">Similar to the example given in the previous section, if there are </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">p</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1"> inputs and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">q</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"> outputs in a layer, then the matrix multiplication will require </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">(p*q)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1"> number of parameters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">The running time complexity of the algorithm will become </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">O (p*q)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">With the sparsely connected approach, if we limit the number of upper limit connections associated with each output to </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">n</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">, then it will need only </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">n*q</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"> parameters, and the runtime complexity will reduce to </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">O (n*q)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.2">For many real-life applications, the sparse connectivity approach provides good performance for the deep learning tasks while keeping the size of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">n &lt;&lt;p</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">.</span></p></div></div><div class="section" title="Parameter sharing"><div class="titlepage"><div><div><h3 class="title"><a id="ch03lvl3sec7"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">Parameter sharing</span></h3></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">Parameter sharing can be defined as the process by which the same parameter for a function can be used for multiple functions in the model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">In regular neural networks, each element of the weight matrix is applied exactly once, when calculating the output of a layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.3">The weight is multiplied by one element of the input, but never revisited. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.4">Parameter sharing can also be referred to as tied weights, as the value of the weight used to one input is tied to the value weight used for others. </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Figure 3.5</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1"> can also be viewed as an example for parameter sharing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.2">For example, a particular parameter from </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">M2</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1"> is used with both </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">N1</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1"> and </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">N3</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">The main purpose of the operation is to control the number of free parameters in the Convolutional layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.2">In a CNN, each element of the kernel is used at almost every position of the input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.3">One logical assumption for this is that if one of the features is desirable at some spatial position, then it should also be necessary to calculate the other positions.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">Since all the elements of a single depth slice share the same type of parametrization, the forward pass in each depth slice of the Convolutional layer can be measured as a convolutional of input volume with the weights of the neurons. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.2">The outcome of this convolution is an activation map. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.3">These collections of activation maps are stacked together with the association of depth dimension to result the output volume. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.4">Although the parameter sharing approach bestows the translation invariance of the CNN architecture, it does not enhance the runtime of forward propagation.</span></p><div class="section" title="Improved space complexity"><div class="titlepage"><div><div><h4 class="title"><a id="ch03lvl4sec1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">Improved space complexity</span></h4></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">In parameter sharing, the runtime of the model still remains </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">O (n*q)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.2">However, it helps to reduce the overall space complexity in a significant way, as the storage requirement of the model reduces to n number of parameters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.3">Since </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">p</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1"> and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">q</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1"> are generally of similar sizes, the value of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">n</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1"> becomes almost negligible as compared to </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">p*q</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note14"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">Convolution is considerably more productive than the traditional dense matrix multiplication approach, both in terms of time complexity as well as space complexity.</span></p></div></div></div></div><div class="section" title="Equivariant representations"><div class="titlepage"><div><div><h3 class="title"><a id="ch03lvl3sec8"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">Equivariant representations</span></h3></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">In the convolution layer, due to parameter sharing, the layers possess a property termed as equivariance to translation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.2">An equivariant function is defined as a function whose output changes in the same way the input does.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">Mathematically, if X and Y both belong to a same group G, then a function </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">f: X </span><span class="inlinemediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1"><img src="graphics/Arrow.jpg" alt="Equivariant representations"/></span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">
   Y</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1"> is said to be equivariant if </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">f (g.x) = g.f(x) for</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1"> all </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">g</span></em></span>
<span class="emphasis"><em><span class="inlinemediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1"><img src="graphics/Belongs-t0.jpg" alt="Equivariant representations"/></span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">
 G</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1"> and all </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">x</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1"> in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">X</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">In case of convolution, if we take </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">g</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1"> to be any function, which shifts the input in equal magnitude, then the convolution function is equivariant to </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">g</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.2">For example, let </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">I</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1"> be a function that gives the image color for any even coordinate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.2">Let </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">h</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1"> be another function, which maps one image function to another image function, given by the following equation:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1"><img src="graphics/image_03_011.jpg" alt="Equivariant representations"/></span></div><p>
</p><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">I</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">/</span></sup></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1"> is an image function that moves every pixel of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">I</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1"> five units to the right. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.2">Therefore, we have the following:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1"><img src="graphics/image_03_012.jpg" alt="Equivariant representations"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">Now, if we apply this translation to </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">I</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">, followed by the convolution, the result would be exactly the same when we apply convolution to </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">I</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">/</span></sup></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">, followed by the transformation function </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">h</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1"> to the output.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">In case of images, a convolution operation generates a two-dimensional map of all the definite features present in the input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.2">So, similar to the earlier example, if we shift the object in the output by some fixed scale, the output representation will also move in the same scale. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.3">This concept is useful for some cases; for example, consider a group photo of cricket players of two different teams. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.4">We can find some common feature of the jersey in the image to detect some players. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.5">Now, the similar feature will obviously be present in others' t-shirts as well. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.6">So, it is quite practical to share the parameter across the entire image.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">Convolution also helps to process some special kinds of data, which are difficult, or rather not even possible, with the traditional fixed-shape matrix multiplication approach.</span></p></div></div><div class="section" title="Choosing the hyperparameters for Convolutional layers"><div class="titlepage"><div><div><h2 class="title"><a id="ch03lvl2sec27"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">Choosing the hyperparameters for Convolutional layers</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">So far we have explained how each neuron in the convolution layers is connected to the input volume. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.2">In this section, we will discuss the ways of controlling the size of the output volume. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.3">In other words, controlling the number of neurons in the output volume, and how they are arranged.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">Basically, there are three hyperparameters, which control the size of the output volume of the Convolutional layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.2">They are: the depth, stride, and zero-padding.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">How do we know how many Convolutional layers should we use, what should be the size of the filters, or the values of stride and padding? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.2">These are extremely subjective questions, and their solutions are not at all trivial in nature. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.3">No researchers have set any standard parameter to choose these hyperparameters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.4">A neural network generally and largely depends on the type of data used for training. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.5">This data can vary in size, complexity of the input raw image, type of image processing tasks, and many other criteria. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.6">One general line of thought by looking at the big dataset, is that one has to think how to choose the hyperparameters to deduce the correct combination, which creates abstractions of the images at proper scale. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.7">We'll discuss all these in this subsection.</span></p><div class="section" title="Depth"><div class="titlepage"><div><div><h3 class="title"><a id="ch03lvl3sec9"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">Depth</span></h3></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">In the output volume, depth is considered as an important parameter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.2">The depth corresponds to the number of filters we would like to apply for each learning iteration on some changes in the input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.3">If the first Convolutional layer takes a raw image as the input, then multiple neurons along the depth dimension might activate in the presence of various blobs of colors or different oriented edges. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.4">The set of neurons in the same regions of input are termed as a depth column.</span></p></div><div class="section" title="Stride"><div class="titlepage"><div><div><h3 class="title"><a id="ch03lvl3sec10"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">Stride</span></h3></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">Stride specifies the policy of allocation of depth columns around the spatial dimension (width and height). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.2">It basically controls how the filter convolves around the input volume. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.3">Stride can be formally defined as the amount by which the filter shifts during the convolution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.4">Ideally, the value of stride should be an integer and not a fraction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.5">Conceptually, this amount helps in deciding how much of the input image information one wants to retain before proceeding to the next layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.6">The more the stride, the more information that will be retained for the next layer.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">For example, when the stride is </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">, a new depth column is allocated to spatial positions, one spatial unit apart. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.2">This produces large output volumes due to heavily overlapping receptive fields in between the columns. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.3">On the other hand, if the value of stride is increased, there will be less overlapping among the receptive fields, which results in spatially smaller dimensional output volume.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">We will take an example to simplify the concept a bit more. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.2">Let us imagine a </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">7*7</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1"> input volume and a </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">3*3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1"> filter (we will ignore the third dimension for the sake of simplicity), with a stride of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.2">The output volume in this case would be of dimension </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">5*5</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">, as shown in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">Figure 3.7</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.2">However, this looks somewhat straightforward. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.3">Now, with stride </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">2</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">, keeping the other parameters the same, the output volume would have less dimensionality of the order </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">3*3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.2">In this case, the receptive field will shift by </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">2</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1"> units, and hence, the volume will shrink to a dimension of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">3*3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1"><img src="graphics/image_03_013.jpg" alt="Stride"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">Figure 3.7: Illustration of how the filter convolves around the input volume of 7x7 with stride 1 resulting in 5x5 output volume.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">This is illustrated in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">Figure 3.8</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.2">All these calculations are based on some formula mentioned in the next topic of this section. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.3">Now, if we want to increase the stride further to </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">, we will have difficulties with spacing and making sure the receptive field fits on the input volume. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.2">Ideally, a programmer will raise the value of the stride only if lesser overlapping of the receptive fields is required, and if they need smaller spatial dimensions:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1"><img src="graphics/image_03_014.jpg" alt="Stride"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">Figure 3.8: Illustration of how the filter convolves around the input volume of 7x7 with stride 2 resulting in 3x3 output volume.</span></p></div><div class="section" title="Zero-padding"><div class="titlepage"><div><div><h3 class="title"><a id="ch03lvl3sec11"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">Zero-padding</span></h3></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">We've already got enough information to infer that, as we keep applying more convolution layers to the input volume, the size of the output volume decreases further. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.2">However, in some cases, we might want to preserve almost all the information about the original input volume so that we can also extract the low-level features. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.3">In such scenarios, we pad the input volume with zeroes around the borders of the input volume.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">This size of zero-padding is considered as a hyperparameter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.2">It can be defined as a hyperparameter, which is directly used to control the spatial size of the output volume in scenarios where we want to exactly preserve the spatial size of input volume.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">For example, if we apply a </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">5*5*3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1"> filter to a </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">32*32*3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1"> input volume, the output volume will reduce to </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">28*28*3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.2">However, let's say we want to use the same Convolutional layer, but need to keep the output volume to </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">32*32*3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.2">We will use a zero-padding of size</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1"> 2 </span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">to this layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.2">This will give us an output volume of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">36*36*3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">, as shown in the following figure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.2">Now, if we apply three convolution layers with a </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">5*5*3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1"> filter, it will produce an output volume of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">32*32*3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">, hence maintaining the exact spatial size of the input volume. </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">Figure 3.9</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1"> represents the pictorial views of the scenario:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1"><img src="graphics/image_03_015.jpg" alt="Zero-padding"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">Figure 3.9: The input volume has a dimension of 32*32*3. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.2">The two borders of zeros will generate an input volume of 36*36*3. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.3">Further application of the Convolution layer, with three filters of size 5*5*3, having stride 1, will result in an output volume of 32*32*3.</span></p></div><div class="section" title="Mathematical formulation of hyperparameters"><div class="titlepage"><div><div><h3 class="title"><a id="ch03lvl3sec12"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">Mathematical formulation of hyperparameters</span></h3></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">This part of the chapter will introduce an equation to calculate the spatial size of the output volume based on the hyperparameters that we have discussed so far. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.2">The equation is extremely useful to choose the hyperparameter for the CNN, as these are the deciding factors to 'fit' the neurons in the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.3">The spatial size of the output volume can be written as a function of the input volume size (</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">W</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">), the receptive field size, or the filter size of the Convolutional layer neurons(</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">K</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">), value of the applied stride(</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">S</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">), and the amount of zero-padding used (</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">P</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">) on the border.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">The equation to compute the spatial size of output volume can be written as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1"><img src="graphics/image_03_016.jpg" alt="Mathematical formulation of hyperparameters"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">Considering the examples given in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">Figure 3.7</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1"> and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">Figure 3.8</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">, where </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">W=7</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">K=3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">, and with no padding, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">P =0</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.2">For stride </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">, we have </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">S=1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">, and this will give the following:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1"><img src="graphics/image_03_017.jpg" alt="Mathematical formulation of hyperparameters"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">Similarly for stride </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">2</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">, the equation will give a value of </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">2</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1"><img src="graphics/image_03_018.jpg" alt="Mathematical formulation of hyperparameters"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">Hence, as shown in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">Figure 3.7</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">, we would get an output of a spatial size of </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">3</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.2">However, with this configuration, when a stride of </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">3 </span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">is applied, it will not fit across the input volume, as this equation will return a fractional value </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">2.333</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1"> for the output volume:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1"><img src="graphics/image_03_019.jpg" alt="Mathematical formulation of hyperparameters"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">This also signifies that the values of the hyperparameter have mutual constraints. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.2">The preceding example returns a fractional value, hence, the hyperparameters would be considered as invalid. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.3">However, we might resolve the issue by adding some zero-padding around the border.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note15"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">The spatial arrangements of hyperparameters have mutual constraints.</span></p></div></div><div class="section" title="Effect of zero-padding"><div class="titlepage"><div><div><h4 class="title"><a id="ch03lvl4sec2"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">Effect of zero-padding</span></h4></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">As mentioned in the zero-padding section, its main purpose is to preserve the information of input volume to the next layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.2">To ensure same spatial size of input and output volume, the conventional formula for zero-padding, with a stride, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1">S=1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">, is as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1"><img src="graphics/image_03_020.jpg" alt="Effect of zero-padding"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">Taking the example given in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">Figure 3.9</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">, we can verify the authenticity of the formula. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.2">In the example, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">W = 32</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">K=5</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">, and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">S=1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.2">Therefore, to ensure the spatial output volume to be equal to 32, we choose the number of zero-padding as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1"><img src="graphics/image_03_021.jpg" alt="Effect of zero-padding"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">So, with </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">P=2</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">, the spatial size of the output volume is given as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1"><img src="graphics/image_03_022.jpg" alt="Effect of zero-padding"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">So, this equation worked out well to preserve the same spatial dimension for the input volume and output volume.</span></p></div></div></div><div class="section" title="ReLU (Rectified Linear Units) layers"><div class="titlepage"><div><div><h2 class="title"><a id="ch03lvl2sec28"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">ReLU (Rectified Linear Units) layers</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">In the convolution layer, the system basically computes the linear operations by doing element-wise multiplication and summations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.2">Deep convolution usually performs the convolution operations followed by a non-linear operation after each layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.3">This is essential, because cascading linear operations produce another linear system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.4">Adding non-linearity in between the layers corroborates a more expressive nature of the model than a linear model.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">Therefore, after each convolution layer, an activation layer is applied on the current output. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.2">So, the main objective of this activation layer is to introduce some non-linearity to the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.3">Modern CNNs use </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">Rectified Linear Unit</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1">ReLu</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">) as the activation function.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">In artificial neural networks, the activation function, the rectifier, is defined as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1"><img src="graphics/image_03_023.jpg" alt="ReLU (Rectified Linear Units) layers"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">where </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">x</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1"> is the input to a neuron.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">A unit operating the rectifier is termed as ReLU. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.2">Earlier, many non-linear functions such as </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">tan h</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">, sigmoid, and the like were used in the network, but in the last few years, researchers have identified that ReLU layers work much better, because they help the network to train a lot faster, without compromising the accuracy of the outcome. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.2">A significant improvement in the computational efficiency is a major factor for this.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">Furthermore, this layer enhances the non-linear properties of the model and other overall networks without having any impact on the receptive fields of the Convolutional layer.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">Recently, in 2013, Mass et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.2">[94] introduced a new version of non-linearity, termed as leaky-ReLU. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.3">Leaky-ReLU can be defined as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1"><img src="graphics/image_03_024.jpg" alt="ReLU (Rectified Linear Units) layers"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">where </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">Î±</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1"> is a predetermined parameter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.2">Later, in 2015, He et al [95] updated this equation by suggesting that the parameter Î± can also be trained, which leads to a much-improved model.</span></p><div class="section" title="Advantages of ReLU over the sigmoid function"><div class="titlepage"><div><div><h3 class="title"><a id="ch03lvl3sec13"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1">Advantages of ReLU over the sigmoid function</span></h3></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">ReLU helps to alleviate the vanishing gradient problem, which is explained in detail in </span><a class="link" href="ch01.html" title="Chapter 1. Introduction to Deep Learning"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">
Chapter 1
</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1">Introduction to Deep Learning</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.2">ReLU applies the aforementioned function </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1">f(x)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1"> to all the values of the input volume, and transforms all the negative activations to </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">0</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.2">For max function, the gradient is defined as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1"><img src="graphics/image_03_025.jpg" alt="Advantages of ReLU over the sigmoid function"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">However, for the Sigmoid function, the gradient tends to vanish as we increase or decrease the value of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">x</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">The Sigmoid function is given as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1"><img src="graphics/image_03_026.jpg" alt="Advantages of ReLU over the sigmoid function"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">The Sigmoid function has a range of [</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">0, 1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">], whereas the ReLU function has the range [</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">0, </span><span class="inlinemediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1"><img src="graphics/Infinity.jpg" alt="Advantages of ReLU over the sigmoid function"/></span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">
</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1">]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.2">Therefore, the Sigmoid function is applied to model the probability, while ReLU can be used to model all the positive numbers.</span></p></div></div><div class="section" title="Pooling layer"><div class="titlepage"><div><div><h2 class="title"><a id="ch03lvl2sec29"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">Pooling layer</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">This layer is the third stage of a CNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.2">After applying some Rectified Linear Units later, the programmer might choose to apply a Pooling layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.3">The layer can also be referred to as a down-sampling layer.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">The pooling function is basically used to further modify the output of the layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.2">The primary function of the layer is to replace the output of the network at a certain location with a summarized statistics of the neighboring outputs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.3">There are multiple options for this layer, Max-pooling being the most popular one. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.4">Max pooling operation [93] operates within a rectangular neighborhood, and reports the maximum output from it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.5">Max-pooling basically takes a filter (generally of size </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">2x2</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1">) and stride of the same length, that is, </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">2</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.2">The filter is then applied to the input volume, and it outputs the maximum number in every region where the filter convolves around. </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1">Figure 3.10</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1"> shows a representation of the same thing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.2">Other popular options for Pooling layers are the average of an </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1">L2</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1"> normal of a rectangular neighborhood, average of a rectangular neighborhood or a weighted average, which is based on the distance from the central pixel:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1"><img src="graphics/B05883_03_10.jpg" alt="Pooling layer"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1">Figure 3.10: Example of Max-pool with a 2*2 filter and stride 2. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.2">Image sourced from Wikipedia.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note16"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1">Invariance to local translation is extremely beneficial if we are interested in the neighboring features, rather than the exact position of the feature.</span></p></div></div><div class="section" title="Where is it useful, and where is it not?"><div class="titlepage"><div><div><h3 class="title"><a id="ch03lvl3sec14"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1">Where is it useful, and where is it not?</span></h3></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1">The intuitive reason behind the Pooling layer is that once some specific feature of the original input volume is known, its exact location becomes trivial as compared to its location relative to the other features. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.2">With the help of pooling, the representation becomes almost invariant to small translations of the input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.3">Invariance to translation signifies that for a small amount of translation on the input, the values of most of the pooled output do not vary significantly.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1">Invariance to local translation is extremely beneficial if we are interested in the neighboring features rather than the exact position of the feature. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.2">However, while dealing with computer vision tasks, it is required to be careful in the use of Pooling layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.3">Although pooling extensively helps in the reduction of complexity of the model, it might end up losing the location sensitivity of the model.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">Let us take an example of image processing, which involves identifying a box in an image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.2">Pooling layer in this case will help if we simply target to determine the existence of the box in the image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.3">However, if the problem statement is more concerned with locating the exact position of the box, we will have to be careful enough while using the Pooling layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.4">As another example, let us say we are working on a language model, and are interested in identifying the contextual similarity between two words. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.5">In this case, the use of Pooling layer is not advisable, as it will lose out on some valuable feature information.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1">Therefore, it can be concluded that Pooling layer is basically used for reducing the computational complexity of the model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.2">The Pooling layer is more like an averaging process, where we are more interested in a group of neighboring features. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.3">The layer can be applied in scenarios where we can afford to let go of some of the localized information.</span></p></div></div><div class="section" title="Fully connected layer"><div class="titlepage"><div><div><h2 class="title"><a id="ch03lvl2sec30"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1">Fully connected layer</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.1">The fully connected layer is the final layer of a CNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.2">The input volume for this layer comes from the output of the preceding Convolutional layer, ReLU, or Pooling layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.3">The fully connected layer takes this input and outputs an </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.1">N</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.1"> dimensional vector, where </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.321.1">N</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.1"> is the number of different classes present in the initial input datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.2">The basic idea on which a fully connected layer works is that it works on the output received from the preceding layer, and identifies the specific feature that mostly correlates to a particular class. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.3">For example, if the model is predicting whether an image contains a cat or bird, it will have high values in the activation maps, which will represent some high-level features such as four legs or wings, respectively.</span></p></div></div></div></div></body></html>
