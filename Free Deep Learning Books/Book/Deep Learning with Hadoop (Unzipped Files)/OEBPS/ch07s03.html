</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Natural language processing using Hadoop"><div class="titlepage"><div><div><h1 class="title"><a id="ch07lvl1sec48"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Natural language processing using Hadoop</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The exponential growth of information in the Web has increased the intensity of diffusion of large-scale unstructured natural language textual resources. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Hence, in the last few years, the interest to extract, process, and share this information has increased substantially. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Processing these sources of knowledge within a stipulated time frame has turned out to be a major challenge for various research and commercial industries. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">In this section, we will describe the process used to crawl the web documents, discover the information and run natural language processing in a distributed manner using Hadoop.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">To design architecture for </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">natural language processing</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">NLP</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">), the first task to be performed is the extraction of annotated keywords and key phrases from the large-scale unstructured data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">To perform the NLP on a distributed architecture, the Apache Hadoop framework can be chosen for its efficient and scalable solution, and also to improve the failure handling and data integrity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.3">The large-scale web crawler can be set to extract all the unstructured data from the Web and write it in the Hadoop Distributed File System for further processing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.4">To perform the particular NLP tasks, we can use the open source GATE application as shown in the paper [136]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.5">An overview of the tentative design of a distributed natural language processing architecture is shown in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Figure 7.2</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">To distribute the working of the web crawler, map-reduce can be used and run across multiple nodes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">The execution of the NLP tasks and also the writing of the final output is performed with Map-reduce. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">The whole architecture will depend on two input files i) the </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">seedurls</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1"> given for crawling a particular web page stored in </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">seed_urls.txt</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1"> and ii) the path location of the NLP application (such as where GATE is installed). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">The web crawler will take </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">seedurls</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> from the </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">.txt</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1"> file and run the crawler for those in parallel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">Asynchronously, an extraction plugin searches the keywords and key phrases on the crawled web pages and executes independently along with the web pages crawled. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.3">At the last step, a dedicated program stores the extracted keywords and key phrases in an external SQL database or a NoSQL database such as </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Elasticsearch</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">, as per the requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">All these modules mentioned in the architecture are described in the following subsections.</span></p><div class="section" title="Web crawler"><div class="titlepage"><div><div><h2 class="title"><a id="ch07lvl2sec64"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Web crawler</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">To explain this phase, we won't go into a deep explanation, as it's almost out of the scope of this book. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.2">Web crawling has a few different phases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.3">The first phase is the URL discovery stage, where the process takes each seed URL as the input of the </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">seed_urls.txt</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1"> file and navigates through the pagination URLs to discover relevant URLs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.2">This phase defines the set of URLs that are going to be fetched in the next phase.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">The next phase is fetching the page content of the URLs and saving in the disk. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">The operation is done segment-wise, where each segment will contain some predefined numbers of URLs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.3">The operation will run in parallel on different </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">DataNodes</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">The final outcome of the phases is stored in the Hadoop Distributed File System. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.3">The Keyword extractor will work on these saved page contents for the next phase.</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1"><img src="graphics/B05883_07_02-1.jpg" alt="Web crawler"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Figure 7.2: The representation of  how natural language processing is performed in Hadoop that is going to be fetched in the next phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">The next phase is fetching the page content of the URLs and saving in the disk. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.3">The operation is done segment wise, where each segment will contain some pre-defined numbers of URLs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.4">The operation will run in parallel on different DataNodes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.5">The final outcome of the phases is stored in Hadoop Distributed File System. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.6">The keyword extractor will work on these saved page contents for the next phase.</span></p></div><div class="section" title="Extraction of keyword and module for natural language processing"><div class="titlepage"><div><div><h2 class="title"><a id="ch07lvl2sec65"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Extraction of keyword and module for natural language processing</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">For the page content of each URL, a </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">Document Object Model</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">DOM</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">) is created and stored back in the HDFS. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.2">In the </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">DOM</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">, documents have a logical structure like a tree. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.2">Using DOM, one can write the </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">xpath</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1"> to collect the required keywords and phrases in the natural language processing phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">In this module, we will define the Map-reduce job for executing the natural language processing application for the next phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.3">The map function defined as a </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">&lt;key, value&gt;</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"> pair key is the URL, and values are a corresponding DOM of the URL. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.2">The </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">reduce</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1"> function will perform the configuration and execution of the natural language processing part. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">The subsequent estimation of the extracted keywords and phrases at the web domain level will be performed in the </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">reduce</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"> method. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">For this purpose, we can write a custom plugin to generate the rule files to perform various string manipulations to filter out the noisy, undesired words from the extracted texts. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.3">The rule files can be a JSON file or any other easy to load and interpret file based on the use case. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.4">Preferably, the common nouns and adjectives are identified as common keywords from the texts.</span></p></div><div class="section" title="Estimation of relevant keywords from a page"><div class="titlepage"><div><div><h2 class="title"><a id="ch07lvl2sec66"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">Estimation of relevant keywords from a page</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">The paper [136] has presented a very important formulation to find the relevant keywords and key phrases from a web document. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.2">They have provided the </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">Term Frequency - Inverse Document Frequency</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">TF-IDF</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">) metric to estimate the relevant information from the whole corpus, composed of all the documents and pages that belong to a single web domain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.2">Computing the value of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">TD-IDF</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1"> and assigning it a threshold value for discarding other keywords allows us to generate the most relevant words from the corpus. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.2">In other words, it discards the common articles and conjunctions that might have a high frequency of occurrence in the text, but generally do not possess any meaningful information. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.3">The </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">TF-IDF</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"> metric is basically the product of two functions, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">TF</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1"> and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">IDF</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">.</span></p><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">TF</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1"> provides the frequency of each word in the corpus, that is, how many times a word is present in the corpus. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.2">Whereas </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">IDF</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1"> behaves as a balance term, showing higher values for terms having the lower frequency in the whole corpus.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Mathematically, the metric </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">TF-IDF</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1"> for a keyword or key phrase </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">i</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1"> in a document </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">d</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1"> contained in the document </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">D</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1"> is given by the following equation:</span></p><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">(TF-IDF)</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1"> = TF</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1"> . </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.2">IDF</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">i</span></sub></em></span>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">Here </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">TF</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1"> = f</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">/n</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">d</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1"> and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">IDF</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1"> = log N</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">d</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">/N</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">i</span></sub></em></span>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">Here </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">f</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">i</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1"> is the frequency of the candidate keyword or key phrase </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">i</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1"> in the document </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">d</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1"> and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">n</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">d</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1"> is the total number of terms in the document </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">d</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.2">In </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">IDF</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">N</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">D</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1"> </span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">denotes the total number of documents present in the corpus </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">D</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">, whereas </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">N</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">i</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1"> denotes the number of documents in which the keyword or key phrase </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">i</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1"> is present.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">Based on the use cases, one should define a generic threshold frequency for </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">TF-IDF</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.2">For a keyword or key phrase </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">i</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1"> if the value of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">TF-IDF</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1"> becomes higher than the threshold value, that keyword or key phrase is accepted as final as written directly to the HDFS. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.2">On the other hand, if the corresponding value is less than the threshold value, that keyword is dropped from the final collection. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.3">In that way, finally, all the desired keywords will be written to the HDFS.</span></p></div></div></div></div></body></html>
