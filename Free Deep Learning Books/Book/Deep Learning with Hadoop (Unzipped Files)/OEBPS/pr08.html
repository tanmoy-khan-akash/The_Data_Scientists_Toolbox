</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="preface" title="Preface"><div class="titlepage"><div><div><h1 class="title"><a id="pref11"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Preface</span></h1></div></div></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">This book will teach you how to deploy large-scale datasets in deep neural networks with Hadoop for optimal performance.</span></p><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Starting with understanding what deep learning is, and what the various models associated with deep neural networks are, this book will then show you how to set up the Hadoop environment for deep learning.</span></p><p>
</p><div class="section" title="What this book covers"><div class="titlepage"><div><div><h1 class="title"><a id="pf11lvl1sec1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">What this book covers</span></h1></div></div></div><p>
<a class="link" href="ch01.html" title="Chapter 1. Introduction to Deep Learning"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Chapter 1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">,</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> Introduction to Deep Learning</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">, covers how deep learning has gained its popularity over the last decade and is now growing even faster than machine learning due to its enhanced functionalities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">This chapter starts with an introduction of the real-life applications of Artificial Intelligence, the associated challenges, and how effectively Deep learning is able to address all of these. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">The chapter provides an in-depth explanation of deep learning by addressing some of the major machine learning problems such as, The curse of dimensionality, Vanishing gradient problem, and the likes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.4">To get started with deep learning for the subsequent chapters, the classification of various deep learning networks is discussed in the latter part of this chapter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.5">This chapter is primarily suitable for readers, who are interested to know the basics of deep learning without getting much into the details of individual deep neural networks.</span></p><p>
<a class="link" href="ch02.html" title="Chapter 2.  Distributed Deep Learning for Large-Scale Data"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Chapter 2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">,</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1"> Distributed Deep Learning for Large - Scale Data</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">, explains that big data and deep learning are undoubtedly the two hottest technical trends in recent days. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">Both of them are critically interconnected and have shown tremendous growth in the past few years. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.3">This chapter starts with how deep learning technologies can be furnished with massive amount of unstructured data to facilitate extraction of valuable hidden information out of them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.4">Famous technological companies such as Google, Facebook, Apple, and the like are using this large-scale data in their deep learning projects to train some aggressively deep neural networks in a smarter way. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.5">Deep neural networks, however, show certain challenges while dealing with Big data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.6">This chapter provides a detailed explanation of all these challenges. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.7">The latter part of the chapter introduces Hadoop, to discuss how deep learning models can be implemented using Hadoop's YARN and its iterative Map-reduce paradigm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.8">The chapter further introduces Deeplearning4j, a popular open source distributed framework for deep learning and explains its various components.</span></p><p>
<a class="link" href="ch03.html" title="Chapter 3.  Convolutional Neural Network"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Chapter 3</span></a>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">, Convolutional Neural Network</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">,</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> </span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">introduces Convolutional neural network (CNN), a deep neural network widely used by top technological industries in their various deep learning projects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2">CNN comes with a vast range of applications in various fields such as image recognition, video recognition, natural language processing, and so on. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.3">Convolution, a special type of mathematical operation, is an integral component of CNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.4">To get started, the chapter initially discusses the concept of convolution with a real-life example. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.5">Further, an in-depth explanation of Convolutional neural network is provided by describing each component of the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.6">To improve the performance of the network, CNN comes with three most important parameters, namely, sparse connectivity, parameter sharing, and equivariant representation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.7">The chapter explains all of these to get a better grip on CNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.8">Further, CNN also possesses few crucial hyperparameters, which help in deciding the dimension of output volume of the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.9">A detailed discussion along with the mathematical relationship among these hyperparameters can be found in this chapter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.10">The latter part of the chapter focuses on distributed convolutional neural networks and shows its implementation using Hadoop and Deeplearning4j.</span></p><p>
<a class="link" href="ch04.html" title="Chapter 4. Recurrent Neural Network"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Chapter 4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">,</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1"> Recurrent Neural Network</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">, explains that it is a special type of neural network that can work over long sequences of vectors to produce different sequences of vectors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">Recently, they have become an extremely popular choice for modeling sequences of variable length. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.3">RNN has been successfully implemented for various applications such as speech recognition, online handwritten recognition, language modeling, and the like. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.4">The chapter provides a detailed explanation of the various concepts of RNN by providing essential mathematical relations and visual representations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.5">RNN possesses its own memory to store the output of the intermediate hidden layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.6">Memory is the core component of the recurrent neural network, which has been discussed in this chapter with an appropriate block diagram. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.7">Moreover, the limitations of uni-directional recurrent neural networks are provided, and to overcome the same, the concept of bidirectional recurrent neural network (BRNN) is introduced. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.8">Later, to address the problem of vanishing gradient, introduced in chapter 1, a special unit of RNN, called Long short-term Memory (LSTM) is discussed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.9">In the end, the implementation of distributed deep recurrent neural network with Hadoop is shown with Deeplearning4j.</span></p><p>
<a class="link" href="ch05.html" title="Chapter 5.  Restricted Boltzmann Machines"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Chapter 5</span></a>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">, Restricted Boltzmann Machines</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">,</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1"> </span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">covers both the models discussed in chapters 3 and 4 and explains that they are discriminative models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.2">A generative model called Restricted Boltzmann machine (RBM) is discussed in chapter 5. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.3">RBM is capable of randomly producing visible data values when hidden parameters are supplied to it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.4">The chapter starts with introducing the concept of an Energy-based model, and explains how Restricted Boltzmann machines are related to it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.5">Furthermore, the discussion progresses towards a special type of RBM known as Convolutional Restricted Boltzmann machine, which is a combination of both Convolution and Restricted Boltzmann machines, and facilitates in the extraction of the features of high dimensional images.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Deep Belief networks (DBN), a widely used multilayer network composed of several Restricted Boltzmann machines gets introduced in the latter part of the chapter.  This part also discusses how DBN can be implemented in a distributed environment using Hadoop. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">The implementation of RBM as well as distributed DBN using Deeplearning4j is discussed in the end of the chapter.</span></p><p>
<a class="link" href="ch06.html" title="Chapter 6.  Autoencoders"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Chapter 6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">,</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1"> Autoencoders</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">, introduces one more generative model called autoencoder, which is generally used for dimensionality reduction, feature learning, or extraction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">The chapter starts with explaining the basic concept of autoencoder and its generic block diagram.  The core structure of an autoencoder is basically divided into two parts, encoder and decoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.3">The encoder maps the input to the hidden layer, whereas the decoder maps the hidden layer to the output layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.4">The primary concern of a basic autoencoder is to copy certain aspects of the input layer to the output layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.5">The next part of the chapter discusses a type of autoencoder called sparse autoencoder, which is based on the distributed sparse representation of the hidden layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.6">Going further, the concept of deep autoencoder, comprising multiple encoders and decoders is explained in-depth with an appropriate example and block diagram. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.7">As we proceed, denoising autoencoder and stacked denoising autoencoder are explained in the latter part of the chapter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.8">In conclusion, chapter 6 also shows the implementation of stacked denoising autoencoder and deep autoencoder in Hadoop using Deeplearning4j.</span></p><p>
<a class="link" href="ch07.html" title="Chapter 7. Miscellaneous Deep Learning Operations using Hadoop"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">Chapter 7</span></a>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">, Miscellaneous Deep Learning Operations using Hadoop</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">,</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1"> </span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">focuses, mainly,on the design of three most commonly used machine learning applications in distributed environment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.2">The chapter discusses the implementation of large-scale video processing, large-scale image processing, and natural language processing (NLP) with Hadoop. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.3">It explains how the large-scale video and image datasets can be deployed in Hadoop Distributed File System (HDFS) and processed with Map-reduce algorithm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.4">For NLP, an in-depth explanation of the design and implementation is provided at the end of the chapter.</span></p></div></div></div></div></body></html>
