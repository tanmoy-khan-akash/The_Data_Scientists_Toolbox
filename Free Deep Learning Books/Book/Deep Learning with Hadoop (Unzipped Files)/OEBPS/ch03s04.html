</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Distributed deep CNN"><div class="titlepage"><div><div><h1 class="title"><a id="ch03lvl1sec21"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Distributed deep CNN</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">This section of the chapter will introduce some extremely aggressive deep CNN architecture, associated challenges for these networks, and the need of much larger distributed computing to overcome this. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">This section will explain how Hadoop and its YARN can provide a sufficient solution for this problem.</span></p><div class="section" title="Most popular aggressive deep neural networks and their configurations"><div class="titlepage"><div><div><h2 class="title"><a id="ch03lvl2sec31"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Most popular aggressive deep neural networks and their configurations</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">CNNs have shown stunning results in image recognition in recent years. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">However, unfortunately, they are extremely expensive to train. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">In the case of a sequential training process, the convolution operation takes around 95% of the total running time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.4">With big datasets, even with low-scale distributed training, the training process takes many days to complete. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.5">The award winning CNN, AlexNet with ImageNet in 2012, took nearly an entire week to train on with two GTX 580 3 GB GPUs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.6">The following table displays few of the most popular distributed deep CNNs with their configuration and corresponding time taken for the training process to complete:</span></p><div class="informaltable"><table border="1"><colgroup><col/><col/><col/><col/><col/></colgroup><tbody><tr><td>

</td></tr></tbody></table></div></div><div class="section" title="Training time - major challenges associated with deep neural networks"><div class="titlepage"><div><div><h2 class="title"><a id="ch03lvl2sec32"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Training time - major challenges associated with deep neural networks</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">From the preceding table, it can be surely inferred that there have been loads of efforts made by researchers to increase the accuracy of the outcome. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.2">One key point that comes out from the table is that the numbers of layers have been one of the major criteria to improve the accuracy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.3">Microsoft's Resnet uses a neural network, as deep as 152 layers, which turns to be an extremely aggressive deep neural network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.4">This architecture has set many new records in 2015 in classification, localization, and detection through the deep CNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.5">Apart from this, ResNet has also won the ILSVRC 2015 with an incredible improvement in the error rate of only 3.6%.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">Although deep convolutional networks are almost about to reach the expected mark of accuracy, the major concern in almost all these deep CNNs is the rightmost column of the table. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.2">Hence, it shows that the current challenge for training deep CNNs is to build a large-scale distributed framework to parallelize the training across many CPUs and GPUs over a fast interconnected network.</span></p></div><div class="section" title="Hadoop for deep CNNs"><div class="titlepage"><div><div><h2 class="title"><a id="ch03lvl2sec33"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">Hadoop for deep CNNs</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">In this section, we will explain how Hadoop can be used to distribute the deep models at a large scale for faster processing.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">The running times of CNNs can be divided into two major categories:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">All the Convolutional layers present in the network consume around 90-95% of the computation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.2">They use approximately 5% of the parameters, and have large representations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.3">[101]</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">The rest of the computation, around 5-10%, is taken by the fully connected layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">They use almost 95% of the parameters, and have small representations.</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Alex Krizhevsky in [101] has proposed an algorithm for training of CNN using distributed architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.2">In a traditional CNN, the convolution operation itself consumes nearly the entire running time of the whole process; hence, data parallelism should be used for faster training. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.3">However, for a fully connected layer, it is advisable to use the model parallelism approach. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.4">We'll explain the algorithm using Hadoop and its YARN in this section of the chapter.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">In Hadoop, the distributed system workers sit on each of the blocks of HDFS, and process the data synchronously in parallel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">We will use a small batch size of 1024 numbers of examples from the raw input image, which will be split into N multiple blocks of </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">Hadoop Distributed File System</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">HDFS</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">So, total </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">N</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1"> workers will be working for each small batch of data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.2">The block size of HDFS would be kept as size </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">K</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.2">Now, what should be the size of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">K</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">Although, a small size of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">K</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1"> will increase the number of blocks and help to make the training even faster, a large number of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">N</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1"> will also eventually increase the volume of metadata that resides in the NameNode. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.2">One major drawback in this case, is </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">Single Point of Failure</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">SPOF</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">) for Hadoop [81], which is more prone to smaller size of main memory for NameNode. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.2">However, with a bigger value of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">K</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">, we will get a small number of blocks of HDFS, and hence, the number of workers working in parallel will be lesser in number. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.2">This will again make the training process slower. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.3">So, a better approach to choose the size of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">K</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"> will primarily depend on the following three factors:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">The availability of the primary memory's size of your NameNode.</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">The size of the input batch and the complexity of operations performed on each block of data.</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">How important or valuable your intermediate outcome of the data is. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.2">Based on these criteria, we can set the replication factor. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.3">However, the higher the replication factor, the higher the load of the NameNode.</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">The blocks of HDFS are distributed across all the DataNodes of Hadoop where YARN will operate directly on them in parallel.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">The steps for distributed training of the Convolutional layer are as follows:</span></p><div class="orderedlist"><ol class="orderedlist arabic"><li class="listitem"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">Each of the </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">N</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1"> blocks is given a different small data batch of 1024 examples from the raw input image.</span></li><li class="listitem"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">The same size of filter and stride is applied on each of the N numbers of blocks, which results in individual spatial output based on the values of the inputs.</span></li><li class="listitem"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">ReLU is applied on all of these, synchronously, in parallel to get some non-linearity in the outcome.</span></li><li class="listitem"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">Max-pooling, or any other down-sampling algorithm, if desired, is applied on these separate chunks of data based on the necessity of the outcome.</span></li><li class="listitem"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">The outputs (transformed parameters) for each iteration of the </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">N</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"> blocks are sent back to the master-node called Resource Manager, where their parameters are averaged. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.2">The newly updated parameter is sent back to each of the </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">N</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1"> blocks to perform the actions again.</span></li><li class="listitem"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">Steps 2 to 5 are repeated for a predefined number of epochs.</span></li></ol></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">For a Fully-connected layer, one of the </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">N</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1"> number of workers working on any of the </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">N</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1"> blocks of data for a small batch of input image will send the last-stage convolutional activities to all other (</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">N-1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">) numbers of workers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.2">The workers will then perform the fully-connected operation on this batch of 1024 examples, then initiate to back-propagate the gradients for these 1024 examples. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.3">The next worker, in parallel to this operation, will then send its last-stage Convolutional layer activities to the other workers similar to the earlier situation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.4">The workers will again work on the fully-connected activities for the second batch of 1024 examples. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.5">The process will iterate until we get the outcome with the desired minimal error.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">In this method, the workers broadcast their last-stage Convolutional layer's information to all other workers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.2">The main benefit of this approach is that a large proportion (</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">(N-1)/N</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">) of the communication can be suppressed, and it can be run in parallel with the calculation of the Fully-connected layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.2">The approach is extremely advantageous in terms of communication of the network.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">Therefore, it is very clear that Hadoop can be highly beneficial for providing a distributed environment for a CNN with the help of HDFS and Hadoop YARN.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">So, now that we are familiar with the approach of distributing the model in parallel with Hadoop, the next part of the section will discuss the coding part that each of the workers will be operating on each block of HDFS.</span></p></div></div></div></div></body></html>
