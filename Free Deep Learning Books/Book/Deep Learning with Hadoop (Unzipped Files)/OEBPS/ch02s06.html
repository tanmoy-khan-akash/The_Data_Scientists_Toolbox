</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Summary"><div class="titlepage"><div><div><h1 class="title"><a id="ch02lvl1sec17"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Summary</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">In contrast to the traditional machine learning algorithms, deep learning models have the capability to address the challenges imposed by a massive amount of input data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Deep learning networks are designed to automatically extract complex representation of data from the unstructured data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">This property makes deep learning a precious tool to learn the hidden information from the big data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">However, due to the velocity at which the volume and varieties of data are increasing day by day, deep learning networks need to be stored and processed in a distributed manner. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">Hadoop, being the most widely used big data framework for such requirements, is extremely convenient in this situation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.6">We explained the primary components of Hadoop that are essential for distributed deep learning architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.7">The crucial characteristics of distributed deep learning networks were also explained in depth. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.8">Deeplearning4j, an open source distributed deep learning framework, integrates with Hadoop to achieve the mentioned indispensable requirement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.9">Deeplearning4j is entirely written in Java, can process data faster in a distributed manner with iterative Map-Reduce, and can address many problems imposed by the large-scale data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.10">We have provided two sample examples to let you know about basic Deeplearning4j codes and syntax. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.11">We have also provided some code snippets for Spark configuration with integration with Hadoop YARN and Hadoop Distributed File System.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">The next chapter of this book will introduce convolutional neural network, a popular deep learning network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">The chapter will discuss the method convolution and how it can be used to build an advanced neural network mainly for image processing and image recognition. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">The chapter will then provide information on how a convolutional neural network can be implemented using Deeplearning4j.</span></p></div></div></div></body></html>
