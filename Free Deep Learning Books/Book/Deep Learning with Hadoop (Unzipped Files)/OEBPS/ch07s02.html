</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Large-scale image processing using Hadoop"><div class="titlepage"><div><div><h1 class="title"><a id="ch07lvl1sec47"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Large-scale image processing using Hadoop</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We have already mentioned in the earlier chapters how the size and volume of images are increasing day by day; the need to store and process these vast amount of images is difficult for centralized computers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Let's consider an example to get a practical idea of such situations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Let's take a large-scale image of size 81025 pixels by 86273 pixels. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">Each pixel is composed of three values:red, green, and blue. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">Consider that, to store each of these values, a 32-bit precision floating point number is required. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.6">Therefore, the total memory consumption of that image can be calculated as follows:</span></p><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">86273 * 81025 * 3 * 32 bits = 78.12 GB</span></em></span>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Leave aside doing any post processing on this image, as it can be clearly concluded that it is impossible for a traditional computer to even store this amount of data in its main memory. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">Even though some advanced computers come with higher configurations, given the return on investment, most companies do not opt for these computers as they are much too expensive to be acquired and maintained. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">Therefore, the proper solution should be to run the images in commodity hardware so that the images can be stored in their memory. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.4">In this section, we will explain the use of Hadoop to process these vast amounts of images in a distributed manner.</span></p><div class="section" title="Application of Map-Reduce jobs"><div class="titlepage"><div><div><h2 class="title"><a id="ch07lvl2sec63"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Application of Map-Reduce jobs</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">In this section, we will discuss how to process large image files using Map-reduce jobs with Hadoop. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">Before the job starts, all the input images to be processed are loaded to the HDFS. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">During the operation, the client sends a job request, which goes through NameNode. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.4">NameNode collects that request from the client, searches its metadata mapping, and then sends the data block information of the filesystem as well as location of the data block back to the client. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.5">Once the client gets the block's metadata, it automatically accesses the DataNodes, where the requested data block resides, then processes this data via the applicable commands.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">The Map-reduce jobs used for large-scale image processing are primarily responsible for controlling the whole task. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">Basically, here we explain the concept of an executable shell script file, which is responsible for collecting the executable file's input data from the HDFS.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">The best way to use the Map-reduce programming model is to design our own Hadoop data types for processing large numbers of image files directly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">The system will use Hadoop Streaming technology, which helps the users to create and run special kinds of Map-reduce jobs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">These special kinds of jobs can be performed through an executable file mentioned earlier, which will act as a mapper or reducer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.4">The mapper implementation of the program will use a shell script to perform the necessary operation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.5">The shell script is responsible for calling the executable files of the image processing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.6">The lists of image files are taken as the input to these executable files for further processing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.7">The results of this processing or output are later written back to the HDFS.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">So, the input image files should be written to the HDFS first, and then a file list is generated in a particular directory of Hadoop Streaming's input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">The directory will store a collection of file lists. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">Each line of the file list will contain the HDFS address of the images files to be processed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.4">The input of the mapper will be </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Inputsplit</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1"> class, which is a text file. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">The shell script manager reads the files line by line and retrieves the images from the metadata. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">It then calls the image processing executable file for further processing of the images, and then write the result back to the HDFS. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.4">Hence, the output of the mapper is the final desired result. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.5">The mapper thus does all the jobs, retrieving the image file from the HDFS, image processing, and then writing it back to the HDFS. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.6">The number of reducers in this process can be set to zero.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">This is a simple design of how to process large numbers of images using Hadoop by the binary image processing method. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">Other complex image processing methods can also be deployed to process large-scale image datasets.</span></p></div></div></div></div></body></html>
