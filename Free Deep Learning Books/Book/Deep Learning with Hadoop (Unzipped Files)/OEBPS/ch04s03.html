</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Backpropagation through time (BPTT)"><div class="titlepage"><div><div><h1 class="title"><a id="ch04lvl1sec26"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Backpropagation through time (BPTT)</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">You have already learnt that the primary requirement of RNNs is to distinctly classify the sequential inputs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">The backpropagation of error and gradient descent primarily help to perform these tasks.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">In case of feed forward neural networks, backpropagation moves in the backward direction from the final error outputs, weights, and inputs of each hidden layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">Backpropagation assigns the weights responsible for generating the error, by calculating their partial derivatives: 
</span><span class="inlinemediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"><img src="graphics/B05883_04_16.jpg" alt="Backpropagation through time (BPTT)"/></span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">
where </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">E</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> denotes the error and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">w</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> is the respective weights. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">The derivatives are applied on the learning rate, and the gradient decreases to update the weights so as to minimize the error rate.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">However, a RNN, without using backpropagation directly, uses an extension of it, termed as </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">backpropagation through time</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">BPTT</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">In this section, we will discuss BPTT to explain how the training works for RNNs.</span></p><div class="section" title="Error computation"><div class="titlepage"><div><div><h2 class="title"><a id="ch04lvl2sec40"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Error computation</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">The </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">backpropagation through time</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">BPTT</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">) learning algorithm is a natural extension of the traditional backpropagation method, which computes the gradient descent on a complete unrolled neural network.</span></p><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Figure 4.5</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1"> shows the errors associated with each hidden state for an unrolled RNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.2">Mathematically, the errors associated with each state can be given as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1"><img src="graphics/image_04_011-1.jpg" alt="Error computation"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">where </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">o</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">t</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1"> represents the correct output, and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">ô</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">t</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1"> represents the predicted word at time step </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">t</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.2">The total error (cost function) of the whole network is calculated as the summation of all the intermediate errors at each time step.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">If the RNN is unfolded into multiple time steps, starting from </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">t</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">0</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"> to </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">t</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">n-1</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">, the total error can be written as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1"><img src="graphics/image_04_012-1.jpg" alt="Error computation"/></span></div><p>

</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">Figure 4.5: The figure shows errors associated with every time step for a RNN.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">In the backpropagation through time method, unlike the traditional method, the gradient descent weight is updated in each time step.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Let </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">w</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">ij</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1"> denote the connection of weight from neuron </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">i</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"> to neuron </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">j</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">. </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">η</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1"> denotes the learning rate of the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.2">So, mathematically, the weight update with gradient descent at every time step is given by the following equation:</span></p><p>
