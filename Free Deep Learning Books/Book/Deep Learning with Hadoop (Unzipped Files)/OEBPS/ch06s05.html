</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Applications of autoencoders"><div class="titlepage"><div><div><h1 class="title"><a id="ch06lvl1sec44"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Applications of autoencoders</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Autoencoders can be successfully applied in many use cases, and hence, have gained much popularity in the world of deep learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">In this section, we will discuss the important applications and uses of autoencoders:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Dimensionality reduction</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">: If you remember, in </span><a class="link" href="ch01.html" title="Chapter 1. Introduction to Deep Learning"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Chapter 1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Introduction to Deep Learning</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">, we introduced the concept of the 'curse of dimensionality'. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">Dimensionality reduction was one of the first applications of deep learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">Autoencoders were initially studied to overcome the issues with the curse of dimensionality. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.4">We have already got a fair idea from this chapter how deep autoencoders work on higher-dimensional data to reduce the dimensionality in the final output.</span></li><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Information Retrieval</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">: One more important application of autoencoders is in information retrieval. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">Information retrieval basically means to search for some entries, which match with an entered query, in a database. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">Searching in high-dimensional data is generally a cumbersome task; however, with reduced dimensionality of a dataset, the search can become extremely efficient in certain kinds of lower dimensional data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.4">The dimensionality reduction obtained from the autoencoder can generate codes that are low dimensional and binary in nature. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.5">These can be stored in a key values stored data structure, where keys are binary code vectors and values are the corresponding entries. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.6">Such key value stores help us to perform information retrieval by returning all the database entries that match some binary code with the query. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.7">This approach to retrieving information through dimensionality reduction and binary code is called semantic hashing [135].</span></li><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Image Search</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">: As explained in the deep autoencoder section, deep autoencoders are capable of compressing image datasets of higher dimensions to a very small number of vectors, say 30. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">Therefore, this has made image searching easier for high-dimensional images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.3">Once an image is uploaded, the search engine will compress it into small vectors, and then compare that vector to all the others in its index. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.4">For a search query, the vectors that contain similar numbers will be returned and translated into the mapped image.</span></li></ul></div></div></div></div></body></html>
