</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Distributed Deep Belief network"><div class="titlepage"><div><div><h1 class="title"><a id="ch05lvl1sec37"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Distributed Deep Belief network</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">DBNs have so far achieved a lot in numerous applications such as speech and phone recognition [127], information retrieval [128], human motion modelling[129], and so on. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">However, the sequential implementation for both RBM and DBNs come with various limitations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">With a large-scale dataset, the models show various shortcomings in their applications due to the long, time consuming computation involved, memory demanding nature of the algorithms, and so on. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">To work with Big data, RBMs and DBNs require distributed computing to provide scalable, coherent and efficient learning.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">To make DBNs acquiescent to the large-scale dataset stored on a cluster of computers, DBNs should acquire a distributed learning approach with Hadoop and Map-Reduce. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">The paper in [130] has shown a key-value pair approach for each level of an RBM, where the pre-training is accomplished with layer-wise, in a distributed environment in Map-Reduce framework. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">The learning is performed on Hadoop by an iterative computing method for the training RBM. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.4">Therefore, the distributed training of DBNs is achieved by stacking multiple RBMs.</span></p><div class="section" title="Distributed training of Restricted Boltzmann machines"><div class="titlepage"><div><div><h2 class="title"><a id="ch05lvl2sec51"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Distributed training of Restricted Boltzmann machines</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">As mentioned in the earlier sections, the energy function for an RBM is given by:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"><img src="graphics/image_05_017.jpg" alt="Distributed training of Restricted Boltzmann machines"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Let an input dataset </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">I = {x</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"> = i= 1, 2,... </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">N}</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1"> be used for the distributed learning of a RBM. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">As discussed in the earlier section, for the learning of a DBN, the weights and biases in each level of the RBM are initialized at first by using a greedy layer-wise unsupervised training. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">The purpose of the distributed training is to learn the weights and the associated biases </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">b</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1"> and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">c</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">For a distributed RBM using Map-Reduce, the one Map-Reduce job is essential in every epoch.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">For matrix-matrix multiplication, Gibbs sampling is used, and for training of RBMs it takes most of the computation time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">Therefore, to truncate the computation time for this, Gibbs sampling can be distributed in the map phase among multiple datasets running different Datanodes on the Hadoop framework.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note22"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Gibbs sampling is a </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Markov chain Monte Carlo</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">MCMC</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">) algorithm for determining the sequence of observations that are estimated from a specified multivariate probability distribution, when traditional direct sampling becomes difficult.</span></p></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Initially, different parameters needed for training, such as the number of neurons for visible and hidden layers, the input layer bias </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">a</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">, the hidden layer bias </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">b</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">, weight </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">W</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">, number of epochs (say </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">N</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">), learning rate, and so on, are initialized. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">The number of epochs signify that both the map and reduce phase will iterate for </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">N</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1"> number of times. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">For each epoch, the mapper runs for each block of the Datanodes, and performs Gibbs sampling to calculate the approximate gradients of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">W</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">a</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">, and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">b</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">The reducer then updates those parameters with the computed increments needed for the next epoch. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.3">Hence, from the second epoch, the input value for the map phase, the updated values of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">W</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">a</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">, and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">b</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">, are calculated from the output of the reducer in the previous epoch.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">The input dataset I is split into a number of chunks, and stored in different blocks, running on each Datanode. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.2">Each mapper running on the blocks will compute the approximate gradient of the weights and biases for a particular chunk stored on that block. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.3">The reducers then calculate the increments of respective parameters and update them accordingly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.4">The process treats the resulting parameters and the updated values as the final outcome of the Map-Reduce phase of that particular epoch. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.5">After every epoch, the reducer decides whether to store the learned weight, if it is the final epoch or whether to increment the epoch index and propagate the key-value pair value to the next mapper.</span></p></div><div class="section" title="Distributed training of Deep Belief networks"><div class="titlepage"><div><div><h2 class="title"><a id="ch05lvl2sec52"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">Distributed training of Deep Belief networks</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">For distributed training of DBNs with </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">L</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1"> number of hidden layers, the learning is performed with pre-training </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">L</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1"> RBMs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.2">The bottom level RBM is trained as discussed, however, for the rest of the (</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">L-1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">) RBMs, the input dataset is changed for each level.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">The input data for </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">m</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">th</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1"> level (</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">L </span><span class="inlinemediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1"><img src="graphics/greater-than-equal.jpg" alt="Distributed training of Deep Belief networks"/></span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">
¥ m &gt; 1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">) RBM will be the conditional probability of hidden nodes of (</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">m-1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">)</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">th</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1"> level RBMs:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"><img src="graphics/Capture-9.jpg" alt="Distributed training of Deep Belief networks"/></span></div><p>
</p><div class="section" title="Distributed back propagation algorithm"><div class="titlepage"><div><div><h3 class="title"><a id="ch05lvl3sec16"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">Distributed back propagation algorithm</span></h3></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">This is the second phase of distributed training of back propagation algorithm to tune the global network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.2">In this procedure, while computing the gradient of weights, the feed-forward and back-propagation methods take up the majority of the computation time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.3">Hence, for each epoch, for faster execution, this procedure should be run in parallel on each mini-batch of the input dataset.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">In the first step of the procedure, the learned weights for a </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">L</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1"> level DBN, namely, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">W1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">W2</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">,</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">...WL</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1"> are loaded into the memory, and other hyper-parameters are initialized. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.2">In this fine-tuning phase, the primary jobs for map and reduce phase are similar to that of the RBMs distributed training. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.3">The mapper will determine the gradients of the weights and eventually update the weight increment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.4">The reducer updates the weight increments from one or more weights and passes the output to the mapper to perform the next iteration.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">The main purpose of this procedure is to obtain some discriminative power of the model by placing the label layer on top of the global network and tuning the weights of the entire layers iteratively.</span></p></div><div class="section" title="Performance evaluation of RBMs and DBNs"><div class="titlepage"><div><div><h3 class="title"><a id="ch05lvl3sec17"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">Performance evaluation of RBMs and DBNs</span></h3></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">The paper [130] performed an experiment of distributed RBM and DBN on Hadoop cluster to provide a comparative study with the traditional sequential approach. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.2">The experiments were carried out on MNIST datasets for hand-written digits recognition. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.3">There were 60,000 images for the training set, and 10,000 images for the testing set. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.4">The block size of HDFS is set to 64 MB with a replication factor of 4. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.5">All the nodes are set to run 26 mappers and 4 reducers maximum. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.6">Interested readers can modify the block size and replication factor to see the final results of the experiments with these parameters.</span></p><div class="section" title="Drastic improvement in training time"><div class="titlepage"><div><div><h4 class="title"><a id="ch05lvl4sec3"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">Drastic improvement in training time</span></h4></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">The purpose of this experiment is to the compare the distributed RBMs and DBNs with the traditional training policy (sequential) in terms of training time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.2">The sequential programs were performed on one CPU, whereas the distributed programs were on 16 CPUs of a node. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.3">Both the experiments were performed on the MNIST datasets mentioned earlier. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.4">The results obtained are summarized in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">Table 5.1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1"> and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">Table 5.2:</span></em></span>
</p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1"><img src="graphics/Capture-7.jpg" alt="Drastic improvement in training time"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">Table 5.1:The table represents the time needed to complete the training of distributed and sequential RBMs</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1"><img src="graphics/Capture-8.jpg" alt="Drastic improvement in training time"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">Table 5.2:The table represents the time needed to complete the training of distributed and sequential DBNs</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">The data shown in the table clearly depicts the advantages of using distributed RBMs and DBNs using Hadoop, over the traditional sequential approach. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.2">The training time for the distributed approach for the models has shown drastic improvement over the sequential one. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.3">Also, one crucial advantage of using the Hadoop framework for distribution is that it scales exceptionally well with the size of the training datasets, as well as the number of machines used to distribute it.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">The next section of the chapter will demonstrate the programming approach for both the models using Deeplearning4j.</span></p></div></div></div></div></div></div></body></html>
