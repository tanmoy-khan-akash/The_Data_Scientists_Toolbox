</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Restricted Boltzmann machine"><div class="titlepage"><div><div><h1 class="title"><a id="ch05lvl1sec34"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Restricted Boltzmann machine</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Restricted Boltzmann machine</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">RBM</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">) is a classic example of building blocks of deep probabilistic models that are used for deep learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">The RBM itself is not a deep model but can be used as a building block to form other deep models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">In fact, RBMs are undirected probabilistic graphical models that consist of a layer of observed variables and a single layer of hidden variables, which may be used to learn the representation for the input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.4">In this section, we will explain how the RBM can be used to build many deeper models.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Let us consider two examples to see the use case of RBM. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">RBM primarily operates on a binary version of factor analysis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.3">Let us say we have a restaurant, and want to ask our customer to rate the food on a scale of 0 to 5. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.4">In the traditional approach, we will try to explain each food item and customer in terms of the variable's hidden factors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.5">For example, foods such as pasta and lasagne will have a strong association with the Italian factors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.6">RBM, on the other hand, works on a different approach. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.7">Instead of asking each customer to rate the food items on a continuous scale, they simply mention whether they like it or not, and then RBM will try to infer various latent factors, which can help to explain the activation of food choices of each customer.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Another example could be to guess someone's movie choice based on the genre the person likes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">Say Mr. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">X has supplied his five binary preferences on the set of movies given. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.4">The job of the RBM will be to activate his preferences based on the hidden units. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.5">So, in this case, the five movies will send messages to all the hidden units, asking them to update themselves. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.6">The RBM will then activate the hidden units with high probability based on some preferences given to the person earlier.</span></p><div class="section" title="The basic architecture"><div class="titlepage"><div><div><h2 class="title"><a id="ch05lvl2sec47"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">The basic architecture</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">The RBM is a shallow, two-layer neural network used as a building block to create deep models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">The first layer of the RBM is called the observed or visible layer, the second layer is called the latent or hidden layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">It is a bipartite graph, with no interconnection allowed between any variables in the observed layer, or between any units in the latent layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.4">As shown in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Figure 5.3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">, there is no intra-layer communication between the layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">Due to this restriction, the model is termed as a </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Restricted Boltzmann machine</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">Each node is used for computation that processed the input, and participated in the output by making stochastic (randomly determined) decisions about whether to convey that input or not.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note20"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">A bipartite graph is a graph wherein the vertices can be split into two disjoint sets so that every edge connects a vertex of one set to the other. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">However, there is no connection between the vertices of the same set. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">The vertex sets are usually termed as a part of the graph.</span></p></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">The primary intuition behind the two layers of an RBM is that there are some visible random variables (for example, food reviews from different customers) and some latent variables (such as cuisines, nationality of the customers or other internal factors), and the task of training the RBM is to find the probability of how these two sets of variables are interconnected to each other.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">To mathematically formulate the energy function of an RBM, let's denote the observed layer that consists of a set of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">n</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">v</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1"> binary variables collectively with the vector </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">v</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.2">The hidden or latent layers of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">n</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">h</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"> binary random variables are denoted as </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">h</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Similar to the Boltzmann machine, the RBM is also an energy-based model, where the joint probability distribution is determined by its energy function:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1"><img src="graphics/B05883_05_07.jpg" alt="The basic architecture"/></span></div><p>
</p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1"><img src="graphics/image_05_009.jpg" alt="The basic architecture"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">Figure 5.3: Figure shows a simple RBM. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.2">The model is a symmetric bipartite graph, where each hidden node is connected to every visible nodes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.3">Hidden units are represented as h</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1"> and visible units as v</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">i</span></sub></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">The energy function of an RBM with binary visible and latent units is as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1"><img src="graphics/B05883_05_08.jpg" alt="The basic architecture"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">Here, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">a</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">b</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">, and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">W</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1"> are unconstrained, learnable, real-valued parameters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.2">From the preceding </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">Figure 5.3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">, we can see that the model is split into two groups of variables, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">v</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1"> and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">h</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.2">The interaction between the units is described by the matrix </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">W</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">.</span></p></div><div class="section" title="How RBMs work"><div class="titlepage"><div><div><h2 class="title"><a id="ch05lvl2sec48"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">How RBMs work</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">So, as we are now aware of the basic architecture of an RBM, in this section, we will discuss the basic working procedure for this model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.2">The RBM is fed with a dataset from which it should learn. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.3">Each visible node of the model receives a low-level feature from an item of the dataset. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.4">For example, for a gray-scale image, the lowest level item would be one pixel value of the image, which the visible node would receive. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.5">Therefore, if an image dataset has n number of pixels, the neural network processing them must also possess n input nodes on the visible layer:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"><img src="graphics/B05883_05_04-300x232.jpg" alt="How RBMs work"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Figure 5.4 : Figure shows the computation of an RBM for a one input path</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">Now, let's propagate one single pixel value, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">p</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1"> through the two-layer network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.2">At the first node of the hidden layer, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">p</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1"> is multiplied by a weight </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">w</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">, and added to the bias. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.2">The final result is then fed into an activation function that generates the output of the node. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.3">The operation produces the outcome, which can be termed as the strength of the signal passing through that node, given an input pixel </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">p</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">. </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">Figure 5.4</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"> shows the visual representation of the computation involved for a single input RBM.</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1"><img src="graphics/B05883_05_12.jpg" alt="How RBMs work"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">Every visible node of the RBM is associated with a separate weight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.2">Inputs from various units get combined at one hidden node. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.3">Each </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">p</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1"> (pixel) from the input is multiplied by a separate weight associated with it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.2">The products are summed up and added to a bias. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.3">This result is passed through an activation function to generate the output of the node. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.4">The following </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">Figure 5.5</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1"> shows the visual representation of the computation involved for multiple inputs to the visible layer of RBMs:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1"><img src="graphics/B05883_05_05-300x232.jpg" alt="How RBMs work"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">Figure 5.5: Figure shows the computation of an RBM with multiple inputs and one hidden unit</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">The preceding </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">Figure 5.5</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1"> shows how the weight associated with every visible node is used to compute the final outcome from a hidden node.</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1"><img src="graphics/B05883_05_06-300x203.jpg" alt="How RBMs work"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">Figure 5.6: Figure shows the computation involved with multiple visible units and hidden units for an RBM</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">As mentioned earlier, RBMs are similar to a bipartitone graph. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.2">Further, the machine's structure is basically similar to a symmetrical bipartite graph because input received from all the visible nodes are being passed to all the latent nodes of the RBM.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">For every hidden node, each input p gets multiplied with its respective weight </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">w</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.2">Therefore, for a single input </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">p</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1"> and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">m</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1"> number of hidden units, the input would have </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">m</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1"> weights associated with it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.2">In </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">Figure 5.6</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">, the input </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">p</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1"> would have three weights, making a total of 12 weights altogether: four input nodes from the visible layer and three hidden nodes in the next layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.2">All the weights associated between the two layers form a matrix, where the rows are equal to the visible nodes, and the columns are equal to the hidden units. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.3">In the preceding figure, each hidden node of the second layer accepts the four inputs multiplied by their respective weights. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.4">The final sum of the products is then again added to a bias. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.5">This result is then passed through an activation algorithm to produce one output for each hidden layer. </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">Figure 5.6</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1"> represents the overall computations that occur in such scenarios.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">With a stacked RBM, it will form a deeper layer neural network, where the output of the first hidden layer would be passed to the next hidden layer as input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.2">This will be propagated through as many hidden layers as one uses to reach the desired classifying layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.3">In the subsequent section, we will explain how to use an RBM as deep neural networks.</span></p></div></div></div></div></body></html>
