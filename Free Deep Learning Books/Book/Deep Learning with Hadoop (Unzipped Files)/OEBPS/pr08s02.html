</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="What you need for this book"><div class="titlepage"><div><div><h1 class="title"><a id="pf11lvl1sec2"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">What you need for this book</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We expect all the readers of this book to have some background on computer science. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">This book mainly talks on different deep neural networks, their designs and applications with Deeplearning4j. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">To extract the most out of the book, the readers are expected to know the basics of machine learning, linear algebra, probability theory, the concepts of distributed systems and Hadoop. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">For the implementation of deep neural networks with Hadoop, Deeplearning4j has been extensively used throughout this book. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">Following is the link for everything you need to run Deeplearning4j:</span></p><p>
<a class="ulink" href="https://deeplearning4j.org/quickstart"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://deeplearning4j.org/quickstart</span></a>
</p></div></div></div></body></html>
