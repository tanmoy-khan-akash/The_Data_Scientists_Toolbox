</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Deep autoencoders"><div class="titlepage"><div><div><h1 class="title"><a id="ch06lvl1sec42"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Deep autoencoders</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">So far, we have talked only about single-layer encoders and single-layer decoders for a simple autoencoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">However, a deep autoencoder with more than one encoder and decoder brings more advantages.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Feed-forward networks perform better when they are deep. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">Autoencoders are basically feed-forward networks; hence, the advantages of a basic feed-forward network can also be applied to autoencoders. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">The encoders and decoders are autoencoders, which also work like a feed-forward network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.4">Hence, we can deploy the advantages of the depth of a feed-forward network in these components also.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">In this context, we can also talk about the universal approximator theorem, which ensures that a feed-forward neural network with at least one hidden layer, and with enough hidden units, can produce an approximation of any arbitrary function to any degree of accuracy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">Following this concept, a deep autoencoder having at least one hidden layer, and containing sufficient hidden units, can approximate any mapping from input to code arbitrarily well.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note24"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">One can approximate any continuous function to any degree of accuracy with a two-layer network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">In the mathematical theory of artificial neural networks, the universal approximation function states that a feed-forward network can approximate any continuous function of a compact subset of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">R</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">n</span></sup></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">, if it has at least one hidden layer with a finite number of neurons.</span></p></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Deep autoencoder provides many advantages as compared to shallow architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">The non-trivial depth of an autoencoder suppresses the computation of representing a few functions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">Also, the depth of autoencoders drastically reduces the amount of training data required to learn the functions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.4">Even experimentally, it has been found that deep autoencoders provide better compression when compared to shallow autoencoders.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">To train a deep autoencoder, the common practice is to train a stack of shallow autoencoders. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">Therefore, to train a deep autoencoder, a series of shallow autoencoders are encountered frequently. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">In the next subsections, we will discuss the concept of deep autoencoders in depth.</span></p><div class="section" title="Training of deep autoencoders"><div class="titlepage"><div><div><h2 class="title"><a id="ch06lvl2sec58"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Training of deep autoencoders</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">The design of a deep autoencoder explained here is based on MNIST handwritten digit databases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">In the paper [133],a well-structured procedure of building and training of a deep autoencoder is explained. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.3">The fundamentals of training a deep autoencoder is through three phases, that is: Pre-training, Unrolling, and Fine-tuning.</span></p><div class="orderedlist"><ol class="orderedlist arabic"><li class="listitem"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Pre-training</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">: The first phase of training a deep autoencoder is 'pre-training'. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">The main purpose of this phase is to work on binary data, generalize in to a real-valued data, and then to conclude that it works well for various datasets.</span><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">We already have enough insights that a single layer of hidden units is not the proper way to model the structure in a large set of images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">A deep autoencoder is composed of multiple layers of a Restricted Boltzmann machine. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">In </span><a class="link" href="ch05.html" title="Chapter 5.  Restricted Boltzmann Machines"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Chapter 5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Restricted Boltzmann Machines</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1"> we gave enough information on how a Restricted Boltzmann machine works. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">Using the same concept, we can proceed to build the structure for a deep autoencoder:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1"><img src="graphics/image_06_009.jpg" alt="Training of deep autoencoders"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Figure 6.4: Pre-training a deep autoencoder involves learning a stack of Restricted Boltzmann machines (RBMs) where each RBM possesses a single layer of feature detectors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.2">The learned features of one Restricted Boltzmann machine is used as the 'input data' to train the next RBM of the stack. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.3">After the pre-training phase, all the RBMs are unfolded or unrolled to build a deep autoencoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.4">This deep autoencoder is then fine-tuned using the backpropagation approach of error derivatives.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">When the first layer of the RBM is driven by a stream of data, the layer starts to learn the feature detectors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.2">This learning can be treated as input data for learning for the next layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.3">In this way, feature detectors of the first layer become the visible units for learning the next layer of the Restricted Boltzmann machine. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.4">This procedure of learning layer-by-layer can be iterated as many times as desired. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.5">This procedure is indeed very much effectual in pre-training the weights of a deep autoencoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.6">The features captured after each layer have a string of high-order correlations between the activities of the hidden units below. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.7">The first part of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Figure 6.4</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1"> gives a flow diagram of this procedure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">Processing the benchmark dataset MNIST, a deep autoencoder would use binary transformations after each RBM. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.3">To process real-valued data, deep autoencoders use Gaussian rectified transformations after each Restricted Boltzmann machine layer.</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"><img src="graphics/B05883_06_05-1.jpg" alt="Training of deep autoencoders"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Figure 6.5: Pictorial representation of how the number or vectors of encoder and decoder varies during the phases.</span></p></li><li class="listitem"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Unrolling</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">: Once the multiple layers of feature detectors of the deep autoencoders are pre-trained, the whole model is unrolled to generate the encoder and decoder networks, which at first use the same weights. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">We will explain each of the designs of each part given in the second part of the image separately to have a better understanding of this phase.</span><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Encoder</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">: For an MNIST dataset of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">28x28</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1"> pixel images, the input that the network will get is that of 784 pixels. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">As per the rule of thumb, the number of parameters of the first layer of the deep autoencoder should be slightly larger. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.3">As shown in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">Figure 6.4</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">, </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">2000</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1"> parameters are taken for the first layer of the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.2">This might sound unreasonable, as taking more parameters as inputs increase the chance of overfitting the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.3">However, in this case, increasing the number of parameters will eventually increase the features of the input, which, in turn, make the decoding of the autoencoder data possible.</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">As shown in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">Figure 6.4</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">, the layers would be </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">2000</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">, </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">1000</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">, </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">500</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">, and </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">30</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">-nodes wide respectively. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.2">A snapshot of this phenomenon is depicted in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Figure 6.5</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.2">In the end, the encoder will produce a vector </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">30</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1"> numbers long. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.2">This </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">30</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1"> number vector is the last layer of the encoder of the deep autoencoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.2">A rough outline for this encoder will be as follows:</span><p>
</p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"><img src="graphics/image_06_011.jpg" alt="Training of deep autoencoders"/></span></div><p>
</p><p>
</p></li><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Decoder</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">: The </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">30</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1"> number vectors found at the end of the encoding phase are the encoded version of the 28x28 pixel images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.2">The second part of the deep autoencoder is the decoder phase, where it basically learns how to decode the condensed vector. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.3">Hence, the output of the encoder phase (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">30</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">-number vectors) becomes the input of the decoder phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.2">This half of the deep autoencoder is a feed-forward network, where the encoded condensed vector proceeds towards the reconstructed input after each layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.3">The layers shown in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">Figure 6.4</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1"> are </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">30</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">, </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">500</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">, </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">1000</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">, and </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">2000</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.2">The layers initially possess the same weights as their counterparts in the pre-training network; it is just that the weights are transposed as shown in the figure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.3">A rough outline for this encoder will be as follows:</span><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1"><img src="graphics/image_06_012.jpg" alt="Training of deep autoencoders"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">So, the main purpose of decoding half of a deep autoencoder is to learn how to reconstruct the image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.2">The operation is carried out in the second feed-forward network that also performs back propagation, which happens through reconstruction entropy.</span></p></li></ul></div><p>
</p></li><li class="listitem"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">Fine-tuning</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">: In the fine-tuning phase, the stochastic activities are replaced by the deterministic, real-valued probabilities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.2">The weights associated with each layer of the whole deep autoencoder are fine-tuned for optimal reconstruction by using the backpropagation method.</span></li></ol></div></div><div class="section" title="Implementation of deep autoencoders using Deeplearning4j"><div class="titlepage"><div><div><h2 class="title"><a id="ch06lvl2sec59"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">Implementation of deep autoencoders using Deeplearning4j</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">So, you now have sufficient idea of how to build a deep autoencoder using a number of Restricted Boltzmann machines. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.2">In this section, we will explain how to design a deep autoencoder with the help of Deeplearning4j.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">We will use the same MNIST dataset as in the previous section, and keep the design of the deep autoencoder similar to what we explained earlier.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">As already explained in earlier examples, a small batch size of 1024 number of examples is used from the raw MNIST datasets, which can be split into </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">N</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"> multiple blocks of Hadoop. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.2">These </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">N</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1"> multiple blocks will run on the Hadoop Distributed File System by each worker in parallel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.2">The flow of code to implement the deep autoencoder is simple and straightforward.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">The steps are shown as follows:</span></p><div class="orderedlist"><ol class="orderedlist arabic"><li class="listitem"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">Batch-wise loading of the MNIST dataset in HDFS. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.2">Each batch will contain </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">1024</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1"> number of examples.</span></li><li class="listitem"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">Start building the model.</span></li><li class="listitem"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">Perform the encoding operation.</span></li><li class="listitem"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">Perform the decoding operation.</span></li><li class="listitem"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">Train the model by calling the </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">fit()</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1"> method.</span></li></ol></div><pre class="programlisting"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">final int numRows = 28;</span></pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">Initial configuration needed to set the Hadoop environment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.2">The </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">batchsize</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1"> is set to </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">1024</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">.</span></p><pre class="programlisting"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">final int numColumns = 28; 
int seed = 123; 
int numSamples = MnistDataFetcher.NUM_EXAMPLES; 
int batchSize = 1024; 
int iterations = 1; 
int listenerFreq = iterations/5; 
</span></pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">Load the data into the HDFS:</span></p><pre class="programlisting"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">log.info("Load data...."); 
DataSetIterator iter = new  MnistDataSetIterator(batchSize,numSamples,true); 
</span></pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">We are now all set to build the model to add the number of layers of the Restricted Boltzmann machine to build the deep autoencoder:</span></p><pre class="programlisting"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">log.info("Build model...."); 
MultiLayerConfiguration conf = new NeuralNetConfiguration.Builder() 
  .seed(seed) 
  .iterations(iterations) 
  .optimizationAlgo(OptimizationAlgorithm.LINE_GRADIENT_DESCENT) 
</span></pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">To a create a ListBuilder with the specified layers (here it is eight), we call the .</span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">list()</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1"> method:</span></p><pre class="programlisting">
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">  .list(8) 
</span></strong></span>
</pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">The next step now is to build the encoding phase of the model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.2">This can be done by the subsequent addition of the Restricted Boltzmann machine into the model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.3">The encoding phase has four layers of the restricted Boltzmann machine in which each layer would have </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">2000</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">, </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">1000</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">, </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">500</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">, and </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">30</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1"> nodes respectively:</span></p><pre class="programlisting"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">  .layer(0, new RBM.Builder().nIn(numRows *    
  numColumns).nOut(2000).lossFunction(LossFunctions.LossFunction
  .RMSE_XENT).build()) 
  .layer(1, new RBM.Builder().nIn(2000).nOut(1000)
  .lossFunction(LossFunctions.LossFunction.RMSE_XENT).build()) 
  .layer(2, new RBM.Builder().nIn(1000).nOut(500)
  .lossFunction(LossFunctions.LossFunction.RMSE_XENT).build()) 
  .layer(3, new RBM.Builder().nIn(500).nOut(30)
  .lossFunction(LossFunctions.LossFunction.RMSE_XENT).build()) 
                
</span></pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">The next phase after encoder is the decoder phase, where we will use four more Restricted Boltzmann machines in a similar manner:</span></p><pre class="programlisting"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">  .layer(4, new RBM.Builder().nIn(30).nOut(500)
  .lossFunction(LossFunctions.LossFunction.RMSE_XENT).build())  
  .layer(5, new RBM.Builder().nIn(500).nOut(1000)
  .lossFunction(LossFunctions.LossFunction.RMSE_XENT).build()) 
  .layer(6, new RBM.Builder().nIn(1000).nOut(2000)
  .lossFunction(LossFunctions.LossFunction.RMSE_XENT).build()) 
  .layer(7, new OutputLayer.Builder(LossFunctions.LossFunction.MSE)
  .activation("sigmoid").nIn(2000).nOut(numRows*numColumns).build()) 
</span></pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">As all the intermediate layers are now built, we can build the model by calling the </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">build()</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1"> method:</span></p><pre class="programlisting">
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">  .pretrain(true).backprop(true) 
  .build(); 
</span></strong></span>
</pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">The last phase of the implementation is to train the deep autoencoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.2">It can be done by calling the </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">fit ()</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1"> method:</span></p><pre class="programlisting"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">MultiLayerNetwork model = new MultiLayerNetwork(conf); 
model.init(); 
 
model.setListeners(new ScoreIterationListener(listenerFreq)); 
 
log.info("Train model...."); 
while(iter.hasNext())
  { 
   DataSet next = iter.next(); 
  </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1"> model.fit(new DataSet(next.getFeatureMatrix(),next
   .getFeatureMatrix()));</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1"> 
  } 
</span></pre></div></div></div></div></body></html>
