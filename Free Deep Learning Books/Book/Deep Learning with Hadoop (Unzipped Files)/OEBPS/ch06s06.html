</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Summary"><div class="titlepage"><div><div><h1 class="title"><a id="ch06lvl1sec45"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Summary</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Autoencoders, one of the most popular and widely applicable generative models, have been discussed in this chapter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Autoencoders basically help two phases: one is the encoder phase and the other is the decoder phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">In this chapter, we elaborated on both of these phases with suitable mathematical explanations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">Going forward, we explained a special kind of autoencoder called the sparse autoencoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">We also discussed how autoencoders can be used in the world of deep neural networks by explaining deep autoencoders. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.6">Deep autoencoders consist of layers of Restricted Boltzmann machines, which take part in the encoder and decoder phases of the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.7">We explained how to deploy deep autoencoders using Deeplearning4j, by loading chunks of the input dataset into a Hadoop Distributed File System. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.8">Later in this chapter, we introduced the most popular form of autoencoder called the denoising autoencoder and its deep network version known as the stacked denoising autoencoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.9">The implementation of a stacked denoising autoencoder using Deeplearning4j was also shown. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.10">We concluded this chapter by outlining the common applications of autoencoders.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">In the next chapter, we will discuss some common useful applications of deep learning with the help of Hadoop.</span></p></div></div></div></body></html>
