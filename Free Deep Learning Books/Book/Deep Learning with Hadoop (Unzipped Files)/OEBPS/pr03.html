</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="preface" title="About the Author"><div class="titlepage"><div><div><h1 class="title"><a id="pref04"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">About the Author</span></h1></div></div></div><p>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Dipayan Dev</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> has completed his M.Tech from National Institute of Technology, Silchar with a first class first and is currently working as a software professional in Bengaluru, India. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">He has extensive knowledge and experience in non-relational database technologies, having primarily worked with large-scale data over the last few years. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">His core expertise lies in Hadoop Framework. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.4">During his postgraduation, Dipayan had built an infinite scalable framework for Hadoop, called Dr. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.5">Hadoop, which got published in top-tier SCI-E indexed journal of Springer (</span><a class="ulink" href="http://link.springer.com/article/10.1631/FITEE.1500015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">http://link.springer.com/article/10.1631/FITEE.1500015</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">Dr. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.3">Hadoop has recently been cited by Goo Wikipedia in their Apache Hadoop article. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.4">Apart from that, he registers interest in a wide range of distributed system technologies, such as Redis, Apache Spark, Elasticsearch, Hive, Pig, Riak, and other NoSQL databases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.5">Dipayan has also authored various research papers and book chapters, which are published by IEEE and top-tier Springer Journals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.6">To know more about him, you can also visit his LinkedIn profile </span><a class="ulink" href="https://www.linkedin.com/in/dipayandev"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">https://www.linkedin.com/in/dipayandev</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">.</span></p></div></div></div></body></html>
