</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="chapter" title="Chapter 7. Miscellaneous Deep Learning Operations using Hadoop"><div class="titlepage"><div><div><h1 class="title"><a id="ch07"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Chapter 7. Miscellaneous Deep Learning Operations using Hadoop</span></h1></div></div></div><div class="blockquote"><table border="0" width="100%" cellspacing="0" cellpadding="0" class="blockquote" summary="Block quote"><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1"> </span></td><td valign="top"><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">"In pioneer days they used oxen for heavy pulling, and when one ox couldn't budge a log, they didn't try to grow a larger ox. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">We shouldn't be trying for bigger computers, but for more systems of computers."</span></em></span>
</p></td><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> </span></td></tr><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> </span></td><td colspan="2" align="right" valign="top" style="text-align: center"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">--</span><span class="attribution"><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Grace Hopper</span></em></span></span></td></tr></table></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">So far in this book, we discussed various deep neural network models and their concepts, applications, and implementation of the models in distributed environments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">We have also explained why it is difficult for a centralized computer to store and process vast amounts of data and extract information using these models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">Hadoop has been used to overcome the limitations caused by large-scale data.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">As we have now reached the final chapter of this book, we will mainly discuss the design of the three most commonly used machine learning applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">We will explain the general concept of large-scale video processing, large-scale image processing, and natural language processing using the Hadoop framework.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">The organization of this chapter is as follows:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Large-scale distributed video processing using Hadoop</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Large-scale image processing using Hadoop</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Natural language processing using Hadoop</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">The large amount of videos available in the digital world are contributing to the lion's share of the big data generated in recent days. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">In </span><a class="link" href="ch02.html" title="Chapter 2.  Distributed Deep Learning for Large-Scale Data"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">
Chapter 2
</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Distributed Deep Learning for Large-Scale Data</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1"> we discussed how millions of videos are uploaded to various social media websites such as YouTube and Facebook. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">Apart from this, surveillance cameras installed for security purposes in various shopping malls, airports, or government organizations generate loads of videos on a daily basis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.3">Most of these videos are typically stored as compressed video files due to their huge storage consumption. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.4">In most of these enterprises, the security cameras operate for the whole day and later store the important videos, to be investigated in future.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">These videos contain hidden "hot data" or information, which needs to be processed and extracted quickly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">As a consequence, the need to process and analyze these large-scale videos has become one of the priorities for data enthusiasts. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.3">Also, in many different fields of studies, such as bio-medical engineering, geology, and educational research, there is a need to process these large-scale videos and make them available at different locations for detailed analysis.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">In this section, we will look into the processing of large-scale video datasets using the Hadoop framework. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">The primary challenge of large-scale video processing is to transcode the videos from compressed to uncompressed format. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.3">For this reason, we need a distributed video transcoder that will write the video in the </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Hadoop Distributed File System</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">HDFS</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">), decode the bit stream chunks in parallel, and generate a sequence file.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">When a block of the input data is processed in the HDFS, each mapper process accesses the lines in each split separately. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">However, in case of a large-scale video dataset, when it is split into multiple blocks of predefined sizes, each mapper process is supposed to interpret the blocks of bit-stream separately. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.3">The mapper process will then provide access to the decoded video frames for subsequent analysis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.4">In the following subsections, we will discuss how each block of the HDFS containing the video bit-stream can be transcoded into sets of images to be processed for the further analyses.</span></p><div class="section" title="Distributed video decoding in Hadoop"><div class="titlepage"><div><div><h1 class="title"><a id="ch07lvl1sec46"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Distributed video decoding in Hadoop</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Most of the popular video compression formats, such as MPEG-2 and MPEG-4, follow a hierarchical structure in the bit-stream. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">In this subsection, we will assume that the compression format used has a hierarchical structure for its bit-stream. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.3">For simplicity, we have divided the decoding task into two different Map-reduce jobs:</span></p><div class="orderedlist"><ol class="orderedlist arabic"><li class="listitem"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Extraction of video sequence level information</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">: From the outset, it can be easily predicted that the header information of all the video dataset can be found in the first block of the dataset. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">In this phase, the aim of the map-reduce job is to collect the sequence level information from the first block of the video dataset and output the result as a text file in the HDFS. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.3">The sequence header information is needed to set the format for the decoder object.</span><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">For the video files, a new </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">FileInputFormat</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"> should be implemented with its own record reader. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.2">Each record reader will then provide a </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">&lt;key, value&gt;</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1"> pair in this format to each map process: </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">&lt;LongWritable, BytesWritable&gt;</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.2">The input key denotes the byte offset within the file; the value that corresponds to </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">BytesWritable</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1"> is a byte array containing the video bit-stream for the whole block of data.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">For each map process, the key value is compared with </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">0</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"> to identify if it is the first block of the video file. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.2">Once the first block is identified, the bit-stream is parsed to determine the sequence level information. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.3">This information is then dumped to a </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">.txt</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1"> file to be written to  HDFS. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">Let's denote the name of the </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">.txt</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"> file as </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">input_filename_sequence_level_header_information.txt</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.2">As only the map process can provide us the desired output, the reducer count for this method is set to </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">0</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note25"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Assume a text file with the following data:
</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">Deep Learning
</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">with Hadoop
</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">Now the offset for the first line is </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">0</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1"> and the input to the Hadoop job will be </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">&lt;0,Deep Learning&gt;</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1"> and for the second line the offset will be </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">&lt;14,with Hadoop&gt;</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">.
</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.2">Whenever we pass the text file to the Hadoop job, it internally calculates the byte offset.</span></p></div></div></li><li class="listitem"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">Decode and convert the blocks of videos into sequence files</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">: The aim of this Map-reduce job is to decode  each block  of the video datasets and generate a corresponding sequence file. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.2">The sequence file will contain the decoded video frames of each block of data in JPEG format. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.3">The </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">InputFileFormat</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1"> file and record reader should be kept same as the first Map-reduce job. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.2">Therefore, the </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">&lt;key, value&gt;</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1"> pairs of the mapper input is </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">&lt;LongWritable, BytesWritable&gt;</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">.</span><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1"><img src="graphics/B05883_07_01-1.jpg" alt="Distributed video decoding in Hadoop"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">Figure 7.1: The overall representation of video decoding with Hadoop</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">In this second phase, the output of the first job is considered as the input to this second Map-reduce job. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.2">Therefore, each mapper of this job will read the sequence information file in the HDFS and pass this information along with the bit-stream buffer, which comes as the </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">BytesWritable</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1"> input.</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">The map process basically converts the decoded video frames to JPEG images and generates a </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">&lt;key, value&gt;</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1"> pair as the output of the map process. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.2">The key of this output of the map process encodes the input video filename and the block number as </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">video_filename_block_number</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.2">The output value that corresponds to this key is </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">BytesWritable</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">, and it stores the JPEG bit-stream of the decoded video block.</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">The reducers will then take the blocks of data as input and simply write the decoded frames into a sequence file containing JPEG images as output format for further processing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.2">A simple format and overview of the whole process is shown in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">Figure 7.1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.2">We have taken an input video </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">sample.m2v</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1"> for illustration purposes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.2">Further, in this chapter, we will discuss how to process the large-scale image files (from the sequence files) with the HDFS.</span></li></ul></div><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note26"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">Note</span></h3><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">Input </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">&lt;key,value&gt;</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1"> for Mapper: </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">&lt;LongWritable, BytesWritable&gt;</span></code>
</p><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">For example: </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">&lt;17308965, BytesWritable&gt;
</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">
Output </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">&lt;key,value&gt;</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1"> from Mapper: </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">&lt;Text, BytesWritable&gt;
</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">
For example: </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">&lt;sample.m2v_3, BytesWritable&gt;</span></code>
</p><p>
</p></div></div></li></ol></div></div></div></div></div></body></html>
