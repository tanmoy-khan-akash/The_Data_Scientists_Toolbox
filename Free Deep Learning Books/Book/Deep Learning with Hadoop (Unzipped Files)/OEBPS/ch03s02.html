</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Background of a CNN"><div class="titlepage"><div><div><h1 class="title"><a id="ch03lvl1sec19"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Background of a CNN</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">CNN, a particular form of deep learning models, is not a new concept, and they have been widely adopted by the vision community for a long time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">The model worked well in recognizing the hand-written digit by LeCun et al in 1998 [90]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">But unfortunately, due to the inability of CNNs to work with higher resolution images, its popularity has diminished with the course of time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">The reason was mostly due to hardware and memory constraints, and also the lack of availability of large-scale training datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">As the computational power increases with time, mostly due to the wide availability of CPUs and GPUs and with the generation of big data, various large-scale datasets, such as the MIT Places dataset (see Zhou et al., 2014), ImageNet [91] and so on. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.6">it became possible to train larger and complex models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.7">This is initially shown by Krizhevsky et al [4] in their paper, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Imagenet classification using deep convolutional neural networks</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">In that paper, they brought down the error rate with half-beating traditional approaches. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">Over the next few years, their paper became one of the most substantial papers in the field of computer vision. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.4">This popular network trained by Alex Krizhevsky, called AlexNet, could well have been the starting point of using deep networks in the field of computer vision.</span></p><div class="section" title="Architecture overview"><div class="titlepage"><div><div><h2 class="title"><a id="ch03lvl2sec24"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Architecture overview</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">We assume that the readers are already familiar with the traditional neural network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">In this section, we will look at the general building blocks of CNN.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">The traditional neural network receives a single vector as input, and reaches the intermediate states through a series of latent (hidden) layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">Each hidden layer is composed of several neurons, where each neuron is fully connected to every other neuron of the previous layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.3">The last layer, called the 'output layer', is fully-connected, and it is responsible for the class scores. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.4">A regular neural network composed of three layers is shown in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Figure 3.2</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"><img src="graphics/image_03_006.jpg" alt="Architecture overview"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Figure 3.2: The figure shows the block diagram of a three-layer regular neural network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">The neurons of every layer are fully-connected to every other layer of the previous layer.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Regular neural networks face tremendous challenges while dealing with large-scale images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">For example, in the CIFAR-10 RGB database, the dimension of the images are </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">32x32x3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">, hence, a single fully-connected neuron in a first hidden layer of the traditional neural network will have </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">32*32*3= 3072</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> number of weights. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">The number of weights, although seems to be reasonable at the outset, would really be a cumbersome task to manage with the increasing number of dimensions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">For another RGB image, if the dimension becomes (</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">300x300x3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">), the total number of weights of the neurons will result in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">300*300*3 = 270000</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1"> weights. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">Also, as the number of layers will increase, this number will also increase drastically, and would quickly lead to overfitting. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.3">Moreover, visualization of an image completely neglects the complex 2D spatial structure of the image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.4">Therefore, the fully-connected concept of the neural network, right from the initial phase, does not seem to work with the larger dimensional datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.5">So, we need to build a model that will overcome both of these limitations:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1"><img src="graphics/image_03_007.jpg" alt="Architecture overview"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Figure 3.3: The arrangement of CNN in 3D (width, height, and depth) is represented in the figure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.2">Every layer converts the 3D input volume to the corresponding 3D output volume of neuron activations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.3">The red input layer keeps the image, hence, its width and height would be the dimensions of the image, where the depth would be three (Red, Green, and Blue). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.4">Image sourced from Wikipedia.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">One way to solve this problem is to use convolution in place of matrix multiplication. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.2">Learning from a set of convolutional filters (kernel) is much easier than learning from the whole matrix (</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">300x300x3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">Unlike the traditional neural network, the layers of a CNN have their neurons arranged in three dimensions: width, height, and depth. </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Figure 3.3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1"> shows the representation for this. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">For example, in the previous example of CIFAR-10, the image has a dimension of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">32x32x3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">, which is width, depth, and height respectively. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">In a CNN, instead of the neurons in a fully-connected nature, the neurons in a layer will only be connected to a subset of neurons in the previous layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.3">Details of this will be explained in the subsequent portion of this section. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.4">Moreover, the final output layer CIFAR-10 image will have the dimension </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">1x1x10</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">, because the CNN will diminish the full image into a single vector of class score, placed along with the depth dimension.</span></p></div></div></div></div></body></html>
