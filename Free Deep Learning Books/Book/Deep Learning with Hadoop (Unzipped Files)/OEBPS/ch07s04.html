</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Summary"><div class="titlepage"><div><div><h1 class="title"><a id="ch07lvl1sec49"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Summary</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">This chapter discussed the most widely used applications of Machine learning and how they can be designed in the Hadoop framework. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">First, we started with a large video set and showed how the video can be decoded in the HDFS and later converted into a sequence file containing images for later processing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Large-scale image processing was discussed next in the chapter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">The mapper used for this purpose has a shell script which performs all the tasks necessary. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">So, no reducer is necessary to perform this operation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.6">Finally, we discussed how the natural language processing model can be deployed in Hadoop.</span></p></div></div></div></body></html>
