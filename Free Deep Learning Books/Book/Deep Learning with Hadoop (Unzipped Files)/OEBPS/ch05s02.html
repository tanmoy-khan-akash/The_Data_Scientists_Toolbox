</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Boltzmann machines"><div class="titlepage"><div><div><h1 class="title"><a id="ch05lvl1sec33"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Boltzmann machines</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Boltzmann machines [122] are a network of symmetrically connected, neuron-like units, which are used for stochastic decisions on the given datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Initially, they were introduced to learn the probability distributions over binary vectors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Boltzmann machines possess a simple learning algorithm, which helps them to infer and reach interesting conclusions about input datasets containing binary vectors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">The learning algorithm becomes very slow in networks with many layers of feature detectors; however, with one layer of feature detector at a time, learning can be much faster.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">To solve a learning problem, Boltzmann machines consist of a set of binary data vectors, and update the weight on the respective connections so that the data vectors turn out to be good solutions for the optimization problem laid by the weights. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">The Boltzmann machine, to solve the learning problem, makes lots of small updates to these weights.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">The Boltzmann machine over a d-dimensional binary vector can be defined as </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">x </span><span class="inlinemediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"><img src="graphics/Belongs-t0.jpg" alt="Boltzmann machines"/></span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">
 {0, 1} </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">d</span></sup></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">As mentioned in the earlier section, the Boltzmann machine is a type of energy-based function whose joint probability function can be defined using the energy function given as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"><img src="graphics/image_05_004.jpg" alt="Boltzmann machines"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Here, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">E(x)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1"> is the energy function and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Z</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1"> is termed as a partition function that confirms </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Î£</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">x </span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">P(x)= 1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">The energy function of the Boltzmann machine is given as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1"><img src="graphics/image_05_006.jpg" alt="Boltzmann machines"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Here, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">W</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1"> is the weight matrix of the model parameters and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">b</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1"> is the vector of the bias parameter.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Boltzmann machines such as EBMs work on observed and unobserved variables. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.2">The Boltzmann machine works more efficiently when the observed variables are not in higher numbers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.3">In those cases, the unobserved or hidden variables behave like hidden units of multilayer perceptron and show higher order interactions among the visible units.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Boltzmann machines have interlayer connections between the hidden layers as well as between visible units. </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Figure 5.2</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1"> shows a pictorial representation of the Boltzmann machine:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1"><img src="graphics/image_05_007.jpg" alt="Boltzmann machines"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">Figure 5.2: Figure shows a graphical representation of a simple Boltzmann machine. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">The undirected edges in the figure signifies the dependency among nodes and w</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">i,j</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1"> represents the weight associated between nodes i and j. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">Figure shows 3 hidden nodes and 4 visible nodes</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">An interesting property of the Boltzmann machine is that the learning rule does not change with the addition of hidden units. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">This eventually helps to learn the binary features to capture the higher-order structure in the input data.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">The Boltzmann machine behaves as a universal approximator of probability mass function over discrete variables.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note19"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">In statistical learning, </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">Maximize Likelihood Estimation</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">MLE</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">) is a procedure of finding the parameters of a statistical model given observations, by finding the value of one or more parameters, which maximizes the likelihood of making the observations with the parameters.</span></p></div></div><div class="section" title="How Boltzmann machines learn"><div class="titlepage"><div><div><h2 class="title"><a id="ch05lvl2sec45"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">How Boltzmann machines learn</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">The learning algorithms for Boltzmann machines are generally based on maximum likelihood estimation method. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">When Boltzmann machines are trained with learning rules based on maximum likelihood estimation, the update of a particular weight connecting two units of the model will depend on only those two units concerned. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.3">The other units of the network take part in modifying the statistics that get generated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.4">Therefore, the weight can be updated without letting the rest of the network know. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.5">In other words, the rest of the network can only know the final statistics, but would not know how the statistics are computed.</span></p></div><div class="section" title="Shortfall"><div class="titlepage"><div><div><h2 class="title"><a id="ch05lvl2sec46"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Shortfall</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">In Boltzmann machines, with many hidden layers, the network becomes extremely large. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">This makes the model typically slow. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.3">The Boltzmann machine stops learning with large scale data, as the machine's size also simultaneously grows exponentially. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.4">With a large network, the weights are generally very large and also the equilibrium distribution becomes very high. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.5">This unfortunately creates a significant problem for Boltzmann machines, which eventually results in a longer time duration to reach to an equilibrium state of distribution.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">This limitation can be overcome by restricting the connectivity between two layers, and thus simplifying the learning algorithm by learning one latent layer at a time.</span></p></div></div></div></div></body></html>
