</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="chapter" title="Chapter 3.  Convolutional Neural Network"><div class="titlepage"><div><div><h1 class="title"><a id="ch03"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Chapter 3.  Convolutional Neural Network </span></h1></div></div></div><div class="blockquote"><table border="0" width="100%" cellspacing="0" cellpadding="0" class="blockquote" summary="Block quote"><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1"> </span></td><td valign="top"><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">"The question of whether a computer can think is no more interesting than the question of whether a submarine can swim."</span></em></span>
</p></td><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> </span></td></tr><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> </span></td><td colspan="2" align="right" valign="top" style="text-align: center"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">--</span><span class="attribution"><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Edsger W. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">Dijkstra</span></em></span></span></td></tr></table></div><p>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Convolutional neural network (CNN)</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">--doesn't it give an uncanny feeling about the combination of mathematics and biology with some negligible amount of computer science added? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">However, these type of networks have been some of the most dominant and powerful architectures in the field of computer vision. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">CNN started to gain its popularity after 2012, when there were huge improvements in the precision of classification, credit to some pioneer in the field of deep learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.4">Ever since then, a bunch of high-tech companies have been using deep CNN for various services. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.5">Amazon uses CNN for their product recommendations, Google uses it for their photo search, and Facebook primarily uses it for its automatic tagging algorithms.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">CNN [89] is a type of feed-forward neural network comprised of neurons, which have learnable weights and biases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">These types of networks are basically used to process data, having the grid-like topology form. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">CNNs, as the name suggests, are a type of neural network where, unlike the general matrix multiplication, a special type of linear mathematical operation, convolution, is used in at least one of the subsequent layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.4">The architecture of CNN is designed to take the benefit of input with multidimensional structure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.5">These include the 2D structure of an input image, speech signal, or even one-dimensional time series data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.6">With all these advantages, CNN has been really successful with many practical applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.7">CNN is thus tremendously successful, specifically in fields such as natural language processing, recommender systems, image recognition, and video recognition.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note12"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">A bias unit is an </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">extra</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1"> neuron that has a value of 1 and is added to each pre-output layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">These units are not connected to the previous layer and so do not represent any </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">activity</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> in a real sense.</span></p></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">In this chapter, we will discuss the building block of CNN in-depth. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2">We will initially discuss what convolution is and the need of convolution operations in the neural network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.3">Under that topic, we will also address pooling operation, which is the most important component of CNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.4">The next topic of this chapter will point out the major challenges of CNN while dealing with large-scale data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.5">The last part of this chapter will help the reader to learn how to design CNN using Deeplearning4j.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">The main topics of the chapter are listed as follows:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Understanding convolution</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Background of a CNN</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Basic layers of CNN</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Distributed deep CNN</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">CNN with Deeplearning4j</span></li></ul></div><div class="section" title="Understanding convolution"><div class="titlepage"><div><div><h1 class="title"><a id="ch03lvl1sec18"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Understanding convolution</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">To understand the concept of convolution, let us take an example to determine the position of a lost mobile phone with the help of a laser sensor. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">Let's say the current location of the mobile phone at time </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">t</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1"> can be given by the laser as </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">f (t)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">The laser gives different readings of the location for all the values of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">t</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">The laser sensors are generally noisy in nature, which is undesirable for this scenario. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.3">Therefore, to derive a less noisy measurement of the location of the phone, we need to calculate the average various measurements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.4">Ideally, the more the measurements, the greater the accuracy of the location. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.5">Hence, we should undergo a weighted average, which provides more weight to the measurements.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">A weighted function can be given by the function </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">w (b)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">, where </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">b</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"> denotes the age of the measurement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.2">To derive a new function that will provide a better estimate of the location of the mobile phone, we need to take the average of the weight at every moment.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">The new function can be given as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1"><img src="graphics/image_03_001.jpg" alt="Understanding convolution"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">The preceding operation is termed as convolution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">The conventional method of representing convolution is denoted by an asterisk or star, '*':</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1"><img src="graphics/image_03_002.jpg" alt="Understanding convolution"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Formally, convolution can be defined as an integral of the product of two functions, where one of the functions is reversed and shifted. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.2">Besides, taking the weighted averages, it may also be used for other purposes.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">In terms of convolutional network terminology, the function </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">f</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1"> in our example is referred to as the input and the function </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">w</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">, the second parameter is called the kernel of the operation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.2">The kernel is composed of a number of filters, which will be used on the input to get the output, referred to as </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">feature maps</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.2">In a more convenient way, the kernel can be seen as a membrane, which will allow only the desirable features of the input to pass through it. </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Figure 3.1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1"> shows a pictorial view of the operation:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1"><img src="graphics/image_03_003.jpg" alt="Understanding convolution"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">Figure 3.1: The figure shows a simple representation of a convolutional network where the input has to pass through the kernel to provide the feature map.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">In a practical scenario, as our example shows, the laser sensor cannot really provide the measurements at every given instant of time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.2">Ideally, when a computer works on data, it only works at some regular intervals; hence, the time will be discrete. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.3">So, the sensor will generally provide the results at some defined interval of time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.4">If we assume that the instrument provides output once/second, then the parameter </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">t</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"> will only take integer values. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">With these assumptions, the functions </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">f</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1"> and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">w</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1"> will only be defined for integer values of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">t</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.2">The modified equation for discrete convolution can now be written as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1"><img src="graphics/image_03_004.jpg" alt="Understanding convolution"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">In case of machine learning or deep learning applications, the inputs are generally a multidimensional array of data, and the kernel uses multidimensional arrays of different parameters taken by the algorithm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.2">The basic assumption is that the values of the functions are non-zero only for a finite set of points for which we store the values, and zero elsewhere. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.3">So, the infinite summation can be represented as the summation for a range of a finite number of array elements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.4">For example, for a 2D image </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">I</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1"> as an input and a corresponding 2D kernel </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">K</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">, the convolution function can be written as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1"><img src="graphics/image_03_005.jpg" alt="Understanding convolution"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">So, with this, you have already got some background of convolution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.2">In the next section of this chapter, we will discuss the application of convolution in a neural network and the building blocks of CNN.</span></p></div></div></div></div></body></html>
