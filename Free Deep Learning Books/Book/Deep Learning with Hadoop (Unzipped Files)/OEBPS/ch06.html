</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="chapter" title="Chapter 6.  Autoencoders"><div class="titlepage"><div><div><h1 class="title"><a id="ch06"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Chapter 6.  Autoencoders </span></h1></div></div></div><div class="blockquote"><table border="0" width="100%" cellspacing="0" cellpadding="0" class="blockquote" summary="Block quote"><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1"> </span></td><td valign="top"><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">"People worry that computers will get too smart and take over the world, but the real problem is that they're too stupid and they've already taken over the world."</span></em></span>
</p></td><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> </span></td></tr><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> </span></td><td colspan="2" align="right" valign="top" style="text-align: center"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">--</span><span class="attribution"><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Pedro Domingos</span></em></span></span></td></tr></table></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">In the last chapter, we discussed a generative model called Restricted Boltzmann machine. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">In this chapter, we will introduce one more generative model called </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">autoencoder</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">Autoencoder, a type of artificial neural network, is generally used for dimensionality reduction, feature learning, or extraction.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">As we move on with this chapter, we will discuss the concept of autoencoder and its various forms in detail. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">We will also explain the terms </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">regularized autoencoder</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1"> and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">sparse autoencoder</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">The concept of sparse coding, and selection criteria of the sparse factor in a sparse autoencoder will be taken up. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.3">Later, we will talk about the deep learning model, deep autoencoder, and its implementation using Deeplearning4j. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.4">Denoising autoencoder is one more form of a traditional autoencoder, which will be discussed in the end part of the chapter.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Overall, this chapter is broken into a few subsections, which are listed as follows:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Autoencoder</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Sparse autoencoder</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Deep autoencoder</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Denoising autoencoder</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Applications of autoencoders</span></li></ul></div><div class="section" title="Autoencoder"><div class="titlepage"><div><div><h1 class="title"><a id="ch06lvl1sec40"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Autoencoder</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">An autoencoder is a neural network with one hidden layer, which is trained to learn an identity function that attempts to reconstruct its input to its output. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.2">In other words, the autoencoder tries to copy the input data by projecting onto a lower dimensional subspace defined by the hidden nodes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.3">The hidden layer, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">h</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">, describes a code, which is used to represent the input data and its structure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">This hidden layer is thus forced to learn the structure from its input training dataset so that it can copy the input at the output layer.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">The network of an autoencoder can be split into two parts: encoder and decoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.2">The encoder is described by the function </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">h=f (k)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">, and a decoder that tries to reconstruct or copy is defined by </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">r = g (h)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">The basic idea of autoencoder should be to copy only those aspects of the inputs which are prioritized, and not to create an exact replica of the input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.3">They are designed in such a way so as to restrict the hidden layer to copy only approximately, and not everything from the input data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.4">Therefore, an autoencoder will not be termed as useful if it learns to completely set </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">g(f(k) = k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"> for all the values of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">. </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Figure 6.1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"> represents the general structure of an autoencoder, mapping an input </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1"> to an output </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">r</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1"> through an internal hidden layer of code </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">h</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1"><img src="graphics/image_06_001.jpg" alt="Autoencoder"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Figure 6.1: General block diagram of an autoencoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.2">Here, input k is mapped to an output r through a hidden state or internal representation h. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.3">An encoder f maps the input k to the hidden state h, and decoder g performs the mapping of h to the output r.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">To provide one more example, let us consider </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">Figure 6.2</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.2">The figure shows a practical representation of an autoencoder for input image patches </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">, which learns the hidden layer </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">h</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1"> to output </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">r</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.2">The input layer </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"> is a combination of intensity values from the image patches. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">The hidden layer nodes help to project the high-dimensional input layer into lower-dimensional activation values of the hidden nodes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.3">These activation values of the hidden node are merged together to generate the output layer </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">r</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">, which is an approximation of the input pixel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.2">In ideal cases, hidden layers generally have a smaller number of nodes as compared to the input layer nodes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.3">For this reason, they are forced to diminish the information in such a way that the output layer can still be generated.</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1"><img src="graphics/B05883_06_02-1.jpg" alt="Autoencoder"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">Figure 6.2: Figure shows a practical example of how an autoencoder learns output structure from the approximation of the input pixels.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">Replicating the structure of the input to the output might sound inefficacious, however, practically, the final result of an autoencoder is not exactly dependent on the output of the decoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.2">Instead, the main idea behind training an autoencoder is to copy the useful properties of the input task, which will reflect in the hidden layer.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">One of the common ways to extract desired features or information from the autoencoder is to limit the hidden layer, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">h</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">, to have smaller dimension </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">(d</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">/</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"> than the input </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1"> with a dimension </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">d,</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1"> that is </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">d</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">/</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">&lt;d</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.2">This resulting smaller dimensional layer can thus be called a loss compressed representation of the input </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.2">An autoencoder whose hidden layer's dimension is less than the input's dimension is termed as </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">undercomplete</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">The learning process described can be mathematically represented as minimizing the loss function </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">L</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">, which is given as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1"><img src="graphics/image_06_003.jpg" alt="Autoencoder"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">In simple words, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">L</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1"> can be defined as a loss function that penalized </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">g (f (k))</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1"> for being different from the input </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">With a linear decoder function, an autoencoder learns to form the basis for space as similar to the </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">Principal component analysis</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">PCA</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">) procedure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.2">Upon convergence, the hidden layer will form a basis for the space spanned by the principal subspace of the training dataset given as the input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.3">However, unlike PCA, these procedures need not necessarily generate orthogonal vectors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.4">For this reason, autoencoders with non-linear encoder functions </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">f</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1"> and non-linear decoder function </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">g</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1"> can learn more powerful non-linear generalization of the PCA. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.2">This will eventually increase the capacity of the encoder and decoder to a large extent. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.3">With this increase in capacity, however, the autoencoder starts showing unwanted behavior.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">It can then learn to undergo copying the whole input without giving attention to extract the desired information. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.2">In a theoretical sense, an autoencoder might be a one-dimensional code, but practically, a very powerful nonlinear encoder can learn to represent each training example </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">k(i)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1"> with code </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">i</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.2">The decoder then maps those integers </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">(i)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1"> to the values of specific training examples. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.2">Hence, copying of only the useful features from the input dataset fails completely with an autoencoder with higher capacity.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note23"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">PCA is a statistical method which applies orthogonal transformation to convert a set of possibly correlated observed variables into a set of linearly correlated set of variables termed as principal components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.2">The number of principal components in the PCA method is less than or equal to the number of original input variables.</span></p></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">Similar to the edge case problem mentioned for an undercomplete autoencoder, where the dimension of the hidden layer is less than that of the input, autoencoder, where the hidden layer or code is allowed to have an equal dimension of input, often faces the same problem.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">An autoencoder, where the hidden code has greater dimension than the dimension of the input, is termed as an overcomplete autoencoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.2">This type of autoencoder is even more vulnerable to the aforementioned problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.3">Even a linear encoder and decoder can perform learning a copy of input to output without learning any desired attributes of the input dataset.</span></p><div class="section" title="Regularized autoencoders"><div class="titlepage"><div><div><h2 class="title"><a id="ch06lvl2sec55"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">Regularized autoencoders</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">By choosing a proper dimension for the hidden layer, and the capacity of the encoder and decoder in accordance with the complexity of the model distribution, autoencoders of any kind of architecture can be built successfully. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.2">The autoencoder which has the ability to provide the same is termed as a regularized autoencoder.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">Besides the ability to copy the input to output, a regularized autoencoder has a loss function, which helps the model to possess other properties too. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.2">These include robustness to missing inputs, sparsity of the representation of data, smallness of the derivative of the representation, and so on. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.3">Even a nonlinear and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">overcomplete</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1"> regularized autoencoder is able to learn at least something about the data distribution, irrespective of the capacity of the model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.2">Regularized autoencoders [131] are able to capture the structure of the training distribution with the help of productive opposition between a restructuring error and a regularizer.</span></p></div></div></div></div></div></body></html>
