</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Conventions"><div class="titlepage"><div><div><h1 class="title"><a id="pf11lvl1sec4"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Conventions</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">In this book, you will find a number of text styles that distinguish between different kinds of information. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Here are some examples of these styles and an explanation of their meaning.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Code words in text, database table names, folder names, filenames, file extensions, pathnames, dummy URLs, user input, and Twitter handles are shown as follows: "The </span><code class="literal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">.build()</span></code><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> function is used to build the layer."</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">A block of code is set as follows:</span></p><pre class="programlisting"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">public static final String DATA_URL =     
  "http://ai.stanford.edu/~amaas/data/sentiment/*";</span></pre><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">When we wish to draw your attention to a particular part of a code block, the relevant lines or items are set in bold:</span></p><pre class="programlisting">
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">MultiLayerNetwork model = new MultiLayerNetwork(getConfiguration());</span></strong></span>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Model.init();</span></strong></span>
</pre><p>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">New terms </span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">and </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">important words </span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">are shown in bold. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">Words that you see on the screen, for example, in menus or dialog boxes, appear in the text like this: "In simple words, any neural network with two or more layers (hidden) is defined as a </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">deep feed-forward network</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> or </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">feed-forward neural</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1"> network."</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Warnings or important notes appear in a box like this.</span></p></div></div><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="tip2"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Tip</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Tips and tricks appear like this.</span></p></div></div></div></div></div></body></html>
