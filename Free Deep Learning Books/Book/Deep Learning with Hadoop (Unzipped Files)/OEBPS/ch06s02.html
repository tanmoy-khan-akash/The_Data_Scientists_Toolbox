</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Sparse autoencoders"><div class="titlepage"><div><div><h1 class="title"><a id="ch06lvl1sec41"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Sparse autoencoders</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Distributed sparse representation is one of the primary keys to learn useful features in deep learning algorithms. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Not only is it a coherent mode of data representation, but it also helps to capture the generation process of most of the real world dataset. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">In this section, we will explain how autoencoders encourage sparsity of data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">We will start with introducing sparse coding. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">A code is termed as sparse when an input provokes the activation of a relatively small number of nodes of a neural network, which combine to represent it in a sparse way. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.6">In deep learning technology, a similar constraint is used to generate the sparse code models to implement regular autoencoders, which are trained with sparsity constants called sparse autoencoders.</span></p><div class="section" title="Sparse coding"><div class="titlepage"><div><div><h2 class="title"><a id="ch06lvl2sec56"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Sparse coding</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Sparse coding is a type of unsupervised method to learn sets of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">overcomplete</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> bases in order to represent the data in a coherent and efficient way. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">The primary goal of sparse coding is to determine a set of vectors </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">(n) v</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> </span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">such that the input vector </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1"> can be represented as a linear combination of these vectors.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Mathematically, this can be represented as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1"><img src="graphics/image_06_004.jpg" alt="Sparse coding"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Here </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">a</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">i</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1"> is the coefficient associated with each vector </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">v</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">i</span></sub></em></span>
<sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">. </span></sub></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">With the help of PCA, we can learn a complete set of basis vectors in a coherent way; however, we want to learn an </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">overcomplete</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1"> set of basis vectors to represent the input vector </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">k</span></em></span>
<span class="inlinemediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"><img src="graphics/equation.jpg" alt="Sparse coding"/></span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">
 where </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">n&gt;m</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">The reason to have the </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">overcomplete</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1"> basis is that the basis vectors are generally able to catch the pattern and structure that are inherent to the input data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">However, overcompleteness sometime raises a degeneracy that, with its basis, the coefficient </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">a</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">i </span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">cannot uniquely identify the input vector </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.2">For this reason, an additional criterion called sparsity is introduced in sparse coding.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">In a simple way, sparsity can be defined as having few non-zero components or having few components that are not close to zero. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.2">The set of coefficients </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">a</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">i</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1"> is termed as sparse if, for a given input vector, the number of non-zero coefficients, or the number of coefficients that are way far from zero, should be a few.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">With this basic understanding of sparse coding, we can now move to the next part to discover how the sparse coding concept is used for autoencoders to generate sparse autoencoders.</span></p></div><div class="section" title="Sparse autoencoders"><div class="titlepage"><div><div><h2 class="title"><a id="ch06lvl2sec57"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">Sparse autoencoders</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">When the input dataset maintains some structure, and if the input features are correlated, then even a simple autoencoder algorithm can discover those correlations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">Moreover, in such cases, a simple autoencoder will end up learning a low-dimensional representation, which is similar to PCA.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">This perception is based on the fact that the number of hidden layers is relatively small. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.2">However, by imposing other constraints on the network, even with a large number of hidden layers, the network can still discover desired features from the input vectors.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">Sparse autoencoders are generally used to learn features to perform other tasks such as classification. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">Autoencoders for which the sparsity constraints have been added must respond to the unique statistical features of the input dataset with which it is training on, rather than simply acting as an identity function.</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1"><img src="graphics/B05883_06_03.jpg" alt="Sparse autoencoders"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">Figure 6.3: Figure shows a typical example of a sparse autoencoder</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">Sparse autoencoders are a type of autoencoder with a sparsity enforcer, which helps to direct a single layer network to learn the hidden layer code. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.2">This approach minimizes the reconstruction errors along with restricting the number of code words needed to restructure the output. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.3">This kind of sparsifying algorithm can be considered as a classification problem that restricts the input to a single class value, which helps to reduce the prediction errors.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">In this part, we will explain sparse autoencoder with a simple architecture. </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">Figure 6.3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1"> shows the simplest form of a sparse autoencoder, consisting of a single hidden layer </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">h</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.2">The hidden layer </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">h</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">, is connected to the input vector </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">K</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1"> by a weight matrix, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">W</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">, which forms the encoding step. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.2">In the decoder step, the hidden layer h outputs to a reconstruction vector </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">K` </span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">with the help of the tied weight matrix </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">W</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">T</span></sup></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.2">In the network, the activation function is denoted as </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">f</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1"> and the bias term as </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">b</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.2">The activation function could be anything: linear, sigmoidal, or ReLU.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">The equation to compute the sparse representation of the hidden code </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">l</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1"> is written as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1"><img src="graphics/Capture-10.jpg" alt="Sparse autoencoders"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">The reconstructed output is the hidden representation, mapped linearly to the output using this:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1"><img src="graphics/Capture-11.jpg" alt="Sparse autoencoders"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">Learning occurs via backpropagation on the reconstruction error. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.2">All the parameters are optimized to minimize the mean square error, given as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1"><img src="graphics/image_06_008.jpg" alt="Sparse autoencoders"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">As we have the network setup now, we can add the sparsifying component, which drives the vector </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">L</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1"> towards a sparse representation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.2">Here, we will use k-Sparse autoencoders to implement the sparse representation of the layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.3">(Don't get confused between the </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"> of k-Sparse representation and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">K</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1"> input vector. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.2">To distinguish between both of them, we have denoted these two with a small </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1"> and capital </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">K</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1"> respectively.)</span></p><div class="section" title="The k-Sparse autoencoder"><div class="titlepage"><div><div><h3 class="title"><a id="ch06lvl3sec18"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">The k-Sparse autoencoder</span></h3></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">The k-Sparse autoencoder [132] is based on an autoencoder with tied weights and linear activation functions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.2">The basic idea of a k-Sparse autoencoder is very simple. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.3">In the feed-forward phase of the autoencoder, once we compute the hidden code </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">l = WK + b</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">, rather than reconstructing the input from all the hidden units, the method searches for the </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1"> largest hidden units and sets the remaining hidden units' values as zero.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">There are alternative methods to determine the </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1"> largest hidden units. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.2">By sorting the activities of the hidden units or using ReLU, hidden units with thresholds are adjusted until we determine the </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1"> largest activities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.2">This selection step to find the </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1"> largest activities is non-linear. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.2">The selection step behaves like a regularizer, which helps to prevent the use of large numbers of hidden units while building the output by reconstructing the input.</span></p><div class="section" title="How to select the sparsity level k"><div class="titlepage"><div><div><h4 class="title"><a id="ch06lvl4sec4"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">How to select the sparsity level k</span></h4></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">An issue might arise during the training of a k-Sparse autoencoder if we enforce a low sparsity level, say </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">k=10</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.2">One common problem is that in the first few epochs, the algorithm will aggressively start assigning the individual hidden units to groups of training cases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.3">The phenomena can be compared with the k-means clustering approach. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.4">In the successive epochs, these hidden units will be selected and re-enforced, but the other hidden units would not be adjusted.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">This issue can be addressed by scheduling the sparsity level in a proper way. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.2">Let us assume we are aiming for a sparsity level of 10. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.3">In such cases, we can start with a large sparsity level of say </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">k=100</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1"> or </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">k=200</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.2">Hence, the k-Sparse autoencoder can train all the hidden units present. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.3">Gradually, over half of the epoch, we can linearly decrease the sparsity level of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">k=100</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1"> to </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">k=10</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.2">This greatly increases the chances of all the hidden units being picked. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.3">Then, we will keep </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">k=10</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1"> for the next half of the epoch. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.2">In this way, this kind of scheduling will guarantee that even with a low sparsity level, all of the filters will be trained.</span></p></div><div class="section" title="Effect of sparsity level"><div class="titlepage"><div><div><h4 class="title"><a id="ch06lvl4sec5"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">Effect of sparsity level</span></h4></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">The choice of value of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1"> is very much crucial while designing or implementing a k-Sparse autoencoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.2">The value of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1"> determines the desirable sparsity level, which helps to make the algorithm ideal for a wide variety of datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.2">For example, one application could be used to pre-train a deep discriminative neural network or a shallow network.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">If we take a large value for </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1"> (say </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">k=200</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1"> on an MNIST dataset), the algorithm will tend to identify and learn very local features of the dataset. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.2">These features sometimes behave too prematurely to be used for the classification of a shallow architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.3">A shallow architecture generally has a naive linear classifier, which does not really have enough architectural strength to merge all of these features and achieve a substantial classification rate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.4">However, similar local features are very much desirable to pre-train a deep neural network.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">For a smaller value of the sparsity level (say </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">k=10</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1"> on an MNIST dataset), the output is reconstructed from the input using a smaller set of hidden units. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.2">This eventually results in detecting of global features from the datasets, instead of local features as in the earlier case. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.3">These less local features are suitable for shallow architecture for the classification tasks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.4">On the contrary, these types of situations are not ideal for deep neural networks.</span></p></div></div></div></div></div></div></body></html>
