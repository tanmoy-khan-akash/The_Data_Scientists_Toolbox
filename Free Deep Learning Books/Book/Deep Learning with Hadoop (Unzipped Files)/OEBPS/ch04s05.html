</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Bi-directional RNNs"><div class="titlepage"><div><div><h1 class="title"><a id="ch04lvl1sec28"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Bi-directional RNNs</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">This section of the chapter will discuss the major limitations of RNNs and how bi-directional RNN, a special type of RNN helps to overcome those shortfalls. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Bi-directional neural networks, apart from taking inputs from the past, takes the information from the future context for its required prediction.</span></p><div class="section" title="Shortfalls of RNNs"><div class="titlepage"><div><div><h2 class="title"><a id="ch04lvl2sec43"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Shortfalls of RNNs</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">The computation power of standard or unidirectional RNNs has constraints, as the current state cannot reach its future input information. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">In many cases, the future input information coming up later becomes extremely useful for sequence prediction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">For example, in speech recognition, due to linguistic dependencies, the appropriate interpretation of the voice as a phoneme might depend on the next few spoken words. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.4">The same situation might also arise in handwriting recognition.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">In some modified versions of RNN, this feature is partially attained by inserting some delay of a certain amount (</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">N</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">) of time steps in the output. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">This delay helps to capture the future information to predict the data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.3">Although, theoretically, in order to capture most of the available future information, the value of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">N</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> can be set as very large, but in a practical scenario, the prediction power of the model actually reduces with a large value of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">N</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">The paper [113] has put some logical explanation for this inference. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">As the value of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">N</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1"> increases, most of the computational power of a RNN only focuses on remembering the input information for 
</span><span class="inlinemediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1"><img src="graphics/image_04_017.jpg" alt="Shortfalls of RNNs"/></span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">

 (from </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Figure 4.8</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">) to predict the outcome, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">y</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">tc</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">(</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">t</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">c</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1"> in figure denotes the current time step in consideration). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.2">Therefore, the model will have less processing power to combine the prediction knowledge received from different input vectors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.3">The following </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Figure 4.8</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1"> shows an illustration of the amount of input information needed for different types of RNNs:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"><img src="graphics/image_04_018-1.jpg" alt="Shortfalls of RNNs"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Figure 4.8: The figure shows visualizations of input information used by different types of RNNs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">[113]</span></p></div><div class="section" title="Solutions to overcome"><div class="titlepage"><div><div><h2 class="title"><a id="ch04lvl2sec44"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Solutions to overcome</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">To subjugate the limitations of a unidirectional RNN explained in the last section, </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">bidirectional recurrent network</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">BRNN</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">) was invented in 1997 [113].</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">The basic idea behind bidirectional RNN is to split the hidden state of a regular RNN into two parts. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">One part is responsible for the forward states (positive time direction), and the other part for the backward states (negative time direction). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.3">Outputs generated from the forward states are not connected to the inputs of the backward states, and vice versa. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.4">A simple version of a bidirectional RNN, unrolled in three time steps is shown in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Figure 4.9</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">With this structure, as both the time directions are taken care of, the currently evaluated time frame can easily use the input information from the past and the future. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.2">So, the objective function of the current output will eventually minimize, as we do not need to put further delays to include the future information. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.3">This was necessary for regular RNNs as stated in the last section.</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1"><img src="graphics/image_04_019.jpg" alt="Solutions to overcome"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">Figure 4.9: The figure shows the conventional structure of a bidirectional neural network unrolled in three time steps.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">So far, bidirectional RNNs have been found to be extremely useful in applications such as speech recognition [114], handwriting recognition, bioinformatics [115], and so on.</span></p></div></div></div></div></body></html>
