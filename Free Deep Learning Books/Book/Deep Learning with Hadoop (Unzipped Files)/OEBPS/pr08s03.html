</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Who this book is for"><div class="titlepage"><div><div><h1 class="title"><a id="pf11lvl1sec3"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Who this book is for</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">If you are a data scientist who wants to learn how to perform deep learning on Hadoop, this is the book for you. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Knowledge of the basic machine learning concepts and some understanding of Hadoop is required to make the best use of this book.</span></p></div></div></div></body></html>
