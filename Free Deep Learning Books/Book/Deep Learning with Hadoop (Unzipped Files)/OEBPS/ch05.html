</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="chapter" title="Chapter 5.  Restricted Boltzmann Machines"><div class="titlepage"><div><div><h1 class="title"><a id="ch05"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Chapter 5.  Restricted Boltzmann Machines </span></h1></div></div></div><div class="blockquote"><table border="0" width="100%" cellspacing="0" cellpadding="0" class="blockquote" summary="Block quote"><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1"> </span></td><td valign="top"><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">"What I cannot create, I do not understand."</span></em></span>
</p></td><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> </span></td></tr><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> </span></td><td colspan="2" align="right" valign="top" style="text-align: center"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">--</span><span class="attribution"><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Richard Feynman</span></em></span></span></td></tr></table></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">So far in this book, we have only discussed the discriminative models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">The use of these in deep learning is to model the dependencies of an unobserved variable y on an observed variable </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">x</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">Mathematically, it is formulated as </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">P(y|x)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">In this chapter, we will discuss deep generative models to be used in deep learning.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Generative models are models, which when given some hidden parameters, can randomly generate some observable data values out of them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">The model works on a joint probability distribution over label sequences and observation.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">The generative models are used in machine and deep learning either as an intermediate step to generate a conditional probability density function or modeling observations directly from a probability density function.</span></p><p>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Restricted Boltzmann machines</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">RBMs</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">) are a popular generative model that will be discussed in this chapter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">RBMs are basically probabilistic graphical models that can also be interpreted as stochastic neural networks.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note18"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Note</span></h3><p>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Stochastic neural networks</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1"> can be defined as a type of artificial neural network that is generated by providing random variations into the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">The random variation can be supplied in various ways, such as providing stochastic weights or by giving a network's neurons stochastic transfer functions.</span></p></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">In this chapter, we will discuss, a special type of Boltzmann machine called RBM, which is the main topic of this chapter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.2">We will discuss how </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Energy-Based models</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">EBMs</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">) are related to RBM, and their functionalities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.2">Later in this chapter, we will introduce </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Deep Belief network</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">DBN</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">), which is an extension of the RBM. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">The chapter will then discuss the large-scale implementation of these in distributed environments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.3">The chapter will conclude by giving examples of RBM and DBN with Deeplearning4j.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">The organization of this chapter is as follows:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">Energy-based models</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">Boltzmann machine</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">Restricted Boltzmann machine</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Convolutional Restricted Boltzmann machine</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Deep Belief network</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">Distributed Deep Belief network</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">Implementation of RBM and DBN with Deeplearning4j</span></li></ul></div><div class="section" title="Energy-based models"><div class="titlepage"><div><div><h1 class="title"><a id="ch05lvl1sec32"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">Energy-based models</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">The main goal of deep learning and statistical modeling is to encode the dependencies between variables. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.2">By getting an idea of those dependencies, from the values of the known variables, a model can answer questions about the unknown variables.</span></p><p>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Energy-based models</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">EBMs</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">) [120] gather and collect the dependencies by identifying scaler energy, which generally is a measure of compatibility to each configuration of the variable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.2">In EBMs, the predictions are made by setting the value of observed variables and finding the value of the unobserved variables, which minimize the overall energy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.3">Learning in EBMs consists of formulating an energy function, which assigns low energies to the correct values of unobserved variables and higher energies to the incorrect ones. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.4">Energy-based learning can be treated as an alternative to probabilistic estimation for classification, decision-making, or prediction tasks.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">To give a clear idea about how EBMs work, let us look at a simple example.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">As shown in F</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">igure 5.1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">, let us consider two sets of variables, observed and unobserved, namely, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">X</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1"> and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Y</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1"> respectively. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.2">Variable </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">X</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">, in the figure, represents the collection of pixels from an image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.2">Variable </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">Y</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1"> is discrete, and contains the possible categories of the object needed for classification. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.2">Variable </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">Y</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1"> in this case, consists of six possible values, namely: air-plane, animal, human, car, truck, and none of the above. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.2">The model is used as an energy function that will measure the correctness of the mapping between </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">X</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1"> and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">Y</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">The model uses a convention that small energy values imply highly related configuration of the variables. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.2">On the other hand, with the increasing energy values, the incompatibility of the variables also increases equally. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.3">The function that is related to both the </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">X</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1"> and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">Y</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"> variable is termed as energy function, denoted as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1"><img src="graphics/B05883_05_01.jpg" alt="Energy-based models"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">In the case of energy models, the input </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">X</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1"> is collected from the surroundings and the model generates an output Y, which is more likely to answer about the observed variable </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">X</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.2">The model is required to produce the value </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">Y</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">/</span></sup></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">, chosen from a set </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">Y*</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">, which will make the value of the energy function </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">E(Y, X)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1"> least. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.2">Mathematically, this is represented as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"><img src="graphics/image_05_001.jpg" alt="Energy-based models"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">The following </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">Figure 5.1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1"> depicts the block diagram of the overall example mentioned in the preceding section:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1"><img src="graphics/image_05_002.jpg" alt="Energy-based models"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">Figure 5.1: Figure shows a energy model which computes the compatibility between the observed variable X and unobserved variable Y. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.2">X in the image is a set of pixel and Y is the set of level used for categorization of X. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.3">The model finds choosing 'Animal' makes the values of energy function least. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.4">Image taken from [121]</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">EBMs in deep learning are related to probability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.2">Probability is proportional to </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">e</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1"> to the power of negative energy:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1"><img src="graphics/image_05_003.jpg" alt="Energy-based models"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">EBMs define probabilities indirectly by formulating the function </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">E(x)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.2">The exponential function makes sure that the probability will always be greater than zero. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.3">This also implies that in an energy-based model, one is always free to choose the energy function based on the observed and unobserved variables. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.4">Although the probabilities for a classification in an energy-based model can arbitrarily approach zero, it will never reach that.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">Distribution in the form of the preceding equation is a form of Boltzmann distribution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.2">The EBMs are hence often termed as </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">Boltzmann machines</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.2">We will explain about Boltzmann machines and their various forms in the subsequent sections of this chapter.</span></p></div></div></div></div></body></html>
