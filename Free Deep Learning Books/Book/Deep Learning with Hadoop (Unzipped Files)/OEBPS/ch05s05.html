</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Deep Belief networks"><div class="titlepage"><div><div><h1 class="title"><a id="ch05lvl1sec36"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Deep Belief networks</span></h1></div></div></div><p>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Deep Belief networks</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">DBNs</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">) were one of the most popular, non-convolutional models that could be successfully deployed as deep neural networks in the year 2006-07 [124] [125]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">The renaissance of deep learning probably started from the invention of DBNs back in 2006. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.3">Before the introduction of DBNs, it was very difficult to optimize the deep models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.4">By outperforming the </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Support Vector machines</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">SVMs</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">), DBNs had shown that deep models can be really successful; although, compared to the other generative or unsupervised learning algorithms, the popularity of DBNs has fallen a bit, and is rarely used these days. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">However, they still play a very important role in the history of deep learning.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note21"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">A DBN with only one hidden layer is just an RBM.</span></p></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">DBNs are generative models composed of more than one layer of hidden variables. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">The hidden variables are generally binary in nature; however the visible units might consist of binary or real values. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.3">In DBNs, every unit of each layer is connected to every other unit of its neighbouring layer, although, there can be a DBN with sparsely connected units. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.4">There possess no connection between the intermediate layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.5">As shown in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Figure 5.9</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">, DBNs are basically a multilayer network composed of several RBMs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">The connections between the top two layers are undirected. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.3">However, the connections between all other layers are directed, where the arrows point toward the layer nearest to the data.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Except for the first and last layer of the stack, each layer of a DBN serves two purposes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">First, it acts as a hidden layer for its predecessor layer, and as a visible layer or input for its next layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.3">DBNs are mainly used to cluster, recognize and generate video sequences and images.</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"><img src="graphics/image_05_016.jpg" alt="Deep Belief networks"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Figure 5.9: A DBN composed of three RBMs is shown in figure</span></p><div class="section" title="Greedy layer-wise training"><div class="titlepage"><div><div><h2 class="title"><a id="ch05lvl2sec50"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Greedy layer-wise training</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">A greedy layer-wise training algorithm for training DBNs was proposed in 2006 [126]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">This algorithm trains the DBN one layer at a time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.3">In this approach, an RBM is first trained, which takes the actual data as input and models it.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">A one-level DBN is an RBM. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">The core philosophy of greedy layer-wise approach is that after training the top-level RBM of an m-level DBN, the interpretation of the parameters changes while adding them in a (</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">m+1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">) level DBN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.2">In an RBM, between layers (</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">m-1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">) and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">m</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">, the probability distribution of layer </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">m</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1"> is defined in terms of the parameters of that RBM. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">However, in the case of a DBN, the probability distribution of layer </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">m</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1"> is defined in terms of the upper layer's parameters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">This procedure can be repeated indefinitely, to connect with as many layers of DBNs as one desires.</span></p></div></div></div></div></body></html>
