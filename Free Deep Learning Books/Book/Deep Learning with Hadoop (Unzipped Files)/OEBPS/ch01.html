</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="chapter" title="Chapter 1. Introduction to Deep Learning"><div class="titlepage"><div><div><h1 class="title"><a id="ch01"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Chapter 1. Introduction to Deep Learning</span></h1></div></div></div><div class="blockquote"><table border="0" width="100%" cellspacing="0" cellpadding="0" class="blockquote" summary="Block quote"><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1"> </span></td><td valign="top"><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">"By far the greatest danger of Artificial Intelligence is that people conclude too early that they understand it."</span></em></span>
</p></td><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> </span></td></tr><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> </span></td><td colspan="2" align="right" valign="top" style="text-align: center"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">--</span><span class="attribution"><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Eliezer Yudkowsky</span></em></span></span></td></tr></table></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Ever thought, why it is often difficult to beat the computer in chess, even for the best players of the game? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">How Facebook is able to recognize your face amid hundreds of millions of photos? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">How can your mobile phone recognize your voice, and redirect the call to the correct person, from hundreds of contacts listed?</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">The primary goal of this book is to deal with many of those queries, and to provide detailed solutions to the readers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">This book can be used for a wide range of reasons by a variety of readers, however, we wrote the book with two main target audiences in mind. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">One of the primary target audiences is undergraduate or graduate university students learning about deep learning and Artificial Intelligence; the second group of readers are the software engineers who already have a knowledge of big data, deep learning, and statistical modeling, but want to rapidly gain knowledge of how deep learning can be used for big data and vice versa.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">This chapter will mainly try to set a foundation for the readers by providing the basic concepts, terminologies, characteristics, and the major challenges of deep learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">The chapter will also put forward the classification of different deep network algorithms, which have been widely used by researchers over the last decade. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">The following are the main topics that this chapter will cover:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Getting started with deep learning</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Deep learning terminologies</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Deep learning: A revolution in Artificial Intelligence</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Classification of deep learning networks</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Ever since the dawn of civilization, people have always dreamt of building artificial machines or robots which can behave and work exactly like human beings. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">From the Greek mythological characters to the ancient Hindu epics, there are numerous such examples, which clearly suggest people's interest and inclination towards creating and having an artificial life.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">During the initial computer generations, people had always wondered if the computer could ever become as intelligent as a human being! </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">Going forward, even in medical science, the need of automated machines has become indispensable and almost unavoidable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">With this need and constant research in the same field, </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Artificial Intelligence</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">AI</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">) has turned out to be a flourishing technology with various applications in several domains, such as image processing, video processing, and many other diagnosis tools in medical science too.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Although there are many problems that are resolved by AI systems on a daily basis, nobody knows the specific rules for how an AI system is programmed! </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">A few of the intuitive problems are as follows:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Google search, which does a really good job of understanding what you type or speak</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">As mentioned earlier, Facebook is also somewhat good at recognizing your face, and hence, understanding your interests</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Moreover, with the integration of various other fields, for example, probability, linear algebra, statistics, machine learning, deep learning, and so on, AI has already gained a huge amount of popularity in the research field over the course of time.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">One of the key reasons for the early success of AI could be that it basically dealt with fundamental problems for which the computer did not require a vast amount of knowledge. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">For example, in 1997, IBM's Deep Blue chess-playing system was able to defeat the world champion Garry Kasparov [1]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.3">Although this kind of achievement at that time can be considered significant, it was definitely not a burdensome task to train the computer with only the limited number of rules involved in chess! </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.4">Training a system with a fixed and limited number of rules is termed as </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">hard-coded knowledge</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1"> of the computer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">Many Artificial Intelligence projects have undergone this hard-coded knowledge about the various aspects of the world in many traditional languages. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.3">As time progresses, this hard-coded knowledge does not seem to work with systems dealing with huge amounts of data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.4">Moreover, the number of rules that the data was following also kept changing in a frequent manner. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.5">Therefore, most of the projects following that system failed to stand up to the height of expectation.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">The setbacks faced by this hard-coded knowledge implied that those artificial intelligence systems needed some way of generalizing patterns and rules from the supplied raw data, without the need for external spoon-feeding. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">The proficiency of a system to do so is termed as </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">machine learning</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">There are various successful machine learning implementations which we use in our daily life. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.3">A few of the most common and important implementations are as follows:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">Spam detection</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">: Given an e-mail in your inbox, the model can detect whether to put that e-mail in spam or in the inbox folder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.2">A common naive Bayes model can distinguish between such e-mails.</span></li><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">Credit card fraud detection</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">: A model that can detect whether a number of transactions performed at a specific time interval are carried out by the original customer or not.</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">One of the most popular machine learning models, given by Mor-Yosef et al in 1990, used logistic regression, which could recommend whether caesarean delivery was needed for the patient or not!</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">There are many such models which have been implemented with the help of machine learning techniques.</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1"><img src="graphics/image_01_001.jpg" alt="Introduction to Deep Learning"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">Figure 1.1: The figure shows the example of different types of representation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.2">Let's say we want to train the machine to detect some empty spaces in between the jelly beans. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.3">In the image on the right side, we have sparse jelly beans, and it would be easier for the AI system to determine the empty parts. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.4">However, in the image on the left side, we have extremely compact jelly beans, and hence, it will be an extremely difficult task for the machine to find the empty spaces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.5">Images sourced from USC-SIPI image database</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">A large portion of performance of the machine learning systems depends on the data fed to the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">This is called </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">representation</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"> of the data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.2">All the information related to the representation is called the </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">feature</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1"> of the data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">For example, if logistic regression is used to detect a brain tumor in a patient, the AI system will not try to diagnose the patient directly! </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.3">Rather, the concerned doctor will provide the necessary input to the systems according to the common symptoms of that patient. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.4">The AI system will then match those inputs with the already received past inputs which were used to train the system.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Based on the predictive analysis of the system, it will provide its decision regarding the disease. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.2">Although logistic regression can learn and decide based on the features given, it cannot influence or modify the way features are defined. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.3">Logistic regression is a type of regression model where the dependent variable has a limited number of possible values based on the independent variable, unlike linear regression. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.4">So, for example, if that model was provided with a caesarean patient's report instead of the brain tumor patient's report, it would surely fail to predict the correct outcome, as the given features would never match with the trained data.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">These dependencies of the machine learning systems on the representation of the data are not really unknown to us! </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">In fact, most of our computer theory performs better based on how the data are represented. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.3">For example, the quality of a database is considered based on how the schema is designed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.4">The execution of any database query, even on a thousand or a million lines of data, becomes extremely fast if the table is indexed properly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.5">Therefore, the dependency of the data representation of the AI systems should not surprise us.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">There are many such examples in daily life too, where the representation of the data decides our efficiency. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.2">To locate a person amidst 20 people is obviously easier than to locate the same person in a crowd of 500 people. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.3">A visual representation of two different types of data representation is shown in the preceding </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">Figure 1.1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Therefore, if the AI systems are fed with the appropriate featured data, even the hardest problems could be resolved. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">However, collecting and feeding the desired data in the correct way to the system has been a serious impediment for the computer programmer.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">There can be numerous real-time scenarios where extracting the features could be a cumbersome task. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.2">Therefore, the way the data are represented decides the prime factors in the intelligence of the system.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note3"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">Finding cats amidst a group of humans and cats can be extremely complicated if the features are not appropriate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.2">We know that cats have tails; therefore, we might like to detect the presence of tails as a prominent feature. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.3">However, given the different tail shapes and sizes, it is often difficult to describe exactly how a tail will look like in terms of pixel values! </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.4">Moreover, tails could sometimes be confused with the hands of humans. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.5">Also, overlapping of some objects could omit the presence of a cat's tail, making the image even more complicated.</span></p></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">From all the above discussions, it can be concluded that the success of AI systems depends mainly on how the data are represented. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.2">Also, various representations can ensnare and cache the different explanatory factors of all the disparities behind the data.</span></p><p>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">Representation learning</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"> is one of the most popular and widely practiced learning approaches used to cope with these specific problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">Learning the representations of the next layer from the existing representation of data can be defined as representation learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.3">Ideally, all representation learning algorithms have this advantage of learning representations, which capture the underlying factors, a subset that might be applicable for each particular sub-task. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.4">A simple illustration is given in the following </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Figure 1.2</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1"><img src="graphics/B05883_01_02.jpg" alt="Introduction to Deep Learning"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">Figure 1.2: The figure illustrates representation learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.2">The middle layers are able to discover the explanatory factors (hidden layers, in blue rectangular boxes). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.3">Some of the factors explain each task's target, whereas some explain the inputs</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">However, dealing with extracting some high-level data and features from a massive amount of raw data, which requires some sort of human-level understanding, has shown its limitations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.2">There can be many such examples:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">Differentiating the cry of two similar age babies.</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">Identifying the image of a cat's eye at both day and night time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.2">This becomes clumsy, because a cat's eyes glow at night unlike during the daytime.</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">In all these preceding edge cases, representation learning does not appear to behave exceptionally, and shows deterrent behavior.</span></p><p>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Deep learning</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">, a sub-field of machine learning, can rectify this major problem of representation learning by building multiple levels of representations or learning a hierarchy of features from a series of other simple representations and features [2] [8].</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1"><img src="graphics/B05883_01_03.jpg" alt="Introduction to Deep Learning"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">Figure 1.3: The figure shows how a deep learning system can represent the human image by identifying various combinations such as corners and contours, which can be defined in terms of edges. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.2">Image reprinted with permission from Ian Goodfellow, Yoshua Bengio, and Aaron Courville, Deep Learning, published by The MIT Press</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">The preceding </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">Figure 1.3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1"> shows an illustration of a deep learning model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.2">It is generally a cumbersome task for the computer to decode the meaning of raw unstructured input data, as represented by this image, as a collection of different pixel values. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.3">A mapping function, which will convert the group of pixels to identify the image, is ideally difficult to achieve. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.4">Also, to directly train the computer for these kinds of mapping is almost insuperable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.5">For these types of tasks, deep learning resolves the difficulty by creating a series of subsets of mappings to reach the desired output. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.6">Each subset of mappings corresponds to a different set of layer of the model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.7">The input contains the variables that one can observe, and hence , are represented in the visible layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.8">From the given input we can incrementally extract the abstract features of the data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.9">As these values are not available or visible in the given data, these layers are termed as hidden layers.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">In the image, from the first layer of data, the edges can easily be identified just by a comparative study of the neighboring pixels. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.2">The second hidden layer can distinguish the corners and contours from the first hidden layer's description of the edges. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.3">From this second hidden layer, which describes the corners and contours, the third hidden layer can identify the different parts of the specific objects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.4">Ultimately, the different objects present in the image can be distinctly detected from the third layer.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">Deep learning started its journey exclusively in 2006, </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">Hinton et al.</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1"> in 2006[2]; also </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">Bengio et al.</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1"> in 2007[3] initially focused on the MNIST digit classification problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.2">In the last few years, deep learning has seen major transitions from digits to object recognition in natural images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.3">Apart from this, one of the major breakthroughs was achieved by </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">Krizhevsky et al.</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1"> in 2012 [4] using the ImageNet dataset.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">The scope of this book is mainly limited to deep learning, so before diving into it directly, the necessary definitions of deep learning should be discussed.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">Many researchers have defined deep learning in many ways, and hence, in the last 10 years, it has gone through many definitions too! </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.2">The following are few of the widely accepted definitions:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">As noted by GitHub, deep learning is a new area of machine learning research, which has been introduced with the objective of moving machine learning closer to one of its original goals: Artificial Intelligence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.2">Deep learning is about learning multiple levels of representation and abstraction, which help to make sense of data such as images, sounds, and texts.</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">As recently updated by Wikipedia, deep learning is a branch of machine learning based on a set of algorithms that attempt to model high-level abstractions in the data by using a deep graph with multiple processing layers, composed of multiple linear and non-linear transformations.</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">As the definitions suggest, deep learning can also be considered as a special type of machine learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.2">Deep learning has achieved immense popularity in the field of data science with its ability to learn complex representation from various simple features. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.3">To have an in-depth grip on deep learning, we have listed out a few terminologies which will be frequently used in the upcoming chapters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.4">The next topic of this chapter will help you to lay a foundation for deep learning by providing various terminologies and important networks used for deep learning.</span></p><div class="section" title="Getting started with deep learning"><div class="titlepage"><div><div><h1 class="title"><a id="ch01lvl1sec7"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">Getting started with deep learning</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">To understand the journey of deep learning in this book, one must know all the terminologies and basic concepts of machine learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.2">However, if you already have enough insight into machine learning and related terms, you should feel free to ignore this section and jump to the next topic of this chapter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.3">Readers who are enthusiastic about data science, and want to learn machine learning thoroughly, can follow </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">Machine Learning</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1"> by Tom M. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.2">Mitchell (1997) [5] and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">Machine Learning: a Probabilistic Perspective</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1"> (2012) [6].</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note4"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">Neural networks do not perform miracles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.2">But, used sensibly, they can produce some amazing results.</span></p></div></div><div class="section" title="Deep feed-forward networks"><div class="titlepage"><div><div><h2 class="title"><a id="ch01lvl2sec6"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">Deep feed-forward networks</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">Neural networks can be recurrent as well as feed-forward. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.2">Feed-forward networks do not have any loop associated in their graph, and are arranged in a set of layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.3">A network with many layers is said to be a deep network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.4">In simple words, any neural network with two or more layers (hidden) is defined as a </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">deep feed-forward network</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1"> or </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">feed-forward neural</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1"> network. </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">Figure 1.4</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1"> shows a generic representation of a deep feed-forward neural network.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">Deep feed-forward networks work on the principle that with an increase in depth, the network can also execute more sequential instructions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.2">Instructions in sequence can offer great power, as these instructions can point to the earlier instruction.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">The aim of a feed-forward network is to generalize some function </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">f</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.2">For example, classifier </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">y=f(x) </span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">maps from input </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">x</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1"> to category </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">y</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.2">A deep feed-forward network modified the mapping, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">y=f(x; α)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">, and learns the value of the parameter </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">α</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">, which gives the most appropriate value of the function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.2">The following </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">Figure 1.4</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1"> shows a simple representation of the deep-forward network, to provide the architectural difference with the traditional neural network.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note5"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">A deep neural network is a feed-forward network with many hidden layers.</span></p></div></div><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1"><img src="graphics/B05883_01_04-1.jpg" alt="Deep feed-forward networks"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">Figure 1.4: Figure shows the representation of a shallow and deep feed-forward network</span></p></div><div class="section" title="Various learning algorithms"><div class="titlepage"><div><div><h2 class="title"><a id="ch01lvl2sec7"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">Various learning algorithms</span></h2></div></div></div><p>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">Datasets</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1"> are considered to be the building blocks of a learning process. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.2">A dataset can be defined as a collection of interrelated sets of data, which is comprised of separate entities, but which can be used as a single entity depending on the use-case. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.3">The individual data elements of a dataset are called </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">data points</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">The following </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">Figure 1.5</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1"> gives the visual representation of the various data points collected from a social network analysis:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1"><img src="graphics/image_01_005.jpg" alt="Various learning algorithms"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">Figure 1.5: Image shows the scattered data points of social network analysis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.2">Image sourced from Wikipedia</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">Unlabeled data</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">: This part of data consists of the human-generated objects, which can be easily obtained from the surroundings. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.2">Some of the examples are X-rays, log file data, news articles, speech, videos, tweets, and so on.</span></li><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">Labelled data</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">: Labelled data are normalized data from a set of unlabeled data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.2">These types of data are usually well formatted, classified, tagged, and easily understandable by human beings for further processing.</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">From the top-level understanding, machine learning techniques can be classified as supervised and unsupervised learning, based on how their learning process is carried out.</span></p><div class="section" title="Unsupervised learning"><div class="titlepage"><div><div><h3 class="title"><a id="ch01lvl3sec0"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">Unsupervised learning</span></h3></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">In unsupervised learning algorithms, there is no desired output from the given input datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.2">The system learns meaningful properties and features from its experience during the analysis of the dataset. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.3">In deep learning, the system generally tries to learn from the whole probability distribution of the data points. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.4">There are various types of unsupervised learning algorithms, which perform clustering. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.5">To explain in simple words, clustering means separating the data points among clusters of similar types of data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.6">However, with this type of learning, there is no feedback based on the final output, that is, there won't be any teacher to correct you! </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">Figure 1.6</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1"> shows a basic overview of unsupervised clustering:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1"><img src="graphics/image_01_006.jpg" alt="Unsupervised learning"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">Figure 1.6: Figures shows a simple representation of unsupervised clustering</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">A real life example of an unsupervised clustering algorithm is Google News. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.2">When we open a topic under Google News, it shows us a number of hyper-links redirecting to several pages. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.3">Each of these topics can be considered as a cluster of hyper-links that point to independent links.</span></p></div><div class="section" title="Supervised learning"><div class="titlepage"><div><div><h3 class="title"><a id="ch01lvl3sec1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">Supervised learning</span></h3></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">In supervised learning, unlike unsupervised learning, there is an expected output associated with every step of the experience. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.2">The system is given a dataset, and it already knows how the desired output will look, along with the correct relationship between the input and output of every associated layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.3">This type of learning is often used for classification problems.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">The following visual representation is given in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">Figure 1.7</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1"><img src="graphics/image_01_007.jpg" alt="Supervised learning"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">Figure 1.7: Figure shows the classification of data based on supervised learning</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">Real-life examples of supervised learning include face detection, face recognition, and so on.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">Although supervised and unsupervised learning look like different identities, they are often connected to each other by various means. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.2">Hence, the fine line between these two learnings is often hazy to the student fraternity.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">The preceding statement can be formulated with the following mathematical expression:</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">The general product rule of probability states that for an </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">n</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1"> number of datasets n ε ℝ</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">t</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">,the joint distribution can be fragmented as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1"><img src="graphics/Capture.jpg" alt="Supervised learning"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">The distribution signifies that the appeared unsupervised problem can be resolved by </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">t</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1"> number of supervised problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.2">Apart from this, the conditional probability of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">p (k | n)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">, which is a supervised problem, can be solved using unsupervised learning algorithms to experience the joint distribution of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">p (n, k)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">.</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1"><img src="graphics/B05883_01_18.jpg" alt="Supervised learning"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">Although these two types are not completely separate identities, they often help to classify the machine learning and deep learning algorithms based on the operations performed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.2">In generic terms, cluster formation, identifying the density of a population based on similarity, and so on are termed as unsupervised learning, whereas structured formatted output, regression, classification, and so on are recognized as supervised learning.</span></p></div><div class="section" title="Semi-supervised learning"><div class="titlepage"><div><div><h3 class="title"><a id="ch01lvl3sec2"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">Semi-supervised learning</span></h3></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">As the name suggests, in this type of learning both labelled and unlabeled data are used during the training. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.2">It's a class of supervised learning which uses a vast amount of unlabeled data during training.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">For example, semi-supervised learning is used in a Deep belief network (explained later), a type of deep network where some layers learn the structure of the data (unsupervised), whereas one layer learns how to classify the data (supervised learning).</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">In semi-supervised learning, unlabeled data from </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">p (n)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1"> and labelled data from </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">p (n, k)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1"> are used to predict the probability of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">k</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">, given the probability of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">n</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">, or </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">p (k | n).</span></em></span>
</p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1"><img src="graphics/image_01_010.jpg" alt="Semi-supervised learning"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">Figure 1.8: Figure shows the impact of a large amount of unlabelled data during the semi-supervised learning technique. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.2">Figure obtained from Wikipedia</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">In the preceding </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">Figure 1.8</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">, at the top it shows the decision boundary that the model uses after distinguishing the white and black circles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.2">The figure at the bottom displays another decision boundary, which the model embraces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.3">In that dataset, in addition to two different categories of circles, a collection of unlabeled data (grey circle) is also annexed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.4">This type of training can be viewed as creating the cluster, and then marking those with the labelled data, which moves the decision boundary away from the high-density data region.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">The preceding </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">Figure 1.8</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1"> depicts the illustration of semi-supervised learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.2">You can refer to </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">Chapelle et al.'s</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1"> book [7] to know more about semi-supervised learning methods.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">So, as you have already got a foundation in what Artificial Intelligence, machine learning, and representation learning are, we can now move our entire focus to elaborate on deep learning with further description.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">From the previously mentioned definitions of deep learning, two major characteristics of deep learning can be pointed out, as follows:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">A way of experiencing unsupervised and supervised learning of the feature representation through successive knowledge from subsequent abstract layers</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">A model comprising of multiple abstract stages of non-linear information processing</span></li></ul></div></div></div></div></div></div></div></body></html>
