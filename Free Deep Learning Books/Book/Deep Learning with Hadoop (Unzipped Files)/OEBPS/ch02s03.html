</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Distributed deep learning and Hadoop"><div class="titlepage"><div><div><h1 class="title"><a id="ch02lvl1sec14"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Distributed deep learning and Hadoop</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">From the earlier sections of this chapter, we already have enough insights on why and how the relationship of deep learning and big data can bring major changes to the research community. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Also, a centralized system is not going to help this relationship substantially with the course of time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Hence, distribution of the deep learning network across multiple servers has become the primary goal of the current deep learning practitioners. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">However, dealing with big data in a distributed environment is always associated with several challenges. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">Most of those are explained in-depth in the previous section. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.6">These include dealing with higher dimensional data, data with too many features, amount of memory available to store, processing the massive Big datasets, and so on. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.7">Moreover, Big datasets have a high computational resource demand on CPU and memory time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.8">So, the reduction of processing time has become an extremely significant criterion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.9">The following are the central and primary challenges in distributed deep learning:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">How can we keep chunks of dataset in the primary memory of the nodes?</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">How can we maintain coordination among the chunks of data, so that later they can be moved together to result in the final outcome?</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">How can we make distributed and parallel processing extremely scheduled and coordinated?</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">How can we achieve an orchestral search process across the dataset to achieve high performance?</span></li></ul></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">There are multiple ways of using distributed deep learning with big datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">However, when we talk about big data, the framework that is performing tremendously well in defending most of the challenges from the past half decade is the Hadoop framework [77-80]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.3">Hadoop allows for parallel and distributed processing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.4">It is undoubtedly the most popular and widely used framework, and it can store and process the data mountain more efficiently compared to the other traditional frameworks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.5">Almost all the major technology companies, such as Google, Facebook, and so on use Hadoop to deploy and process their data in a sophisticated fashion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.6">Most of the software designed at Google, which requires the use of an ocean of data, uses Hadoop. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.7">The primary advantage of Hadoop is the way it stores and processes enormous amount of data across thousands of commodity servers, bringing some well-organized results [81]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.8">From our general understanding of deep learning, we can relate that deep learning surely needs that sort of distributed computing power to produce some wondrous outcomes from the input data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.9">The Big dataset can be split into chunks and distributed across multiple commodity hardware for parallel training. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.10">Further more, the complete stage of a deep neural network can be split into subtasks, and then those subtasks can be processed in parallel.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note10"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Hadoop has turned out to be the point of convergence for all the data lakes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">The need to shif deep learning to the data, which is already residing in Hadoop, has become quintessential.</span></p></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Hadoop operates on the concept that </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">moving computation is cheaper than moving data</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1"> [86] [87]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">Hadoop allows for the distributed processing of large-scale datasets across clusters of commodity servers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.3">It also provides efficient load balancing, has a very high degree of fault tolerance, and is highly horizontally scalable with minimal effort. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.4">It can detect and tolerate failures in the application layers, and hence, is suitable for running on commodity hardware. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.5">To achieve the high availability of data, Hadoop, by default, keeps a replication factor of three, with a copy of each block placed on two other separate machines. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.6">So, if a node fails, the recovery can be done instantly from the other two nodes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.7">The replication factor of Hadoop can be easily increased based on how valuable the data is and other associated requirements on the data.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Hadoop was initially built mainly for processing the batch tasks, so it is mostly suitable for deep learning networks, where the main task is to find the classification of large-scale data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">The selection of features to learn how to classify the data is mainly done on a large batch of datasets.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Hadoop is extremely configurable, and can easily be optimized as per the user's requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">For example, if a user wants to keep more replicas of the data for better reliability, he can increase the replication factor. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.3">However, an increase in the number of replicas will eventually increase the storage requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.4">Here we will not be explaining more about the features and configuration of data, rather we will mostly discuss the part of Hadoop which will be used extensively in distributed deep neural networks.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">In the new version of Hadoop, the parts which we will mainly use in this book are HDFS, Map-Reduce, and </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Yet Another Resource Negotiator</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">YARN</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">YARN has already dominated Hadoop's Map-Reduce (explained in the next part) in a large manner. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.3">YARN currently has the responsibility to assign the works to the Data nodes (data server) of Hadoop. </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Hadoop Distributed File System</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">HDFS</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">), on the other hand, is a distributed file system, which is distributed across all the Data nodes under a centralized meta-data server called NameNode. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.2">To achieve high-availability, in the later version, a secondary NameNode was integrated to Hadoop framework, the purpose of which is to have a copy of the metadata from primary NameNode after certain checkpoints.</span></p><div class="section" title="Map-Reduce"><div class="titlepage"><div><div><h2 class="title"><a id="ch02lvl2sec15"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Map-Reduce</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">The Map-Reduce paradigm [83] is a distributed programming model developed by Google in 2004, and is associated with processing huge datasets with a parallel and distributed algorithm on a cluster of machines. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">The entire Map-Reduce application is useful with large-scale datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.3">Basically, it has two primary components, one is called Map and the other is called Reduce, along with a few intermediate stages like shuffling, sorting and partitioning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.4">In the map phase, the large input job is broken down into smaller ones, and each of the jobs is distributed to different cores. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.5">The operation(s) are then carried out on every small job placed on those machines. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.6">The Reduce phase accommodates all the scattered and transformed output into one single dataset.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Explaining the concept of Map-Reduce in detail is beyond the scope of this chapter; interested readers can go through </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">"Map-Reduce: Simplified data processing on large clusters</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">" [83] to get an in-depth knowledge of this.</span></p></div><div class="section" title="Iterative Map-Reduce"><div class="titlepage"><div><div><h2 class="title"><a id="ch02lvl2sec16"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Iterative Map-Reduce</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">The deep learning algorithms are iterative in nature - the models learn from the optimization algorithms, which go through multiple steps so that it leads to a point of minimal error. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">For these kinds of models the Map-Reduce application does not seem to work as efficiently as it does for other use-cases.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">Iterative Map-Reduce, a next generation YARN framework (unlike the traditional Map-Reduce) does multiple iterations on the data, which passes through only once. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">Although the architecture of Iterative Map-Reduce and Map-Reduce is dissimilar in design, the high level of understanding of both the architectures is simple. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.3">Iterative Map-Reduce is nothing but a sequence of Map-Reduce operations, where the output of the first Map-Reduce operation becomes the input to the next operation and so on. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.4">In the case of deep learning models, the map phase places all the operations of a particular iteration on each node of the distributed systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.5">It then distributes that massive input dataset to all the machines in the cluster. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.6">The training of the models is performed on each node of the cluster.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">Before sending the aggregated new model back to each of the machines, the reduce phase takes all the outputs collected from the map phase and calculates the average of the parameters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.2">The same operations are iterated over and over again by the Iterative Reduce algorithm until the learning process completes and the errors minimize to almost zero.</span></p><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">Figure 2.4</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1"> compares the high-level functionalities of the two methods. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">The left image shows the block diagram of Map-Reduce, while on the right, we have the close-up of Iterative Map-Reduce. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.3">Each 'Processor' is a working deep network, which is learning on small chunks of the larger dataset. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.4">In the 'Superstep' phase, the averaging of the parameters is done before the entire model is redistributed to the whole cluster as shown in the following diagram:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1"><img src="graphics/B05883_02_04.jpg" alt="Iterative Map-Reduce"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Figure 2.4: Difference of functionalities in Map-Reduce and parallel iterative reduce</span></p></div><div class="section" title="Yet Another Resource Negotiator (YARN)"><div class="titlepage"><div><div><h2 class="title"><a id="ch02lvl2sec17"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">Yet Another Resource Negotiator (YARN)</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">The primary idea of YARN is to dissociate job scheduling and resource management from the data processing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.2">So the data can continue to process in the system in parallel with the Map-Reduce batch jobs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.3">YARN possesses a central resource manager, which mostly manages the Hadoop system resources according to the need. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.4">The node manager (specific to nodes) is responsible for managing and monitoring the processing of individual nodes of the cluster. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.5">This processing is dedicatedly controlled by an ApplicationMaster, which monitors the resources from the central resource manager, and works with the node manager to monitor and execute the tasks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.6">The following figure gives an overview of the architecture of YARN:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1"><img src="graphics/B05883_02_05-1.jpg" alt="Yet Another Resource Negotiator (YARN)"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">Figure 2.5: An overview of the high-level architecture of YARN</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">All these components of Hadoop are primarily used in distributed deep learning to overcome all the challenges stated earlier. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.2">The following subsection shows the criteria that need to be satisfied for better performance of distributed deep learning.</span></p></div><div class="section" title="Important characteristics for distributed deep learning design"><div class="titlepage"><div><div><h2 class="title"><a id="ch02lvl2sec18"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">Important characteristics for distributed deep learning design</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">the following are the important characteristics of distributed deep learning design:</span></p><div class="orderedlist"><ol class="orderedlist arabic"><li class="listitem"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Small batch processing</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">: In distributed deep learning, the network must intake and process data quickly in parallel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">To process and provide results more accurately, every node of the cluster should receive small chunks of data of approximately 10 elements at a time.</span><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">For example, say the master node of YARN is coordinating 20 worker nodes for a Big dataset of 200 GB. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.2">The master node will split the dataset into 10 GB of 20 small batches of data, allocating one small batch to each worker. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.3">The workers will process the data in parallel, and send the results back to the master as soon as it finishes the computing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.4">All these outcomes will be aggregated by the master node, and the average of the results will be finally redistributed to the individual workers.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">Deep learning networks perform well with small batches of nearly 10, rather than working with 100 or 200 large batches of data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.2">Small batches of data empower the networks to learn from different orientations of the data in-depth, which later on recompiles to give a broader knowledge to the model.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">On the other hand, if the batch size is too large, the network tries to learn quickly, which maximizes the errors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.2">Conversly, smaller batch size slows down the speed of learning, and results in the possibility of divergence as the network approaches towards the minimum error rate.</span></p></li><li class="listitem"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Parameter Averaging</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">: Parameter averaging is a crucial operation for the training of distributed deep network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.2">In a network, parameters are generally the weight and biases of the node layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.3">As mentioned in the small batch processing section, once training is completed for several workers, they will pass different sets of parameters back to the master. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.4">With every iteration, the parameters are averaged, updated, and sent back to the master for further operations.</span><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">The sequential process of parameter averaging can be outlined as follows:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">The master configures the initial network and sets the different hyperparameters</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">Based on the configuration of the training master, the Big dataset is split into chunks of several smaller datasets</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">For each split of the training dataset, until the error rate approaches towards zero, perform the following:</span><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">The master distributes the parameter from the master to each individual worker</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Each worker starts the training of the model with its dedicated chunk of dataset</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">The average of the parameters is calculated and returned back to the master.</span></li></ul></div></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">The training completes, and the master will have one copy of the training network</span></li></ul></div></li><li class="listitem"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">Parameter averaging offers the following two important advantages in case of distributed training:</span><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">It enables parallelism by generating simultaneous results.</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">It helps to prevent over-fitting by distributing the given dataset into multiple datasets of smaller sizes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.2">The network then learns the average result, rather than just aggregating the results from different smaller batches.</span></li></ul></div></li></ol></div><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">Figure 2.6</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1"> shows a combined diagrammatic overview of the small batch processing and parameter averaging operation:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1"><img src="graphics/B05883_02_06-1.jpg" alt="Important characteristics for distributed deep learning design"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">Figure 2.6: Figure shows the high level architecture of a distributed deep learning architecture</span></p></div></div></div></div></body></html>
