</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Recurrent neural networks(RNNs)"><div class="titlepage"><div><div><h1 class="title"><a id="ch04lvl1sec25"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Recurrent neural networks(RNNs)</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">In this section, we will discuss the architecture of the RNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">We will talk about how time is unfolded for the recurrence relation, and used to perform the computation in RNNs.</span></p><div class="section" title="Unfolding recurrent computations"><div class="titlepage"><div><div><h2 class="title"><a id="ch04lvl2sec37"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Unfolding recurrent computations</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">This section will explain how unfolding a recurrent relation results in sharing of parameters across a deep network structure, and converts it into a computational model.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Let us consider a simple recurrent form of a dynamical system:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"><img src="graphics/image_04_002-1.jpg" alt="Unfolding recurrent computations"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">In the preceding equation, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">s </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">(t)</span></sup></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"> represents the state of the system at time </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">t</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">, and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">θ</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1"> is the same parameter shared across all the iterations.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">This equation is called a recurrent equation, as the computation of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">s </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">(t)</span></sup></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1"> requires the value returned by </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">s </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">(t-1)</span></sup></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">, the value of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">s </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">(t-1)</span></sup></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1"> will require the value of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">s </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">(t-2)</span></sup></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">, and so on.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">This is a simple representation of a dynamic system for understanding purpose. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">Let us take one more example, where the dynamic system is driven by an external signal </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">x </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">(t)</span></sup></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">, and produces output </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">y </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">(t)</span></sup></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1"><img src="graphics/image_04_003-1.jpg" alt="Unfolding recurrent computations"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">RNNs, ideally, follow the second type of equation, where the intermediate state retains the information about the whole past sequence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.2">However, any equation that involves recurrence can be used to model the RNN.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">Therefore, similar to the feed-forward neural networks, the state of the hidden (intermediate) layers of RNNs can be defined using the variable </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">h</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1"> at time </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">t</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">, as follows:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1"><img src="graphics/image_04_004-1.jpg" alt="Unfolding recurrent computations"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">We will explain the functionality of this preceding equation in a RNN in the next part of this section. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">As of now, to illustrate the functionality of this hidden layer, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Figure 4.2</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"> shows a simple recurrent network with no output. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">The left side of the figure shows a network whose current state influences the next state. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.3">The box in the middle of the loop represents the delay between two successive time steps.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">As shown in the preceding recurrent equation, we can unfold or unroll the hidden states in time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.2">The right side of the image shows the unfolded structure of the recurrent network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.3">There, the network can be converted to a feed-forward network by unfolding over time.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">In an unfolded network, each variable for each time step can be shown as a separate node of the network.</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1"><img src="graphics/image_04_005.jpg" alt="Unfolding recurrent computations"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Figure 4.2: The left part of the figure shows the recurrent network where the information passes through multiple times through the hidden layer with each time step. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">On the right, we have the unfolded structure of the same network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.3">Each node of this network is associated with one timestamp.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">So, from </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Figure 4.2</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">, the unfolding operation can be defined as an operation that performs the mapping of the circuit on the left-hand side to a computational model split into multiple states on the right-hand side.</span></p><div class="section" title="Advantages of a model unfolded in time"><div class="titlepage"><div><div><h3 class="title"><a id="ch04lvl3sec15"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">Advantages of a model unfolded in time</span></h3></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">Unfolding a network in time provides a few major advantages, which are listed as follows:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">A model without a parameter would require many training examples for learning purposes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">However, learning a shared single model helps to generalize the sequence lengths, even those that are not present in the training set. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.3">This allows the model to estimate the upcoming sequence data with fewer training examples.</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Irrespective of the length of the sequence, the input size of the model will always remain the same. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.2">The input size in an unfolded model is specified in terms of transition from the hidden state to the other. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.3">However, for other cases, it is specified in terms of undefined length of the history of states.</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">Due to parameter sharing, the same transition function </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">f</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">, with the same parameter can be used at every time step.</span></li></ul></div></div></div><div class="section" title="Memory of RNNs"><div class="titlepage"><div><div><h2 class="title"><a id="ch04lvl2sec38"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">Memory of RNNs</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">As of now, you might have got some idea that the primary difference between a feed forward neural network and recurrent network is the feedback loop. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.2">The feedback loop is ingested into its own intermediate outcome as the input to the next state. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.3">The same task is performed for every element of the input sequence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.4">Hence, the output of each hidden state depends on the previous computations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.5">In a practical situation, each hidden state is not only concerned about the current input sequence in action, but also about what they perceived one step back in time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.6">So, ideally, every hidden state must have all the information of the previous step's outcome.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">Due to this requirement of persistent information, it is said that RNNs have their </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">own memory</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.2">The sequential information is preserved as memory in the recurrent network's hidden state. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.3">This helps to handle the upcoming time steps as the network cascades forward to update the processing with each new sequence.</span></p><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">Figure 4.3</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1"> shows the concept of </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">simple recurrent neural networks</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1"> proposed by Elman back in 1990 [112]; it shows the illustration of persistent memory for a RNN.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">In the next figure, a part of the word sequence AYSXWQF at the bottom represents the input example currently under consideration. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.2">Each box of this input example represents a pool of units. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.3">The forward arrow shows the complete set of trainable mapping from each sending input unit to each output unit for the next time step. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.4">The context unit, which can be considered as the persistent memory unit, preserves the output of the previous steps. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.5">The backward arrow, directed from the hidden layer to the context unit shows a copy operation of the output, used for evaluating the outcome for the next time step.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">The decision where a RNN reaches at time step </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">t</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">, depends mostly on its last decision of the time step at </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">(t-1)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.2">Therefore, it can be inferred that unlike traditional neural networks, RNNs have two sources of input.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">One is the current input unit under consideration, which is </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">X</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1"> in the following figure, and the other one is the information received from the recent past, which is taken from the context units in the figure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.2">The two sources, in combination, decide the output of the current time step. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.3">More about this will be discussed in the next section.</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1"><img src="graphics/image_04_006.jpg" alt="Memory of RNNs"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">Figure 4.3: A simple recurrent neural networks with the concept of memory of RNN is shown in this figure.</span></p></div><div class="section" title="Architecture"><div class="titlepage"><div><div><h2 class="title"><a id="ch04lvl2sec39"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">Architecture</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">So, we have come to know that RNNs have their memory, which collects information about what has been computed so far. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.2">In this section, we will discuss the general architecture of RNNs and their functioning.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">A typical RNN, unfolded (or unrolled) at the time of the calculation involved in its forward computation is shown in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">Figure 4.4</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">Unrolling or unfolding a network means to write out the network for the complete sequences of input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.2">Let us take an example before we start explaining the architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.3">If we have a sequence of 10 words, the RNN would then be unfolded into a 10-layer deep neural network, one layer for each word, as depicted by the following diagram:</span></p><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1"><img src="graphics/image_04_007.jpg" alt="Architecture"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">Figure 4.4: The figure shows a RNN being unrolled or unfolded into a full network.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">The time period to reach from input </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">x</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1"> to output </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">o</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1"> is split into several timestamps given by </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">(t-1)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">t</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">(t+1)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">, and so on.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">The computational steps and formulae for an RNN are listed as follows:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">In the preceding figure, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">x</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">t</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1"> is the input at time step </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">t</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.2">The figure shows computations for three timestamps </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">(t-1)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">t</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">, and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">(t+1)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">, where the inputs are </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">x</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">(t-1)</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">x</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">t</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">, and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">x</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">(t+1)</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">,</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1"> respectively. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.2">For example, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">x</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">1</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1"> and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">x</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">2</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1"> are the vectors that correspond to the second and third word of the sequence.</span></li><li class="listitem" style="list-style-type: disc"><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">s</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">t</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1"> represents the hidden state at time step </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">t</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.2">Conceptually, this state defines the memory of the neural network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.3">Mathematically, the formulation for </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">s</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">t</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1"> or the process of carrying memory can be written as follows:</span></li></ul></div><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1"><img src="graphics/image_04_008-1.jpg" alt="Architecture"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">So, the hidden state is a function of the input at time step </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">x</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">t</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">, multiplied by the weight </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">U</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">, and addition of the hidden state of the last time step </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">s</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">t-1</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">, which is multiplied by its own hidden-state-to-hidden-state matrix </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">W</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.2">This hidden-state-to-hidden-state is often termed as a transition matrix, and is similar to a Markov chain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.3">The weight matrices behave as filters, which primarily decide the importance of both, the past hidden state and the current input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.4">The error generated for the current state would be sent back via backpropagation to update these weights until the error is minimized to the desired value.</span></p><div class="note" title="Note" style=""><div class="inner"><h3 class="title"><a id="note17"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">Note</span></h3><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">To calculate the first hidden state, we would require determining the value </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">s-1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">, which is generally initialized to all zeroes.</span></p></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">Unlike a traditional deep neural network, where different parameters are used for the computation at each layer, a RNN shares the same parameters (here, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">U</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">V</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">, and </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">W</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">) across all the time steps to calculate the value of the hidden layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.2">This makes the life of a neural network much easier, as we need to learn fewer number of parameters.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">This sum of the weight input and hidden state is squeezed by the function </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">f</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">, which usually is a nonlinearity such as a logistic sigmoid function, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">tan h</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">, or ReLU:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">In the last figure, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">o</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">t</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1"> is represented as the output at time step t. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.2">The output at step </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">o</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">t</span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1"> is solely computed based on the memory available for the network at time t. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.2">Theoretically, although RNNs can persist memory for arbitrarily long sequences, in practice, it's a bit complicated, and they are limited to looking back only a few time steps. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.3">Mathematically, this can be represented as follows:</span></li></ul></div><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1"><img src="graphics/image_04_009-1.jpg" alt="Architecture"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">The next section shall discuss how to train a RNN through back propagation.</span></p></div></div></div></div></body></html>
