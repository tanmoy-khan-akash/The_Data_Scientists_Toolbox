</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="chapter" title="Chapter 4. Recurrent Neural Network"><div class="titlepage"><div><div><h1 class="title"><a id="ch04"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Chapter 4. Recurrent Neural Network</span></h1></div></div></div><div class="blockquote"><table border="0" width="100%" cellspacing="0" cellpadding="0" class="blockquote" summary="Block quote"><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1"> </span></td><td valign="top"><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">I think the brain is essentially a computer and consciousness is like a computer program. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">It will cease to run when the computer is turned off. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">Theoretically, it could be re-created on a neural network, but that would be very difficult, as it would require all one's memories.</span></em></span>
</p></td><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> </span></td></tr><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> </span></td><td colspan="2" align="right" valign="top" style="text-align: center"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">--</span><span class="attribution"><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Stephen Hawking</span></em></span></span></td></tr></table></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">To solve every problem, people do not initiate their thinking process from scratch. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">Our thoughts are non-volatile, and it is persistent just like the </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Read Only Memory</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">ROM</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">) of a computer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">When we read an article, we understand the meaning of every word from our understanding of earlier words in the sentences.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Let us take a real life example to explain this context a bit more. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">Let us assume we want to make a classification based on the events happening at every point in a video. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.3">As we do not have the information of the earlier events of the video, it would be a cumbersome task for the traditional deep neural networks to find some distinguishing reasons to classify those. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.4">Traditional deep neural networks cannot perform this operation, and hence, it has been one of the major limitations for them.</span></p><p>
<span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Recurrent neural networks</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">RNN</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">) [103] are a special type of neural network, which provides many enigmatic solutions for these difficult machine learning and deep learning problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2">In the last chapter, we discussed convolutional neural networks, which is specialized in processing a set of values </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">X</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1"> (For example, an image). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">Similarly, RNNs are magical while processing a sequence of values, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">x (0)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">,</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1"> x (1)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">,</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">x(2)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">,</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">...</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">,</span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1"> x(τ-1)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">To start with RNNs in this chapter, let us first place this network next to convolutional neural networks so that you can get an idea of its basic functionalities, and to basically know about this network.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Convolutional neural networks can easily scale to images with large width, height, and depth. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">Moreover, some convolutional neural networks can also process images with variable sizes.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">In contrast, recurrent networks can readily scale to long sequences; also, most of those can also process variable length sequences. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">To process these arbitrary sequences of inputs, RNN uses their internal memory.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">RNNs generally operate on mini-batches of sequences, and contain vectors </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">x (t)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1"> with the time-step index </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">t</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"> ranging from </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">0</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1"> to </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">(τ-1)</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.2">The sequence length </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">τ</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1"> can also vary for each member of the mini-batch. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.2">This time-step index should not always refer to the time intervals in the real world, but can also point to the position inside the sequence.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">A RNN, when unfolded in time, can be seen as a deep neural network with indefinite number of layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">However, compared to common deep neural networks, the basic functionalities and architecture of RNNs are somewhat different. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.3">For RNNs, the main function of the layers is to bring in memory, and not hierarchical processing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.4">For other deep neural networks, the input is only provided in the first layer, and the output is produced at the final layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.5">However, in RNNs, the inputs are generally received at each time step, and the corresponding outputs are computed at those intervals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.6">With every network iteration, fresh information is integrated into every layer, and the network can go along with this information for an indefinite number of network updates. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.7">However, during the training phase, the recurrent weights need to learn which information they should pass onwards, and what they must reject. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.8">This feature generates the primary motivation for a special form of RNN, called </span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Long short-term memory</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"> (</span><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">LSTM</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">).</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">RNNs started its journey a few decades back [104], but recently, it has significantly become a popular choice for modeling sequences of variable length. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.2">As of now, RNN has been successfully implemented in various problems such as learning word embedding [105], language modelling [106] [107] [108], speech recognition [109], and online handwritten recognition [110].</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">In this chapter, we will discuss everything you need to know about RNN and the associated core components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">We will introduce Long short-term memory later in the chapter, which is a special type of RNN.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">The topic-wise organization of this chapter is as follows:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">What makes recurrent networks distinctive from others?</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">Recurrent neural networks(RNNs)</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">Backpropagation through time (BPTT)</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">Long short-term memory (LSTM)</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">Bi-directional RNNs</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Distributed deep RNNs</span></li><li class="listitem" style="list-style-type: disc"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">RNNs with Deeplearning4j</span></li></ul></div><div class="section" title="What makes recurrent networks distinctive from others?"><div class="titlepage"><div><div><h1 class="title"><a id="ch04lvl1sec24"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">What makes recurrent networks distinctive from others?</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">You might be curious to know the specialty of RNNs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.2">This section of the chapter will discuss these things, and from the next section onwards, we will talk about the building blocks of this type of network.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">From </span><a class="link" href="ch03.html" title="Chapter 3.  Convolutional Neural Network"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">
Chapter 3
</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">Convolutional Neural Network</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">, you have probably got a sense of the harsh limitation of convolutional networks and that their APIs are too constrained; the network can only take an input of a fixed-sized vector, and also generates a fixed-sized output. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.2">Moreover, these operations are performed through a predefined number of intermediate layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.3">The primary reason that makes RNNs distinctive from others is their ability to operate over long sequences of vectors, and produce different sequences of vectors as the output.</span></p><div class="blockquote"><table border="0" width="100%" cellspacing="0" cellpadding="0" class="blockquote" summary="Block quote"><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1"> </span></td><td valign="top"><p>
<span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">"If training vanilla neural nets is optimization over functions, training recurrent nets is optimization over programs"</span></em></span>
</p></td><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"> </span></td></tr><tr><td valign="top"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1"> </span></td><td colspan="2" align="right" valign="top" style="text-align: center"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">--</span><span class="attribution"><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">Alex Lebrun</span></em></span></span></td></tr></table></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">We show different types of input-output relationships of the neural networks in </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">Figure 4.1</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1"> to portray the differences. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.2">We show five types of input-output relations as follows:</span></p><div class="itemizedlist"><ul class="itemizedlist"><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">One to one</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">: This input-output relationship is for traditional neural network processing without the involvement of a RNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.2">Mostly used for image classification, where the mapping is from fixed-sized input to fixed-sized output.</span></li><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">One to many</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">: In this kind of relationship, the input and output maintain a one-to-many relationship. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.2">The model generates a sequence of outputs with one fixed-sized input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.3">Often observed where the model takes an image (image captioning), and produces a sentence of words.</span></li><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">Many to one</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">: In this type of relationship, the model takes a sequence of inputs, and outputs one single observation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.2">For example, in case of sentiment analysis, a sentence or reviews are provided to the model; it classifies the sentence as either a positive or negative sentiment.</span></li><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">Many to many (Variable intermedia states)</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">: The model receives a sequence of inputs, and a corresponding sequence of outputs are generated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.2">In this type, the RNN reads a sentence in English, and then translates and outputs a sentence in German. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.3">Used in case of Machine Translation.</span></li><li class="listitem" style="list-style-type: disc"><span class="strong"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">Many to many (Fixed number of intermedia state)</span></strong></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">: The model receives a synced sequence of input, and generates a sequence of outputs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.2">For example, in video classification, we might wish to classify every event of the movie.</span></li></ul></div><p>
</p><div class="mediaobject"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1"><img src="graphics/image_04_001.jpg" alt="What makes recurrent networks distinctive from others?"/></span></div><p>
</p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">Figure 4.1: The rectangles in the figure represent each element of the sequence vector, the arrows signify the functions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.2">Input vectors are shown in red, and output vectors are in blue. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.3">The green color represents the intermediate RNN's state. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.4">Image taken from [111].</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">Operations that involve sequences are generally more powerful and appealing than networks with fixed-sized inputs and outputs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.2">These models are used to build more intelligent systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.3">In the next sections, we will see how RNNs are built, and how the network unites the input vectors with their state vector with a defined function to generate a new state vector.</span></p></div></div></div></div></body></html>
