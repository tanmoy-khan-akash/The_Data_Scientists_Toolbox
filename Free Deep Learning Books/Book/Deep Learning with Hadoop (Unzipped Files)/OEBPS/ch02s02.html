</head><body id="page"><div xmlns="http://www.w3.org/1999/xhtml" id="book-columns"><div xmlns="http://www.w3.org/1999/xhtml" id="book-inner"><div class="section" title="Challenges of deep learning for big data"><div class="titlepage"><div><div><h1 class="title"><a id="ch02lvl1sec13"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Challenges of deep learning for big data</span></h1></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The potential of big data is certainly noteworthy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">However, to fully extract valuable information at this scale, we would require new innovations and promising algorithms to address many of these related technical problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">For example, to train the models, most of the traditional machine learning algorithms load the data in memory. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">But with a massive amount of data, this approach will surely not be feasible, as the system might run out of memory. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">To overcome all these gritty problems, and get the most out of the big data with the deep learning techniques, we will require brain storming.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Although, as discussed in the earlier section, large-scale deep learning has achieved many accomplishments in the past decade, this field is still in a growing phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">Big data is constantly raising limitations with its 4Vs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">Therefore, to tackle all of those, many more advancements in the models need to take place.</span></p><div class="section" title="Challenges of deep learning due to massive volumes of data (first V)"><div class="titlepage"><div><div><h2 class="title"><a id="ch02lvl2sec11"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Challenges of deep learning due to massive volumes of data (first V)</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">The volume of large-scale data imposes a great challenge to deep learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">With very high dimensionality (attributes), a large number of examples (input) and large varieties of classifications (outputs), big data often increases the complexity of the model, as well as the running-time complexity of the algorithm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.3">The mountain of data makes the training of deep learning algorithms almost impossible using centralized storage and its limited processing ability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.4">To provide a cushion to this challenge, pushed by the huge volume of data, distributed frameworks with parallelized servers should be used. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.5">The upgraded deep network models have started to use clusters of CPUs and GPUs to enhance the training speed, without compromising the algorithm's accuracy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.6">Various new strategies have been evolved for model parallelism and data parallelism.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">In these types, the models or data are split into blocks, which can fit with the in-memory data, and then be distributed to various nodes with forward and backward propagations [57]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">Deeplearning4j, a Java-based distributed tool for deep learning, uses data parallelism for this purpose, and will be explained in the next section.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">High volumes of data are always associated with noisy labels and data incompleteness. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">This poses a major challenge during the training of large-scale deep learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.3">A huge proportion of the big data is contained by the unlabeled or unstructured data, where the noisy labels predominantly exist. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.4">To overcome this issue, some manual curation of the datasets is required to a significant extent. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.5">For example, all the search engines are used to collect the data over the last one year span. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.6">For this data, we need some sort of filtering, particularly to remove redundancy and the low-value data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.7">Advanced deep learning methods are essential to handle such noisy, redundant data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.8">Also, the associated algorithms should be able to tolerate these disarray datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.9">One can also implement some more efficient cost function and updated training strategy to fully overcome the effect of noisy labels. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.10">Moreover, the use of semi-supervised learning [58] [59] could help to enhance the solution associated with this noisy data.</span></p></div><div class="section" title="Challenges of deep learning from a high variety of data (second V)"><div class="titlepage"><div><div><h2 class="title"><a id="ch02lvl2sec12"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Challenges of deep learning from a high variety of data (second V)</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">This is the second dimension of big data, which represents all types of formats, with different distributions and from numerous sources. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">The exponentially growing data come from heterogeneous sources, which include a mammoth collection of audio streams, images, videos, animations, graphics, and unstructured texts from various log files. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">These varieties of data possess different characteristics and behavior. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.4">Data integration could be the only way to deal with such situations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.5">As stated in </span><a class="link" href="ch01.html" title="Chapter 1. Introduction to Deep Learning"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">
Chapter 1
</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">, </span><span class="emphasis"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Introduction to Deep Learning</span></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">, deep learning has the ability to represent learning from structured/unstructured data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">Deep learning can carry out unsupervised learning in a hierarchical fashion, which is training performed one level at a time, and the higher level features are defined by the immediate lower levels. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.3">This property of deep learning can be used to address the data integration problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.4">The natural solution of this could be to learn the data representation from each individual data sources, and then integrate the learned features at the subsequent levels.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">There have already been a few experiments [60] [61], which have successfully demonstrated that deep learning can easily be used for the heterogeneous data sources for its significant gains in system performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">However, there are still many unanswered questions which deep learning has to address in the upcoming years. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.3">Currently, most of the deep learning models are mainly tested on bi-modalities (data from only two sources), but will the system performance be enhanced while dealing with multiple modalities? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.4">It might happen that multiple sources of data will offer conflicting information; in those cases, how will the model be able to nullify such conflicts and integrate the data in a constructive and fruitful way? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.5">Deep learning seems perfectly appropriate for the integration of various sources of data with multiple modalities, on account of its capability of learning intermediate representations and the underlying factors associated with a variety of data.</span></p></div><div class="section" title="Challenges of deep learning from a high velocity of data (third V)"><div class="titlepage"><div><div><h2 class="title"><a id="ch02lvl2sec13"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Challenges of deep learning from a high velocity of data (third V)</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">The extreme velocity at which data is growing poses an enormous challenge to the deep learning technique. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">For data analytics, data created at this speed should also be processed in a timely manner. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">Online learning is one of the solutions to learning from this high velocity data [62-65]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.4">However, online learning uses a sequential learning strategy, where the entire dataset should be kept in-memory, which becomes extremely difficult for traditional machines. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.5">Although the conventional neural network has been modified for online learning [67-71], there is still so much scope for progress in this field for deep learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.6">As an alternate approach to online learning, the stochastic gradient descent approach [72], [73] is also applied for deep learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.7">In this type, one training example with the known label is fed to the next label to update the model parameters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.8">Further, to speed up learning, the updates can also be performed on a small batch basis [74]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.9">This mini batch can provide a good balance between running time and the computer memory. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.10">In the next section, we will explain why mini batch data is most important for distributed deep learning.</span></p><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">One more big challenge related to this high velocity of data is that this data is extremely changeable in nature. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2">The distribution of data happens too frequently over time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.3">Ideally, the data that changes over time is split into chunks taken from small time durations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.4">The basic idea is that the data remains stationary for some time, and also possesses some major degree of correlation [75] [76]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.5">Therefore, the deep learning algorithms of big data should have the feature of learning the data as a stream. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.6">Algorithms which can learn from those non-stationary data are really crucial for deep learning.</span></p></div><div class="section" title="Challenges of deep learning to maintain the veracity of data (fourth V)"><div class="titlepage"><div><div><h2 class="title"><a id="ch02lvl2sec14"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Challenges of deep learning to maintain the veracity of data (fourth V)</span></h2></div></div></div><p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Data veracity, imprecise, or uncertain data, is sometime overlooked, though it is equally consequential as the other 3Vs of big data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">With the immense variety and velocity of big data, an organization can no longer rely on the traditional models to measure the accuracy of data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.3">Unstructured data, by definition, contains a huge amount of imprecise and uncertain data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.4">For example, social media data is excessively uncertain in nature. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.5">Although there are tools that can automate the normalization and cleansing of data, they are mostly in the pre-industrial stage.</span></p></div></div></div></div></body></html>
