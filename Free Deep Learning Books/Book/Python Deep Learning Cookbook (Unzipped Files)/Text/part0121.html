                            <header class="calibre1">
                    </header><h1 class="header-title" id="calibre_pb_0">Classifying objects in images</h1>
                
            
            <article class="calibre1">
                
<p class="calibre3">In this recipe, we will show you how to classify objects in images using a CNN. We will train the network from scratch to classify five different flower types in images. The images have different sizes. For this recipe, we will be using Keras.</p>
