                            <header class="calibre1">
                    </header><h1 class="header-title" id="calibre_pb_0">Launching an instance on Amazon Web Services (AWS)</h1>
                
            
            <article class="calibre1">
                
<p class="calibre3"><span><strong class="calibre5">Amazon Web Services</strong> (<strong class="calibre5">AWS</strong>) is the most popular cloud solution. If you don't have access to a local GPU or if you prefer to use a server, you can set up an EC2 instance on AWS. </span>In this recipe, we provide steps to launch a GPU-enabled server.</p>
