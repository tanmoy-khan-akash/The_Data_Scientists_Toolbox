                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting Ready...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Before starting with the recipe, let's explore the KL divergence, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">D</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">KL</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> a little more. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">It is a non-symmetric measure of the difference between two distributions, in our case,  </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">ρ</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> and </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">ρ_hat</span></kbd><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">.</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"> When </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1"> </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">ρ</span></kbd></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1"> and </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">ρ_hat</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">  are equal, then it is zero, otherwise, it increases monotonically as </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">ρ_hat</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1"> diverges from </span><kbd><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">ρ</span></em></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">Mathematically, it is expressed as follows:</span><em><br/></em></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1"><img src="assets/2af9126b-03f8-44e1-b55f-b6d796fc91e9.png"/></span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Here is the plot of </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">D</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">KL</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1"> for a fixed </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">ρ</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">=0.3, where we can see that when </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">ρ_hat=0.3</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">D</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">KL</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">=0; otherwise, it is increasing monotonically on both sides:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"><img height="253" width="367" src="assets/9787a812-e35c-4503-9ade-e270c508c780.png"/></span></div>


            </article>
