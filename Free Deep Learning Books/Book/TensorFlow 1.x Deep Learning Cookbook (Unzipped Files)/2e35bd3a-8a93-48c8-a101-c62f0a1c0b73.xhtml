                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How it works...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Now, you might wonder why we want to extract the features from an intermediate layer in a CNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">The key intuition is that: as the network learns to classify images into categories, each layer learns to identify the features that are necessary to do the final classification.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Lower layers identify lower order features such as colors and edges, and higher layers compose these lower order features into higher order features such as shapes or objects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">Hence the intermediate layer has the capability to extract important features from an image, and these features are more likely to help with different kinds of classification.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">This has multiple advantages. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">First, we can rely on publicly available large-scale training and transfer this learning to novel domains. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">Second, we can save time for expensive large training. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.4">Third, we can provide reasonable solutions even when we don't have a large number of training examples for our domain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.5">We also get a good starting network shape for the task at hand, instead of guessing it.</span></p>


            </article>
