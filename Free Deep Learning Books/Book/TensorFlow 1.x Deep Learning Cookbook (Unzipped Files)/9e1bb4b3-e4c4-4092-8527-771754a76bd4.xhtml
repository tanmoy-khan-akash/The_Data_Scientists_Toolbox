        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Learning to Learn with AutoML (Meta-Learning)</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The success of deep learning has immensely facilitated the work of feature engineering. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Indeed, traditional machine learning depended very much on the selection of the right set of features, and very frequently, this step was more important that the selection of a particular learning algorithm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Deep learning has changed this scenario; creating a right model is still very important but nowadays networks are less sensitive to the selection of a particular set of feature and are much more able to auto-select the features that really matter.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Instead, the introduction of deep learning has increased the focus on the selection of the right neural network architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">This means that progressively the interest of researchers is shifting from feature engineering to network engineering</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">AutoML</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Meta Learning</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">) is an emerging research topic which aims at auto-selecting the most efficient neural network for a given learning task. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">In other words, AutoML represents a set of methodologies f</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">or learning how to learn</span></em><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> efficiently</span></em><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">Consider for instance the tasks of Machine Translation, or Image Recognition, or Game playing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">Typically, the models are manually designed by a team of engineers, data scientist, and domain experts. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.4">If you consider that a typical 10-layer network can have ~10</span></span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">10</span></sup> <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">candidate network, you understand how expensive, error prone, and ultimately sub-optimal the process can be.</span></span></p>


            </article>
