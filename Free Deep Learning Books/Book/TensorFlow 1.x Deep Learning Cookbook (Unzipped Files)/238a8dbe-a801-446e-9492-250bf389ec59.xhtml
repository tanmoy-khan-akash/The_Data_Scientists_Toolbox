<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">In order to create a lighter model that can be loaded on the device, we have deleted all the unneeded nodes with the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">strip_unused_nodes</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> rule which was applied by the graph' transforms tool. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">This operation removes all operations used for learning and leaves the ones used for inference intact.</span></p>
