        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting ready</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We use the RBM class we have already created in the recipe </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Restricted Boltzmann Machine</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">, with just one change, we do not need to reconstruct the image after training now. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">Instead, our stacked RBMs will be only forward passing the data up to the last MLP layer of DBN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">This is achieved by removing the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">reconstruct()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> function from the class, and replacing it with the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">rbm_output()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"> function:</span></p>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">def rbm_output(self,X):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">    x = tf.nn.sigmoid(tf.matmul(X, self._W) + self._c)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">    return self.session.run(x, feed_dict={self._X: X})</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">For the data, we consider the Kaggle Face Emotion Recognition data, available at </span><a href="https://www.kaggle.com/c/challenges-in-representation-learning-facial-expression-recognition-challenge"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">https://www.kaggle.com/c/challenges-in-representation-learning-facial-expression-recognition-challenge</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">The data description given there is:</span></p>
<div class="packt_quote"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">The data consists of 48 x 48 pixel grayscale images of faces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">The faces have been automatically registered so that the face is more or less centered and occupies about the same amount of space in each image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.3">The task is to categorize each face based on the emotion shown in the facial expression into one of seven categories (0=</span><span class="x_x_il"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Angry</span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">, 1=Disgust, 2=Fear, 3=Happy, 4=Sad, 5=Surprise, 6=Neutral)</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">
train.csv contains two columns, "emotion" and "pixels". </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">The "emotion" column contains a numeric code ranging from 0 to 6, inclusive, for the emotion that is present in the image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.3">The "pixels" column contains a string surrounded in quotes for each image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.4">The contents of this string are space-separated pixel values in row major order. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.5">test.csv contains only the "pixels" column and your task is to predict the emotion column.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">
The training set consists of 28,709 examples. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">The public test set used for the leaderboard consists of 3,589 examples. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.3">The final test set, which was used to determine the winner of the competition, consists of another 3,589 examples.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">
This dataset was prepared by Pierre-Luc Carrier and Aaron Courville, as part of an ongoing research project. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">They have graciously provided the workshop organizers with a preliminary version of their dataset to use for this contest.</span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">The complete data is in one .</span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">csv</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1"> file called </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">fer2013.csv</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.2">We separate out training, validation, and test data from this:</span></p>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">data = pd.read_csv('data/fer2013.csv')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">tr_data = data[data.Usage == "Training"]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">test_data = data[data.Usage == "PublicTest"]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">mask = np.random.rand(len(tr_data)) &lt; 0.8</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">train_data = tr_data[mask]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">val_data = tr_data[~mask]</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">We will need to preprocess the data, that is, separate the pixels and emotion labels. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">For this we make two function </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">dense_to_one_hot ()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">, it performs the one hot encoding for labels. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.2">The second function is </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">preprocess_data()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">, which separates out individual pixels as an array. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.2">With the help of these two functions, we generate the input feature and label of the training, validation, and test dataset:</span></p>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">def dense_to_one_hot(labels_dense, num_classes):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">     num_labels = labels_dense.shape[0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">     index_offset = np.arange(num_labels) * num_classes</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">     labels_one_hot = np.zeros((num_labels, num_classes))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">     labels_one_hot.flat[index_offset + labels_dense.ravel()] = 1</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">     return labels_one_hot</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">def preprocess_data(dataframe):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">     pixels_values = dataframe.pixels.str.split(" ").tolist()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">     pixels_values = pd.DataFrame(pixels_values, dtype=int)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">     images = pixels_values.values</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">     images = images.astype(np.float32)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">     images = np.multiply(images, 1.0/255.0)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">     labels_flat = dataframe["emotion"].values.ravel()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">     labels_count = np.unique(labels_flat).shape[0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">     labels = dense_to_one_hot(labels_flat, labels_count)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">     labels = labels.astype(np.uint8)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">     return images, labels</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">Using the functions defined in the preceding code, we get the data in the format required for training. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">We build the emotion detection DBN, based on the similar principle as mentioned in this paper for MNIST: </span><a href="https://www.cs.toronto.edu/~hinton/absps/fastnc.pdf"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">https://www.cs.toronto.edu/~hinton/absps/fastnc.pdf</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">.</span></p>


            </article>
