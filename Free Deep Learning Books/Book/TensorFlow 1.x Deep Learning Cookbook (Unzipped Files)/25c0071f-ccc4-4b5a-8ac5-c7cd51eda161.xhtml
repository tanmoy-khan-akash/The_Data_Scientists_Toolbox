<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">This skeleton example is inspired by a scheme available online (</span><a href="https://keras.io/applications/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://keras.io/applications/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">)  on the Keras website. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">We suppose to have a training dataset D in a domain, different from ImageNet. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">D has 1,024 features in input and 200 categories in output.</span></p>
