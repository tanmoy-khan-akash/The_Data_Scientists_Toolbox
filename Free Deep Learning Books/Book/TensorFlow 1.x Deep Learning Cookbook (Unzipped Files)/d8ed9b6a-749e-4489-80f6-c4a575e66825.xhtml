        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Restricted Boltzmann Machine</span></h1>
                </header>
            
            <article>
                
<p><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Restricted Boltzmann Machine</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">RBM</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">) is a two-layered neural network--the first layer is called the </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">visible layer</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> and the second layer is called the </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">hidden layer</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">They are called </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">shallow neural networks</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1"> because they are only two layers deep. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">They were first proposed in 1986 by Paul Smolensky (he called them Harmony Networks</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">[1]</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">) and later by Geoffrey Hinton who in 2006 proposed </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Contrastive Divergence</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">CD</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">) as a method to train them. All neurons in the visible layer are connected to all the neurons in the hidden layer, but there is a </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">restriction</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">--no neuron in the same layer can be connected. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">All neurons are binary in nature:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1"><img height="225" width="216" src="assets/06c4c832-db20-40c8-bf83-39d907a5a660.png"/></span></div>
<div class="packt_figref CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Source: By Qwertyus - Own work, CC BY-SA 3.0, https://commons.wikimedia.org/w/index.php?curid=22717044</span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">RBM can be used for dimensionality reduction, feature extraction, and collaborative filtering. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.2">The training in RBMs can be divided into three parts: forward pass, backward pass, and then compare.</span></p>


            </article>
