<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Here we assume that you have already created a Cloud Platform Project, enabling billing for your project, and enable the Google Compute Engine and the Cloud Machine Learning APIs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">These steps are similar to the ones described in the previous recipes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">This recipe is inspired by the MNIST training code available in </span><a href="https://cloud.google.com/ml-engine/docs/distributed-tensorflow-mnist-cloud-datalab"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://cloud.google.com/ml-engine/docs/distributed-tensorflow-mnist-cloud-datalab</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">.</span></p>
