        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We proceed with the recipe as follows:</span></p>
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Clone the code from Github:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">git clone </span><a href="https://github.com/carpedm20/DCGAN-tensorflow"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">https://github.com/carpedm20/DCGAN-tensorflow</span></a></pre>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Download the dataset with the following:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">python download.py mnist celebA</span></pre>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">To train a model with the downloaded dataset, use the following:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">python main.py --dataset celebA --input_height=108 --train --crop</span></pre>
<ol start="4">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">To test it with an existing model</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">, use the following:</span></span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">python main.py --dataset celebA --input_height=108 --crop</span></pre>
<ol start="5">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Alternatively, you can use your own dataset by doing the following:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">$ mkdir data/DATASET_NAME</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1"> ... </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">add images to data/DATASET_NAME ...</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> $ python main.py --dataset DATASET_NAME --train</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1"> $ python main.py --dataset DATASET_NAME</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1"> $ # example</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1"> $ python main.py --dataset=eyes --input_fname_pattern="*_cropped.png" --train</span></pre>


            </article>
