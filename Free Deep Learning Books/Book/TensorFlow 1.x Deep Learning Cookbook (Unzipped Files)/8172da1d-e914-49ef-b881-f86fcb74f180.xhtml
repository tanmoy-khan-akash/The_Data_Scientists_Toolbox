            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Using ConvNets, we increased our performance on the MNIST dataset reaching almost 95 percent accuracy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Our ConvNet consists of two layers combining convolutions, ReLU, and maxpooling, followed by two fully connected layers with dropout. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Training happens in batches of size 128 with Adam used as an optimizer, a learning rate of 0.001, and a maximum number of 500 iterations.</span></p>


            </article>
