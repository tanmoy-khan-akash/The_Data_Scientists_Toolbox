                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting ready</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The idea is to use the VGG16 network pretrained on a large dataset such as ImageNet. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Note that training could be rather computationally expensive and therefore makes sense to reuse an already pretrained network:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"><img height="60" width="317" src="assets/a8a83c1f-147f-4b48-90f0-fb6e931ef5ce.png"/></span></div>
<div class="packt_figref CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">A VGG16 Network</span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">So, how to use a VGG16? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">Keras makes it easy as the library has a standard VGG16 application available as a library and precomputed weights are automatically downloaded. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.3">Note that we explicitly omit the last layer and replace it with our custom layer, which will be fine-tuned on the top of the prebuilt VGG16. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.4">In this example, you will learn how to classify dogs and cats images available from Kaggle.</span></p>


            </article>
