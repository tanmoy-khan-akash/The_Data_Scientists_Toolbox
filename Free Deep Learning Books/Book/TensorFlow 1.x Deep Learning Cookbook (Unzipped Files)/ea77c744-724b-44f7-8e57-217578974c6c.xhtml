                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Learning to predict future Bitcoin value with RNNs</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">In this recipe, we will learn how to predict future Bitcoin value with an RNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">The key idea is that the temporal sequence of values observed in the past is a good predictor of future values. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">For this recipe, we will use the code available at </span><a href="https://github.com/guillaume-chevalier/seq2seq-signal-prediction"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://github.com/guillaume-chevalier/seq2seq-signal-prediction</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> under the MIT license. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">The Bitcoin value for a given temporal interval is downloaded via an API from </span><a href="https://www.coindesk.com/api/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">https://www.coindesk.com/api/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> . </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">Here is a piece of the API documentation:</span></p>
<div class="mce-root packt_quote"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">We offer historical data from our Bitcoin Price Index through the following endpoint:</span><br/></em><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">https://api.coindesk.com/v1/bpi/historical/close.json</span><br/></em><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">By default, this will return the previous 31 days' worth of data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">This endpoint accepts the following optional parameters:</span><br/></em><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">?index=[USD/CNY]The index to return data for. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">Defaults to USD.</span><br/></em><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">?currency=&lt;VALUE&gt;The currency to return the data in, specified in ISO 4217 format. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">Defaults to USD.</span><br/></em><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">?start=&lt;VALUE&gt;&amp;end=&lt;VALUE&gt; Allows data to be returned for a specific date range. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">Must be listed as a pair of start and end parameters, with dates supplied in the YYYY-MM-DD format, e.g. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.3">2013-09-01 for September 1st, 2013.</span><br/></em><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">?for=yesterday Specifying this will return a single value for the previous day. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">Overrides the start/end parameter.</span><br/></em><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Sample Request:</span><br/></em><a href="https://api.coindesk.com/v1/bpi/historical/close.json?start=2013-09-01&amp;end=2013-09-05"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">https://api.coindesk.com/v1/bpi/historical/close.json?start=2013-09-01&amp;end=2013-09-05</span><br/></a><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Sample JSON Response:</span><br/></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">{"bpi":{"2013-09-01":128.2597,"2013-09-02":127.3648,"2013-09-03":127.5915,"2013-09-04":120.5738,"2013-09-05":120.5333},"disclaimer":"This data was produced from the CoinDesk Bitcoin Price Index. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2">BPI value data returned as USD.","time":{"updated":"Sep 6, 2013 00:03:00 UTC","updatedISO":"2013-09-06T00:03:00+00:00"}}</span></div>


            </article>
