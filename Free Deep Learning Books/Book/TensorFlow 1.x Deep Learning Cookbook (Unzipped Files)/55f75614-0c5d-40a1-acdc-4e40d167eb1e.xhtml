        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The first step, as always, is including the necessary modules:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">import tensorflow as tf</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">import numpy as np</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">from tensorflow.examples.tutorials.mnist import input_data</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">import matplotlib.pyplot as plt</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">import math</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">%matplotlib inline</span></pre>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Load the input data:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">mnist = input_data.read_data_sets("MNIST_data/")</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">trX, trY, teX, teY = mnist.train.images, mnist.train.labels, mnist.test.images, mnist.test.labels</span></pre>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Define the network parameters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">Here, we also calculate the spatial dimensions of the output of each max-pool layer; we need this information to upsample the image in the decoder network:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1"># Network Parameters</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">h_in, w_in = 28, 28 # Image size height and width</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">k = 3 # Kernel size</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">p = 2 # pool</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">s = 2 # Strides in maxpool</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">filters = {1:32,2:32,3:16}</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">activation_fn=tf.nn.relu</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1"># Change in dimensions of image after each MaxPool</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">h_l2, w_l2 = int(np.ceil(float(h_in)/float(s))) , int(np.ceil(float(w_in)/float(s))) # Height and width: second encoder/decoder layer</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">h_l3, w_l3 = int(np.ceil(float(h_l2)/float(s))) , int(np.ceil(float(w_l2)/float(s))) # Height and width: third encoder/decoder layer</span></pre>
<ol start="4">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Create placeholders for input (noisy image) and target (corresponding clear image):</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">X_noisy = tf.placeholder(tf.float32, (None, h_in, w_in, 1), name='inputs')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">X = tf.placeholder(tf.float32, (None, h_in, w_in, 1), name='targets')</span></pre>
<ol start="5">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Build the Encoder and Decoder networks:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">### Encoder</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">conv1 = tf.layers.conv2d(X_noisy, filters[1], (k,k), padding='same', activation=activation_fn)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1"># Output size h_in x w_in x filters[1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">maxpool1 = tf.layers.max_pooling2d(conv1, (p,p), (s,s), padding='same')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1"># Output size h_l2 x w_l2 x filters[1] </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">conv2 = tf.layers.conv2d(maxpool1, filters[2], (k,k), padding='same', activation=activation_fn)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1"># Output size h_l2 x w_l2 x filters[2] </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">maxpool2 = tf.layers.max_pooling2d(conv2,(p,p), (s,s), padding='same')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1"># Output size h_l3 x w_l3 x filters[2] </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">conv3 = tf.layers.conv2d(maxpool2,filters[3], (k,k), padding='same', activation=activation_fn)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1"># Output size h_l3 x w_l3 x filters[3]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">encoded = tf.layers.max_pooling2d(conv3, (p,p), (s,s), padding='same')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1"># Output size h_l3/s x w_l3/s x filters[3] Now 4x4x16</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">### Decoder</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">upsample1 = tf.image.resize_nearest_neighbor(encoded, (h_l3,w_l3))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1"># Output size h_l3 x w_l3 x filters[3]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">conv4 = tf.layers.conv2d(upsample1, filters[3], (k,k), padding='same', activation=activation_fn)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1"># Output size h_l3 x w_l3 x filters[3]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">upsample2 = tf.image.resize_nearest_neighbor(conv4, (h_l2,w_l2))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1"># Output size h_l2 x w_l2 x filters[3] </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">conv5 = tf.layers.conv2d(upsample2, filters[2], (k,k), padding='same', activation=activation_fn)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1"># Output size h_l2 x w_l2 x filters[2] </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">upsample3 = tf.image.resize_nearest_neighbor(conv5, (h_in,w_in))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1"># Output size h_in x w_in x filters[2]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">conv6 = tf.layers.conv2d(upsample3, filters[1], (k,k), padding='same', activation=activation_fn)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1"># Output size h_in x w_in x filters[1]</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">logits = tf.layers.conv2d(conv6, 1, (k,k) , padding='same', activation=None)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1"># Output size h_in x w_in x 1</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">decoded = tf.nn.sigmoid(logits, name='decoded')</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">loss = tf.nn.sigmoid_cross_entropy_with_logits(labels=X, logits=logits)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">cost = tf.reduce_mean(loss)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">opt = tf.train.AdamOptimizer(0.001).minimize(cost)</span></pre>
<ol start="6">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">Start the session:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">sess = tf.Session()</span></pre>
<ol start="7">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">Fit the model for the given input:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">epochs = 10</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">batch_size = 100</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1"># Set's how much noise we're adding to the MNIST images</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">noise_factor = 0.5</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">sess.run(tf.global_variables_initializer())</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">err = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">for i in range(epochs):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1"> for ii in range(mnist.train.num_examples//batch_size):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1"> batch = mnist.train.next_batch(batch_size)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1"> # Get images from the batch</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1"> imgs = batch[0].reshape((-1, h_in, w_in, 1))</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1"> # Add random noise to the input images</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1"> noisy_imgs = imgs + noise_factor * np.random.randn(*imgs.shape)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1"> # Clip the images to be between 0 and 1</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1"> noisy_imgs = np.clip(noisy_imgs, 0., 1.)</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1"> # Noisy images as inputs, original images as targets</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1"> batch_cost, _ = sess.run([cost, opt], feed_dict={X_noisy: noisy_imgs,X: imgs})</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1"> err.append(batch_cost)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1"> if ii%100 == 0:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"> print("Epoch: {0}/{1}... </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.2">Training loss {2}".format(i, epochs, batch_cost))</span></pre>
<ol start="8">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">The error of the network as it learns is as follows:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">plt.plot(err)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">plt.xlabel('epochs')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">plt.ylabel('Cross Entropy Loss')</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">The plot is as follows:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1"><img height="174" width="253" src="assets/22ac3c25-d442-4bee-8881-fde55b8e13a1.png"/></span></div>
<ol start="9">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">Finally, let's see the reconstructed images:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">fig, axes = plt.subplots(rows=2, cols=10, sharex=True, sharey=True, figsize=(20,4))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">in_imgs = mnist.test.images[:10]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">noisy_imgs = in_imgs + noise_factor * np.random.randn(*in_imgs.shape)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">noisy_imgs = np.clip(noisy_imgs, 0., 1.)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">reconstructed = sess.run(decoded, feed_dict={X_noisy: noisy_imgs.reshape((10, 28, 28, 1))})</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">for images, row in zip([noisy_imgs, reconstructed], axes):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1"> for img, ax in zip(images, row):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1"> ax.imshow(img.reshape((28, 28)), cmap='Greys_r')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1"> ax.get_xaxis().set_visible(False)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1"> ax.get_yaxis().set_visible(False)</span></pre>
<p class="mce-root CDPAlignLeft CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">Here is the output of the preceding code:</span></p>
<div class="CDPAlignCenter CDPAlign"><br/>
<span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1"><img height="44" width="211" src="assets/b5243361-e893-4da2-ae00-a1e972cf00a5.png"/></span></div>
<ol start="10">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">Close the Session:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">sess.close()</span></pre>
