        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Accessing TPUs</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Google has decided not to sell TPUs directly to others; instead, the TPUs will be made available via the Google cloud platform: Cloud TPU Alpha (</span><a href="https://cloud.google.com/tpu/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://cloud.google.com/tpu/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">Cloud TPU Alpha will offer up to 180 teraflops of computing performance and 64 GB of ultra-high bandwidth memory. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">Users will be able to connect to these Cloud TPUs from custom virtual machines.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Google has also decided to make a cluster of 1,000 cloud TPUs </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">available free of charge </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">to machine learning researchers around the world, with the aim of accelerating the pace of open machine learning research. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">Access to it will be given to selected individuals for limited amounts of computing time; individuals can sign up using this link: </span><a href="https://services.google.com/fb/forms/tpusignup/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">https://services.google.com/fb/forms/tpusignup/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">.  According to the Google Blog:</span></p>
<div class="packt_quote"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">"Since the main goal of the TensorFlow Research Cloud is to benefit the open machine learning research community as a whole, successful applicants will be expected to do the following:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">
Share their TFRC-supported research with the world through peer-reviewed publications, open-source code, blog posts, or other open media</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">
Share concrete, constructive feedback with Google to help us improve the TFRC program and the underlying Cloud TPU platform over time.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">
Imagine a future in which ML acceleration is abundant and develop new kinds of machine learning models in anticipation of that future"</span></div>


            </article>
