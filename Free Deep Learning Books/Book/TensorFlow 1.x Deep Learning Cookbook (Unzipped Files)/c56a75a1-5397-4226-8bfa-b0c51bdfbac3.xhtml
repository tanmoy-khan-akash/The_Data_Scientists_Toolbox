        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Like always, the first step is to import the necessary modules--TensorFlow, numpy to manipulate input data, matplotlib to plot, and so on:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">import tensorflow as tf</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">import numpy as np</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">from tensorflow.examples.tutorials.mnist import input_data</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">import matplotlib.pyplot as plt</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">import math</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">%matplotlib inline</span></pre>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Load the data from TensorFlow examples. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">We have used the standard MNIST database for illustration in all the recipes of this chapter to provide you with a benchmark between different autoencoders.</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">mnist = input_data.read_data_sets("MNIST_data/")</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">trX, trY, teX, teY = mnist.train.images, mnist.train.labels, mnist.test.images, mnist.test.labels</span></pre>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Next, we define the main component of this recipe--the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">DenoisingAutoEncoder</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1"> class. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">The class is very similar to the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">SparseAutoEncoder</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> class that we made in the previous recipe. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">Here, we have a placeholder for the noisy image; this noisy input is fed to the encoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">The reconstruction error is now the difference between the original clean image and the output of the decoder when the noisy image is the input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.4">We retain the sparsity penalty term here. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.5">The fit function thus takes both the original image and the noisy image as its argument.</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">class DenoisingAutoEncoder(object):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">def __init__(self, m, n, eta = 0.01):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">"""</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">m: Number of neurons in input/output layer</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">n: number of neurons in hidden layer</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">"""</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">self._m = m</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">self._n = n</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">self.learning_rate = eta</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"># Create the Computational graph</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1"># Weights and biases</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">self._W1 = tf.Variable(tf.random_normal(shape=(self._m,self._n)))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">self._W2 = tf.Variable(tf.random_normal(shape=(self._n,self._m)))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">self._b1 = tf.Variable(np.zeros(self._n).astype(np.float32)) #bias for hidden layer</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">self._b2 = tf.Variable(np.zeros(self._m).astype(np.float32)) #bias for output layer</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"># Placeholder for inputs</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">self._X = tf.placeholder('float', [None, self._m])</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">self._X_noisy = tf.placeholder('float', [None, self._m])</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">self.y = self.encoder(self._X_noisy)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">self.r = self.decoder(self.y)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">error = self._X - self.r</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">self._loss = tf.reduce_mean(tf.pow(error, 2))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">#self._loss = tf.reduce_mean(tf.nn.sigmoid_cross_entropy_with_logits(labels =self._X, logits = self.r))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">alpha = 0.05</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">kl_div_loss = tf.reduce_sum(self.kl_div(0.02, tf.reduce_mean(self.y,0)))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">loss = self._loss + alpha * kl_div_loss </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">self._opt = tf.train.AdamOptimizer(self.learning_rate).minimize(loss)</span><br/> <br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">def encoder(self, x):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">h = tf.matmul(x, self._W1) + self._b1</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">return tf.nn.sigmoid(h)</span><br/> <br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">def decoder(self, x):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">h = tf.matmul(x, self._W2) + self._b2</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">return tf.nn.sigmoid(h)</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">def set_session(self, session):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">self.session = session</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">def reconstruct(self,x):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">h = self.encoder(x)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">r = self.decoder(h)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">return self.session.run(r, feed_dict={self._X: x})</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">def kl_div(self, rho, rho_hat):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">term2_num = tf.constant(1.)- rho</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">term2_den = tf.constant(1.) - rho_hat</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">kl = self.logfunc(rho,rho_hat) + self.logfunc(term2_num, term2_den)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">return kl</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">def logfunc(self, x1, x2):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">return tf.multiply( x1, tf.log(tf.div(x1,x2)))</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">def corrupt(self,x):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">return x * tf.cast(tf.random_uniform(shape=tf.shape(x), minval=0,maxval=2),tf.float32)</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">def getWeights(self):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">return self.session.run([self._W1, self._W2,self._b1, self._b2])</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">def fit(self, X, Xorg, epochs = 1, batch_size = 100):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">N, D = X.shape</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">num_batches = N // batch_size</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">obj = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">for i in range(epochs):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">#X = shuffle(X)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">for j in range(num_batches):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">batch = X[j * batch_size: (j * batch_size + batch_size)]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">batchO = Xorg[j * batch_size: (j * batch_size + batch_size)]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">_, ob = self.session.run([self._opt,self._loss], feed_dict={self._X: batchO, self._X_noisy: batch})</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">if j % 100 == 0:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">print('training epoch {0} batch {2} cost {1}'.format(i,ob, j)) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">obj.append(ob)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">return obj</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">It is also possible to add noise to the autoencoder object. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.2">In that case, you will use the corrupt method defined in the class, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">self._X_noisy = self.corrupt(self._X) * 0.3 + self._X * (1 - 0.3)</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">, and the fit method will also change to the following:</span></p>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">def fit(self, X, epochs = 1, batch_size = 100):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">        N, D = X.shape</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">        num_batches = N // batch_size</span><br/>        <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">        obj = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">        for i in range(epochs):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">            #X = shuffle(X)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">            for j in range(num_batches):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">                batch = X[j * batch_size: (j * batch_size + batch_size)]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">                _, ob = self.session.run([self._opt,self._loss], feed_dict={self._X: batch})</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">                if j % 100 == 0:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">                    print('training epoch {0} batch {2} cost {1}'.format(i,ob, j)) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">                obj.append(ob)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">        return obj</span></pre>
<ol start="4">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">Now, we use the corruption function defined earlier to generate a noisy image and feed it to the session:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">n_hidden = 800</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">Xtrain = trX.astype(np.float32)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">Xtrain_noisy = corruption(Xtrain).astype(np.float32)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">Xtest = teX.astype(np.float32)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">#noise = Xtest * np.random.randint(0, 2, Xtest.shape).astype(np.float32)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">Xtest_noisy = corruption(Xtest).astype(np.float32) #Xtest * (1-0.3)+ noise *(0.3)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">_, m = Xtrain.shape</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">dae = DenoisingAutoEncoder(m, n_hidden)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">#Initialize all variables</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">init = tf.global_variables_initializer()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">with tf.Session() as sess:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1"> sess.run(init)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1"> dae.set_session(sess)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1"> err = dae.fit(Xtrain_noisy, Xtrain, epochs=10)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1"> out = dae.reconstruct(Xtest_noisy[0:100])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1"> W1, W2, b1, b2 = dae.getWeights()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1"> red = dae.reduced_dimension(Xtrain)</span></pre>
<ol start="5">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">The reconstruction loss reduces as the network learns:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">plt.plot(err)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">plt.xlabel('epochs')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">plt.ylabel('Reconstruction Loss (MSE)')</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">The plot is as follows:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1"><img src="assets/5e026eeb-65fb-4540-81f0-ebadf8d6bd95.png"/></span></div>
<ol start="6">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">The reconstructed images, when noisy images from the test dataset are presented to the trained network, are as follows:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1"># Plotting original and reconstructed images</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">row, col = 2, 8</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">idx = np.random.randint(0, 100, row * col // 2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">f, axarr = plt.subplots(row, col, sharex=True, sharey=True, figsize=(20,4))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">for fig, row in zip([Xtest_noisy,out], axarr):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1"> for i,ax in zip(idx,row):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1"> ax.imshow(fig[i].reshape((28, 28)), cmap='Greys_r')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1"> ax.get_xaxis().set_visible(False)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1"> ax.get_yaxis().set_visible(False)</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">We the following result:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1"><img height="75" width="360" src="assets/6fdcf058-4368-4143-afe9-0b5b7ea91212.png"/></span></div>
