                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">There's more...</span></h1>

            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The same logic can be used to make an agent for other environments of OpenAI; however, for Atari games such as Breakout or Pac-Man, the observation space is not an array of just four numbers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Instead, it is very large (210 × 160 = 33,600 pixels with 3 RGB values); without some form of quantization, the possible states are infinite and do not yield good results with this simplistic NN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">We will resolve this issue using CNN in our deep Q learning recipe.</span></p>


            </article>
