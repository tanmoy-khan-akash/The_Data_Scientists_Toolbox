    <body>
        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Shared weights and bias</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Let's suppose that we want to move away from the raw pixel representation by gaining the ability to detect the same feature independently from the location where it is placed in the input image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">A simple intuition is to use the same set of weights and bias for all the neurons in the hidden layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">In this way, each layer will learn a set of position-independent latent features derived from the image.</span></p>


            </article>

            
        </section>
    </body>

</html>
