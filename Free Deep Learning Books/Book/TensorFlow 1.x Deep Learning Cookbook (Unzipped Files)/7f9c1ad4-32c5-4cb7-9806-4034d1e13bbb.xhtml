                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Classifying images with VGGNet, ResNet, Inception, and Xception</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Image classification is a typical deep learning application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">This task had an initial increase of interest thanks to the ImageNet (</span><a href="http://image-net.org/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">http://image-net.org/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">)  image database organized according to the WordNet (</span><a href="http://wordnet.princeton.edu/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">http://wordnet.princeton.edu/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">) hierarchy (currently only the nouns), in which each node of the hierarchy is depicted by hundreds and thousands of images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">More precisely, ImageNet aimed to label and categorize images into almost 22,000 separate object categories. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">In the context of deep learning, ImageNet refers generally to the work contained in the paper </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">ImageNet Large Scale Visual Recognition Challenge (</span><a href="http://www.image-net.org/challenges/LSVRC/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">http://www.image-net.org/challenges/LSVRC/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">)</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">, or ILSVRC for short. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">In this case, the goal is to train a model that can classify an input image into 1,000 separate object categories. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">In this recipe, we will use pre-trained models over 1.2 million training images with 50,000 validation images and 100,000 testing images.</span></p>


            </article>
