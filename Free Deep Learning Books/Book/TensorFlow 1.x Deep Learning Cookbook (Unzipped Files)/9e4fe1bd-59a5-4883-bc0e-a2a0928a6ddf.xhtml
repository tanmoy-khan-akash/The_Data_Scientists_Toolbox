                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Self-organizing maps</span></h1>
                </header>
            
            <article>
                
<p><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Self-organized maps</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">SOM</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">), sometimes known as </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Kohonen networks</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> or </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Winner take all units</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">WTU</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">), are a very special kind of neural network, motivated by a distinctive feature of the human brain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">In our brain, different sensory inputs are represented in a topologically ordered manner. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">Unlike other neural networks, neurons are not all connected to each other via weights, instead, they influence each other's learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.4">The most important aspect of SOM is that neurons represent the learned inputs in a topographic manner.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">In SOM, neurons are usually placed at nodes of a (1D or 2D) lattice. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">Higher dimensions are also possible but are rarely used in practice. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.3">Each neuron in the lattice is connected to all the input units via weight matrix. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.4">Here, you can see a SOM with 3 x 4 (12 neurons) and seven inputs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.5">For clarity, only the weight vectors connecting all inputs to one neuron are shown. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.6">In this case, each neuron will have seven elements, resulting in a combined weight matrix of size (12 x 7):</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1"><img height="236" width="408" src="assets/22a4a2c8-9e42-496b-bf1f-e66e0c5bf09d.png"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">SOM learns via competitive learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">It can be considered as a nonlinear generalization of PCA and thus, like PCA, can be employed for dimensionality reduction.</span></p>


            </article>
