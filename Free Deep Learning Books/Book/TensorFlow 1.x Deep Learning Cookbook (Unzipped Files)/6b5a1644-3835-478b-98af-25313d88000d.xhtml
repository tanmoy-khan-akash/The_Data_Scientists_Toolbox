        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting ready</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The game of Pong is a two-player game, where the goal is to bounce the ball past the other player. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">The agent can move the paddle up or down (and, yes, the standard NoOp). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">One of the players in the OpenAI environment is a decent AI player who knows how to play the game well. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">Our goal is to train the second agent using policy gradients. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">Our agent gets proficient with each game it plays. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.6">While the code has been built to run only for 500 episodes, we should add a provision to save the agent state at specified checkpoints and, in the next run, start by loading the previous checkpoint. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.7">We achieve this by first declaring a saver, then using the TensorFlow </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">saver.save</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> method to save the present network state (checkpoint), and lastly load the network from the last saved checkpoint. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">The following methods of the class </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">PolicyNetwork</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">, defined in the </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Ho</span></em><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">w</span></em> <em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">to do it</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"> section of this recipe, perform this work:</span></p>
<pre><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">def </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">load(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">):</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">.saver = tf.train.Saver(tf.global_variables())</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">load_was_success </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">= </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">True  </span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1"># yes, I'm being optimistic</span><br/></span><span>    </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">try</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">        save_dir = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">'/'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">.join(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">.save_path.split(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">'/'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">)[:-</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">        ckpt = tf.train.get_checkpoint_state(save_dir)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">        load_path = ckpt.model_checkpoint_path</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">.saver.restore(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">.session, load_path)</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">except</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">:</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">print</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">"no saved model to load. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.2">starting new session"</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">)</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">load_was_success </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">= </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">False</span><br/></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">    else</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">:</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">print</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">"loaded model: {}"</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">.format(load_path))</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">saver </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">= tf.train.Saver(tf.global_variables())</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">episode_number </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">= </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">int</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">(load_path.split(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">'-'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">)[-</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">])</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">To save the model after every 50 episodes, we use the following:</span></p>
<pre><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">def </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">save(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">):</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">.saver.save(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">.session, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">.save_path, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">global_step</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">=n)</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">print</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">"SAVED MODEL #{}"</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">.</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">format</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">(n))</span></pre>


            </article>
