<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">In this recipe we will show how to run a Docker container for TensorFlow Serving, a set of components to export a trained TensorFlow model and use the standard </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">tensorflow_model_server</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> to serve it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">The TensorFlow Serving server discovers new exported models and runs a gRPC service for serving them.</span></p>
