        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We proceed with the recipe as follows:</span></p>
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Start by importing a few modules</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">import sys</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">import numpy as np</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">import tensorflow as tf</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">from datetime import datetime</span></pre>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Get from command line the type of processing unit that you desire to use (either </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">"gpu"</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"> or </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">"cpu"</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">)</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">device_name = sys.argv[1] # Choose device from cmd line. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">Options: gpu or cpu</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">shape = (int(sys.argv[2]), int(sys.argv[2]))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">if device_name == "gpu":</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">  device_name = "/gpu:0"</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">else:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">  device_name = "/cpu:0"</span></pre>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Execute the matrix multiplication either on GPU or on CPU. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">The key instruction is with </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">tf.device(device_name)</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">It creates a new context manager, telling TensorFlow to perform those actions on either the GPU or the CPU</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">with tf.device(device_name):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">  random_matrix = tf.random_uniform(shape=shape, minval=0, maxval=1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">  dot_operation = tf.matmul(random_matrix, tf.transpose(random_matrix))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">  sum_operation = tf.reduce_sum(dot_operation)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">startTime = datetime.now()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">with tf.Session(config=tf.ConfigProto(log_device_placement=True)) as session:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">  result = session.run(sum_operation)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">  print(result)</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">4. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">Print some debug timing just to verify what is the difference between CPU and GPU</span></p>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">print("Shape:", shape, "Device:", device_name)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">print("Time taken:", datetime.now() - startTime)</span></pre>


            </article>
