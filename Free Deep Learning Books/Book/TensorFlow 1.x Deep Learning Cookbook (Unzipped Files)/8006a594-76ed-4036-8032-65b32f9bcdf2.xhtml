                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Learning to forge MNIST images with DCGANs</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">In this recipe, we will use a simple GAN that uses CNNs for learning how to forge MNIST images and create new ones that are not part of the original dataset. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">The idea is that CNNs used together with GANs will improve the </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">ability to deal</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> with image datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">Please note that the previous recipe was using GANs with fully connected networks, while here we focus on CNNs.</span></p>


            </article>
