                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">About the Authors</span></h1>
                </header>
            
            <article>
                
<p><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Antonio Gulli</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> is a transformational software executive and business leader with a passion for establishing and managing global technological talent for innovation and execution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">He is an expert in search engines, online services, machine learning, information retrieval, analytics, and cloud computing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">So far, he has been lucky enough to gain professional experience in four different countries in Europe and manage teams in six different countries in Europe and America. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.4">Currently, he works as site lead and director of cloud in Google Warsaw, driving European efforts for Serverless, Kubernetes, and Google Cloud UX. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.5">Previously, Antonio helped to innovate academic search as the vice president for Elsevier, a worldwide leading publisher. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.6">Before that, he drove query suggestions and news search as a principal engineer for Microsoft. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.7">Earlier, he served as the CTO for Ask.com, driving multimedia and news search. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.8">Antonio has filed for 20+ patents, published multiple academic papers, and served as a senior PC member in multiple international conferences. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.9">He truly believes that to be successful, you must have a great combination of management, research skills, just-get-it-done, and selling attitude.</span></p>
<div class="packt_quote"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">I thank every reader of this book for your attention and for the trust. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">I am humbled by the number of comments received on LinkedIn and Facebook: You, the reader, provided immense help in making this book better. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">I would also like to thank various people for providing support during the process of writing the book. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.4">In no order: Susana, Ewa, Ignacy, Dawid, Max, Jarek, Jerzy, Nina, Laura, Antonella, Eric, Ettore, Francesco, Liubov, Marco, Fabio, Giacomo, Saskia, Christina, Wieland, and Yossi. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.5">I am very grateful to my coauthor, Amita, for her valuable comments and suggestions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.6">I am extremely thankful to the reviewers of this book, Eric Brewer, Corrado Zoccolo, and Sujit Pal, for going through the entire book content. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.7">Special thanks to my manager, Eyal, for supporting me during the writing process and for the trust constantly offered. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.8">Part of this book has been written in Charlotte Menora (</span><a href="http://bistrocharlotte.pl/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">http://bistrocharlotte.pl/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">), a pub in Warsaw, where I found myself writing pages after work. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">This is an inspirational place, which I definitively recommend if you are visiting Poland. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">Modern and cool as the city of Warsaw is these days. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.4">Last and not the least, I am grateful to the entire editorial team of Packt, especially Tushar Gupta and Tejas Limkar for all the support, constant reminders regarding the schedule, and continuous motivation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.5">Thanks for your patience.</span></div>
<p><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Amita Kapoor</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"> is an associate professor in the Department of Electronics, SRCASW, University of Delhi. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">She has been actively teaching neural networks for the last 20 years. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">She did her master's in electronics in 1996 and PhD in 2011. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.4">During her PhD, she was awarded the prestigious DAAD fellowship to pursue a part of her research work in Karlsruhe Institute of Technology, Karlsruhe, Germany. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.5"> She had been awarded the best presentation award at International Conference Photonics 2008 for her paper. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.6">She is a member of professional bodies such as OSA (Optical Society of America), IEEE (Institute of Electrical and Electronics Engineers), INNS (International Neural Network Society), and ISBS (Indian Society for Buddhist Studies). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.7">Amita has more than 40 publications in international journals and conferences to her credit. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.8">Her present research areas include machine learning, artificial intelligence, neural networks, robotics, Buddhism (philosophy and psychology) and ethics in AI.</span></p>
<div class="packt_quote"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">This book is an attempt to summarize what all I had learned in the field of deep neural networks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">I have presented it in a manner that readers find easy to understand and apply, and so the prime motivation of this book comes from you, the readers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">I thank every reader of this book for being consistently present at the back of my mind, especially when I felt lazy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.4">I would also like to thank professor Parongama Sen, University of Calcutta, for introducing me to the subject in 1994, and my friends Nirjara Jain and Shubha Swaminathan for the hours spent in college library discussing Asimov, his stories, and the future that neural networks behold for our society. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.5">I am very grateful to my coauthor, Antonio Guili, for his valuable comments and suggestions and the reviewers of this book, Narotam Singh and Nick McClure, for painstakingly going through the entire content and rechecking the codes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.6">Last and not the least, I am grateful to the entire editorial team of Packt, especially Tushar Gupta and Tejas Limkar for all the support, constant reminders regarding schedule, and continuous motivation.</span></div>


            </article>
