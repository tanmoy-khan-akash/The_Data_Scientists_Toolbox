        <title>Meta-learning with recurrent networks and with reinforcement learning</title>

        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Meta-learning with recurrent networks and with reinforcement learning</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The key idea to tackle this problem is to have a controller network which proposes a </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">child</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> model architecture with probability </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">p</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">, given a particular network given in input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">The child is trained and evaluated for the particular task to be solved (say for instance that the child gets accuracy </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">R</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">This evaluation </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">R</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"> is passed back to the controller which, in turn, uses R to improve the next candidate architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">Given this framework, it is possible to model the feedback from the candidate child to the controller as the task of computing the gradient of </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">p</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1"> and then scale this gradient by </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">R</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">The controller can be implemented as a Recurrent Neural Network (see the following figure). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.3">In doing so, the controller will tend to privilege iteration after iterations candidate areas of architecture that achieve better </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">R</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> and will tend to assign a lower probability to candidate areas that do not score so well.</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1"><img height="136" width="303" src="assets/30ccd28f-f08f-4323-aae4-313b11ba8ddb.png"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">For instance, a controller recurrent neural network can sample a convolutional network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">The controller can predict many hyper-parameters such as filter height, filter width, stride height, stride width, and the number of filters for one layer and then can repeat. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.3">Every prediction can be carried out by a softmax classifier and then fed into the next RNN time step as input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.4">This is well expressed by the following images taken from </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Neural Architecture Search with Reinforcement Learning</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">, Barret Zoph, Quoc V. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">Le, </span><a href="https://arxiv.org/abs/1611.01578" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">https://arxiv.org/abs/1611.01578</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1"><img height="331" width="842" class="alignnone size-full wp-image-1076 image-border" src="assets/9986f40c-9051-4483-959c-00a067ed0e2a.png"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Predicting hyperparameters is not enough as it would be optimal to define a set of actions to create new layers in the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.2">This is particularly difficult because the reward function describing the new layers is most likely not differentiable and therefore it would not be possible to optimize it with standard techniques such as SGD. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.3">The solution comes from reinforcement learning and it consists of adopting a policy gradient network similar to the one described in our </span><a href="671df089-57af-4c8f-b498-050188364865.xhtml" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Chapter 9</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Reinforcement Learning</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Besides that, parallelism can be used for optimizing the parameters of the controller RNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">Quoc Le &amp; Barret Zoph proposed to adopt a parameter-server scheme where we have a parameter server of S shards, that store the shared parameters for K controller replicas. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.3">Each controller replica samples m different child architectures that are trained in parallel as illustrated in the following images, taken from </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Neural Architecture Search with Reinforcement Learning</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">, Barret Zoph, Quoc V. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">Le, </span><a href="https://arxiv.org/abs/1611.01578" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">https://arxiv.org/abs/1611.01578</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1"><img src="assets/23d54b43-728d-4230-b0ab-4d219de2c679.png"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Quoc and Barret applied AutoML techniques for Neural Architecture Search to the Penn Treebank dataset (</span><a href="https://en.wikipedia.org/wiki/Treebank" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">https://en.wikipedia.org/wiki/Treebank</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">), a well-known benchmark for language modeling. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.2">Their results improve the manually designed networks currently considered the state-of-the-art. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.3">In particular, they achieve a test set perplexity of 62.4 on the Penn Treebank, which is 3.6 perplexity better than the previous state-of-the-art model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.4">Similarly, on the CIFAR-10 dataset (</span><a href="https://www.cs.toronto.edu/~kriz/cifar.html" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">https://www.cs.toronto.edu/~kriz/cifar.html</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">), starting from scratch, the method can design a novel network architecture that rivals the best human-invented architecture in terms of test set accuracy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">The proposed CIFAR-10 model achieves a test error rate of 3.65, which is 0.09 percent better and 1.05x faster than the previous state-of-the-art model that used a similar architectural scheme.</span></p>


            </article>

            
        </section>
