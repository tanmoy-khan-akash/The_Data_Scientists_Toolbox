        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Introduction</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Autoencoders, also known as </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Diabolo networks</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> or </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">autoassociators</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">, was initially proposed in the 1980s by Hinton and the PDP group [1]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">They are feedforward networks, without any feedback, and they learn via unsupervised learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">Like multiplayer perceptrons of </span><a href="8a46655c-6805-48b5-b4c1-c35457883d78.xhtml" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Chapter 3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Neural Networks-Perceptrons</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">, they use the backpropagation algorithm to learn, but with a major difference--the target is the same as the input. </span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">We can think of an autoencoder as consisting of two cascaded networks--the first network is an encoder, it takes the input </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">x</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">, and encodes it using a transformation </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">h</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1"> to encoded signal </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">y</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">:</span></p>
<div class="CDPAlignCenter CDPAlign"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">y</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1"> = </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">h</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">(</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">x</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">)</span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">The second network uses the encoded signal </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">y</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"> as its input and performs another transformation </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">f</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1"> to get a reconstructed signal </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">r</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">:</span></p>
<div class="mce-root CDPAlignCenter CDPAlign"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">r</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"> = </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">f</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">(</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">y</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">) = </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">f</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">(</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">h</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">(</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">x</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">))</span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">We define error </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">e</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"> as the difference between the original input </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">x</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1"> and the reconstructed signal </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">r, e</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"> = </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">x</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1"> - </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">r.</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1"> The network then learns by reducing the </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">mean squared error</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">MSE</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">), and the error is propagated back to the hidden layers as in the case of MLPs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.2">The following figure shows an autoencoder with encoder and decoder highlighted separately. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.3">Autoencoders can have weight sharing, that is, weights of decoder and encoder are simply a transpose of each other, which can help the network learn faster as the number of training parameters is less, but at the same time reduces the degrees of freedom of the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.4">They are very similar to RBMs of </span><a href="7107d74d-abaa-4d1e-86c5-4739cb12a876.xhtml" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">Chapter 7</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">,</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1"> Unsupervised Learning</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">, but with one big difference--the state of the neurons in autoencoders is deterministic, while in RBMs, the state of the neurons is probabilistic:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1"><img src="assets/e02f44f9-d555-4a46-9f16-f3b0307bf6ce.png"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">Depending on the size of the hidden layer, autoencoders are classified as </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Undercomplete</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1"> (hidden layer has fewer neurons than the input layer) or </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">Overcomplete</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"> (hidden layer has more neurons than the input layer). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.2">Depending on the restriction/constraints imposed on the loss, we have various types of autoencoders: Sparse Autoencoders, Denoising Autoencoders, and Convolution Autoencoders. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.3">In this chapter, you will learn about these variations in autoencoders and implement them using TensorFlow.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">One of the obvious applications of autoencoders is in the field of dimensionality reduction [2]; the results show that autoencoders yield better results as compared to PCA. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.2">Autoencoders can also be used for feature extraction [3], document retrieval [2], classification, and anomaly detection.</span></p>


            </article>
