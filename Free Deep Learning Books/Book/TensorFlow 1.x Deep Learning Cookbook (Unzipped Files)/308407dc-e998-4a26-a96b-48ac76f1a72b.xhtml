        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The code here is based on the paper Autoencoding Variational Bayes by Kingma and Welling (</span><a href="https://arxiv.org/pdf/1312.6114.pdf"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://arxiv.org/pdf/1312.6114.pdf</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">), and is adapted from GitHub: </span><a href="https://jmetzen.github.io/2015-11-27/vae.html"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">https://jmetzen.github.io/2015-11-27/vae.html</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> .</span></p>
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">The first step is as always importing the necessary modules. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">For this recipe we will require Numpy, Matplolib, and TensorFlow:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">import numpy as np</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">import tensorflow as tf</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">import matplotlib.pyplot as plt</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">%matplotlib inline</span></pre>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Next, we define the VariationalAutoencoder class. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">The </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">class __init__ method</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1"> defines the hyperparameters such as the learning rate, batch size, the placeholders for the input, and the weight and bias variables for the encoder and decoder network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">It also builds the computational graph according to the network architecture of the VAE. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.3">We initialize the weights using Xavier initialization in this recipe. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.4">Instead of defining our own method for Xavier initialization, we use the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">tf.contrib.layers.xavier_initializer()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> TensorFlow to do the task. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">Lastly, we define the loss (generation and latent) and optimizer ops:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">class VariationalAutoencoder(object):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">  def __init__(self, network_architecture,   transfer_fct=tf.nn.softplus,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">learning_rate=0.001, batch_size=100):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">      self.network_architecture = network_architecture</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">      self.transfer_fct = transfer_fct</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">      self.learning_rate = learning_rate</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">      self.batch_size = batch_size</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">      # Place holder for the input</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">      self.x = tf.placeholder(tf.float32, [None,    network_architecture["n_input"]])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">      # Define weights and biases</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">      network_weights = self._initialize_weights(**self.network_architecture)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">      # Create autoencoder network</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">      # Use Encoder Network to determine mean and</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">      # (log) variance of Gaussian distribution in latent</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">      # space</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">      self.z_mean, self.z_log_sigma_sq = \</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">      self._encoder_network(network_weights["weights_encoder"],</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">    network_weights["biases_encoder"])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">      # Draw one sample z from Gaussian distribution</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">      n_z = self.network_architecture["n_z"]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">      eps = tf.random_normal((self.batch_size, n_z), 0, 1, dtype=tf.float32)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">      # z = mu + sigma*epsilon</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">      self.z =       tf.add(self.z_mean,tf.multiply(tf.sqrt(tf.exp(self.z_log_sigma_sq)), eps))</span><br/>  <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">      # Use Decoder network to determine mean of</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">      # Bernoulli distribution of reconstructed input</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">      self.x_reconstr_mean = \</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">      self._decoder_network(network_weights["weights_decoder"],</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">   network_weights["biases_decoder"])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">      # Define loss function based variational upper-bound and </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">      # corresponding optimizer</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">      # define generation loss</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">      generation_loss = \</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">  -tf.reduce_sum(self.x * tf.log(1e-10 + self.x_reconstr_mean)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">+ (1-self.x) * tf.log(1e-10 + 1 - self.x_reconstr_mean), 1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">      latent_loss = -0.5 * tf.reduce_sum(1 + self.z_log_sigma_sq</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">- tf.square(self.z_mean)- tf.exp(self.z_log_sigma_sq), 1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">      self.cost = tf.reduce_mean(generation_loss + latent_loss)       #    average over batch</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">      # Define the optimizer</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">      self.optimizer = \</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1"> tf.train.AdamOptimizer(learning_rate=self.learning_rate).minimize(self.cost)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">      # Initializing the tensor flow variables</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">      init = tf.global_variables_initializer()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">  # Launch the session</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">      self.sess = tf.InteractiveSession()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">      self.sess.run(init)</span><br/>  <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">def _initialize_weights(self, n_hidden_recog_1, n_hidden_recog_2,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">n_hidden_gener_1, n_hidden_gener_2,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">n_input, n_z):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">   initializer = tf.contrib.layers.xavier_initializer()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">   all_weights = dict()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">   all_weights['weights_encoder'] = {</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">   'h1': tf.Variable(initializer(shape=(n_input, n_hidden_recog_1))),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">   'h2': tf.Variable(initializer(shape=(n_hidden_recog_1, n_hidden_recog_2))),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">   'out_mean': tf.Variable(initializer(shape=(n_hidden_recog_2, n_z))),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">   'out_log_sigma': tf.Variable(initializer(shape=(n_hidden_recog_2, n_z)))}</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">   all_weights['biases_encoder'] = {</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">   'b1': tf.Variable(tf.zeros([n_hidden_recog_1], dtype=tf.float32)),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">   'b2': tf.Variable(tf.zeros([n_hidden_recog_2], dtype=tf.float32)),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">   'out_mean': tf.Variable(tf.zeros([n_z], dtype=tf.float32)),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">   'out_log_sigma': tf.Variable(tf.zeros([n_z], dtype=tf.float32))}</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">   all_weights['weights_decoder'] = {</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">   'h1': tf.Variable(initializer(shape=(n_z, n_hidden_gener_1))),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">   'h2': tf.Variable(initializer(shape=(n_hidden_gener_1, n_hidden_gener_2))),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">   'out_mean': tf.Variable(initializer(shape=(n_hidden_gener_2, n_input))),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">   'out_log_sigma': tf.Variable(initializer(shape=(n_hidden_gener_2, n_input)))}</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">    all_weights['biases_decoder'] = {</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">   'b1': tf.Variable(tf.zeros([n_hidden_gener_1],    dtype=tf.float32)),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">   'b2': tf.Variable(tf.zeros([n_hidden_gener_2], dtype=tf.float32)),'out_mean': tf.Variable(tf.zeros([n_input], dtype=tf.float32)),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">   'out_log_sigma': tf.Variable(tf.zeros([n_input], dtype=tf.float32))}</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">   return all_weights</span></pre>
<ol start="3">
<li class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">We build the encoder network and the decoder network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.2">The first layer of the Encoder network is taking the input and generating a reduced latent representation of the input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.3">The second layer maps the input to a Gaussian distribution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.4">The network learns these transformations:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">def _encoder_network(self, weights, biases):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">  # Generate probabilistic encoder (recognition network), which</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">  # maps inputs onto a normal distribution in latent space.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">  # The transformation is parametrized and can be learned.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">  layer_1 = self.transfer_fct(tf.add(tf.matmul(self.x,     weights['h1']),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">biases['b1']))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">  layer_2 = self.transfer_fct(tf.add(tf.matmul(layer_1,   weights['h2']),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">biases['b2']))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">  z_mean = tf.add(tf.matmul(layer_2, weights['out_mean']),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">biases['out_mean'])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">  z_log_sigma_sq = \</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">tf.add(tf.matmul(layer_2, weights['out_log_sigma']),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">biases['out_log_sigma'])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">  return (z_mean, z_log_sigma_sq)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">def _decoder_network(self, weights, biases):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">  # Generate probabilistic decoder (decoder network), which</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">  # maps points in latent space onto a Bernoulli distribution in data space.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">  # The transformation is parametrized and can be learned.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">  layer_1 = self.transfer_fct(tf.add(tf.matmul(self.z, weights['h1']),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">biases['b1']))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">  layer_2 = self.transfer_fct(tf.add(tf.matmul(layer_1, weights['h2']),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">biases['b2']))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">  x_reconstr_mean = \</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">tf.nn.sigmoid(tf.add(tf.matmul(layer_2, weights['out_mean']),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">  biases['out_mean']))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">  return x_reconstr_mean</span></pre>
<ol start="4">
<li class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">The class VariationalAutoencoder also contains some helper functions to generate and reconstruct data, and to fit the VAE:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">def fit(self, X):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">  opt, cost = self.sess.run((self.optimizer, self.cost),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">  feed_dict={self.x: X})</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">  return cost</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">def generate(self, z_mu=None):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">""" Generate data by sampling from latent space.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">If z_mu is not None, data for this point in latent space is</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">generated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.2">Otherwise, z_mu is drawn from prior in latent</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">space.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">"""</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">  if z_mu is None:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">    z_mu = np.random.normal(size=self.network_architecture["n_z"])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1"># Note: This maps to mean of distribution, we could alternatively</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1"># sample from Gaussian distribution</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">  return self.sess.run(self.x_reconstr_mean,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">      feed_dict={self.z: z_mu})</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">def reconstruct(self, X):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">""" Use VAE to reconstruct given data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.2">"""</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">  return self.sess.run(self.x_reconstr_mean,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">    feed_dict={self.x: X})</span></pre>
<ol start="5">
<li class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">Once the VAE class is done, we define a function</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1"> train, which uses the VAE class object and trains it for a given data.</span></span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">def train(network_architecture, learning_rate=0.001,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">batch_size=100, training_epochs=10, display_step=5):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">  vae = VariationalAutoencoder(network_architecture,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">  learning_rate=learning_rate,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">  batch_size=batch_size)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">  # Training cycle</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">  for epoch in range(training_epochs):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">    avg_cost = 0.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">    total_batch = int(n_samples / batch_size)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">    # Loop over all batches</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">    for i in range(total_batch):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">      batch_xs, _ = mnist.train.next_batch(batch_size)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">      # Fit training using batch data</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">      cost = vae.fit(batch_xs)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">      # Compute average loss</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">      avg_cost += cost / n_samples * batch_size</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">      # Display logs per epoch step</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">     if epoch % display_step == 0:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">       print("Epoch:", '%04d' % (epoch+1), </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">           "cost=", "{:.9f}".format(avg_cost))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">  return vae</span></pre>
<ol start="6">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">Let us now use the VAE clas</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">s and train function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.2">We use the VAE for our favorite MNIST dataset:</span></span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1"># Load MNIST data in a format suited for tensorflow.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1"># The script input_data is available under this URL:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">#https://raw.githubusercontent.com/tensorflow/tensorflow/master/tensorflow/examples/tutorials/mnist/input_data.py</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">from tensorflow.examples.tutorials.mnist import input_data</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">mnist = input_data.read_data_sets('MNIST_data', one_hot=True)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">n_samples = mnist.train.num_examples</span><br/><br/></pre>
<ol start="7">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">We define the network-architecture and perform training of VAE on MNIST dataset. In this case, we keep the latent dimensions 2 for simplicity.</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">network_architecture = \</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">dict(n_hidden_recog_1=500, # 1st layer encoder neurons</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">n_hidden_recog_2=500, # 2nd layer encoder neurons</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">n_hidden_gener_1=500, # 1st layer decoder neurons</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">n_hidden_gener_2=500, # 2nd layer decoder neurons</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">n_input=784, # MNIST data input (img shape: 28*28)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">n_z=2) # dimensionality of latent space</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">vae = train(network_architecture, training_epochs=75)</span></pre>
<ol start="8">
<li class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">Let us now see if the VAE really reconstructs the input or not. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.2">The output shows that digits are indeed reconstructed, and since we have used a 2D latent space, there is a significant blurring of the images:</span></li>
</ol>
<pre class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">x_sample = mnist.test.next_batch(100)[0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">x_reconstruct = vae.reconstruct(x_sample)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">plt.figure(figsize=(8, 12))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">for i in range(5):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">  plt.subplot(5, 2, 2*i + 1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">  plt.imshow(x_sample[i].reshape(28, 28),  vmin=0, vmax=1, cmap="gray")</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">  plt.title("Test input")</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">  plt.colorbar()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">  plt.subplot(5, 2, 2*i + 2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">  plt.imshow(x_reconstruct[i].reshape(28, 28), vmin=0, vmax=1, cmap="gray")</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">  plt.title("Reconstruction")</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">  plt.colorbar()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">  plt.tight_layout()</span></pre>
