                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How it works...</span></h1>
                </header>
            
            <article>
                
<p><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Weights were initialized using Xavier initialization, which ensures that our weights are neither too large nor too small; both cases impede the learning of the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">In Xavier initialization, the weights are assigned a value from a distribution with zero mean and a specific variance </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">2/(n</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">in</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">+n</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">out</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">)</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">, where </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">n</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">in</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1"> and </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">n</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">out</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1"> are respectively the numbers of inputs and output of the layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">To know more about Xavier initialization, you can refer to Glorot and Bengio's 2009 paper; details are given in the</span></span> <em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">See also</span></em> <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">section.</span></span></p>


            </article>
