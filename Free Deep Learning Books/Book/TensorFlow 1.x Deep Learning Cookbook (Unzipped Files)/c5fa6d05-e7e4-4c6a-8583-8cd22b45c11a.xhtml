                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How it works...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The preceding code implements a random agent; the agent randomly selects one of the four actions:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"><img height="225" width="300" src="assets/0b56e265-ff8c-4e5d-b752-b1b1e46dab61.jpg"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Another important thing to observe is that in this environment, the action space is Discrete, while the observation space is of type Box. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">The terms Discrete and Box in reference to space (action/observation) in OpenAI refer to the allowed values. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">The Discrete space allows a fixed range of non-negative numbers, in our case, (0,1,2,3). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.4">The Box space, on the other hand, represents an </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">n</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">-dimensional box, thus any valid observation would be an array of 210 × 160 × 3 numbers </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">for Pac-Man</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">.</span></p>


            </article>
