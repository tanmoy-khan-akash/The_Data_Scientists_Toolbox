                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Applications of Siamese Networks</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The Siamese networks have been in recent years used for a lot of applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Their first used in the LeCun paper was for signature verification. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Since then a large number of applications have emerged, we will present some of the recent ones:</span></p>
<ul>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Joint Learning of Speaker and Phonetic Similarities with Siamese Networks (</span><a href="https://pdfs.semanticscholar.org/4ffe/3394628a8a0ffd4cba1a77ea85e197bd4c22.pdf"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">https://pdfs.semanticscholar.org/4ffe/3394628a8a0ffd4cba1a77ea85e197bd4c22.pdf</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">): They trained a multi-output Siamese network, with one output for phonetic similarity and other for the speaker similarity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">They extended the work to include Triamese Network.</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Fully-Convolutional Siamese Network for Object Tracking (</span><a href="https://link.springer.com/chapter/10.1007/978-3-319-48881-3_56"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">https://link.springer.com/chapter/10.1007/978-3-319-48881-3_56</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">): They used convolutional Siamese network trained on ILSVRC15 dataset for object detection in Video.</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Together We stand: Siamese Networks for Similar Question Retrieval (</span><a href="http://www.aclweb.org/anthology/P16-1036"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">http://www.aclweb.org/anthology/P16-1036</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">): The paper used Siamese Network to find the semantic similarity between the current and archived questions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">They also used convolutional Siamese Networks.</span></li>
</ul>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Besides these, Siamese networks have also been explored for face verification/recognition (</span><a href="https://github.com/harveyslash/Facial-Similarity-with-Siamese-Networks-in-Pytorch" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">https://github.com/harveyslash/Facial-Similarity-with-Siamese-Networks-in-Pytorch</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">They have been used for Question-Answering (</span><a href="https://arxiv.org/pdf/1512.05193v2.pdf"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">https://arxiv.org/pdf/1512.05193v2.pdf</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">).</span></p>


            </article>
