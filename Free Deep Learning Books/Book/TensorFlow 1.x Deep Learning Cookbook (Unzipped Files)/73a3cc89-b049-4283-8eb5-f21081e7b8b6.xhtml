                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Migrating from 0.x to 1.x</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">TensorFlow 1.x does not offer backward compatibility. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">This means that the codes that worked on TensorFlow 0.x may not work on TensorFlow 1.0. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">So, if you have codes that worked on TensorFlow 0.x, you need to upgrade them (old GitHub repositories or your own codes). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">This recipe will point out major differences between TensorFlow 0.x and TensorFlow 1.0 and will show you how to use the script </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">tf_upgrade.py</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> to automatically upgrade the code for TensorFlow 1.0.</span></p>


            </article>
