        <title>How to do it...</title>
        <link rel="stylesheet" href="css/style.css" type="text/css"/>

<!-- kobo-style -->
<script xmlns="http://www.w3.org/1999/xhtml" type="text/javascript" src="js/kobo.js"/>

    <body>
        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We proceed with the recipe as follows:</span></p>
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">As always, we start with importing the necessary modules:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">import tensorflow as tf</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">import numpy as np</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">import matplotlib.pyplot as plt</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">%matplotlib inline</span></pre>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Next, we declare a class, WTU, which will perform all the tasks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">The class is instantiated with </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">m x n</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"> the size of the 2D SOM lattice, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">dim</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1"> the number of dimensions in the input data, and the total number of iterations:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">def __init__(self, m, n, dim, num_iterations, eta = 0.5, sigma = None):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">    """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">    m x n : The dimension of 2D lattice in which neurons are     arranged</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">    dim : Dimension of input training data</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">    num_iterations: Total number of training iterations</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">    eta : Learning rate</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">    sigma: The radius of neighbourhood function.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">    """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">    self._m = m</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">    self._n = n</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">    self._neighbourhood = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">    self._topography = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">    self._num_iterations = int(num_iterations) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">    self._learned = False</span></pre>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">In the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">__init__</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1"> itself, we define the computation graph and the session.</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">If the network is not provided with any </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">sigma</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"> value, it will take a default value, which is normally half of the maximum dimension of the SOM lattice:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">if sigma is None:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">    sigma = max(m,n)/2.0 # Constant radius</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">else:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">    sigma = float(sigma)</span></pre>
<ol start="5">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">Next, in the graph, we declare variables for the weight matrix, placeholders for the input, and computational steps to calculate the winner and update its and its neighbors' weight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.2">As SOM provides a topographic map, we also add ops to get the topographic location of neurons:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">self._graph = tf.Graph()</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1"># Build Computation Graph of SOM</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1"> with self._graph.as_default():</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"># Weight Matrix and the topography of neurons</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">    self._W = tf.Variable(tf.random_normal([m*n, dim], seed = 0))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">    self._topography = tf.constant(np.array(list(self._neuron_location(m, n))))</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">    # Placeholders for training data</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">    self._X = tf.placeholder('float', [dim])</span><br/>    <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">    # Placeholder to keep track of number of iterations</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">    self._iter = tf.placeholder('float')</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">    # Finding the Winner and its location</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">    d = tf.sqrt(tf.reduce_sum(tf.pow(self._W - tf.stack([self._X </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">          for i in range(m*n)]),2),1))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">    self.WTU_idx = tf.argmin(d,0)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">    slice_start = tf.pad(tf.reshape(self.WTU_idx, [1]),np.array([[0,1]]))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">    self.WTU_loc = tf.reshape(tf.slice(self._topography, slice_start,             [1,2]), [2])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">    # Change learning rate and radius as a function of iterations</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">    learning_rate = 1 - self._iter/self._num_iterations</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">    _eta_new = eta * learning_rate</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">    _sigma_new = sigma * learning_rate</span><br/>   <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">    # Calculating Neighbourhood function</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">    distance_square = tf.reduce_sum(tf.pow(tf.subtract(</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">    self._topography, tf.stack([self.WTU_loc for i in range(m * n)])), 2), 1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">    neighbourhood_func = tf.exp(tf.negative(tf.div(tf.cast(</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">distance_square, "float32"), tf.pow(_sigma_new, 2))))</span><br/>    <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">    # multiply learning rate with neighbourhood func</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">    eta_into_Gamma = tf.multiply(_eta_new, neighbourhood_func)</span><br/>    <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">    # Shape it so that it can be multiplied to calculate dW</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">    weight_multiplier = tf.stack([tf.tile(tf.slice(</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">eta_into_Gamma, np.array([i]), np.array([1])), [dim])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">for i in range(m * n)])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">    delta_W = tf.multiply(weight_multiplier,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">tf.subtract(tf.stack([self._X for i in range(m * n)]),self._W))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">    new_W = self._W + delta_W</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">    self._training = tf.assign(self._W,new_W)</span><br/>   <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">   # Initialize All variables</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">   init = tf.global_variables_initializer()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">   self._sess = tf.Session()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">   self._sess.run(init)</span></pre>
<ol start="6">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">We define a </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">fit</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1"> method for the class, which executes the training op declared in the default graph of the class. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.2">The method also calculates centroid grid:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">def fit(self, X):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"> """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1"> Function to carry out training</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1"> """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1"> for i in range(self._num_iterations):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">   for x in X:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">       self._sess.run(self._training, feed_dict= {self._X:x, self._iter: i})</span><br/> <br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1"> # Store a centroid grid for easy retreival</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1"> centroid_grid = [[] for i in range(self._m)]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1"> self._Wts = list(self._sess.run(self._W))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1"> self._locations = list(self._sess.run(self._topography))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1"> for i, loc in enumerate(self._locations):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">      centroid_grid[loc[0]].append(self._Wts[i])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1"> self._centroid_grid = centroid_grid</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1"> self._learned = True</span></pre>
<ol start="7">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">We define a function to determine the index and the location of the winning neuron in the 2D lattice:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">def winner(self, x):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">    idx = self._sess.run([self.WTU_idx,self.WTU_loc], feed_dict = {self._X:x})</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">    return idx</span></pre>
<ol start="8">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">We define some more helper functions to perform the 2D mapping of neurons in the lattice and to map input vectors to the relevant neurons in the 2D lattice:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">def _neuron_location(self,m,n):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">    """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">    Function to generate the 2D lattice of neurons</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">    """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">    for i in range(m):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">       for j in range(n):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">           yield np.array([i,j])</span><br/> <br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">def get_centroids(self):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">    """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">    Function to return a list of 'm' lists, with each inner     list containing the 'n' corresponding centroid locations     as 1-D NumPy arrays.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">    """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">    if not self._learned:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">       raise ValueError("SOM not trained yet")</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">    return self._centroid_grid</span></pre>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">def map_vects(self, X):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">    """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">    Function to map each input vector to the relevant neuron         in the lattice</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">    """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">    if not self._learned:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">        raise ValueError("SOM not trained yet")</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">    to_return = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">    for vect in X:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">       min_index = min([i for i in range(len(self._Wts))],</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">       key=lambda x: np.linalg.norm(vect -</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">self._Wts[x]))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">       to_return.append(self._locations[min_index])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">return to_return</span></pre>
<ol start="9">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">Now that our WTU class is ready, we read data from the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">.csv</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1"> file and normalize it:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">def normalize(df):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">    result = df.copy()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">    for feature_name in df.columns:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">       max_value = df[feature_name].max()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">       min_value = df[feature_name].min()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">       result[feature_name] = (df[feature_name] - min_value) / (max_value - min_value)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">    return result</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1"># Reading input data from file</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">import pandas as pd</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">df = pd.read_csv('colors.csv') # The last column of data file is a label</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">data = normalize(df[['R', 'G', 'B']]).values</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">name = df['Color-Name'].values</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">n_dim = len(df.columns) - 1</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1"># Data for Training</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">colors = data</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">color_names = name</span></pre>
<ol start="10">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">Finally, we use our class to perform dimensionality reduction and arrange it in a beautiful topographic map:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">som = WTU(30, 30, n_dim, 400, sigma=10.0)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">som.fit(colors)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1"># Get output grid</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">image_grid = som.get_centroids()</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1"># Map colours to their closest neurons</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">mapped = som.map_vects(colors)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1"># Plot</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">plt.imshow(image_grid)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">plt.title('Color Grid SOM')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">for i, m in enumerate(mapped):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">     plt.text(m[1], m[0], color_names[i], ha='center', va='center', bbox=dict(facecolor='white', alpha=0.5, lw=0))</span></pre>
