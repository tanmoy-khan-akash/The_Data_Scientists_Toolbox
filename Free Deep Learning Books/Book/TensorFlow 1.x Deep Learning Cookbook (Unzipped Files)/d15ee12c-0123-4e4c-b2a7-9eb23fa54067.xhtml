                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting ready</span></h1>

            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">For this recipe, we are not going to write code, instead, I'll show you how to use some code available online (</span><a href="https://github.com/tensorflow/magenta/tree/master/magenta/models/nsynth"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://github.com/tensorflow/magenta/tree/master/magenta/models/nsynth</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">)  and some cool demos you can find from Google Brain (</span><a href="https://aiexperiments.withgoogle.com/sound-maker"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">https://aiexperiments.withgoogle.com/sound-maker</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">) . </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">The interested reader can also have a look the the paper </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Neural Audio Synthesis of Musical Notes with WaveNet Autoencoders,</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"> Jesse Engel, Cinjon Resnick, Adam Roberts, Sander Dieleman, Douglas Eck, Karen Simonyan, Mohammad Norouzi, 5 Apr 2017</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">. </span></em><a href="https://arxiv.org/abs/1704.01279"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">https://arxiv.org/abs/1704.01279</span></a></p>


            </article>
