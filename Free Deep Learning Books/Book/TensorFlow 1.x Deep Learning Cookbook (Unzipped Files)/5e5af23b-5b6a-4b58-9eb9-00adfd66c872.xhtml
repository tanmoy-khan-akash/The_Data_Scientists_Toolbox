        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Meta-learning novel tasks</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Meta-learning systems can be trained to achieve a large number of tasks and are then tested for their ability to learn new tasks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">A famous example of this kind of meta-learning is the so-called Transfer Learning discussed in the Chapter on Advanced CNNs, where networks can successfully learn new image-based tasks from relatively small datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">However, there is no analogous pre-training scheme for non-vision domains such as speech, language, and text.</span></p>
<p><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Model-Agnostic Meta-Learning for Fast Adaptation of Deep Networks</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">, Chelsea Finn, Pieter Abbeel, Sergey Levine, 2017, </span><a href="https://arxiv.org/abs/1703.03400" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">https://arxiv.org/abs/1703.03400</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> proposes a model-agnostic approach names MAML, compatible with any model trained with gradient descent and applicable to a variety of different learning problems, including classification, regression, and reinforcement learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">The goal of meta-learning is to train a model on a variety of learning tasks, such that it can solve new learning tasks using only a small number of training samples. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">The meta-learner aims at finding an initialization that rapidly adapts to various problems quickly (in a small number of steps) and efficiently (using only a few examples). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.4">A model represented by a parametrized function f</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">θ</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"> with parameters θ. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">When adapting to a new task T</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">, the model's parameters θ become θ</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">i</span></sub><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">~</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">In MAML, the updated parameter vector θ</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">i</span></sub><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">'</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> is computed using one or more gradient descent updates on task T</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">For example, when using one gradient update, θ</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">i</span></sub><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">~</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1"> = θ − α∇</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">θ</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">L</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Ti</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"> (f</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">θ</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">) where L</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Ti</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1"> is the loss function for the task T and α is a meta-learning parameter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">The MAML algorithm is reported in this figure:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1"><img height="318" width="486" class="alignnone size-full wp-image-1079 image-border" src="assets/30503d87-ad59-4ec7-8e66-2918624faaf7.png"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">MAML was able to substantially outperform a number of existing approaches on popular few-shot image classification benchmark. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.2">Few shot image is a quite challenging problem aiming at learning new concepts from one or a few instances of that concept. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.3">As an example, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">Human-level concept learning through probabilistic program induction</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">, Brenden M. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">Lake, Ruslan Salakhutdinov, Joshua B. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.3">Tenenbaum, 2015, </span><a href="https://www.cs.cmu.edu/~rsalakhu/papers/LakeEtAl2015Science.pdf" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">https://www.cs.cmu.edu/~rsalakhu/papers/LakeEtAl2015Science.pdf</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">, suggested that humans can learn to identify novel two-wheel vehicles from a single picture such as the one contained in a red box as follows:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1"><img height="224" width="210" class="alignnone size-full wp-image-1080 image-border" src="assets/d55d0f5e-ee42-4c09-a213-65fadee76b26.png"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">At the end of 2017, the topic of AutoML (or meta-learning) is an active research topic that aims at auto-selecting the most efficient neural network for a given learning task. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.2">The goal is to learn how to efficiently and automatically design networks that, in turn, can learn specific tasks or can adapt to new tasks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.3">The main problem is that designing a network cannot simply be described with a differentiable loss function and therefore traditional optimization techniques cannot simply be adopted for meta-learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.4">Therefore a few solutions have been proposed including the idea of having a controller recurrent network (RNN) and a reward policy based on reinforcement learning and the idea of having a model-agnostic meta-Learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.5">Both the approaches are very promising but there is certainly still a lot of room for research.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">So, if you are interested in a hot topic, this </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">Learning to learn for deep learning</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"> is certainly a space to consider as your next job.</span></p>
<ul>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">Google proposed the adoption of RNNs for the controller in </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">Using Machine Learning to Explore Neural Network Architecture</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">; Quoc Le &amp; Barret Zoph, 2017, </span><a href="https://research.googleblog.com/2017/05/using-machine-learning-to-explore.html"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">https://research.googleblog.com/2017/05/using-machine-learning-to-explore.html</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">.</span></li>
<li class="MsoNormalCxSpMiddle"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">Neural Architecture Search with Reinforcement Learning</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">, Barret Zoph, Quoc V. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.2">Le, </span><a href="https://arxiv.org/abs/1611.01578"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">https://arxiv.org/abs/1611.01578</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">, is a seminal paper proving more details about Google's approach. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.2">However, RNNs are not the only option.</span></li>
<li class="MsoNormalCxSpMiddle"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Large-Scale Evolution of Image Classifiers</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">, Esteban Real, Sherry Moore, Andrew Selle, Saurabh Saxena, Yutaka Leon Suematsu, Jie Tan, Quoc Le, Alex Kurakin, 2017, </span><a href="https://arxiv.org/abs/1703.01041" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">https://arxiv.org/abs/1703.01041</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">, proposed to use evolutionary computing where genetic intuitive mutation operations are explored to generate new candidate networks.</span></li>
<li class="MsoNormalCxSpMiddle"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">Learning Transferable Architectures for Scalable Image Recognition</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">, Barret Zoph, Vijay Vasudevan, Jonathon Shlens, Quoc V. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.2">Le, </span><a href="https://arxiv.org/abs/1707.07012" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">https://arxiv.org/abs/1707.07012</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">, proposed the idea of cells learnt on CIFAR and used for improving ImageNet classification.</span></li>
<li class="MsoNormalCxSpMiddle"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">Building A.I. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.2">That Can Build A.I.: Google and others, fighting for a small pool of researchers, are looking for automated ways to deal with a shortage of artificial intelligence experts.</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">, The New York Times, </span><a href="https://www.nytimes.com/2017/11/05/technology/machine-learning-artificial-intelligence-ai.html" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">https://www.nytimes.com/2017/11/05/technology/machine-learning-artificial-intelligence-ai.html</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">.</span></li>
<li><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">Model-Agnostic Meta-Learning for Fast Adaptation of Deep Networks</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">, Chelsea Finn, Pieter Abbeel, Sergey Levine, 2017, </span><a href="https://arxiv.org/abs/1703.03400" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">https://arxiv.org/abs/1703.03400</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">.</span></li>
<li><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">Learning to Learn by Gradient Descent by Gradient Descent</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">, Marcin Andrychowicz, Misha Denil, Sergio Gomez, Matthew W. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.2">Hoffman, David Pfau, Tom Schaul, Brendan Shillingford, Nando de Freitas, </span><a href="https://arxiv.org/abs/1606.04474"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">https://arxiv.org/abs/1606.04474</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">, shows how the design of an optimization algorithm can be cast as a learning problem, allowing the algorithm to learn to exploit structure in the problems of interest in an automatic way. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.2">The LSMT learned algorithms outperform hand-designed competitors on the tasks for which they are trained, and also generalize well to new tasks with similar structure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.3">The code for this algorithm is available on GitHub at </span><a href="https://github.com/deepmind/learning-to-learn"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">https://github.com/deepmind/learning-to-learn</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">.</span></li>
</ul>
