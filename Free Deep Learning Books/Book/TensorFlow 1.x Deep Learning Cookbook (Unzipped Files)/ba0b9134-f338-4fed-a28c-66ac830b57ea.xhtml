        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">There's more...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Training the agent takes lots of episodes, which is both time-and memory-consuming. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">OpenAI Gym provides a wrapper to save the game as a video and so, instead of using render, you can use the wrapper to save videos and later monitor how the agent learned. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">AI engineers and enthusiasts can upload these videos to show their results. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">To do so, we need to first import wrappers, then create the environment, and finally use Monitor. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">By default, it will store the video of 1, 8, 27, 64, ... </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.6">and then every 1,000th episode (episode numbers with perfect cubes); each training, by default, is saved in one folder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.7">The code to be added for this is as follows:</span></p>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">import gym</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">from gym import wrappers</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">env = gym.make('Breakout-v0)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">env = wrappers.Monitor(env, '/save-path')</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">In case you want to use the same folder in the next training, you can add </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">force=True</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> to Monitor.</span></p>


            </article>

            
        </section>
