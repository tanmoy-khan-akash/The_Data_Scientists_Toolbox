                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">ResNet</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">ResNet has been introduced in </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Deep Residual Learning for Image Recognition</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">, Kaiming He, Xiangyu Zhang, Shaoqing Ren, Jian Sun, 2015</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">,</span></em> <a href="https://arxiv.org/abs/1512.03385"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">https://arxiv.org/abs/1512.03385</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> . </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">This network is very deep and can be trained using a standard stochastic descent gradient by using a standard network component called the residual module, which is then used to compose more complex networks (the composition is called </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">network in network</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">).</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"><img height="279" width="133" class=" image-border" src="assets/ce5c2306-3a96-4a2b-86ff-b25f9faafdc5.png"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">In comparison to VGG, ResNet is deeper, but the size of the model is smaller because a global average pooling operation is used instead of full-dense layers.</span></p>


            </article>
