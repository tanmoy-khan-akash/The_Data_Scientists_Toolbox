        <title>Neural machine translation - training a seq2seq RNN</title>

        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Neural machine translation - training a seq2seq RNN</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Sequence to sequence (seq2seq) is a particular kind of RNN with successful applications in neural machine translation, text summarization, and speech recognition. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">In this recipe, we will discuss how to implement a neural machine translation with results similar to the one achieved by the Google Neural Machine Translation system (</span><a href="https://research.googleblog.com/2016/09/a-neural-network-for-machine.html"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://research.googleblog.com/2016/09/a-neural-network-for-machine.html</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> ). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">The key idea is to input a whole sequence of text, understand the entire meaning, and then output the translation as another sequence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">The idea of reading an entire sequence is very different from the previous architectures, where a fixed set of words was translated from one source language into a destination language.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">This section is inspired by the 2016 PhD thesis, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Neural Machine Translation</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">, by Minh-Thang Luong (</span><a href="https://github.com/lmthang/thesis/blob/master/thesis.pdf"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">https://github.com/lmthang/thesis/blob/master/thesis.pdf</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">The first key concept is the presence of an encoder-decoder architecture, where an encoder transforms a source sentence into a vector representing the meaning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">This vector is then passed through a decoder to produce a translation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.4">Both the encoders and the decoders are RNNs that can capture long-range dependencies in languages, for example, gender agreements and syntax structures, without knowing them a priori and with no need to have a 1:1 mapping across languages. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.5">This is a powerful capacity which enables very fluent translations:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"><img height="92" width="329" src="assets/7af9de06-f5cd-4edc-a793-76ad408c579b.png"/></span></div>
<div class="packt_figref CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">An example of encoder-decoder as seen in https://github.com/lmthang/thesis/blob/master/thesis.pdf</span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Let's see an example of an RNN translating the sentence </span><span class="packt_screen"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">She loves cute cats</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1"> into </span><span class="packt_screen"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Elle aime les chats mignons</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">There are two RNNs: one that acts as the encoder, and one that acts as the decoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2">The source sentence </span><span class="packt_screen"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">She loves cute cats</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1"> is followed by a separator sign </span><span class="packt_screen"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">-</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1"> and by the target sentence </span><span class="packt_screen"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Elle aime les chats mignons</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.2">These two concatenated sentences are given in input to the encoder for training, and the decoder will produce the target </span><span class="packt_screen"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Elle aime les chats mignons</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">Of course, we need multiple examples like this one for achieving good training:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"><img height="222" width="366" src="assets/8e9fd11b-d547-4740-9010-ca4e1ebb30f9.png"/></span></div>
<div class="packt_figref CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">An example of</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1"> sequence models for NMT</span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1"> </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">as seen in https://github.com/lmthang/thesis/blob/master/thesis.pdf</span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">Now there is a number of RNNs variants we can have. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">Let's look at some of them:</span></p>
<ul>
<li class="MsoNormalCxSpMiddle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">RNNs can be unidirectional or bidirectional. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.2">The latter will capture long-term relations in both directions.</span></li>
<li class="MsoNormalCxSpMiddle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">RNNs can have multiple hidden layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">The choice is a matter of optimization: on one hand, a deeper network can learn more; on the other hand, it might require a long time to be trained and might overfit.</span></li>
<li class="MsoNormalCxSpMiddle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">RNNs can have an embedding layer which maps words into an embedding space where similar words happen to be mapped very close.</span></li>
<li class="MsoNormalCxSpMiddle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">RNNs can use simple either recurrent cells, or LSTM, or PeepHole LSTM, or GRUs.</span></li>
</ul>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Still considering the PhD thesis, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">Neural Machine Translation</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1"> (</span><a href="https://github.com/lmthang/thesis/blob/master/thesis.pdf"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">https://github.com/lmthang/thesis/blob/master/thesis.pdf</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">), we can use embedding layers to map the input sentences into an embedding space. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.2">Then, there are two RNNs </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">stuck together</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1"> - the encoder for the source language and the decoder for the target language. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.2">As you can see, there are multiple hidden layers, and two flows: the feed-forward vertical direction connects the hidden layers, and the horizontal direction is the recurrent part transferring knowledge from the previous step to the next one:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1"><img height="291" width="359" src="assets/45216119-cbfa-47f0-9080-b6256eefb995.png"/></span></div>
<div class="packt_figref CDPAlignCenter CDPAlign"><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">An example of</span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"> Neural machine translation</span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1"> </span></span><span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">as seen in https://github.com/lmthang/thesis/blob/master/thesis.pdf</span></span></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">In this recipe, we use NMT (Neural Machine Translation), a demo package for translation available online on top of TensorFlow.</span></p>


            </article>

            
        </section>
