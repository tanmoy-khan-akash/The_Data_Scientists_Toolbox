        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We proceed with activation functions as follows:</span></p>
<ol>
<li><span class="FigurePACKTChar"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Threshold activation function</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">: this is the simplest activation function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">Here, the neuron fires if the activity of the neuron is greater than zero; otherwise, it does not fire. </span></span><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Here is the plot of the threshold activation function as the activity of the neuron changes along with the code to implement the threshold activation function in TensorFlow:</span></span></li>
</ol>
<pre style="padding-left: 60px"><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">import tensorflow as tf</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">import numpy as np</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">import matplotlib.pyplot as plt</span></span> <br/><br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"># Threshold Activation function</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">def threshold (x):</span></span> <span class="FigurePACKTChar"> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">    cond = tf.less(x, tf.zeros(tf.shape(x), dtype = x.dtype))</span></span> <span class="FigurePACKTChar"> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">    out = tf.where(cond, tf.zeros(tf.shape(x)), tf.ones(tf.shape(x)))</span></span> <span class="FigurePACKTChar"> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">    return out</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1"># Plotting Threshold Activation Function</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">h = np.linspace(-1,1,50)</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">out = threshold(h)</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">init = tf.global_variables_initializer()</span><br/></span><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">with tf.Session() as sess:</span></span> <span class="FigurePACKTChar"> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">     sess.run(init)</span></span> <span class="FigurePACKTChar"> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">     y = sess.run(out)</span></span> <br/>     <span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">plt.xlabel('Activity of Neuron')</span></span> <br/>     <span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">plt.ylabel('Output of Neuron')</span></span> <br/>     <span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">plt.title('Threshold Activation Function')</span></span> <br/>     <span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">plt.plot(h, y)</span></span></pre>
<p style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Following is the output of the preceding code:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"><img src="assets/3e6ec5cd-a201-49fd-af77-86dd6e3d7378.png"/></span></div>
<ol start="2">
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Sigmoidal activation function</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">: In this case, the output of the neuron is specified by the function </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">g(x) = 1 / (1 + exp(-x))</span></kbd><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">In TensorFlow, there is a method,</span></span> <kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">tf.sigmoid</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">, </span><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">which provides Sigmoid activation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">The range of this function is between 0 and 1. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.3">In shape, it looks like the alphabet </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">S</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">, hence the name Sigmoid:</span></span></li>
</ol>
<pre style="padding-left: 60px" class="CDPAlignCenter CDPAlign CDPAlignLeft"><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"># Plotting Sigmoidal Activation function</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">h = np.linspace(-10,10,50)</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">out = tf.sigmoid(h)</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">init = tf.global_variables_initializer()</span><br/></span><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">with tf.Session() as sess:</span></span> <span class="FigurePACKTChar"> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">    sess.run(init)</span></span> <span class="FigurePACKTChar"> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">    y = sess.run(out)</span></span> <br/>    <span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">plt.xlabel('Activity of Neuron')</span></span> <br/>    <span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">plt.ylabel('Output of Neuron')</span></span> <br/>    <span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">plt.title('Sigmoidal Activation Function')</span></span> <br/>    <span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">plt.plot(h, y)</span></span></pre>
<p style="padding-left: 60px" class="mce-root CDPAlignLeft CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">Following is the output of the following code:</span></p>
<div class="mce-root CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1"><img src="assets/609aa86e-74e6-486c-bb63-6a30f329c016.png"/></span></div>
<ol start="3">
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Hyperbolic tangent activation function</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">: Mathematically, it is </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">(1 - exp(-2x)/(1+exp(-2x))</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.2">In shape, it resembles the sigmoid function, but it is centred at 0 and its range is from -1 to 1. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.3">TensorFlow has a built-in function, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">tf.tanh</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">, </span><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">for the hyperbolic tangent activation function:</span></span></li>
</ol>
<pre style="padding-left: 60px" class="CDPAlignCenter CDPAlign CDPAlignLeft"><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1"># Plotting Hyperbolic Tangent Activation function</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">h = np.linspace(-10,10,50)</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">out = tf.tanh(h)</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">init = tf.global_variables_initializer()</span><br/></span><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">with tf.Session() as sess:</span></span> <span class="FigurePACKTChar"> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">    sess.run(init)</span></span> <span class="FigurePACKTChar"> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">    y = sess.run(out)</span></span> <br/>    <span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">plt.xlabel('Activity of Neuron')</span></span> <br/>    <span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">plt.ylabel('Output of Neuron')</span></span> <br/>    <span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">plt.title('Hyperbolic Tangent Activation Function')</span></span> <br/>    <span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">plt.plot(h, y)</span></span></pre>
<p style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">Following is the output of the preceding code:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1"><img src="assets/af28e03a-fd52-4a3a-bc73-75a254bab90b.png"/></span></div>
<ol start="4">
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">Linear activation function</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">: In this case, the output of the neuron is the same as the activity of the neuron. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.2">This function is not bounded on either side:</span></li>
</ol>
<pre style="padding-left: 60px"><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1"># Linear Activation Function</span></span>
<span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">b = tf.Variable(tf.random_normal([1,1], stddev=2))</span></span>
<span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">w = tf.Variable(tf.random_normal([3,1], stddev=2))</span></span>
<span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">linear_out = tf.matmul(X_in, w) + b</span></span>
<span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">init = tf.global_variables_initializer()</span></span>
<span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">with tf.Session() as sess:</span></span>
    <span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">sess.run(init)</span></span>
    <span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">out = sess.run(linear_out)</span></span>
    
<span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">print(out)</span><br/></span></pre>
<ol start="5">
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">Rectified linear units</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">ReLU</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">) activation function is again built-in with the TensorFlow library. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.2">The activation function is similar to the linear activation function, but with one big change--for a negative value of the activity, the neuron does not fire (zero output), and for a positive value of the activity, the output of the neuron is the same as the given activity:</span></li>
</ol>
<pre style="padding-left: 60px"><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1"># Plotting ReLU Activation function</span></span>
<span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">h = np.linspace(-10,10,50)</span></span>
<span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">out = tf.nn.relu(h)</span><br/></span><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">init = tf.global_variables_initializer()</span><br/></span><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">with tf.Session() as sess:</span></span> <span class="FigurePACKTChar"> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">    sess.run(init)</span></span> <span class="FigurePACKTChar"> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">    y = sess.run(out)</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">plt.xlabel('Activity of Neuron')</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">plt.ylabel('Output of Neuron')</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">plt.title('ReLU Activation Function')</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">plt.plot(h, y)</span></span></pre>
<p style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">Following is the output of the ReLu activation function:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1"><img height="243" width="336" src="assets/af4d0f81-869c-49ce-a8c9-8728c01bd7e2.png"/></span></div>
<ol start="6">
<li><span class="FigurePACKTChar"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">Softmax activation function</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1"> is a normalized exponential function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.2">The output of one neuron depends not only on its own activity but the sum of the activity of all other neurons present in that layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.3">One advantage of this is that it keeps the output of the neurons small and thus the gradients never blow up. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.4">Mathematically, it is </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">y</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1"> = exp(x</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">)/</span></em></span> <em><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">∑</span></span> <span class="FigurePACKTChar"><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">j</span></sub></span></em> <span class="FigurePACKTChar"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">exp(x</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">j</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">)</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">:</span></span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root CDPAlignLeft CDPAlign"><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1"># Plotting Softmax Activation function</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">h = np.linspace(-5,5,50)</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">out = tf.nn.softmax(h)</span></span> <br/><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">init = tf.global_variables_initializer()</span><br/></span><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">with tf.Session() as sess:</span></span> <span class="FigurePACKTChar"> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">    sess.run(init)</span></span> <span class="FigurePACKTChar"> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">    y = sess.run(out)</span></span> <br/>    <span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">plt.xlabel('Activity of Neuron')</span></span> <br/>    <span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">plt.ylabel('Output of Neuron')</span></span> <br/>    <span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">plt.title('Softmax Activation Function')</span></span> <br/>    <span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">plt.plot(h, y)</span></span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">Following is the output of the preceding code:</span></p>
<div class="CDPAlignCenter CDPAlign"><br/>
<span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1"><img height="232" width="334" src="assets/ae82089e-332d-4430-bbd1-86bf55c0acfb.png"/></span></div>
