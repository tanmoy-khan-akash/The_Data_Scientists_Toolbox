                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How it works...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Now we have a new deep network which re-uses the standard Inception-v3 network but it is trained on a new domain D via transfer learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Of course, there are many parameters to fine-tune for achieving good accuracy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">However, we are now re-using a very large pre-trained network as a starting point via transfer learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">In doing so, we can save the need for training on our machines by re-using what is already available in Keras.</span></p>


            </article>
