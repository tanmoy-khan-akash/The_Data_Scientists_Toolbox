                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting ready</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">PCA reduces the </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">n</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">-dimensional input data to </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">r</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">-dimensional input data, where </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">r</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">&lt;</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">n</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">In simpler terms, PCA involves translating the origin and performing rotation of the axis such that one of the axes (the principal axis) has the least variance with data points. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">A reduced dimension dataset is obtained from the original dataset by performing this transformation and then dropping (removing) the orthogonal axes with high variance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.4">Here, we employ the SVD method for PCA dimensionality reduction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.5">Consider </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">X</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">, the </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">n</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">-dimensional data, with </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">p</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> points </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">X</span></em><sub><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">p</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">,</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">n</span></em></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">Any real (</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">p</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">×</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">n</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">) matrix can be decomposed as follows:</span></p>
<p style="padding-left: 240px"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">X = U ∑ V</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">T</span></sup></em></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Here, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">U</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1"> and </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">V</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"> are orthonormal matrices (that is, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">U.U</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">T</span></sup></em> <em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">=</span></em> <em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">V</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">T</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">.V= 1</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">) of size </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">p</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"> × </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">n</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1"> and </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">n</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"> × </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">n</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1"> respectively. </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">∑</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"> is a diagonal matrix of size </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">n</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1"> × </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">n</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.2">Next, slice the </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">∑</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"> matrix to </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">r</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1"> columns resulting in </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">∑</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">r</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">; using </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">U</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1"> and </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">V</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">, we find the reduced dimension data points </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">Y</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">r</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">:</span></p>
<p style="padding-left: 240px"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">Y</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">r</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1"> = U∑</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">r</span></sub></em></p>
