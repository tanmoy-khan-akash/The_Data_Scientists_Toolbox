        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting ready</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We are going to implement the algorithm described in the paper, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">A Neural Algorithm of Artistic Style (</span><a href="https://arxiv.org/abs/1508.06576"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">https://arxiv.org/abs/1508.06576</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">) </span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> by Leon A. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">Gatys, Alexander S. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">Ecker, and Matthias Bethge. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.4">So, it would be good to read the paper first (</span><a href="https://arxiv.org/abs/1508.06576"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">https://arxiv.org/abs/1508.06576</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">This recipe will reuse a pretrained model VGG19 available online (</span><a href="http://www.vlfeat.org/matconvnet/models/beta16/imagenet-vgg-verydeep-19.mat"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">http://www.vlfeat.org/matconvnet/models/beta16/imagenet-vgg-verydeep-19.mat</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">), which should be downloaded locally. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">Our style image will be a famous painting of Van Gogh available online (</span><a href="https://commons.wikimedia.org/wiki/File:VanGogh-starry_night.jpg"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">https://commons.wikimedia.org/wiki/File:VanGogh-starry_night.jpg</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">), and our content image is a picture of Marilyn Monroe downloaded from Wikipedia (</span><a href="https://commons.wikimedia.org/wiki/File:Marilyn_Monroe_in_1952.jpg"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">https://commons.wikimedia.org/wiki/File:Marilyn_Monroe_in_1952.jpg</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">The content image will be repainted according to the </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Van Gogh</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> style.</span></p>


            </article>

            
        </section>
