<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Let's first build a simple neural network agent to play the game Pac-Man. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">We will create an agent with a set of random weights and biases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">These agents will then try to play the game; we select the agent that is able to play for the longest average duration, assuming theirs to be the best policy.</span></p>
