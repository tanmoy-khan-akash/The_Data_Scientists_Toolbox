                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Using a pretrained VGG16 net for transfer learning</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">In this recipe, we will discuss transfer learning, a very powerful deep learning technique that has many applications in different domains. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">The intuition is very simple and can be explained with an analogy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Suppose you want to learn a new language, say Spanish, then it could be useful to start from what you already know in a different language, say English.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Following this line of thinking, computer vision researchers now commonly use pretrained CNNs to generate representations for novel tasks, where the dataset may not be large enough to train an entire CNN from scratch. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">Another common tactic is to take the pretrained ImageNet network and then to fine-tune the entire network to the novel task. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">The example proposed here has been inspired by Francois Chollet in a famous blog posting for Keras. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.4">(</span><a href="https://blog.keras.io/building-powerful-image-classification-models-using-very-little-data.html"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">https://blog.keras.io/building-powerful-image-classification-models-using-very-little-data.html</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">) </span></p>


            </article>
