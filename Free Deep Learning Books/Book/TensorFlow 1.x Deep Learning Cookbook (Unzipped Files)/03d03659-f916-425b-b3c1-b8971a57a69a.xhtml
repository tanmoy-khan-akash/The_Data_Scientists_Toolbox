        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">AlphaGo Zero</span></h1>
                </header>
            
            <article>
                
<p><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Recently, DeepMind published an article about AlphaGo Zero, the latest evolution of AlphaGo. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">According to the results they have published, AlphaGo Zero is even more powerful and the strongest Go player in History. AlphaGo starts tabula rasa, that is, it starts from a blank state, and it uses only the board states and the games it plays against itself to tune the neural network and predict the right moves.</span></span></p>
<p><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">AlphaGo Zero uses a deep neural network, that takes as an input the raw board representations (present and history) and outputs both move probabilities and a value. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">Thus this neural network combines the role of both policy network and value network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">The network is trained from games of self-play, unlike previous AlphaGo versions (they were trained using supervised learning). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.4">At each position, a Monte Carlo Tree Search (MCTS) is performed, guided by the neural network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.5">The neural network is trained by a self-play reinforcement learning algorithm that uses MCTS to play each move.</span></span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Initially, the neural network has its weights randomly initialized. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">At each iteration step, many games of self-play are generated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">At each time step, an MCTS search is performed for the possible policies using the previous iteration of the neural network., then a move is played by sampling the search probabilities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.4">This is repeated till this particular game terminates. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.5">The game state, the policy taken and rewards for each time step of the game are stored. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.6">In parallel, the neural network is trained from the data sampled uniformly among all the time steps of the previous iteration(s) of self-play. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.7">The weights of the neural network are adjusted so as to minimize the error between the predicted value and the self-play winner, and to maximize the similarity of the neural network move probabilities to the search probabilities.</span></p>
<p><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">With only 3 days of training on a single machine with four TPUs, AlphaGo Zero beat AlphaGo by 100-0. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">AlphaGo Zero is based solely on RL. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.3">The detail of its implementation can be read in the paper </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Mastering the game of Go without human knowledge</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> published in Nature, October 2017.</span></span></p>


            </article>
