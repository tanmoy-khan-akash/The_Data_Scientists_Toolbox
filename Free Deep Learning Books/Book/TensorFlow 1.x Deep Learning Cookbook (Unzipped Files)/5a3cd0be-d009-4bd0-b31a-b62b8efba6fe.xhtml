    <body>
        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We proceed with the recipe as follows:</span></p>
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">The first step is importing the necessary modules. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">This time, besides our usual TensorFlow, Numpy, and Matplotlib, we will be importing Gym and some classes from scikit:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">import numpy as np</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">import tensorflow as tf</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">import gym</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">import matplotlib.pyplot as plt</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">from sklearn.pipeline import FeatureUnion</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">from sklearn.preprocessing import StandardScaler</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">from sklearn.kernel_approximation import RBFSampler</span></pre>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">In Q learning, we use NNs as function approximators to estimate the value-function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">We define a linear </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">NeuralNetwork</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1"> class; the NN will take the transformed observation space as input and will predict the estimated Q value. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">As we have two possible actions, we need two different neural network objects to get the predicted state action value. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.3">The class includes methods to train the individual NN and predict the output:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">class NeuralNetwork:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1"> def __init__(self, D):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">     eta = 0.1</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">     self.W = tf.Variable(tf.random_normal(shape=(D, 1)), name='w')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">     self.X = tf.placeholder(tf.float32, shape=(None, D), name='X')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">     self.Y = tf.placeholder(tf.float32, shape=(None,), name='Y')</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">     # make prediction and cost</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">     Y_hat = tf.reshape(tf.matmul(self.X, self.W), [-1])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">     err = self.Y - Y_hat</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">     cost = tf.reduce_sum(tf.pow(err,2))</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">    # ops we want to call later</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">    self.train_op = tf.train.GradientDescentOptimizer(eta).minimize(cost)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">    self.predict_op = Y_hat</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">    # start the session and initialize params</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">    init = tf.global_variables_initializer()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">    self.session = tf.Session()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">    self.session.run(init)</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">def train(self, X, Y):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">    self.session.run(self.train_op, feed_dict={self.X: X, self.Y: Y})</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">def predict(self, X):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">    return self.session.run(self.predict_op, feed_dict={self.X: X})</span></pre>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">The next important class is the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Agent</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1"> class that uses the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">NeuralNetwork</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1"> class to create a learning agent. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">The class on instantiation creates an agent with two linear NNs, each with 2,000 input neurons and 1 output neuron. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.3">(Essentially, this means that the agent has 2 neurons each with 2,000 inputs as the input layer of the NN does not do any processing). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.4">The </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">Agent</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"> class has methods defined to predict the output of the two NNs and update the weights of the two NNs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.2">The agent here uses Epsilon Greedy Policy for exploration during the training phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.3">At each step, the agent either chooses an action with the highest Q value or a random action, depending on the value of epsilon (</span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">eps</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">); epsilon is annealed during the training process so that, initially, the agent takes lots of random actions (exploration) but as training progresses, the actions with maximum Q value are taken (exploitation). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">This is called the </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Exploration-Exploitation</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"> trade-off: we allow the agent to explore random actions over the exploited course of actions, which allows the agent to try new random actions and learn from them:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">class Agent:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1"> def __init__(self, env, feature_transformer):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1"> self.env = env</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"> self.agent = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1"> self.feature_transformer = feature_transformer</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1"> for i in range(env.action_space.n):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1"> model = NeuralNetwork(feature_transformer.dimensions)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1"> self.agent.append(model)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">def predict(self, s):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"> X = self.feature_transformer.transform([s])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1"> return np.array([m.predict(X)[0] for m in self.agent])</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">def update(self, s, a, G):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1"> X = self.feature_transformer.transform([s])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1"> self.agent[a].train(X, [G])</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">def sample_action(self, s, eps):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1"> if np.random.random() &lt; eps:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">     return self.env.action_space.sample()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1"> else:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">     return np.argmax(self.predict(s))</span></pre>
<ol start="4">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">Next, we define a function to play one episode; it is similar to the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">play_one</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"> function we used earlier, but now we use Q learning to update the weights of our agent. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.2">We start the episode by resetting the environment using </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">env.reset()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">, and then till the game is done (and maximum iterations to ensure the program ends). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.2">Like before, the agent chooses an action for the present observation state (</span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">obs</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">) and implements the action on the environment (</span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">env.step(action)</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.2">The difference now is that, based on the previous state and the state after the action is taken, the NN weights are updated using </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">G = r + γ max</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">a'</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1"> Q(s',a')</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">, such that it can predict an accurate expected value corresponding to an action. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.2">For better stability, we have modified the rewards--whenever the pole falls, the agent is given a reward of -400, otherwise for each step, it gets a reward of +1:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">def play_one(env, model, eps, gamma):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1"> obs = env.reset()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1"> done = False</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"> totalreward = 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1"> iters = 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1"> while not done and iters &lt; 2000:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1"> action = model.sample_action(obs, eps)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1"> prev_obs = obs</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1"> obs, reward, done, info = env.step(action)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1"> env.render()   # Can comment it to speed up.</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">if done:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1"> reward = -400</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1"># update the model</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1"> next = model.predict(obs)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1"> assert(len(next.shape) == 1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1"> G = reward + gamma*np.max(next)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1"> model.update(prev_obs, action, G)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">if reward == 1:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1"> totalreward += reward</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">iters += 1</span></pre>
<ol start="5">
<li class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">Now that all the functions and classes are in place, we define our agent and environment (in this case, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">'CartPole-v0'</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.2">The agent plays in total 1,000 episodes and learns by interacting with the environment with the help of the value function:</span></li>
</ol>
<pre style="padding-left: 60px"><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">if </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">__name__ == </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">'__main__'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">    env_name = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">'CartPole-v0'</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">env = gym.make(env_name)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">    ft = FeatureTransformer(env)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">    agent = Agent(env, ft)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">    gamma = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">0.97</span><br/></span><span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">N = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">1000</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">totalrewards = np.empty(N)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">    running_avg = np.empty(N)</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">for </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">n </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">in </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">range(N):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">        eps = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">1.0 </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">/ np.sqrt(n + </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">        totalreward = play_one(env, agent, eps, gamma)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">        totalrewards[n] = totalreward</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">        running_avg[n] = totalrewards[max(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">0</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">, n - </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">100</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">):(n + </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">)].mean()</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">if </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">n % </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">100 </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">== </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">0</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">:</span><br/>            <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">print</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">"episode: {0}, total reward: {1} eps: {2} avg reward (last 100): {3}"</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">.format(n, totalreward, eps,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">                                                                                               running_avg[n]), )</span><br/><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">print</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">"avg reward for last 100 episodes:"</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">, totalrewards[-</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">100</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">:].mean())</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">print</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">"total steps:"</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">, totalrewards.sum())</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">    plt.plot(totalrewards)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">    plt.xlabel(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">'episodes'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">    plt.ylabel(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">'Total Rewards'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">    plt.show()</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">    plt.plot(running_avg)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">    plt.xlabel(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">'episodes'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">    plt.ylabel(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">'Running Average'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">    plt.show()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">    env.close()</span></pre>
