        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We proceed with the recipes as follows:</span></p>
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Import </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">numpy</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> for numerical computation, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">functools</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> to define partial functions with one or more argument already filled in, Pillow for image manipulation, and </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">matplotlib</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> to render images:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">import numpy as np from functools </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">import partial import PIL.Image </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">import tensorflow as tf </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">import matplotlib.pyplot as plt</span></pre>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Set up the path for the content image and the pretrained model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">Start with a seed image that is just random noise:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">content_image = 'data/gulli.jpg' </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"># start with a gray image with a little noise </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">img_noise = np.random.uniform(size=(224,224,3)) + 100.0 </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">model_fn = 'data/tensorflow_inception_graph.pb'</span></pre>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Load the Inception network downloaded from the internet </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">in a graph</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">Initialize a TensorFlow session, load the graph with </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">FastGFile(..)</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">, and parse the graph with </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">ParseFromstring(..)</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">After that, create an input as placeholder with the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">placeholder(..)</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1"> method. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">The </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">imagenet_mean</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1"> is a precomputed constant that will be removed from our content image to normalize the data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">In fact, this is the mean value observed during training and the normalization allows faster convergence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.3">The value will be subtracted from the input and stored in a </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">t_preprocessed</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1"> variable, which is then used to load the graph definition:</span></li>
</ol>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"> </span></p>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1"># load the graph</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">graph = tf.Graph()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">sess = tf.InteractiveSession(graph=graph)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">with tf.gfile.FastGFile(model_fn, 'rb') as f:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">       graph_def = tf.GraphDef()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">       graph_def.ParseFromString(f.read())</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">t_input = tf.placeholder(np.float32, name='input') # define</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">the input tensor</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">imagenet_mean = 117.0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">t_preprocessed = tf.expand_dims(t_input-imagenet_mean, 0)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">tf.import_graph_def(graph_def, {'input':t_preprocessed})  </span></pre>
<ol start="4">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Define some </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">util</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1"> functions to visualize the image and transform the TF-graph generating function into regular Python functions (see the following example to resize):</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1"># helper</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">#pylint: disable=unused-variable</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">def showarray(a):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">   a = np.uint8(np.clip(a, 0, 1)*255)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">   plt.imshow(a)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">   plt.show()   </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">def visstd(a, s=0.1):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">   '''Normalize the image range for visualization'''</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">   return (a-a.mean())/max(a.std(), 1e-4)*s + 0.5   </span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">def T(layer):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">   '''Helper for getting layer output tensor'''</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">   return graph.get_tensor_by_name("import/%s:0"%layer)   </span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">def tffunc(*argtypes):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">   '''Helper that transforms TF-graph generating function into a regular one.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">   See "resize" function below.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">   '''</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">   placeholders = list(map(tf.placeholder, argtypes))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">   def wrap(f):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">       out = f(*placeholders)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">       def wrapper(*args, **kw):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">           return out.eval(dict(zip(placeholders, args)), session=kw.get('session'))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">       return wrapper</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">   return wrap   </span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">def resize(img, size):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">   img = tf.expand_dims(img, 0)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">   return tf.image.resize_bilinear(img, size)[0,:,:,:]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">resize = tffunc(np.float32, np.int32)(resize)</span></pre>
<ol start="5">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">Compute the gradient ascent over the image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.2">To increase the efficiency, apply a tiled computation in which separate gradient ascents are computed on different tiles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.3">Random shifts are applied to the image to blur tile boundaries over multiple iterations:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">def calc_grad_tiled(img, t_grad, tile_size=512):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">   '''Compute the value of tensor t_grad over the image in a tiled way.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">   Random shifts are applied to the image to blur tile boundaries over</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">   multiple iterations.'''</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">   sz = tile_size</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">   h, w = img.shape[:2]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">   sx, sy = np.random.randint(sz, size=2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">   img_shift = np.roll(np.roll(img, sx, 1), sy, 0)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">   grad = np.zeros_like(img)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">   for y in range(0, max(h-sz//2, sz),sz):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">       for x in range(0, max(w-sz//2, sz),sz):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">           sub = img_shift[y:y+sz,x:x+sz]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">           g = sess.run(t_grad, {t_input:sub})</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">           grad[y:y+sz,x:x+sz] = g</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">   return np.roll(np.roll(grad, -sx, 1), -sy, 0)    </span></pre>
<ol start="6">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">Define the optimization object to reduce the mean of our input layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.2">The </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">gradient</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1"> function allows us to compute the symbolic gradient of our optimized tensor by considering the input tensor. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.2">For efficiency, the image is split in a number of octaves, which are then resized and added to an array of octaves. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.3">Then, for each octave, we use the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">calc_grad_tiled</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1"> function:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">def render_deepdream(t_obj, img0=img_noise,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">                        iter_n=10, step=1.5, octave_n=4, octave_scale=1.4):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">   t_score = tf.reduce_mean(t_obj) # defining the optimization objective</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1"> t_grad = tf.gradients(t_score, t_input)[0] # behold the power of automatic differentiation!</span><br/>   <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">   # split the image into a number of octaves</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">   img = img0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">   octaves = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">   for _ in range(octave_n-1):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">       hw = img.shape[:2]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">       lo = resize(img,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">np.int32(np.float32(hw)/octave_scale))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">       hi = img-resize(lo, hw)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">       img = lo</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">       octaves.append(hi)       </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1"># generate details octave by octave</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">   for octave in range(octave_n):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">       if octave&gt;0:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">           hi = octaves[-octave]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">           img = resize(img, hi.shape[:2])+hi</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">       for _ in range(iter_n):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">           g = calc_grad_tiled(img, t_grad)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">           img += g*(step / (np.abs(g).mean()+1e-7))</span><br/>           <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">           #this will usually be like 3 or 4 octaves</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">           #Step 5 output deep dream image via matplotlib</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">       showarray(img/255.0)</span></pre>
<ol start="7">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">Load a specific content image and start dreaming. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.2">In this example, the face of the author has been transformed into something resembling a wolf:</span></li>
</ol>
