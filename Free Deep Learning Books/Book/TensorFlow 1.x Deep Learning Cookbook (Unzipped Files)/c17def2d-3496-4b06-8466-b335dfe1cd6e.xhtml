                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Inception</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Inception has been introduced in </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Rethinking the Inception Architecture for Computer Vision</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">, Christian Szegedy, Vincent Vanhoucke, Sergey Ioffe, Jonathon Shlens, Zbigniew Wojna, 2015, </span><a href="https://arxiv.org/abs/1512.00567"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">https://arxiv.org/abs/1512.00567</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> and the key idea is to have multiple sizes of convolutions acting as feature extraction and computing 1×1, 3×3, and 5×5 convolutions within the same module. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">The outputs of these filters are then stacked along the channel dimension and sent into the next layer in the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">This is described in the following image:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"><img class=" image-border" src="assets/fe01f14d-99c3-45c3-aa49-fb2bb7394454.png"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Inception-v3 is described in </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Rethinking the Inception Architecture for Computer Vision,</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"> while Inception-v4 is described in </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Inception-v4, Inception-ResNet and the Impact of Residual Connections on Learning</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">, Christian Szegedy, Sergey Ioffe, Vincent Vanhoucke, Alex Alemi, 2016, </span><a href="https://arxiv.org/abs/1602.07261"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">https://arxiv.org/abs/1602.07261.</span></a></p>


            </article>
