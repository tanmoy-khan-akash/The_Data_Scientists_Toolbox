<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Quantization helps to reduce the size of a model by downsizing the const operations from 32 bit down to 8 bits. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">In general, the model will not suffer significant degradation of performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">However, this has to be verified on a case by case basis.</span></p>
