        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We proceed with the recipe as follows:</span></p>
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Import TensorFlow, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">tflearn</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">, and the modules needed for building our network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">Then, Import IMDb libraries and perform one-hot encoding and padding:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">import tensorflow as tf</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">import tflearn</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">from tflearn.layers.core import input_data, dropout, fully_connected</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">from tflearn.layers.conv import conv_1d, global_max_pool</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">from tflearn.layers.merge_ops import merge</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">from tflearn.layers.estimator import regression</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">from tflearn.data_utils import to_categorical, pad_sequences</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">from tflearn.datasets import imdb</span></pre>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Load the dataset, pad the sentences to maxlength with 0s, and perform one-hot encoding on the labels with two values corresponding to the true and one false value. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">Note that the parameter </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">n_words</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> is the number of words to keep in the vocabulary. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">All extra words are set to unknown. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">Also, note that trainX and trainY are sparse vectors because each review will most likely contain a subset of the whole set of words:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1"># IMDb Dataset loading</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">train, test, _ = imdb.load_data(path='imdb.pkl', n_words=10000,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">valid_portion=0.1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">trainX, trainY = train</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">testX, testY = test</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">#pad the sequence</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">trainX = pad_sequences(trainX, maxlen=100, value=0.)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">testX = pad_sequences(testX, maxlen=100, value=0.)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">#one-hot encoding</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">trainY = to_categorical(trainY, nb_classes=2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">testY = to_categorical(testY, nb_classes=2)</span></pre>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Print a few dimensions to inspect the just-processed data and understand what the dimension of the problem is:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">print ("size trainX", trainX.size)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">print ("size testX", testX.size)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">print ("size testY:", testY.size)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">print ("size trainY", trainY.size)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">size trainX 2250000</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1"> size testX 250000</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1"> size testY: 5000</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"> site trainY 45000</span></pre>
<ol start="4">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">Build an embedding for the text contained in the dataset. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.2">Just for now, consider this step as a black box which takes the words and maps them into aggregates (clusters) so that similar words are likely to appear in the same cluster. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.3">Note that the vocabulary for the previous steps is discrete and sparse. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.4">With the embedding, we will create a map which will embed each word into a continuous dense vector space. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.5">Using this vector space representation will give us a continuous, distributed representation of our vocabulary words. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.6">How to build embeddings is something that will be discussed in detail when we talk about RNNs:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1"># Build an embedding</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">network = input_data(shape=[None, 100], name='input')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">network = tflearn.embedding(network, input_dim=10000, output_dim=128)</span></pre>
<ol start="5">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Build a suitable </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">convnet</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">We have three convolutional layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.3">Since we are dealing with a text, we will use one-dimension ConvNets and the layers will act in parallel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.4">Each layer takes a tensor of size 128 (the output of the embeddings) and applies a number of filters (respectively 3, 4, 5) with valid padding, the activation function ReLU, and an L2 </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">regularizer</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">Then the output of each layer is concatenated with a merge operation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.3">After that, a max pool layer is added, followed by a dropout with a probability of 50%. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.4">The final layer is a fully connected one with softmax activation:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">#Build the convnet</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">branch1 = conv_1d(network, 128, 3, padding='valid', activation='relu', regularizer="L2")</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">branch2 = conv_1d(network, 128, 4, padding='valid', activation='relu', regularizer="L2")</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">branch3 = conv_1d(network, 128, 5, padding='valid', activation='relu', regularizer="L2")</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">network = merge([branch1, branch2, branch3], mode='concat', axis=1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">network = tf.expand_dims(network, 2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">network = global_max_pool(network)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">network = dropout(network, 0.5)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">network = fully_connected(network, 2, activation='softmax')</span></pre>
<ol start="6">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">The learning phase implies the Adam optimizer with </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">categorical_crossentropy</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1"> used as a loss function:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">network = regression(network, optimizer='adam', learning_rate=0.001,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">loss='categorical_crossentropy', name='target')</span></pre>
<ol start="7">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">Then we run the training with batch_size=32 and observe what is the accuracy reached on the training and validation set. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.2">As you can see, we are able to get an accuracy of 79% in predicting what is the sentiment expressed for movie reviews:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1"># Training</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">model = tflearn.DNN(network, tensorboard_verbose=0)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">model.fit(trainX, trainY, n_epoch = 5, shuffle=True, validation_set=(testX, testY), show_metric=True, batch_size=32)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Training Step: 3519 | total loss: </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">0.09738</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1"> | time: 85.043s</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"> | Adam | epoch: 005 | loss: 0.09738 - acc: 0.9747 -- iter: 22496/22500</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1"> Training Step: 3520 | total loss: </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">0.09733</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1"> | time: 86.652s</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1"> | Adam | epoch: 005 | loss: 0.09733 - acc: 0.9741 | val_loss: 0.58740 - val_acc: 0.7944 -- iter: 22500/22500</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1"> --</span></pre>


            </article>
