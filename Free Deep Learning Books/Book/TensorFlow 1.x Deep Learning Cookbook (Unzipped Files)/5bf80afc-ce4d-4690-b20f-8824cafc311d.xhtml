        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Here are listed some of the common Python packages used:</span></p>
<ol>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Numpy:</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> This is the fundamental package for scientific computing with Python. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">It supports n-dimensional arrays and matrices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">It also has a large collection of high-level mathematical functions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.4">It is a necessary package required by TensorFlow and therefore, with </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">pip install tensorflow</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">, it is installed if not already present.</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Matplolib</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">: This is the Python 2D plotting library. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">You can use it to create plots, histograms, bar charts, error charts, scatterplots, and power spectra with just a few lines of code. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">It can be installed using </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">pip:</span></kbd></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">pip install matplotlib </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1"># or using Anaconda    </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">conda install -c conda-forge matplotlib</span></pre>
<ol start="3">
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">OS</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">: This is included in the basic Python installation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">It provides an easy and portable way of using operating system-dependent functionality like reading, writing, and changing files and directories.</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Pandas</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">: This provides various data structures and data analysis tools. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">Using Pandas, you can read and write data between in-memory data structures and different formats. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">We can read from </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">.csv</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1"> and text files. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">It can be installed using either </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">pip install</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1"> or </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">conda install</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">.</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Seaborn</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">: This is a specialized statistical data visualization tool built on Matplotlib.</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">H5fs</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">: H5fs is a filesystem for Linux (also other operating systems with FUSE implementation like macOS X) capable of operations on an </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">HDFS</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Hierarchical Data Format Filesystem</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">).</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">PythonMagick</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">: It is the Python binding of the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">ImageMagick</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1"> library. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">It is a library to display, convert, and edit raster image and vector image files. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.3">It supports more than 200 image file formats. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.4">It can be installed using source build available from </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">ImageMagick.</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"> Certain </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">.whl</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1"> formats are also available for a convenient </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">pip install</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1"> (</span><a href="http://www.lfd.uci.edu/%7Egohlke/pythonlibs/#pythonmagick"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">http://www.lfd.uci.edu/%7Egohlke/pythonlibs/#pythonmagick</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">).</span></li>
</ol>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1"> </span></p>
<ol start="8">
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">TFlearn</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">: TFlearn is a modular and transparent deep learning library built on top of TensorFlow. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">It provides a higher-level API to TensorFlow in order to facilitate and speed up experimentation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.3">It currently supports most of the recent deep learning models, such as Convolutions, LSTM, BatchNorm, BiRNN, PReLU, Residual networks, and Generative networks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.4">It works only for TensorFlow 1.0 or higher. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.5">To install, use </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">pip install tflearn</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">.</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">Keras</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">: Keras too is a high-level API for neural networks, which uses TensorFlow as its backend. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">It can run on top of Theano and CNTK as well. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.3">It is extremely user-friendly, adding layers to it is just a one-line job. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.4">It can be installed using </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">pip install keras</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">.</span></li>
</ol>


            </article>

            
        </section>
