                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Introduction</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Regression is one of the oldest and yet quite powerful tools for mathematical modelling, classification, and prediction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Regression finds application in varied fields ranging from engineering, physical science, biology, and the financial market to social sciences. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">It is the basic tool in the hand of a data scientist.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Regression is normally the first algorithm that people in machine learning work with. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">It allows us to make predictions from data by learning the relationship between the dependent and independent variables. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">For example, in the case of house price estimation, we determine the relationship between the area of the house (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">independent variable</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">) and its price (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">dependent variable</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">); this relationship can be then used to predict the price of any house given its area. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">We can have multiple independent variables impacting the dependent variable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.3">Thus, there are two important components of regression: the </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">relationship</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> between independent and dependent variables, and the </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">strength of impact</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1"> of the different independent variable on the dependent variable.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">There are various types of regression methods available:</span></p>
<ul>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Linear regression</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">: This is one of the most widely used modelling technique. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">Existing for more than 200 years, it has been explored from almost all possible angles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.3">Linear regression assumes a linear relationship between the input variables (</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">X</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">) and the single output variable (</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Y</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">)</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">.</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1"> It involves finding a linear equation for predicted value </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Y</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1"> of the form:</span></li>
</ul>
<div style="padding-left: 270px" class="mce-root CDPAlignLeft CDPAlign"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1"> </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1"><img src="assets/5f56fc4e-0ef5-4339-8a40-6728f006267c.png"/></span></strong></div>
<p style="padding-left: 90px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Here, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">X</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1"> = (</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">x</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">, x</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">2</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">, ..., x</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">n</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">) are the </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">n</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"> input variables and </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">W = (w</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">, w</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">2</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">, ...w</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">n</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">) are the linear coefficients, with </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">b</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"> as the bias term. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">The goal is to find the best estimates for the coefficients </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">W</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">, such that the error in the predicted </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">Y</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"> is minimized. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">The linear coefficients </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">W</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">s are estimated using the method of least squares, that is, minimizing the sum of squared differences between predicted values (</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">Y</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">hat</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">) and observed values (</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">Y</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.2">Thus, we try to minimize the </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">loss</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1"> function:</span></p>
<p style="padding-left: 270px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1"><img src="assets/989fcbf6-aa62-4d79-9313-d27833b11e02.png"/></span></p>
<p style="padding-left: 90px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">Here, the sum is over all the training samples. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.2">Depending on the number and type of input variable </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">X</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">, there are different types of linear regression: simple linear regression (one input variable, one output variable), multiple linear regression (many independent input variables, one output variable), or multivariate linear regression (many independent input variables and multiple output variables). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.2">For more on linear regression, you can refer to </span><a href="https://en.wikipedia.org/wiki/Linear_regression"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">https://en.wikipedia.org/wiki/Linear_regression</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">.</span></p>
<ul>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">Logistic regression</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">: This is used to determine the probability of an event. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.2">Conventionally, the event is represented as a categorical dependent variable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.3">The probability of the event is expressed using the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">logit</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1"> function (</span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">sigmoid</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1"> function):</span></li>
</ul>
<p style="padding-left: 210px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1"><img src="assets/1941eb7b-63c3-4357-80d9-970e8938003d.png"/></span></p>
<p style="padding-left: 90px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">The goal now is to estimate weights </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">W = ( w1, w2, ...wn</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">) and bias term </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">b</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.2">In logistic regression, the coefficients are estimated using either maximum likelihood estimator or stochastic gradient descent. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.3">The loss is conventionally defined as a cross-entropy term given as follows:</span></p>
<p style="padding-left: 210px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1"><img src="assets/12190d93-01ea-46a9-a8c4-6a884071651a.png"/></span></p>
<p style="padding-left: 90px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">Logistic regression is used in classification problems, for example, given medical data, we can use logistic regression to classify whether a person has cancer or not. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.2">In case the output categorical variable has two or more levels, we can use multinomial logistic regression. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.3">Another common technique used for two or more output variables is one versus all. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.4">For multiclass logistic regression, the cross-entropy </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">loss</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1"> function is modified as follows:</span></p>
<p style="padding-left: 210px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"><img src="assets/45534cbd-30d1-46b6-b2f7-f83b946bf478.png"/></span></p>
<p style="padding-left: 90px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">Here, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">K</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1"> is the total number of classes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.2">More about logistic regression can be read at </span><a href="https://en.wikipedia.org/wiki/Logistic_regression"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">https://en.wikipedia.org/wiki/Logistic_regression</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">.</span></p>
<p style="padding-left: 90px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">These are the two popularly used regression techniques.</span></p>
<ul>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">Regularization</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">: When there are a large number of input features, then regularization is needed to ensure that the predicted model is not complex. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.2">Regularization can help in preventing overfitting of data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.3">It can also be used to obtain a convex </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">loss</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1"> function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.2">There are two types of regularization, L1 and L2 regularization, which are described in the following points:</span></li>
</ul>
<ul>
<li style="list-style-type: none">
<ul style="padding-left: 1px">
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">L1 regularization</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1"> can also work when the data is highly collinear. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.2">In L1 regularization, an additional penalty term dependent on the absolute sum of all the coefficients is added to the </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">loss</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1"> function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.2">The regularization penalty term for L1 regularization is as follows:</span></li>
</ul>
</li>
</ul>
<p style="padding-left: 240px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1"><img src="assets/64791ff7-d76f-4eb6-a4f0-158faeb33f46.png"/></span></p>
<ul>
<li style="list-style-type: none">
<ul style="padding-left: 1px">
<li>
<p><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">L2 Regularization</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1"> provides sparse solutions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.2">It is very useful when the number of input features is extremely large. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.3">In this case, the penalty term is the sum of the square of all the coefficients:</span></p>
</li>
</ul>
</li>
</ul>
<p style="padding-left: 240px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1"><img src="assets/1b5d16bd-6cbd-41ce-8b7d-85bec85bb7f4.png"/></span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">Above the Greek letter, lambda (</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">λ</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">) is the regularization parameter.</span></p>
