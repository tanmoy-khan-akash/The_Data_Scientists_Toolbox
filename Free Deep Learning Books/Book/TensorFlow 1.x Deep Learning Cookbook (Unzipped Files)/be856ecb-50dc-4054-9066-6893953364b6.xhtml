                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Recommender system using RBM</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Recommender systems are widely used by web retailers to suggest products to their customers; for example, Amazon tells you what other customers who purchased this item were interested in or Netflix suggests TV serials and movies based on what you have watched and what other Netflix users with the same interest have watched. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">These recommender systems work on the basis of collaborative filtering. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">In collaborative filtering, the system builds a model from a user's past behavior. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">We will use the RBM, made in the previous recipe, to build a recommender system using collaborative filtering to recommend movies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">An important challenge in this work is that most users will not rate all products/movies, thus most data is missing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.6">If there are M products and N users, then we need to build an array, N x M, which contains the known ratings of the users and makes all unknown values zero.</span></p>


            </article>
