                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">TensorFlow Processing Units</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Google services such as Google Search (RankBrain), Street View, Google Photos, and Google Translate have one thing in common: they all use Google’s Tensor Processing Unit, or </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">TPU</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">, for their computations. </span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">You might be thinking what is a TPU and what is so great about these services? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">All these services use state-of-the-art machine learning algorithms in the background, and these algorithms involve large computations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.3">TPUs help to accelerate the neural network computations involved. </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Even AlphaGo, the deep learning program that defeated Lee Sedol in the game of Go, was powered by TPUs. </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">So let us see what exactly a TPU is.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">A TPU is a custom application-specific integrated circuit (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">ASIC</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">) built by Google specifically for machine learning and is tailored for Tensorflow. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">It is built on a 28-nm process, it runs at 700 MHz, and consumes 40 W of energy when running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">It is packaged as an external accelerator card that can fit into the existing SATA hard disk slots. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.4">A TPU is connected to the host CPUs via a PCIe Gen 3×16 bus, which provides an effective bandwidth of 12.5 GB/s.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">The first generation of TPUs is, as of now, targeting inference, that is, use of an already trained model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">The training of DNNs, which usually takes more time, was still done on CPUs and GPUs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">The second-generation TPUs announced in a May 2017 blog post</span><a href="https://www.blog.google/topics/google-cloud/google-cloud-offer-tpus-machine-learning/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">(https://www.blog.google/topics/google-cloud/google-cloud-offer-tpus-machine-learning/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">) can both train and infer machine learning models. </span></p>


            </article>
