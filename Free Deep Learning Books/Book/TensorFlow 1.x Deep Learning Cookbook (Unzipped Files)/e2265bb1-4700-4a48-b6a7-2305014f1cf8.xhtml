        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How it works...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">A standard VGG16 network has been pretrained on the whole ImageNet with precomputed weights downloaded from the Internet. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">This network has been then juxtaposed with a custom network that has been also trained separately. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Then, the juxtaposed network has been retrained as a whole, keeping 15 lower layers of the VGG16 frozen.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">This combination is very effective. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">It allows us to save significant computational power and reuse the work already performed for VGG16 by performing a transfer learning of what the network has learned on ImageNet, apply this learning to our new specific domain, and therefore perform a fine-tuning classification task.</span></p>


            </article>

            
        </section>
