            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The blog post </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">The Unreasonable Effectiveness of Recurrent Neural Networks</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> (</span><a href="http://karpathy.github.io/2015/05/21/rnn-effectiveness/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">http://karpathy.github.io/2015/05/21/rnn-effectiveness/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> ) describes a fascinating set of examples of RNN character-level language models, including the following:</span></p>
<ul>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Shakespeare text generation similar to this example</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Wikipedia text generation similar to this example, but based on different training text</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Algebraic geometry (LaTex) text generation similar to this example, but based on different training text</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Linux source code text generation similar to this example, but based on different training text</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Baby names text generation similar to this example, but based on different training text</span></li>
</ul>
