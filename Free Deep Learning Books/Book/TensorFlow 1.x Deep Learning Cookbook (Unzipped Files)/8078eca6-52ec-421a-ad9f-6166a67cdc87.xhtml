        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Here is how we proceed with the recipe:</span></p>
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Clone the </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">following </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">GitHub repository. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">This is a project to encourage users to try and experiment with the seq2seq neural network architecture:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">git clone https://github.com/guillaume-chevalier/seq2seq-signal-prediction.git</span></pre>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Given the preceding repository, consider the following functions which load and normalize the Bitcoin historical data for the USD or EUR Bitcoin value. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">The functions are defined in </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">dataset.py</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">Training and testing data are separated according to the 80/20 rule. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">As a consequence, 20 percent of the testing data is the most recent historical Bitcoin values. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.4">Every example contains 40 data points of USD and then EUR data in the feature axis/dimension. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.5">Data is normalized according to the mean and standard deviation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.6">The function </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">generate_x_y_data_v4</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1"> generates random samples of the training data (respectively, the testing data) of size </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">batch_size</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">def loadCurrency(curr, window_size):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">   """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">   Return the historical data for the USD or EUR bitcoin value. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">Is done with an web API call.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">   curr = "USD" | "EUR"</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">   """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">   # For more info on the URL call, it is inspired by :</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">   # https://github.com/Levino/coindesk-api-node</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">   r = requests.get(</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">       "http://api.coindesk.com/v1/bpi/historical/close.json?start=2010-07-17&amp;end=2017-03-03&amp;currency={}".format(</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">           curr</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">       )</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">   )</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">   data = r.json()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">   time_to_values = sorted(data["bpi"].items())</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">   values = [val for key, val in time_to_values]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">   kept_values = values[1000:]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">   X = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">   Y = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">   for i in range(len(kept_values) - window_size * 2):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">       X.append(kept_values[i:i + window_size])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">       Y.append(kept_values[i + window_size:i + window_size * 2])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">   # To be able to concat on inner dimension later on:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">   X = np.expand_dims(X, axis=2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">   Y = np.expand_dims(Y, axis=2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">   return X, Y</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">def normalize(X, Y=None):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">   """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">   Normalise X and Y according to the mean and standard</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">deviation of the X values only.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">   """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">   # # It would be possible to normalize with last rather than mean, such as:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">   # lasts = np.expand_dims(X[:, -1, :], axis=1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">   # assert (lasts[:, :] == X[:, -1, :]).all(), "{}, {}, {}. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.2">{}".format(lasts[:, :].shape, X[:, -1, :].shape, lasts[:, :], X[:, -1, :])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">   mean = np.expand_dims(np.average(X, axis=1) + 0.00001, axis=1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">   stddev = np.expand_dims(np.std(X, axis=1) + 0.00001, axis=1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">   # print (mean.shape, stddev.shape)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">   # print (X.shape, Y.shape)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">   X = X - mean</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">   X = X / (2.5 * stddev)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">   if Y is not None:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">       assert Y.shape == X.shape, (Y.shape, X.shape)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">       Y = Y - mean</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">       Y = Y / (2.5 * stddev)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">       return X, Y</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">   return X</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">def fetch_batch_size_random(X, Y, batch_size):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">   """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">   Returns randomly an aligned batch_size of X and Y among all examples.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">   The external dimension of X and Y must be the batch size</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">(eg: 1 column = 1 example).</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">   X and Y can be N-dimensional.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">   """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">   assert X.shape == Y.shape, (X.shape, Y.shape)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">   idxes = np.random.randint(X.shape[0], size=batch_size)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">   X_out = np.array(X[idxes]).transpose((1, 0, 2))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">   Y_out = np.array(Y[idxes]).transpose((1, 0, 2))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">   return X_out, Y_out</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">X_train = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">Y_train = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">X_test = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">Y_test = []</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">def generate_x_y_data_v4(isTrain, batch_size):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">   """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">   Return financial data for the bitcoin.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">   Features are USD and EUR, in the internal dimension.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">   We normalize X and Y data according to the X only to not</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">   spoil the predictions we ask for.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">   For every window (window or seq_length), Y is the prediction following X.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">   Train and test data are separated according to the 80/20</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">rule.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">   Therefore, the 20 percent of the test data are the most</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">   recent historical bitcoin values. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.2">Every example in X contains</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">   40 points of USD and then EUR data in the feature axis/dimension.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">   It is to be noted that the returned X and Y has the same shape</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">   and are in a tuple.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">   """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">   # 40 pas values for encoder, 40 after for decoder's predictions.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">   seq_length = 40</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">   global Y_train</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">   global X_train</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">   global X_test</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">   global Y_test</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">   # First load, with memoization:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">   if len(Y_test) == 0:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">       # API call:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">       X_usd, Y_usd = loadCurrency("USD",</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">window_size=seq_length)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">       X_eur, Y_eur = loadCurrency("EUR",</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">window_size=seq_length)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">       # All data, aligned:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">       X = np.concatenate((X_usd, X_eur), axis=2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">       Y = np.concatenate((Y_usd, Y_eur), axis=2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">       X, Y = normalize(X, Y)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">       # Split 80-20:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">       X_train = X[:int(len(X) * 0.8)]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">       Y_train = Y[:int(len(Y) * 0.8)]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">       X_test = X[int(len(X) * 0.8):]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">       Y_test = Y[int(len(Y) * 0.8):]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">   if isTrain:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">       return fetch_batch_size_random(X_train, Y_train, batch_size)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">   else:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">       return fetch_batch_size_random(X_test,  Y_test,  batch_size)</span></pre>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">Generate the training, validation, and testing data, and define a number of hyperparameters such as </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">batch_size</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">hidden_dim</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1"> (the number of hidden neurons in the RNN), and </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">layers_stacked_count</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1"> (the number of stacked recurrent cells). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.2">In addition, define a number of parameters for fine-tuning the optimizer, such as the optimizer's learning rate, number of iterations, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">lr_decay</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1"> for the optimizer's simulated annealing, the optimizer's momentum, and L2 regularization for avoiding overfitting. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.2">Note that the GitHub repository has the default </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">batch_size = 5</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1"> and </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">nb_iters = 150</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1"> but I've obtained better results with </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">batch_size = 1000</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1"> and </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">nb_iters = 100000</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">from datasets import generate_x_y_data_v4</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">generate_x_y_data = generate_x_y_data_v4</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">import tensorflow as tf  </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">import numpy as np</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">import matplotlib.pyplot as plt</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">%matplotlib inline</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">sample_x, sample_y = generate_x_y_data(isTrain=True, batch_size=3)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">print("Dimensions of the dataset for 3 X and 3 Y training</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">examples : ")</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">print(sample_x.shape)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">print(sample_y.shape)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">print("(seq_length, batch_size, output_dim)")</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">print sample_x, sample_y</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1"># Internal neural network parameters</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">seq_length = sample_x.shape[0]  # Time series will have the same past and future (to be predicted) lenght.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">batch_size = 5  # Low value used for live demo purposes - 100 and 1000 would be possible too, crank that up!</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">output_dim = input_dim = sample_x.shape[-1]  # Output dimension (e.g.: multiple signals at once, tied in time)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">hidden_dim = 12  # Count of hidden neurons in the recurrent units.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">layers_stacked_count = 2  # Number of stacked recurrent cells, on the neural depth axis.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1"># Optmizer:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">learning_rate = 0.007  # Small lr helps not to diverge during training.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">nb_iters = 150  # How many times we perform a training step (therefore how many times we show a batch).</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">lr_decay = 0.92  # default: 0.9 . </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.2">Simulated annealing.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">momentum = 0.5  # default: 0.0 . </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.2">Momentum technique in weights update</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">lambda_l2_reg = 0.003  # L2 regularization of weights - avoids overfitting</span></pre>
<ol start="4">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">Define the network as an encoder-decoder made up of basic GRU cells. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.2">The network is made up of </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">layers_stacked_count=2</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1"> RNNs, and we will visualize the network with TensorBoard. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.2">Note that </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">hidden_dim = 12</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1"> are the hidden neurons in the recurrent units:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">tf.nn.seq2seq = tf.contrib.legacy_seq2seq</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">tf.nn.rnn_cell = tf.contrib.rnn</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">tf.nn.rnn_cell.GRUCell = tf.contrib.rnn.GRUCell</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">tf.reset_default_graph()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1"># sess.close()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">sess = tf.InteractiveSession()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">with tf.variable_scope('Seq2seq'):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">   # Encoder: inputs</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">   enc_inp = [</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">       tf.placeholder(tf.float32, shape=(None, input_dim), name="inp_{}".format(t))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">          for t in range(seq_length)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">   ]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">   # Decoder: expected outputs</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">   expected_sparse_output = [</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">       tf.placeholder(tf.float32, shape=(None, output_dim), name="expected_sparse_output_".format(t))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">         for t in range(seq_length)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">   ]</span><br/>   <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">   # Give a "GO" token to the decoder.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">   # You might want to revise what is the appended value "+ enc_inp[:-1]".</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">   dec_inp = [ tf.zeros_like(enc_inp[0], dtype=np.float32, name="GO") ] + enc_inp[:-1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">   # Create a `layers_stacked_count` of stacked RNNs (GRU cells here).</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">   cells = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">   for i in range(layers_stacked_count):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">       with tf.variable_scope('RNN_{}'.format(i)):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">           cells.append(tf.nn.rnn_cell.GRUCell(hidden_dim))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">           # cells.append(tf.nn.rnn_cell.BasicLSTMCell(...))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">   cell = tf.nn.rnn_cell.MultiRNNCell(cells)   </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">   # For reshaping the input and output dimensions of the seq2seq RNN:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">   w_in = tf.Variable(tf.random_normal([input_dim, hidden_dim]))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">   b_in = tf.Variable(tf.random_normal([hidden_dim], mean=1.0))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">   w_out = tf.Variable(tf.random_normal([hidden_dim, output_dim]))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">   b_out = tf.Variable(tf.random_normal([output_dim]))   </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">reshaped_inputs = [tf.nn.relu(tf.matmul(i, w_in) + b_in) for i in enc_inp]   </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1"># Here, the encoder and the decoder uses the same cell, HOWEVER,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">   # the weights aren't shared among the encoder and decoder, we have two</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">   # sets of weights created under the hood according to that function's def.</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">   dec_outputs, dec_memory = tf.nn.seq2seq.basic_rnn_seq2seq(</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">       enc_inp,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">       dec_inp,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">       cell</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">   )   </span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">output_scale_factor = tf.Variable(1.0, name="Output_ScaleFactor")</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">   # Final outputs: with linear rescaling similar to batch norm,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">   # but without the "norm" part of batch normalization hehe.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">   reshaped_outputs = [output_scale_factor*(tf.matmul(i, w_out) + b_out) for i in dec_outputs]  </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">   # Merge all the summaries and write them out to /tmp/bitcoin_logs (by default)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">   merged = tf.summary.merge_all()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">   train_writer = tf.summary.FileWriter('/tmp/bitcoin_logs',                                     sess.graph)</span></pre>
<ol start="5">
<li class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">Now let's run the TensorBoard and visualize the network consisting of an RNN encoder and an RNN decoder:</span></li>
</ol>
<pre class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">tensorboard --logdir=/tmp/bitcoin_logs</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">The following is the flow of the code:</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1"> </span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1"><img height="500" width="571" src="assets/9a09fe95-a97b-4532-89a5-186fef8159af.png"/></span></div>
<div class="packt_figref CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">An example of code for Bitcoin value prediction as seen in Tensorboard</span></div>
<ol start="6">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">Now let's define the loss function as an L2 loss with regularization to avoid overfitting and to have a better generalization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.2">The chosen optimizer is RMSprop with the value of </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">learning_rate</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">, decay, and momentum as defined at step 3:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1"># Training loss and optimizer</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">with tf.variable_scope('Loss'):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">   # L2 loss</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">   output_loss = 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1">   for _y, _Y in zip(reshaped_outputs, expected_sparse_output):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">       output_loss += tf.reduce_mean(tf.nn.l2_loss(_y - _Y))       </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">  # L2 regularization (to avoid overfitting and to have a  better generalization capacity)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">   reg_loss = 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">   for tf_var in tf.trainable_variables():</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1">       if not ("Bias" in tf_var.name or "Output_" in tf_var.name):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">           reg_loss += tf.reduce_mean(tf.nn.l2_loss(tf_var))</span><br/>           <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">   loss = output_loss + lambda_l2_reg * reg_loss</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">with tf.variable_scope('Optimizer'):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">   optimizer = tf.train.RMSPropOptimizer(learning_rate, decay=lr_decay, momentum=momentum)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">   train_op = optimizer.minimize(loss)</span></pre>
<ol start="7">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1">Prepare for training in batch by generating the training data and by running the optimizer on </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">batch_size</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1"> examples from the dataset. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.2">Similarly, prepare for test by generating test data on </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">batch_size</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1"> examples from the dataset. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.2">Training runs for </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">nb_iters+1</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1"> iterations, and one iteration out of ten is used to test the results:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">def train_batch(batch_size):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">   """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">   Training step that optimizes the weights</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">   provided some batch_size X and Y examples from the dataset.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">   """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">   X, Y = generate_x_y_data(isTrain=True, batch_size=batch_size)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">   feed_dict = {enc_inp[t]: X[t] for t in range(len(enc_inp))}</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">   feed_dict.update({expected_sparse_output[t]: Y[t] for t in range(len(expected_sparse_output))})</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">   _, loss_t = sess.run([train_op, loss], feed_dict)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1">   return loss_t</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">def test_batch(batch_size):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">   """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">   Test step, does NOT optimizes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.2">Weights are frozen by not</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">   doing sess.run on the train_op.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">   """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">   X, Y = generate_x_y_data(isTrain=False, batch_size=batch_size)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1">   feed_dict = {enc_inp[t]: X[t] for t in range(len(enc_inp))}</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">   feed_dict.update({expected_sparse_output[t]: Y[t] for t in range(len(expected_sparse_output))})</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">   loss_t = sess.run([loss], feed_dict)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">   return loss_t[0]</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1"># Training</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">train_losses = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">test_losses = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">sess.run(tf.global_variables_initializer())</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">for t in range(nb_iters+1):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">   train_loss = train_batch(batch_size)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">   train_losses.append(train_loss)   </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">   if t % 10 == 0:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">       # Tester</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">       test_loss = test_batch(batch_size)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">       test_losses.append(test_loss)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">       print("Step {}/{}, train loss: {}, \tTEST loss: {}".format(t, nb_iters, train_loss, test_loss))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1">print("Fin. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.2">train loss: {}, \tTEST loss: {}".format(train_loss, test_loss))</span></pre>
<ol start="8">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">Visualize the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">n_predictions</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1"> results. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.2">We will visualize </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1">nb_predictions = 5</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1"> predictions in yellow and the actual value ix in blue with an x. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.2">Note that the prediction starts with the last blue dot in the histogram and, visually, you can observe that even this simple model is pretty accurate:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1"># Test</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">nb_predictions = 5</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">print("Let's visualize {} predictions with our signals:".format(nb_predictions))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">X, Y = generate_x_y_data(isTrain=False, batch_size=nb_predictions)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">feed_dict = {enc_inp[t]: X[t] for t in range(seq_length)}</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">outputs = np.array(sess.run([reshaped_outputs], feed_dict)[0])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">for j in range(nb_predictions):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">   plt.figure(figsize=(12, 3))   </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">   for k in range(output_dim):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">       past = X[:,j,k]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">       expected = Y[:,j,k]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">       pred = outputs[:,j,k]       </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">       label1 = "Seen (past) values" if k==0 else "_nolegend_"</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">       label2 = "True future values" if k==0 else "_nolegend_"</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">       label3 = "Predictions" if k==0 else "_nolegend_"</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">       plt.plot(range(len(past)), past, "o--b", label=label1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1">       plt.plot(range(len(past), len(expected)+len(past)), expected, "x--b", label=label2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">       plt.plot(range(len(past), len(pred)+len(past)), pred, "o--y", label=label3)   </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">   plt.legend(loc='best')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">   plt.title("Predictions v.s. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.2">true values")</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">   plt.show()</span></pre>
