            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">This model spends a lot of time on Conv2D operations, as expected. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Overall this takes about 77.5 percent of the average time on my desktop machine. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">If you run this on a mobile device, it is critical to take the time to execute each layer in the neural network and make sure they are under control. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">The other aspect to consider is the memory occupation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">In this case, it is ~10 Mb for the desktop execution.</span></p>


            </article>
