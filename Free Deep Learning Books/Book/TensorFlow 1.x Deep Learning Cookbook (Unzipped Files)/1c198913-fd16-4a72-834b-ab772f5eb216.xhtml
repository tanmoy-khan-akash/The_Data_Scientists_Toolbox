                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How it works...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">An encoder-decoder layer stacked RNN with GRU basic cells is used to predict Bitcoin value. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">RNNs are very good at learning sequences, and indeed the Bitcoin prediction is reasonably accurate even with a simple model based on 2 layers and 12 GRU cells. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Of course, this prediction code is not an encouragement to invest in Bitcoin but only to discuss a deep learning methodology. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">Moreover, more experiments are needed in order to verify whether or not we have a situation of data overfitting.</span></p>


            </article>
