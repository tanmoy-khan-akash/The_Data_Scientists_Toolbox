        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Stacked autoencoder</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Autoencoders covered so far (except for CAEs) consisted only of a single-layer encoder and a single-layer decoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">However, it is possible for us to have multiple layers in encoder and decoder networks; using deeper encoder and decoder networks can allow the autoencoder to represent complex features. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">The structure so obtained is called a Stacked Autoencoder (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Deep Autoencoders</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">); the features extracted by one encoder are passed on to the next encoder as input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">The stacked  autoencoder can be trained as a whole network with an aim to minimize the reconstruction error, or each individual encoder/decoder network can be first pretrained using the unsupervised method you learned earlier, and then the complete network is fine-tuned. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">It has been pointed out that, by pretraining, also called Greedy layer-wise training, the results are better.</span></p>


            </article>

            
        </section>
