        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Activation functions</span></h1>
                </header>
            
            <article>
                
<p><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Every neuron must have an activation function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">They are what gives the neuron the nonlinear property necessary to model the complex nonlinear datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">The function takes the weighted sum of all the inputs and generates an output signal. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">You can think of it as a transform between input and output. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">Using the proper activation function, we can bound our output values in a defined range.</span></span></p>
<p><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">If </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">x</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">j</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> is the </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">j</span></em><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">th</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> input, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">W</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">j</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1"> the weight connecting </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">j</span></em><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">th</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1"> input to our neuron, and </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">b</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1"> the bias of our neuron, the output of the neuron (in biological terms, firing of the neuron) is decided by the activation function, and mathematically it is expressed as follows:</span></span></p>
<div style="padding-left: 180px" class="mce-root CDPAlignLeft CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1"><img class=" image-border" src="assets/83e47038-3f0e-4388-a4ac-785306036a5e.png"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Here, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">g</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1"> represents the activation function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">The argument to the activation function </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">∑W</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">j</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">x</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">j</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">+b</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1"> is called </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">activity of the neuron</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">.</span></p>


            </article>
