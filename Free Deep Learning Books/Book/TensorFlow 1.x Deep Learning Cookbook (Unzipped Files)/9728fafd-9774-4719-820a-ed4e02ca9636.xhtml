        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Introduction</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">In machine learning, there are three different learning paradigms: supervised learning, unsupervised learning, and reinforcement learning.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">In </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">supervised learning</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">, also known as learning with a teacher, the network is provided with both the inputs and the respective desired outputs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">For example, in the MNIST dataset, each image of the handwritten digit has a label signifying the digit value associated with it.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">In </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">reinforcement learning</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">, also known as learning with a critic, the network is not provided with the desired output; instead, the environment provides a feedback in terms of reward or punishment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">When its output is correct, the environment rewards the network, and when the output is not correct, the environment punishes it.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">In </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">unsupervised learning</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">, also known as learning without a teacher, no information is provided to the network about its output. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">The network receives the input, but is neither provided with desired outputs nor with rewards from the environment; the network learns the hidden structure of the input by itself. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">Unsupervised learning can be very useful because data available normally is unlabeled. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.4">It can be used for tasks such as pattern recognition, feature extraction, data clustering, and dimensionality reduction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.5">In this, and the next chapter, you will learn about different machine learning and NN techniques based on unsupervised learning.</span></p>


            </article>
