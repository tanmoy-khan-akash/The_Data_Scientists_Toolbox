                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Very deep InceptionV3 Net used for Transfer Learning</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Transfer learning is a very powerful deep learning technique which has more applications in different domains. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">The intuition is very simple and can be explained with an analogy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Suppose you want to learn a new language, say Spanish, then it could be useful to start from what you already know in a different language, say English.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Following this line of thinking, computer vision researchers now commonly use pre-trained CNNs to generate representations for new tasks, where the dataset may not be large enough to train an entire CNN from scratch. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">Another common tactic is to take the pre-trained ImageNet network and then fine-tune the entire network to the novel task.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">InceptionV3 Net is a very deep ConvNet developed by Google. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">Keras implements the full network, shown in the following figure, and it comes pre-trained on ImageNet. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">The default input size for this model is 299x299 on three channels:</span></p>
