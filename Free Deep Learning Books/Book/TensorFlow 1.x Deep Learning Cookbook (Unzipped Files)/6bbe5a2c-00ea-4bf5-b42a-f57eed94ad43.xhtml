        <title>Getting ready</title>
        <link rel="stylesheet" href="css/style.css" type="text/css"/>
        <meta charset="utf-8"/>
    
<!-- kobo-style -->
<script xmlns="http://www.w3.org/1999/xhtml" type="text/javascript" src="js/kobo.js"/>
<style xmlns="http://www.w3.org/1999/xhtml" type="text/css" id="koboSpanStyle">.koboSpan { -webkit-text-combine: inherit; }</style>

    <body>
        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting ready</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Let's see the expressions that we will need to make our RBM:</span></p>
<p><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Forward pass</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">: The information at visible units (</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">V</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">) is passed via weights (</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">W</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">) and biases (</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">c</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">) to the hidden units (</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">h</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">0</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">The hidden unit may fire or not depending on the stochastic probability (</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">σ</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1"> is stochastic probability):</span></p>
<div class="CDPAlignCenter CDPAlign"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">p(h</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">|v</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">0</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">) = σ(V</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">T</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">W + c)</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">i</span></sub></em></div>
<p><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Backward pass</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">: The hidden unit representation (</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">h</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">0</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">) is then passed back to the visible units through the same weights </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">W</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">, but different bias </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">c</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">, where they reconstruct the input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.2">Again, the input is sampled:</span></p>
<div class="CDPAlignCenter CDPAlign"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">p(v</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">|h</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">0</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">) = σ(W</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">T</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">h</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">0</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"> +b)</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">i</span></sub></em></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">These two passes are repeated for k-steps or till the convergence is reached. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">According to researchers, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">k=1</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"> gives good results, so we will keep </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">k = 1</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">The joint configuration of the visible vector </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">V</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1"> and the hidden vector has an energy given as follows:</span></p>
<p style="padding-left: 30px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1"><img src="assets/71465973-609e-49e8-88f1-a79edcdbb6de.png"/></span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">Also associated with each visible vector </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">V</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1"> is free energy, the energy that a single configuration would need to have in order to have the same probability as all of the configurations that contain </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">V</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">:</span></p>
<p style="padding-left: 30px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1"><img src="assets/0bdb95b3-4af7-4b13-aaf2-b6686c2c50f3.png"/></span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">Using the Contrastive Divergence objective function, that is, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">Mean(F(V</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">original</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">))- Mean(F(V</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">reconstructed</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">))</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">, the change in weights is given by:</span></p>
<p style="padding-left: 90px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1"><img src="assets/a34043ff-5f4b-48fe-a027-6565ea41a215.png"/></span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">Here, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">η</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1"> is the learning rate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.2">Similar expressions exist for the biases </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">b</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1"> and </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">c</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">.</span></p>


            </article>

            
        </section>
