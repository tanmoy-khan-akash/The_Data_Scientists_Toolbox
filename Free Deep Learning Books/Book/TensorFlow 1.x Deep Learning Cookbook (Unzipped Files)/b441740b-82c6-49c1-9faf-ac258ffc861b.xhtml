        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We proceed with the recipe as follows:</span></p>
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">We need to import the standard modules, TensorFlow, NumPy, and Pandas, for reading the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">.csv</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> file, and Matplolib:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">import tensorflow as tf</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">import numpy as np</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">import pandas as pd</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">import matplotlib.pyplot as plt</span></pre>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">The training, validation, and testing data is obtained using the helper functions:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">X_train, Y_train = preprocess_data(train_data)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">X_val, Y_val = preprocess_data(val_data)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">X_test, Y_test = preprocess_data(test_data)</span></pre>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Let us explore our data a little. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">We plot the mean image and find the number of images in each training, validation, and testing dataset:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1"># Explore Data</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">mean_image = X_train.mean(axis=0)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">std_image = np.std(X_train, axis=0)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">print("Training Data set has {} images".format(len(X_train)))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">print("Validation Data set has {} images".format(len(X_val)))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">print("Test Data set has {} images".format(len(X_test)))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">plt.imshow(mean_image.reshape(48,48), cmap='gray')</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">We get the result as follows:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1"><img height="237" width="241" src="assets/8b39be19-d7cc-4fdf-8dc2-f464543daa43.png"/></span></div>
<ol start="4">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">We also see the images from the training sample and their respective label:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">classes = ['angry','disgust','fear','happy','sad','surprise','neutral']</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">num_classes = len(classes)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">samples_per_class = 7</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">for y,cls in enumerate(classes):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">     idxs = np.flatnonzero(np.argmax(Y_train, axis =1) == y)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">     idxs = np.random.choice(idxs, samples_per_class, replace=False)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">     for i, idx in enumerate(idxs):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">         plt_idx = i * num_classes + y + 1</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">         plt.subplot(samples_per_class, num_classes, plt_idx)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">         plt.imshow(X_train[idx].reshape(48,48), cmap='gray') #pixel height and width</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">         plt.axis('off')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">         if i == 0:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">             plt.title(cls)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">plt.show()</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">The plot is as follows:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1"><img height="197" width="271" src="assets/c1f4a087-3971-4d1a-a1ff-48cc226c4a9e.png"/></span></div>
<ol start="5">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Next, we define the RBM stack; each RBM takes the output of the previous RBM as its input:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">RBM_hidden_sizes = [1500, 700, 400] #create 4 layers of RBM with size 1500, 700, 400 and 100</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">#Set input as training data</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">inpX = X_train</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">#Create list to hold our RBMs</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">rbm_list = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">#Size of inputs is the number of inputs in the training set</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">input_size = inpX.shape[1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">#For each RBM we want to generate</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">for i, size in enumerate(RBM_hidden_sizes):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">     print ('RBM: ',i,' ',input_size,'-&gt;', size)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">     rbm_list.append(RBM(input_size, size))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">     input_size = size</span></pre>
<p style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">This generates three RBMs: the first RBM with 2,304 (48 × 48) input and 1,500 hidden units, the second RBM with 1,500 input and 700 hidden units, and finally the third RBM with 700 input and 400 hidden units.</span></p>
<ol start="6">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">We train each RBM one by one. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">The technique is also called </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">greedy wise training</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.2">In the original paper the number of epochs for training each RBM on MNIST was 30, so here, too, increasing the epochs should improve the performance of the network:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1"># Greedy wise training of RBMs</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">init = tf.global_variables_initializer()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">for rbm in rbm_list:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">     print ('New RBM:')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">     #Train a new one</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">     with tf.Session() as sess:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">         sess.run(init)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">         rbm.set_session(sess)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">         err = rbm.fit(inpX, 5)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">         inpX_n = rbm.rbm_output(inpX)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">         print(inpX_n.shape)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">         inpX = inpX_n</span></pre>
<ol start="7">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">We define a </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">DBN</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1"> class. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.2">In the class, we build the complete DBN with the three layers of RBM and two additional MLP layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.3">The weights of RBM layers are loaded from the pre-trained RBMs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.4">We also declare methods to train and predict the DBN; for fine-tuning, the network tries to minimize the mean square loss function:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">class DBN(object):</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">     def __init__(self, sizes, X, Y, eta = 0.001, momentum = 0.0, epochs = 10, batch_size = 100):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">         #Initialize hyperparameters</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">         self._sizes = sizes</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">         print(self._sizes)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">         self._sizes.append(1000) # size of the first FC layer</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">         self._X = X</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">         self._Y = Y</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">         self.N = len(X)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">         self.w_list = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">         self.c_list = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">         self._learning_rate = eta</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">         self._momentum = momentum</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">         self._epochs = epochs</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">         self._batchsize = batch_size</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">         input_size = X.shape[1]</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">         #initialization loop</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">         for size in self._sizes + [Y.shape[1]]:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">             #Define upper limit for the uniform distribution range</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">             max_range = 4 * math.sqrt(6. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.2">/ (input_size + size))</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">             #Initialize weights through a random uniform distribution</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">             self.w_list.append(</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">             np.random.uniform( -max_range, max_range, [input_size,         size]).astype(np.float32))</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">             #Initialize bias as zeroes</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">             self.c_list.append(np.zeros([size], np.float32))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">             input_size = size</span><br/> <br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">         # Build DBN</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">         #Create placeholders for input, weights, biases, output</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">         self._a = [None] * (len(self._sizes) + 2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">         self._w = [None] * (len(self._sizes) + 1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">         self._c = [None] * (len(self._sizes) + 1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">         self._a[0] = tf.placeholder("float", [None, self._X.shape[1]])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">         self.y = tf.placeholder("float", [None, self._Y.shape[1]])</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">         #Define variables and activation function</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">         for i in range(len(self._sizes) + 1):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">             self._w[i] = tf.Variable(self.w_list[i])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">             self._c[i] = tf.Variable(self.c_list[i])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">         for i in range(1, len(self._sizes) + 2):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">             self._a[i] = tf.nn.sigmoid(tf.matmul(self._a[i - 1], self._w[i - 1]) + self._c[i - 1])</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">         #Define the cost function</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">         cost = tf.reduce_mean(tf.nn.softmax_cross_entropy_with_logits(labels=self.y, logits= self._a[-1]))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">         #cost = tf.reduce_mean(tf.square(self._a[-1] - self.y))</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">         #Define the training operation (Momentum Optimizer minimizing the Cost function)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">         self.train_op = tf.train.AdamOptimizer(learning_rate=self._learning_rate).minimize(cost)</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">         #Prediction operation</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">         self.predict_op = tf.argmax(self._a[-1], 1)</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">     #load data from rbm</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">     def load_from_rbms(self, dbn_sizes,rbm_list):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">         #Check if expected sizes are correct</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">         assert len(dbn_sizes) == len(self._sizes)</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">         for i in range(len(self._sizes)):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">             #Check if for each RBN the expected sizes are correct</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">             assert dbn_sizes[i] == self._sizes[i]</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">         #If everything is correct, bring over the weights and biases</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">         for i in range(len(self._sizes)-1):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">             self.w_list[i] = rbm_list[i]._W</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">             self.c_list[i] = rbm_list[i]._c</span><br/> <br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">     def set_session(self, session):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">         self.session = session</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">    #Training method</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">     def train(self, val_x, val_y):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">         #For each epoch</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">         num_batches = self.N // self._batchsize</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">         batch_size = self._batchsize</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">         for i in range(self._epochs):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">             #For each step</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">             for j in range(num_batches):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">                 batch = self._X[j * batch_size: (j * batch_size + batch_size)]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">                 batch_label = self._Y[j * batch_size: (j * batch_size + batch_size)]</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">                 self.session.run(self.train_op, feed_dict={self._a[0]: batch, self.y: batch_label})</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">                 for j in range(len(self._sizes) + 1):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">                     #Retrieve weights and biases</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">                     self.w_list[j] = sess.run(self._w[j])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">                     self.c_list[j] = sess.run(self._c[j])</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">             train_acc = np.mean(np.argmax(self._Y, axis=1) ==</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1"> self.session.run(self.predict_op, feed_dict={self._a[0]: self._X, self.y: self._Y}))</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">             val_acc = np.mean(np.argmax(val_y, axis=1) ==</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1"> self.session.run(self.predict_op, feed_dict={self._a[0]: val_x, self.y: val_y}))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">             print (" epoch " + str(i) + "/" + str(self._epochs) + " Training Accuracy: " +  str(train_acc) + " Validation Accuracy: " + str(val_acc))</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">     def predict(self, X):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">         return self.session.run(self.predict_op, feed_dict={self._a[0]: X})</span></pre>

<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">nNet = DBN(RBM_hidden_sizes, X_train, Y_train, epochs = 80)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">with tf.Session() as sess:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">     #Initialize Variables</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">     sess.run(tf.global_variables_initializer())</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">     nNet.set_session(sess)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">     nNet.load_from_rbms(RBM_hidden_sizes,rbm_list)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">     nNet.train(X_val, Y_val)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">     y_pred = nNet.predict(X_test)</span></pre>
