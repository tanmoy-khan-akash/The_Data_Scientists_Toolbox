                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">There is more...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">On the internet, you can find more experiments performed by Avi Singh (</span><a href="https://avisingh599.github.io/deeplearning/visual-qa/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://avisingh599.github.io/deeplearning/visual-qa/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">)  where different models are compared, including a simple 'bag-of-words' for language together with CNN for images, an LSTM-only model, and an LSTM+CNN model - similar to the one discussed in this recipe. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">The blog posting also discusses different training strategies for each model.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">In addition to that, interested readers can fin</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">d on the internet (</span><a href="https://github.com/anujshah1003/VQA-Demo-GUI"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">https://github.com/anujshah1003/VQA-Demo-GUI</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">)</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> a nice GUI built on the top of Avi Singh's demo which allows you to interactively load images and ask related questions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">A YouTube video is also available (</span><a href="https://www.youtube.com/watch?v=7FB9PvzOuQY"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">https://www.youtube.com/watch?v=7FB9PvzOuQY</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">).</span></p>


            </article>
