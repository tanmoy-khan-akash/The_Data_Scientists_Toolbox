                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Installing TensorFlow</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">In this recipe, you will learn how to do a fresh installation of TensorFlow 1.3 on different OSes (Linux, Mac, and Windows). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">We will find out about the necessary requirements to install TensorFlow. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">TensorFlow can be installed using native pip, Anaconda, virtualenv, and Docker on Ubuntu and macOS. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">For Windows OS, one can use native pip or Anaconda.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">As Anaconda works on all the three OSes and provides an easy way to not only install but also to maintain different project environments on the same system, we will concentrate on installing TensorFlow using Anaconda in this book. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">More details about Anaconda and managing its environment can be read from </span><a href="https://conda.io/docs/user-guide/index.html"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">https://conda.io/docs/user-guide/index.html</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">. </span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">The code in this book has been tested on the following platforms:</span></p>
<ul>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Windows 10, Anaconda 3, Python 3.5, TensorFlow GPU, CUDA toolkit 8.0, cuDNN v5.1, NVDIA® GTX 1070</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Windows 10/ Ubuntu 14.04/ Ubuntu 16.04/macOS Sierra, Anaconda3, Python 3.5, TensorFlow (CPU)</span></li>
</ul>


            </article>
