        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The code for this recipe is based on the Andrej Karpathy blog (</span><a href="http://karpathy.github.io/2016/05/31/rl/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">http://karpathy.github.io/2016/05/31/rl/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">) and a part of it has been adapted from code by Sam Greydanus (</span><a href="https://gist.github.com/karpathy/a4166c7fe253700972fcbc77e4ea32c5"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">https://gist.github.com/karpathy/a4166c7fe253700972fcbc77e4ea32c5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">).</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">We have the usual imports:</span></li>
</ol>
<pre style="padding-left: 60px"><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">import </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">numpy </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">as </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">np</span><br/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">import </span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">gym</span></span><br/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">import </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">matplotlib.pyplot </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">as </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">plt</span><br/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">import </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">tensorflow </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">as </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">tf</span></pre>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">We define our </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">PolicyNetwork</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1"> </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">class.</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"> During the class construction, the model hyperparameters are also initialized. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.2">The </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">__init__</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1"> method defines the placeholders for input state, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">self.tf_x</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">; predicted action, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">self.tf.y</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">; corresponding reward, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">self.tf_epr</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">; network weights; and ops to predict action value, training, and updating. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">You can see that the class construction also initiates an interactive TensorFlow session:</span></li>
</ol>
<pre style="padding-left: 60px"><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">class </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">PolicyNetwork(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">object</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">):</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">def </span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">__init__</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">, N_SIZE, h=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">200</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">, gamma=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">0.99</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">, eta=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">1e-3</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">, decay=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">0.99</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">, save_path = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">'models2/pong.ckpt' </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">):</span><br/><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">.gamma = gamma</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">.save_path = save_path</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1"># Placeholders for passing state....</span><br/></span><span>        </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">.tf_x = tf.placeholder(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">dtype</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">=tf.float32, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">shape</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">=[</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">None</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">, N_SIZE * N_SIZE], </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">name</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">"tf_x"</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">)</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">.tf_y = tf.placeholder(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">dtype</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">=tf.float32, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">shape</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">=[</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">None</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">, n_actions], </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">name</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">"tf_y"</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">)</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">.tf_epr = tf.placeholder(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">dtype</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">=tf.float32, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">shape</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">=[</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">None</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">], </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">name</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">"tf_epr"</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">)</span><br/><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1"># Weights</span><br/></span><span>        </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">xavier_l1 = tf.truncated_normal_initializer(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">mean</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">0</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">stddev</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">1. </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">/ N_SIZE, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">dtype</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">=tf.float32)</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">.W1 = tf.get_variable(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">"W1"</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">, [N_SIZE * N_SIZE, h], </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">initializer</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">=xavier_l1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">        xavier_l2 = tf.truncated_normal_initializer(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">mean</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">0</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">stddev</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">1. </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">/ np.sqrt(h), </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">dtype</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">=tf.float32)</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">.W2 = tf.get_variable(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">"W2"</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">, [h, n_actions], </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">initializer</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">=xavier_l2)</span><br/><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1"># Build Computation</span><br/></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">        # tf reward processing (need tf_discounted_epr for policy gradient wizardry)</span><br/></span><span>        </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">tf_discounted_epr = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">.tf_discount_rewards(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">.tf_epr)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">        tf_mean, tf_variance = tf.nn.moments(tf_discounted_epr, [</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">0</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">], </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">shift</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">None</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">name</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">"reward_moments"</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">        tf_discounted_epr -= tf_mean</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">        tf_discounted_epr /= tf.sqrt(tf_variance + </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">1e-6</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">)</span><br/><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1"># Define Optimizer, compute and apply gradients</span><br/></span><span>        </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">.tf_aprob = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">.tf_policy_forward(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">.tf_x)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">        loss = tf.nn.l2_loss(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">.tf_y - </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">.tf_aprob)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">        optimizer = tf.train.RMSPropOptimizer(eta, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">decay</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">=decay)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">        tf_grads = optimizer.compute_gradients(loss, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">var_list</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">=tf.trainable_variables(), </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">grad_loss</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">=tf_discounted_epr)</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">.train_op = optimizer.apply_gradients(tf_grads)</span><br/><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1"># Initialize Variables</span><br/></span><span>        </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">init = tf.global_variables_initializer()</span><br/>        <br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">.session = tf.InteractiveSession()</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">.session.run(init)</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">.load()</span></pre>
<ol start="4">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">We define a method to calculate the discounted rewards. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.2">This ensures that the agent takes into account not only the present reward, but also future rewards. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.3">The discounted reward at any time </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">t</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1"> is given by </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">R</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">t</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1"> = ∑γ</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">k</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">r</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">t+k</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">, where the summation is over </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">k ∈ [0,∞]</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">, and </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">γ</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1"> is the discount factor with value lying between 0 and 1. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.2">In our code, we have used gamma = 0.99:</span></li>
</ol>
<pre style="padding-left: 60px"><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">def </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">tf_discount_rewards(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">, tf_r):  </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1"># tf_r ~ [game_steps,1]</span><br/></span><span>    </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">discount_f</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1"> = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">lambda </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">a, v: a * </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">.gamma + v;</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">    tf_r_reverse = tf.scan(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">discount_f</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">, tf.reverse(tf_r, [</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">0</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">]))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">    tf_discounted_r = tf.reverse(tf_r_reverse, [</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">0</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">])</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">return </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">tf_discounted_r</span></pre>
<ol start="5">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">We define a </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">tf_policy_forward</span></kbd> <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">method </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">to provide the probability of moving the paddle UP, given an input observation state. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.2">We implement it using a two-layer NN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.3">The network takes the processed image of the state of the game and generates a single number denoting the probability of moving the paddle UP. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.4">In TensorFlow, as the network graph is computed only in the TensorFlow session, we therefore define another method, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">predict_UP</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1">, to compute the probability:</span></li>
</ol>
<pre style="padding-left: 60px"><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">def </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">tf_policy_forward(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">, x): </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1">#x ~ [1,D]</span><br/></span><span>     </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">h = tf.matmul(x, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">.W1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">     h = tf.nn.relu(h)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">     logp = tf.matmul(h, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">.W2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1">     p = tf.nn.softmax(logp)</span><br/>     <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">return </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">p</span><br/><br/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">def </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">predict_UP(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">,x):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">    feed = {</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">.tf_x: np.reshape(x, (</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">, -</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">))}</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1">    aprob = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">.session.run(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">.tf_aprob, feed);</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">return </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">aprob</span></pre>
<ol start="6">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1">The </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">PolicyNetwork</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1"> agent updates the weights using the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">update</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1"> method:</span></li>
</ol>
<pre style="padding-left: 60px"><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">def </span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">update</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">, feed):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">    return </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">.session.run(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">.train_op, feed)</span></pre>
<ol start="7">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">We define a helper function to preprocess the observation state space:</span></li>
</ol>
<pre style="padding-left: 60px"><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1"># downsampling</span><br/></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">def </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">preprocess(I):</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">""" prepro 210x160x3 uint8 frame into 6400 (80x80) 1D float vector """</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1">I = I[</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">35</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1">:</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">195</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">] </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1"># crop</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">I = I[::</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">2</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">,::</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">2</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">,</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">0</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">] </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1"># downsample by factor of 2</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">I[I == </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">144</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">] = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">0  </span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1"># erase background (background type 1)</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">I[I == </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">109</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">] = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">0  </span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1"># erase background (background type 2)</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">I[I != </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1">0</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1">] = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1">1    </span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1"># everything else (paddles, ball) just set to 1</span><br/></span><span>    </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1">return </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">I.astype(np.float).ravel()</span><br/><br/></pre>
<ol start="8">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1">The rest is simple--we create a game environment, define arrays to hold (state, action, reward, state), and make the agent learn for a very large number of episodes (with a break or continuously, depending solely on your computational resources). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.2">An important thing to note here is that the agent is not learning per action step. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.3">Instead, the agent uses the complete set of (state, action, reward, state) of one episode to correct its policy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.4">This can be memory-expensive:</span></li>
</ol>
<pre style="padding-left: 60px"><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">if </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1">__name__ == </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1">'__main__'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1">:</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1"># Create Game Environment</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">env_name = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1">"Pong-v0"</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1">env = gym.make(env_name)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.1">    env = wrappers.Monitor(env, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.1">'/tmp/pong'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.321.1">force</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.323.1">True</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.1">)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.1">    n_actions = env.action_space.n  </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.1"># Number of possible actions</span><br/></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.327.1">    # Initializing Game and State(t-1), action, reward, state(t)</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.1">xs, rs, ys = [], [], []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.329.1">    obs = env.reset()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.330.1">    prev_x = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.1">None</span><br/></span><span><br/></span><span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.332.1">running_reward = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.333.1">None</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.334.1">running_rewards = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.335.1">    reward_sum = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.1">0</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.337.1">n = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.338.1">0</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.1">done = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.340.1">False</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.341.1">n_size = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.1">80</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.343.1">num_episodes = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.344.1">500</span><br/></span><span><br/></span><span>    </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.345.1">#Create Agent</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.346.1">agent = PolicyNetwork(n_size)</span><br/><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.347.1"># training loop</span><br/></span><span>    </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.1">while not </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.349.1">done </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.350.1">and </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.351.1">n&lt; num_episodes:</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.352.1"># Preprocess the observation</span><br/></span><span>        </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.1">cur_x = preprocess(obs)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.1">        x = cur_x - prev_x </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.355.1">if </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.356.1">prev_x </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.357.1">is not None else </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.1">np.zeros(n_size*n_size)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.1">        prev_x = cur_x</span><br/><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.1">#Predict the action</span><br/></span><span>        </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.361.1">aprob = agent.predict_UP(x) ; aprob = aprob[</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.362.1">0</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.1">,:]</span><br/><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.364.1">        action = np.random.choice(n_actions, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.365.1">p</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.366.1">=aprob)</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.367.1">#print(action)</span><br/></span><span>        </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.368.1">label = np.zeros_like(aprob) ; label[action] = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.369.1">1</span><br/></span><span><br/></span><span>        </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.1"># Step the environment and get new measurements</span><br/></span><span>        </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.371.1">obs, reward, done, info = env.step(action)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.372.1">        env.render()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.1">        reward_sum += reward</span><br/><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.374.1"># record game history</span><br/></span><span>        </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.375.1">xs.append(x) ; ys.append(label) ; rs.append(reward)</span><br/><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.376.1">if </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.377.1">done:</span><br/>            <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.378.1"># update running reward</span><br/></span><span>            </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.379.1">running_reward = reward_sum </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.1">if </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.381.1">running_reward </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.1">is None else </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.1">running_reward * </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.384.1">0.99 </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.1">+ reward_sum * </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.1">0.01</span><br/></span><span>            </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.1">running_rewards.append(running_reward)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.388.1">            feed = {agent.tf_x: np.vstack(xs), agent.tf_epr: np.vstack(rs), agent.tf_y: np.vstack(ys)}</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.1">            agent.update(feed)</span><br/>            <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.1"># print progress console</span><br/></span><span>            </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.1">if </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.1">n % </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.393.1">10 </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.394.1">== </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.1">0</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.396.1">:</span><br/>                <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.1">print </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.1">(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.399.1">'ep {}: reward: {}, mean reward: {:3f}'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.400.1">.format(n, reward_sum, running_reward))</span><br/>            <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.1">else</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.402.1">:</span><br/>                <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.1">print </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.404.1">(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.405.1">'</span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.406.1">\t</span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.407.1">ep {}: reward: {}'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.1">.format(n, reward_sum))</span><br/><br/>            <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.1"># Start next episode and save model</span><br/></span><span>            </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.1">xs, rs, ys = [], [], []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.1">            obs = env.reset()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.1">            n += </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.1">1 </span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.1"># the Next Episode</span><br/></span><span><br/></span><span>            </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.415.1">reward_sum = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.1">0</span><br/></span><span>            </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.417.1">if </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.418.1">n % </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.419.1">50 </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.1">== </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.1">0</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.422.1">:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.1">                agent.save()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.1">            done = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.425.1">False</span><br/></span><span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.426.1">plt.plot(running_rewards)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.1">    plt.xlabel(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.428.1">'episodes'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.429.1">)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.1">    plt.ylabel(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.431.1">'Running Averge'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.432.1">)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.1">    plt.show()</span><br/><span xm
