<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">A large number of docker images and machine images with preconfigured libraries and APIs are available at AWS marketplace. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">To launch the jupyter notebook , at command line use </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">&lt;jupyter notebook --ip=0.0.0.0 --no-browser&gt;</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">This will result in an output as shown in the following:</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Copy/paste this URL into your browser when you connect for the first time to login with a token:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">

<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">You copy and paste the URL on your browser and you are ready to go.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">In addition, the whole process can be simplified by looking at AWS CloudFormation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">It creates and configures Amazon Web Services resources with a template. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">In doing so, it simplifies the process of setting up a distributed deep learning cluster. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.4">The interested reader can have a look to </span><a href="https://aws.amazon.com/blogs/compute/distributed-deep-learning-made-easy/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">https://aws.amazon.com/blogs/compute/distributed-deep-learning-made-easy/</span></a></p>
