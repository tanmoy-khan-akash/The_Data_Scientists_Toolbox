            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Attention is a mechanism for using the information acquired by the inner states of the encoder RNN and combining this information with the final state of the decoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">The key </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">idea</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> is that, in this way, it is possible to pay more or less attention to some tokens in the source sequence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">The gain obtained with attention is shown in the following figure representing the BLEU score.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">We notice a significant gain with respect to the same diagram given in our first recipe, where no attention was used:</span></p>
