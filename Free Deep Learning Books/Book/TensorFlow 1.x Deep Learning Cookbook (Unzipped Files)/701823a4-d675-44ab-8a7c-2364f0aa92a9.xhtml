                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting ready</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The first step is to select a specific category used for training the VGG16 on ImageNet. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Let's say that we take the category 20, which corresponds to the </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">American Dipper</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> bird shown in the following picture:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"><img height="167" width="222" class="alignnone size-full wp-image-783 image-border" src="assets/75e30d9a-ab59-44ab-918e-5c0dd6dd7c5a.jpg"/></span></div>
<div class="packt_figref CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">An example of American Dipper as seen on </span><a href="https://commons.wikimedia.org/wiki/File:American_Dipper.jpg"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">https://commons.wikimedia.org/wiki/File:American_Dipper.jpg</span></a></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">ImageNet mapping can be found online (</span><a href="https://gist.github.com/yrevar/6135f1bd8dcf2e0cc683"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">https://gist.github.com/yrevar/6135f1bd8dcf2e0cc683</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">)  as a python pickle dictionary where the ImageNet 1000 class ID is mapped to human-readable labels.</span></p>


            </article>
