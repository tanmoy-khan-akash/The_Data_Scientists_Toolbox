                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Generating music with dilated ConvNets, WaveNet, and NSynth</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">WaveNet is a deep generative model for producing raw audio waveforms. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">This breakthrough technology has been introduced (</span><a href="https://deepmind.com/blog/wavenet-generative-model-raw-audio/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://deepmind.com/blog/wavenet-generative-model-raw-audio/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">)  by Google DeepMind(</span><a href="https://deepmind.com/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">https://deepmind.com/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">)  for teaching how to speak to computers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">The results are truly impressive and online you can find examples of synthetic voices where the computer learns how to talk with the voice of celebrities, such as Matt Damon.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">So, you might wonder why learning to synthesize audio is so difficult. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">Well, each digital sound we hear is based on 16,000 samples per second (sometimes 48,000 or more) and building a predictive model where we learn to reproduce a sample based on all the previous ones is a very difficult challenge. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.3">Nevertheless, there are experiments showing that WaveNet has improved the current state-of-the-art </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Text-to-Speech</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> (TTS) systems, reducing the difference with human voices by 50 percent for both US English and Mandarin Chinese.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">What is even cooler is that DeepMind proved that WaveNet can be also used to teach to computers how to generate the sound of musical instruments, such as piano music.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Now for some definitions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">TTS systems are typically divided into two different classes:</span></p>
<ul>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Concatenative TTS, where single speech voice fragments are first memorized and then recombined when the voice has to be reproduced. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">However, this approach does not scale because it is possible to reproduce only the memorized voice fragments and it is not possible to reproduce new speakers or different types of audio without memorizing the fragments from the beginning.</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Parametric TTS, where a model is created for storing all the characteristic features of the audio to be synthesized. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">Before WaveNet, the audio generated with parametric TTS was less natural than concatenative TTS. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.3">WaveNet improved the state of the art by modeling directly the production of audio sounds, instead of using intermediate signal processing algorithms used in the past.</span></li>
</ul>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">In principle, WaveNet can be seen as a stack of 1D convolutional layers (we have seen 2D convolution for images in Chapter 4) with a constant stride of one and with no pooling layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">Note that the input and the output have by construction the same dimension, so the ConvNets are well suited to model sequential data such as audio sounds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.3">However, it has been shown that in order to reach a large size for the receptive field in the output neuron it is necessary to either use a massive number of large filters or prohibitively increase the depth of the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.4">Remember that the receptive field of a neuron in a layer is the cross-section of the previous layer from which neurons provide inputs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.5">For this reason, pure ConvNets are not so effective in learning how to synthesize audio. </span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">The key intuition beyond WaveNet is the so-called dilated causal convolutions (sometimes known as atrous convolutions), which simply means that some input values are skipped when the filter of a convolutional layer is applied. Atrous is the </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">bastardization</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1"> of the  French expression </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">à trous</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">, meaning </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">with holes</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">So an AtrousConvolution is a convolution with holes As an example, in one dimension a filter w of size 3 with dilatation 1 would compute the following sum.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">So in short, in a D-dilated convolution, usually the stride is 1, but nothing prevents you from using other strides. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.2">An example is given in the following figure with increased dilatation (hole) sizes = 0, 1, 2:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1"><img height="211" width="741" class=" image-border" src="assets/9b70353f-75b7-4778-a8f1-d7fe69213a3f.png"/></span></div>
<div class="packt_figref CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">An example of dilated network</span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Thanks to this simple idea of introducing 'holes', it is possible to stack multiple dilated convolutional layers with exponentially increasing filters and learn long range input dependencies without having an excessively deep network.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">A WaveNet is, therefore, a ConvNet where the convolutional layers have various dilation factors allowing the receptive field to grow exponentially with depth, and therefore efficiently cover thousands of audio timesteps.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">When we train, the inputs are sounds recorded from human speakers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">The waveforms are quantized to a fixed integer range. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.3">A WaveNet defines an initial convolutional layer accessing only the current and previous input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.4">Then, there is a stack of dilated ConvNet layers, still accessing only current and previous inputs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.5">At the end, there is a series of Dense layers which combines previous results, followed by a softmax activation function for categorical outputs.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">At each step, a value is predicted from the network and fed back into the input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">At the same time, a new prediction for the next step is computed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.3">The loss function is the cross-entropy between the output for the current step and the input at the next step.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">NSynth (</span><a href="https://magenta.tensorflow.org/nsynth"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">https://magenta.tensorflow.org/nsynth</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">) is an evolution of WaveNet recently released by the Google Brain group, which instead of being causal, aims at seeing the entire context of the input chunk. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">The neural network is truly, complex as depicted in the following image, but for the sake of this introductory discussion it is sufficient to know that the network learns how to reproduce its input by using an approach based on reducing the error during the encoding/decoding phases:</span></p>
