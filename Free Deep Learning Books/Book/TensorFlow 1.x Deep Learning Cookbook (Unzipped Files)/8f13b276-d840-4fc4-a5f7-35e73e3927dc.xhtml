                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How it works...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">At each epoch, the generator makes a number of predictions (it creates forged MNIST images) and the discriminator tries to learn how to produce forged images after mixing the prediction with real MNIST images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">After 32 epochs, the generator learns to forge this set of handwritten numbers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">No one has programmed the machine to write, but it has learned how to write numbers that are indistinguishable from the ones written by humans. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">Note that training GANs can be very difficult because it is necessary to find the equilibrium between two players. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">If you are interested in the topic, I'd suggest you have a look at the series of tricks collected by practitioners (</span><a href="https://github.com/soumith/ganhacks"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://github.com/soumith/ganhacks</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">).</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Let's look at a number of practical examples for different epochs to understand how the machine will learn to improve its writing process:</span></p>
