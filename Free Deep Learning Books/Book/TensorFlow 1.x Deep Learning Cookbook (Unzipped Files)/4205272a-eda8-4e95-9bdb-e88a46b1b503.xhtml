        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">What this book covers</span></h1>
                </header>
            
            <article>
                
<p class="NormalPACKT"><em><a href=""><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Chapter 1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">, TensorFlow - An Introduction</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">, </span><span class="sugar_field"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">discusses TensorFlow the Google's open source framework, and why it is useful for deep learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">We will discuss how to install TensorFlow on MAC, Windows and Ubuntu for both CPU and GPU. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.3">We will also discuss other python packages that we will use throughout the book. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.4">We will explain the two components of TensorFlow codes, the definition of graph and its execution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.5"> We will learn about using the TensorBoard to see the graph structure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.6">We will understand the difference between TensorFlow constants, variables and placeholders. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.7">And we will also get a taste of TensorFlow estimators.</span></span></p>
<p class="NormalPACKT"><em><a href=""><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Chapter 2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> , </span><span class="cdp-organizer-chapter-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Regression,</span></span></em> <span><span class="sugar_field"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">talks about </span></span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">regression and its applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">We will discuss the concepts involved in regression, understand how it is different from clustering and classification. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">We will learn about different types of loss functions possible and how to implement them in Tensorflow. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.4">We learn how to implement L1 and L2  regularizations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.5"> We will discuss the gradient descent algorithm, learn how to optimize it and implement it in Tensorflow. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.6">We will briefly learn about cross-entropy function and its implementation.</span></p>
<p class="NormalPACKT"><span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1"> </span></em></span><em><a href=""><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Chapter 3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1"> , </span><span class="cdp-organizer-chapter-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Neural Networks - Perceptron</span></span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">, </span><span class="sugar_field"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">covers </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">artificial neural networks and explains why it can do the wonderful tasks as claimed recently by DNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2"> We will learn about different choices of activation functions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.3">We will use all this to build a simple perceptron and use it for function modeling. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.4">We will learn about regularization of data before training. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.5">We will also learn to build a multilayer perceptron (MLP) layer by layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.6">We will see how the auto-differentiator of TensorFlow makes our work easier.</span></p>
<p class="NormalPACKT"><em><a href=""><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Chapter 4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1"> , </span><span class="cdp-organizer-chapter-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">TensorFlow - Convolutional Neural Networks</span></span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">, </span><span class="sugar_field"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">discusses the process of convolution and how it is able to extract features. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.2">We will learn about three important layers of CNN: convolutional layers, pooling layer and fully connected layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.3">We will also learn about dropout, how it can increase performance and different CNN architectures such as LeNET and GoogleNET.</span></span></p>
<p class="mce-root"><em><a href=""><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Chapter 5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">, CNN in Action</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">, </span><span class="sugar_field"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">covers </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">some wow success stories of CNN like face recognition. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">We will write a recipe for using CNNs for sentiment analysis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.3">We will discuss pre-tuning CNN and learn how to implement transfer learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.4">We will learn how to use VGG16 for transfer learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.5">We will learn classification of images with VGGNet, ResNet, Inception and Xception. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.6">We will Generate music using dilated ConvNets, Wavenet and Nsynth. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.7">We will also learn how to do Visual Q &amp; A. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.8">We will learn how to classify videos.</span></p>
<p class="NormalPACKT"><em><a href=""><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Chapter 6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">, Recurrent Neural Networks</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">, discusses Recurrent Neural networks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">We will learn the basic unit of RNNs the RNN cell. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.3">We will learn about word embeddings and time sequencing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.4">We will briefly discuss LSTM networks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.5">We will learn about seq2seq RNNs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.6">We will learn how RNNs can be employed for machine translation, generating text, and predicting future values</span></p>
<p class="NormalPACKT"><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1"> </span></span><em><a href=""><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">Chapter 7</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">, Unsupervised Learning</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">, </span><span class="sugar_field"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">teaches the unsupervised learning paradigm. </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">We will learn about clustering and dimensionality reduction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.2">We will learn about techniques like Principal Component Analysis (PCA) and see how they can be used for dimensionality reduction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.3">We will learn about k-means clustering. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.4">We will understand the concept of Topographic maps and learn how to train self-organizing maps. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.5">We will learn about Restricted Boltzmann Machines (RBM). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.6">We will discuss the architecture and training of RBMs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.7">We learn how to stack RBMs to make Deep Belief Networks, and we will learn how to train them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.8">We will train DBN using the concept of pre-training and fine tuning for emotion detection.</span></p>
<p class="NormalPACKT"><em><a href=""><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">Chapter 8</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">, Autoencoders</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">, </span><span class="sugar_field"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">demystifies autoencoders. </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">We will learn about autoencoders and their applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.2">We will discuss various real-life examples where auto-encoders can be used. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.3">We will discuss the process of encoding and subsequent reconstruction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.4">We will learn about reconstruction error. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.5">We will learn about sparse autoencoders, the concept of KL divergence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.6">We will learn Denoising Autoencoders and use them to reconstruct clean images given noisy images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.7">We will learn how to build Convolutional Autoencoders and Stacked Autoencoders.</span></p>
<p class="NormalPACKT"><em><a href=""><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">Chapter 9</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">, Reinforcement Learning</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">, </span><span class="sugar_field"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">covers different </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">reinforcement learning algorithms. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.2">We will learn the Q-learning algorithm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.3">We will discuss Bellman-Ford equation and how to choose learning rate, discount factor. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.4">We will learn how to use OpenAI gym framework. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.5">We will learn about the concepts of Experience Replay and buffering to implement value-iteration Q network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.6">We will use Q learning and policy gradients to build game playing agents. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.7">And finally, we will learn how to make our own Deep Q-learning Network (DQN). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.8">A brief description of AlphaGo Zero and its grand win.</span></p>
<p><em><a href="284c0bfc-60b0-40b0-b87f-44e4bdc61373.xhtml" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">Chapter 10</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">, TensorFlow Mobile Computation,</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"> covers TensorFlow mobile. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">We will learn about different applications of mobile deep learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.3">We will learn how to use Tensorflow with Android studio on Windows platform. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.4">We will learn how to use Tensorflow along with XCode to make IOS based apps. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.5"> We will learn how to optimize the Tensorflow graphs for mobile devices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.6">We will also learn how to transform Tensorflow graphs for mobile devices.</span></p>
<p><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1"> </span></em><em><a href="60f066cc-ed8c-41db-851e-06933f71a4a8.xhtml" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Chapter 11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">, TensorFlow – Generative Adversarial Networks (GANs), Variational Autoencoders, and Capsule networks, </span></em><span class="sugar_field"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">starts with generative adversarial networks and their strength over other DNNs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.2">We explore different predictive models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.3">We understand the motivation behind GANs and their working intuitively. We learn about the basic GAN architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.4">We will explore some very cool applications of GANs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.5">We will learn about another generative network the Variational Autoencoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.6">Lastly, we will learn about the recently proposed Capsule Networks  </span></span></p>
<p><em><a href="fdb2546e-ff27-4e0d-a3d0-85b9d49288eb.xhtml" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">Chapter 12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">,</span></em> <span class="cdp-organizer-chapter-title"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Distributed TensorFlow and Cloud Deep Learning</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">,</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1"> explains the cloud environment, dockers, containers, and how to use them. </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">We learn how to work with distributed Tensorflow with multiple GPUs, and multiple servers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.2">We learn how to setup AWS for deep learning.</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1"> We learn how to setup Google cloud for deep learning applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.2">We learn how to setup Microsoft Azure cloud for deep learning applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.3">We learn about other available cloud services</span></p>
<p><a href="9e1bb4b3-e4c4-4092-8527-771754a76bd4.xhtml"><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">Appendix A</span></span></a><a href="9e1bb4b3-e4c4-4092-8527-771754a76bd4.xhtml"/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">, </span></span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">Learning to Learn with AutoML (Meta-Learning)</span></em><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">, briefly talks about AutoML and Siamese Networks.</span></span></p>
<p><a href="8caf712d-133b-41a6-976f-b222ff15baa1.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">Appendix B</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">TensorFlow Processing Unit,</span></em> <span class="sugar_field"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">covers Tensor Processing Unit, its basic architecture, and how it will affect DNN's future.</span></span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1"> </span></p>
