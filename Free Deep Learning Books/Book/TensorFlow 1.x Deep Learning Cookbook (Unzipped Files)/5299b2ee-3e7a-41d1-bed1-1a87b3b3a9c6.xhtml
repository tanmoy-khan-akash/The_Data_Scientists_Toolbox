                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">See also...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">● The paper by Kingma and Welling is the seminal paper in this field. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">They go through the complete building thought process along with its elegant maths. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">For anyone interested in VAEs, this is a must read: </span><a href="https://arxiv.org/pdf/1312.6114.pdf"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://arxiv.org/pdf/1312.6114.pdf</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> .</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">● Another interesting read is the paper by Carl Doersch, A Tutorial on Variational Encoders: </span><a href="https://arxiv.org/pdf/1606.05908.pdf"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">https://arxiv.org/pdf/1606.05908.pdf</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">● The Github link contains another implementation of VAEs, along with the reproduction of the images from the Kingma and Welling paper: </span><a href="https://github.com/hwalsuklee/tensorflow-mnist-VAE"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">https://github.com/hwalsuklee/tensorflow-mnist-VAE</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">.</span></p>


            </article>
