                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">There's more...</span></h1>

            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">CapsNets work very well on MNIST but there is a lot of research work to be done in terms of understanding if the same impressive results can be achieved on other datasets such as CIFAR, or on more general collections of images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">If you are interested to know more please have a look at the following:</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">● Google's AI Wizard Unveils a new twist on neural networks: </span><a href="https://www.wired.com/story/googles-ai-wizard-unveils-a-new-twist-on-neural-networks/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">https://www.wired.com/story/googles-ai-wizard-unveils-a-new-twist-on-neural-networks/</span></a></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">● Google Researchers Have a New Alternative to Traditional Neural Networks: </span><a href="https://www.technologyreview.com/the-download/609297/google-researchers-have-a-new-alternative-to-traditional-neural-networks/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">https://www.technologyreview.com/the-download/609297/google-researchers-have-a-new-alternative-to-traditional-neural-networks/</span></a></p>
