                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">There is more...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Inception-v4 is not directly available in Keras as of July 2017, but it can be downloaded as a separate module online (</span><a href="https://github.com/kentsommer/keras-inceptionV4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://github.com/kentsommer/keras-inceptionV4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">Once installed, the module will automatically download the weights the first time it is used.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">AlexNet was one of the first stacked deep networks and it contained only eight layers, the first five were convolutional layers followed by fully-connected layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">The network was proposed in 2012 and significantly outperformed the second runner-up (top five error of 16% compared to runner-up with 26% error).</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Recent research on deep neural networks has focused primarily on improving accuracy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">With equivalent accuracy, smaller DNN architectures offer at least three advantages:</span></p>
<ul>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Smaller CNNs require less communication across servers during distributed training.</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Smaller CNNs require less bandwidth to export a new model from the cloud to the place where the model is served.</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Smaller CNNs are more feasible to deploy on FPGAs and other hardware with limited memory. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">To provide all of these advantages, SqueezeNet has been proposed in the paper </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">SqueezeNet: AlexNet-level accuracy with 50x fewer parameters and &lt;0.5MB model size</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">, Forrest N. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">Iandola, Song Han, Matthew W. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">Moskewicz, Khalid Ashraf, William J. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.4">Dally, Kurt Keutzer, 2016, </span><a href="https://arxiv.org/abs/1602.07360"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">https://arxiv.org/abs/1602.07360</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">SqueezeNet achieves AlexNet-level accuracy on ImageNet with 50x fewer parameters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.3">Additionally, with model compression techniques we are able to compress SqueezeNet to less than 0.5 MB (510x smaller than AlexNet). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.4">Keras implements SqueezeNet as a separate module available online (</span><a href="https://github.com/DT42/squeezenet_demo"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">https://github.com/DT42/squeezenet_demo</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">).</span></li>
</ul>


            </article>
