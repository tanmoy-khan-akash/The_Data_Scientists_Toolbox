                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting ready</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">This recipe uses Keras because the framework has a pre-cooked implementation of the above modules. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Keras automatically downloads the weights of each network the first time it is used and stores these weights on your local disk. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">In other words, you don't need to retrain the networks but can leverage training already available on the internet. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">This is true under the assumption that you would like to classify your network on the 1,000 predefined categories. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">In the next recipe, we will see how to start with these 1,000 categories and extend them to a customized set with a process known as transfer learning.</span></p>


            </article>

            
        </section>
