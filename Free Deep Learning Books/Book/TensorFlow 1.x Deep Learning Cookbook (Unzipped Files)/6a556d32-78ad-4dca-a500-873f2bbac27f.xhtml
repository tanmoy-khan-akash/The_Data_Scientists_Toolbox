<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">This recipe describes an example of distributed MNIST classifier. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">In this example, TensorFlow allows us to define a cluster of three machines. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">One acts as parameter server and two more machines are used as workers working on separate batches of the training data.</span></p>
