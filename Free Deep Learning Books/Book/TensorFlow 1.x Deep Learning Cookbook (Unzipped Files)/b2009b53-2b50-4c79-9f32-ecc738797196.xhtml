        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">There is more...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The paper </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Convolutional Neural Networks for Sentence Classification</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">, Yoon Kim, EMNLP 2014 (</span><a href="https://arxiv.org/abs/1408.5882"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">https://arxiv.org/abs/1408.5882</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">) performs an extensive set of experiments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">Despite little tuning of hyperparameters, a simple CNN with one layer of convolution performs remarkably well for sentence classification. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">The paper shows that adopting a set of static embedding - which will be discussed when we talk about RNNs - and building a very simple ConvNet on the top of it, can actually improve the performance of sentiment analysis significantly:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"><img class=" image-border" src="assets/15a29ebe-9ed0-4a68-a5f6-a71a16b24261.png"/></span></div>
<div class="packt_figref CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">An example of model architecture as seen in </span><a href="https://arxiv.org/pdf/1408.5882.pdf"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">https://arxiv.org/pdf/1408.5882.pdf</span></a></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">The use of CNNs for text analysis is an active field of research. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">I suggest having a look at the following article:</span></p>
<ul>
<li><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Text Understanding from Scratch</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">, Xiang Zhang, Yann LeCun (</span><a href="https://arxiv.org/abs/1502.01710"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">https://arxiv.org/abs/1502.01710</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">This article demonstrates that we can apply deep learning to text understanding from character-level inputs all the way up to abstract text concepts, using CNNs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.3">The authors apply CNNs to various large-scale datasets, including ontology classification, sentiment analysis, and text categorization, and show that they can achieve astonishing performance without the knowledge of words, phrases, sentences, or any other syntactic or semantic structures with regards to a human language. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.4">The models work for both English and Chinese.</span></li>
</ul>


            </article>
