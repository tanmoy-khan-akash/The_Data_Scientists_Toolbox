            <article>
                
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We import the necessary modules. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">We are using the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">sys</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> module's </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">stdout.flush()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> to help us force Python to </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">flush</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"> the data in the standard output (computer monitor in our case). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">The </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">random</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"> module is used to derive random samples from the experience replay buffer (the buffer where we store the past experience). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">The </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">datetime</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1"> module is used to keep track of the time spent in training:</span></li>
</ol>
<pre style="padding-left: 60px"><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">import </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">gym</span><br/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">import </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">sys</span><br/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">import </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">random</span><br/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">import </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">numpy </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">as </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">np</span><br/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">import </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">tensorflow </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">as </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">tf</span><br/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">import </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">matplotlib.pyplot </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">as </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">plt</span><br/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">from </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">datetime </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">import </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">datetime</span><br/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">from </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">scipy.misc </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">import </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">imresize</span></pre>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">We define the hyperparameters for the training; you can experiment by changing them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">These parameters define the minimum and maximum size of the experience replay buffer and the number of episodes after which the target network is updated:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">MAX_EXPERIENCES = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">500000</span><br/></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">MIN_EXPERIENCES</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1"> = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">50000</span><br/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">TARGET_UPDATE_PERIOD = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">10000</span><br/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">IM_SIZE = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">80</span><br/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">K = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">4</span></span></pre>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">The class </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">DQN</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1"> is defined; its constructor builds the CNN network using the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">tf.contrib.layers.conv2d</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"> function and defines the cost and training ops:</span></li>
</ol>
<pre style="padding-left: 60px"><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">class </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">DQN:</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">def </span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">__init__</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">, K, scope, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">save_path</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">= </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">'models/atari.ckpt'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">):</span><br/><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">.K = K</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">.scope = scope</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">.save_path = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">save_path</span></span><br/><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">with </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">tf.variable_scope(scope):</span><br/><br/>            <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1"># inputs and targets</span><br/></span><span>            </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">.X = tf.placeholder(tf.float32, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">shape</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">=(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">None</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">4</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">, IM_SIZE, IM_SIZE), </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">name</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">'X'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">)</span><br/><br/>            <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1"># tensorflow convolution needs the order to be:</span><br/></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">            # (num_samples, height, width, "color")</span><br/></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">            # so we need to tranpose later</span><br/></span><span>            </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">.G = tf.placeholder(tf.float32, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">shape</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">=(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">None</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">,), </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">name</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">'G'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">)</span><br/>            <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">.actions = tf.placeholder(tf.int32, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">shape</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">=(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">None</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">,), </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">name</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">'actions'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">)</span><br/><br/>            <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1"># calculate output and cost</span><br/></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">            # convolutional layers</span><br/></span><span>            </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">Z = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">.X / </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">255.0</span><br/></span><span>            </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">Z = tf.transpose(Z, [</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">0</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">2</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">3</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">            cnn1 = tf.contrib.layers.conv2d(Z, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">32</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">8</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">4</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">activation_fn</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">=tf.nn.relu)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">            cnn2 = tf.contrib.layers.conv2d(cnn1, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">64</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">4</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">2</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">activation_fn</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">=tf.nn.relu)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">            cnn3 = tf.contrib.layers.conv2d(cnn2, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">64</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">3</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">activation_fn</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">=tf.nn.relu)</span><br/><br/>            <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1"># fully connected layers</span><br/></span><span>            </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">fc0 = tf.contrib.layers.flatten(cnn3)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">            fc1 = tf.contrib.layers.fully_connected(fc0, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">512</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">)</span><br/><br/>            <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1"># final output layer</span><br/></span><span>            </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">.predict_op = tf.contrib.layers.fully_connected(fc1, K)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">            selected_action_values = tf.reduce_sum(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">.predict_op * tf.one_hot(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">.actions, K),</span><br/>                <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">reduction_indices</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">=[</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">            )</span><br/><br/>            <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">.cost = tf.reduce_mean(tf.square(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">.G - selected_action_values))</span><br/>            <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">.train_op = tf.train.RMSPropOptimizer(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">0.00025</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">0.99</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">0.0</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">1e-6</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">).minimize(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">.cost)</span></pre>
<ol start="4">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">The class has methods to set the session, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">set_session()</span></kbd><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">, </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">predict the action value function, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">predict()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">, update the network, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">update()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">, and select an action using Epsilon Greedy algorithm, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">sample_action()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">:</span></li>
</ol>
<pre style="padding-left: 60px"><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">def </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">set_session(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">, session):</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">.session = session</span><br/><br/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">def </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">predict(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">, states):</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">return </span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">.session.run(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">.predict_op, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">feed_dict</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">={</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">.X: states})</span><br/><br/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">def </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">update(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">, states, actions, targets):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">    c, _ = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">.session.run(</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1">        [</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">.cost, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">.train_op],</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1">feed_dict</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">={</span><br/>            <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">.X: states,</span><br/>            <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">.G: targets,</span><br/>            <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">.actions: actions</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1">        }</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">    )</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">return </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">c</span><br/><br/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">def </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">sample_action(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">, x, eps):</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">"""Implements epsilon greedy algorithm"""</span><br/></span><span>    </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">if </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">np.random.random() &lt; eps:</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">return </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">np.random.choice(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1">.K)</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">else</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">:</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">return </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">np.argmax(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">self</ <ol start="5">

</ol>
<pre style="padding-left: 60px"><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">def </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">load(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">):</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">.saver = tf.train.Saver(tf.global_variables())</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">load_was_success</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1"> = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">True</span><br/></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">    try</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">        save_dir = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">'/'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1">.join(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">.save_path.split(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">'/'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1">)[:-</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1">])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">        ckpt = tf.train.get_checkpoint_state(save_dir)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">        load_path = ckpt.model_checkpoint_path</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">.saver.restore(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">.session, load_path)</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">except</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">:</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">print</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">"no saved model to load. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.2">starting new session"</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">)</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">load_was_success</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1"> = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">False</span><br/></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1">    else</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">:</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">print</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">"loaded model: {}"</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1">.format(load_path))</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">saver </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1">= tf.train.Saver(tf.global_variables())</span><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1">episode_number </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1">= </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1">int</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1">(load_path.split(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">'-'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1">)[-</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1">])</span><br/><br/><br/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1">def </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1">save(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">, n):</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1">.saver.save(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31 <ol start="6">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.1">The method to copy the parameters of the main DQN network to the target network is as follows:</span></li>
</ol>
<pre style="padding-left: 60px"><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.329.1">def </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.330.1">copy_from(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.332.1">, other):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.333.1">    mine = [t </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.334.1">for </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.335.1">t </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.1">in </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.337.1">tf.trainable_variables() </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.338.1">if </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.1">t.name.startswith(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.340.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.341.1">.scope)]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.1">    mine = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.343.1">sorted</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.344.1">(mine, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.345.1">key</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.346.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.347.1">lambda </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.1">v: v.name)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.349.1">    others = [t </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.350.1">for </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.351.1">t </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.352.1">in </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.1">tf.trainable_variables() </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.1">if </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.355.1">t.name.startswith(other.scope)]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.356.1">    others = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.357.1">sorted</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.1">(others, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.1">key</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.361.1">lambda </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.362.1">v: v.name)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.1">    ops = []</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.364.1">for </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.365.1">p, q </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.366.1">in </span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.367.1">zip</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.368.1">(mine, others):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.369.1">        actual = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.371.1">.session.run(q)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.372.1">        op = p.assign(actual)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.1">        ops.append(op)</span><br/><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.374.1">self</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.375.1">.session.run(ops)</span></pre>
<ol start="7">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.376.1">We define a function </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.377.1">learn()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.378.1">, which predicts the value function and updates the original DQN network:</span></li>
</ol>
<pre style="padding-left: 60px"><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.379.1">def </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.1">learn(model, target_model, experience_replay_buffer, gamma, batch_size):</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.381.1"># Sample experiences</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.1">samples = random.sample(experience_replay_buffer, batch_size)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.1">    states, actions, rewards, next_states, dones = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.384.1">map</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.1">(np.array, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.1">zip</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.1">(*samples))</span><br/><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.388.1"># Calculate targets</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.1">next_Qs = target_model.predict(next_states)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.1">    next_Q = np.amax(next_Qs, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.1">axis</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.393.1">1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.394.1">)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.1">    targets = rewards + np.invert(dones).astype(np.float32) * gamma * next_Q</span><br/><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.396.1"># Update model</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.1">loss = model.update(states, actions, targets)</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.1">return </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.399.1">loss</span></pre>
<ol start="8">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.400.1">Now that we have all the ingredients defined in the main code, we use them to build and train a DQN network to play the game of Atari. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.400.2">The code is well commented and is an extension of the previous Q learning code with an addition of the Experience Replay buffer, so you should not have trouble understanding it:</span></li>
</ol>
<pre style="padding-left: 60px"><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.1">if </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.402.1">__name__ == </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.1">'__main__'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.404.1">:</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.405.1"># hyperparameters</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.406.1">gamma = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.407.1">0.99</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.1">batch_sz = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.1">32</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.1">num_episodes = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.1">500</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.1">total_t = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.1">0</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.1">experience_replay_buffer = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.415.1">    episode_rewards = np.zeros(num_episodes)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.1">    last_100_avgs = []</span><br/><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.417.1"># epsilon for Epsilon Greedy Algorithm</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.418.1">epsilon = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.419.1">1.0</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.1">epsilon_min = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.1">0.1</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.422.1">epsilon_change = (epsilon - epsilon_min) / </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.1">500000</span><br/></span><span><br/></span><span>    </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.1"># Create Atari Environment</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.425.1">env = gym.envs.make(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.426.1">"Breakout-v0"</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.1">)</span><br/><br/><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.428.1"># Create original and target  Networks</span><br/></span><span>    </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.429.1">model = DQN(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.1">K</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.431.1">=K, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.432.1">gamma</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.1">=gamma, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.434.1">scope</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.435.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.436.1">"model"</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.437.1">)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.438.1">    target_model = DQN(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.439.1">K</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.440.1">=K, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.1">gamma</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.442.1">=gamma, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.1">scope</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.444.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.445.1">"target_model"</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.446.1">)</span><br/><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.447.1">with </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.448.1">tf.Session() </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.449.1">as </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.450.1">sess:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.451.1">        model.set_session(sess)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.1">        target_model.set_session(sess)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.453.1">        sess.run(tf.global_variables_initializer())</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.454.1">        model.load()</span><br/><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.455.1">print</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.456.1">(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.457.1">"Filling experience replay buffer..."</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.458.1">)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.459.1">        obs = env.reset()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.460.1">        obs_small = preprocess(obs)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.461.1">        state = np.stack([obs_small] * </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.462.1">4</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.463.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.464.1">axis</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.465.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.466.1">0</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.467.1">)</span><br/><br/>        <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.468.1"># Fill experience replay buffer</span><br/></span><span>        </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.469.1">for </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.1">i </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.1">in </span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.472.1">range</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.473.1">(MIN_EXPERIENCES):</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.474.1">            action = np.random.randint(</span><span><span xmlns="http:/
