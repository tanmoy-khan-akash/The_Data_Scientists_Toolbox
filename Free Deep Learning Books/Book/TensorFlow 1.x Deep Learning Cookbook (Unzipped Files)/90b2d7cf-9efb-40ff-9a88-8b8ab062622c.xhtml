                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Gated Recurrent Units (GRUs) and Peephole LSTM</span></h1>
                </header>
            
            <article>
                
<p class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">There have been a number of variants of LSTM cells proposed during recent years. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Two of them are really popular. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Peephole LSTM allows the gate layers to look at the cell state, as depicted in the following figure with dotted lines, while </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Gated Recurrent Units</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">GRUs</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">) merge the hidden state and the cell state into one single channel of information.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Again, both GRUs and Peephole LSTM can be used as a blackbox drop-in for standard RNN cells with no need to know the underlying math. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">Both cells can be used for solving the problem of vanishing gradients and can be used for building deep neural networks:</span></p>
