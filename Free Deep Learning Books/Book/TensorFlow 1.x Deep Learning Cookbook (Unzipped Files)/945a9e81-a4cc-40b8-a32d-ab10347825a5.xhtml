        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">There's more...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Prof Geoffrey Hinton led the University of Toronto team that won the Netflix competition for the best collaborative filtering to predict user ratings for movies using RBM </span><a href="https://en.wikipedia.org/wiki/Netflix_Prize"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">(https://en.wikipedia.org/wiki/Netflix_Prize)</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">The detail of their work can be accessed from their paper: </span><a href="http://www.cs.toronto.edu/~hinton/absps/netflixICML.pdf"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">http://www.cs.toronto.edu/~hinton/absps/netflixICML.pdf</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">The output from the hidden units of one RBM can be fed to visible units of another RBM, the process can be repeated to form a stack of RBMs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">This results in </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Stacked RBMs</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">Each stacked RBM is trained independently assuming that others do not exist. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">A large number of stacked RBMs form </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Deep Belief Networks (DBN)</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">DBNs can be trained using both supervised or unsupervised training. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">You will learn more about them in the next recipe.</span></p>


            </article>

            
        </section>
