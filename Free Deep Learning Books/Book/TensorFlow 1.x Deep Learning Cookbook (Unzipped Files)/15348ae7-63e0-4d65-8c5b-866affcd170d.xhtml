    <body>
        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting ready</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The agents in this recipe are not learning any policy; they make their decision based on their initial set of weights (fixed policy). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">The agent picks the actions based on the probability given by the neural network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">The decision that each agent makes is based only on the present observation of the environment.</span></p>
<p><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">We implement this by a fully connected neural network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">The inputs to the NN are decided by the observation space of the environment; the number of output neurons is decided by the number of possible discrete actions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">The Pac-Man game has nine discrete possible actions--NoOp, Turn Right, Turn Left, Turn Up, Turn Down, Move Left, Move Right, Move Up, and Move Down--and so our NN has nine output neurons. </span></span></p>


            </article>

            
        </section>
