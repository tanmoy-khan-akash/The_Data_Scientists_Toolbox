                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting ready</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We will use TensorFlow </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">KmeansClustering</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> Estimator class to implement k-means. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">It is defined in </span><a href="https://github.com/tensorflow/tensorflow/blob/r1.3/tensorflow/contrib/learn/python/learn/estimators/kmeans.py"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">https://github.com/tensorflow/tensorflow/blob/r1.3/tensorflow/contrib/learn/python/learn/estimators/kmeans.py.</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> It creates a model to run k-means and inference. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">According to the TensorFlow docs, once a </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">KmeansClustering</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"> class object is created, it is instantiated with the following </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">__init__</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"> method:</span></p>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">__init__(</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">num_clusters,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">model_dir=None,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">initial_clusters=RANDOM_INIT,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">distance_metric=SQUARED_EUCLIDEAN_DISTANCE,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">random_seed=0,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">use_mini_batch=True,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">mini_batch_steps_per_iteration=1,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">kmeans_plus_plus_num_retries=2,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">relative_tolerance=None,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">config=None</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">)</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">TensorFlow Docs define these arguments as follows:</span></p>
<div class="packt_quote packt_infobox"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Args:</span></strong><br/>
<strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">num_clusters</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">: The number of clusters to train.</span><br/>
<strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">model_dir:</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1"> The directory to save the model results and log files.</span><br/>
<strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">initial_clusters:</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1"> Specifies how to initialize the clusters for training. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">See clustering_ops.kmeans for the possible values.</span><br/>
<strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">distance_metric:</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"> The distance metric used for clustering. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.2">See clustering_ops.kmeans for the possible values.</span><br/>
<strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">random_seed</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">: Python integer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">Seed for PRNG used to initialize centers.</span><br/>
<strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">use_mini_batch</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">: If true, use the mini-batch k-means algorithm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.2">Or else assume full batch.</span><br/>
<strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">mini_batch_steps_per_iteration</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">: The number of steps after which the updated cluster centers are synced back to a master copy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.2">See clustering_ops.py for more details.</span><br/>
<strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">kmeans_plus_plus_num_retries:</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1"> For each point that is sampled during kmeans++ initialization, this parameter specifies the number of additional points to draw from the current distribution before selecting the best. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.2">If a negative value is specified, a heuristic is used to sample O(log(num_to_sample)) additional points.</span><br/>
<strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">relative_tolerance</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">: A relative tolerance of change in the loss between iterations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.2">Stops learning if the loss changes less than this amount. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.3">Note that this may not work correctly if use_mini_batch=True.</span><br/>
<strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">config</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">: See Estimator.</span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">TensorFlow supports Euclidean distance and cosine distance as the measure of the centroid. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">TensorFlow </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">KmeansClustering</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1"> provides various methods to interact with the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">KmeansClustering</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"> object. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">In the present recipe, we will use </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">fit()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">clusters()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">, and </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">predict_clusters_idx()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"> methods:</span></p>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">fit(</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1"> x=None,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1"> y=None,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1"> input_fn=None,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1"> steps=None,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1"> batch_size=None,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1"> monitors=None,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1"> max_steps=None</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">)</span></pre>
<p class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">According to TensorFlow docs, for </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">KmeansClustering</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"> Estimator, we need to provide </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">input_fn()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1"> to </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">fit()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.2">The </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">cluster</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1"> method returns cluster centres and the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">predict_cluster_idx</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1"> method returns predicted cluster indices.</span></p>


            </article>
