                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>

            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1"> </span></p>
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">The first step will be connecting to the instance, you can do it either through ssh using the command line, or via browser. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">We use CLI.</span></li>
</ol>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">To connect first change the mode of </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">.pem</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> file.</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">chmod 400 &lt;security-keypair-filename&gt;.pem</span></pre>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Next use the the command below to SSH the instance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">The exact address will be available on the dashboard, when you select connect:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">ssh -i " &lt;security-keypair-filename&gt;.pem" ubuntu@ec2-XXXXXXXXXXXXX.compute-1.amazonaws.com</span></pre>
<ol start="4">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">The machine instance that we have chosen already contains all the deep learning libraries including TensorFlow and so we don't need to install anything:</span></li>
</ol>

<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Each folder contains a readme file which describes how to use the corresponding library:</span></li>
