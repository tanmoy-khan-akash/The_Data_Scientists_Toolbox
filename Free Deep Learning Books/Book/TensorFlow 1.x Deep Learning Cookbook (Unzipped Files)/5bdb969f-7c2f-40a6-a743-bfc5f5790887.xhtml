                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">See also</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">After the initial results presented in 2015, many new additional papers and blog postings were presented about DeepDreaming:</span></p>
<ul>
<li><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">DeepDream: A code example to visualize Neural Networks</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">--</span><a href="https://research.googleblog.com/2015/07/deepdream-code-example-for-visualizing.html"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">https://research.googleblog.com/2015/07/deepdream-code-example-for-visualizing.html</span></a></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">When Robots Hallucinate, LaFrance, Adrienne--</span><a href="https://www.theatlantic.com/technology/archive/2015/09/robots-hallucinate-dream/403498/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">https://www.theatlantic.com/technology/archive/2015/09/robots-hallucinate-dream/403498/</span></a></li>
</ul>
<p style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">In addition, it might be interesting to understand how to visualize each layer of a pretrained network and get a better intuition of how the net memorizes basic features in lower layers and more complex features in higher layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">An interesting blog posting about this topic is available online:</span></p>
<ul>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">How convolutional neural networks see the world--</span><a href="https://blog.keras.io/category/demo.html"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">https://blog.keras.io/category/demo.html</span></a></li>
</ul>


            </article>
