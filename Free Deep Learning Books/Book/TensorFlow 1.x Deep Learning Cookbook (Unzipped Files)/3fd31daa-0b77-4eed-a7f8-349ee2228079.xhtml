    <body>
        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Let us start with the recipe:</span></p>
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Import a few modules such as </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">numpy</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">scipy</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">tensorflow</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">, and </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">matplotlib</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">Then import </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">PIL</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1"> to manipulate images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">Note that as this code runs on a Jupyter notebook that you can download from online, the fragment </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">%matplotlib inline</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1"> has been added:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">import os </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">import sys </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">import numpy as np </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">import scipy.io </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">import scipy.misc </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">import tensorflow as tf </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">import matplotlib.pyplot as plt </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">from matplotlib.pyplot </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">import imshow </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">from PIL </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">import Image %matplotlib inline from __future__ </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">import division</span></pre>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Then, set the input path for the image used to learn the style and for the content image to be repainted according to the style:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">OUTPUT_DIR = 'output/' </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1"># Style image </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">STYLE_IMAGE = 'data/StarryNight.jpg' </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"># Content image to be repainted </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">CONTENT_IMAGE = 'data/Marilyn_Monroe_in_1952.jpg'</span></pre>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">Then we set up the noise ratio used during the image generation and the emphasis we would like to put on content loss and on style loss when repainting the content image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">In addition to that, we store the path to the pretrained VGG model and the mean computed during the VGG pretraining. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.3">This mean is already known and it is subtracted from the input to the VGG model:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1"># how much noise is in the image </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">NOISE_RATIO = 0.6 </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1"># How much emphasis on content loss. </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">BETA = 5 </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1"># How much emphasis on style loss. </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">ALPHA = 100 </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"># the VGG 19-layer pre-trained model </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">VGG_MODEL = 'data/imagenet-vgg-verydeep-19.mat' </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1"># The mean used when the VGG was trained </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1"># It is subtracted from the input to the VGG model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.2">MEAN_VALUES = np.array([123.68, 116.779, 103.939]).reshape((1,1,1,3))</span></pre>
<ol start="4">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">Show the content image just to understand how it is:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">content_image = scipy.misc.imread(CONTENT_IMAGE) imshow(content_image)</span></pre>
<p style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">Here is the output of the preceding code (note that this image is in </span><a href="https://commons.wikimedia.org/wiki/File:Marilyn_Monroe_in_1952.jpg"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">https://commons.wikimedia.org/wiki/File:Marilyn_Monroe_in_1952.jpg</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">) :</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1"><img src="assets/359c23f6-f761-4df1-9542-0234e69e01d0.png"/></span></div>
<ol start="5">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Resize the style image and show it just to understand how it is. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.2">Note that the content image and the style image have now the same size and the same number of color channels:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">style_image = scipy.misc.imread(STYLE_IMAGE) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1"># Get shape of target and make the style image the same </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">target_shape = content_image.shape </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">print "target_shape=", target_shape </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">print "style_shape=", style_image.shape </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">#ratio = target_shape[1] / style_image.shape[1] </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">#print "resize ratio=", ratio </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">style_image = scipy.misc.imresize(style_image, target_shape) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">scipy.misc.imsave(STYLE_IMAGE, style_image) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">imshow(style_image)</span></pre>
<p style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">Here is the output of the preceding code:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1"><img height="177" width="143" src="assets/7b344e49-0863-4be3-9e39-9dc289b2f05c.png"/></span></div>
<div class="packt_figref CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">An example of Vicent Van Gogh painting as seen in https://commons.wikimedia.org/wiki/File:VanGogh-starry_night_ballance1.jpg</span></div>
<ol start="6">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">The next step is to define the VGG model as described in the original paper. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.2">Note that the deep learning network is rather complex as it combines multiple ConvNet layers with ReLU activation function and max pooling. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.3">An additional note is that in the original paper for Transfer Styling (</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">A Neural Algorithm of Artistic Style</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"> by Leon A. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.2">Gatys, Alexander S. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.3">Ecker, and Matthias Bethge), many experiments show that average pooling is actually outperforming max pooling. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.4">So, we will use average pooling instead:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">def load_vgg_model(path, image_height, image_width, color_channels):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">   """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">   Returns the VGG model as defined in the paper</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">       0 is conv1_1 (3, 3, 3, 64)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">       1 is relu</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">       2 is conv1_2 (3, 3, 64, 64)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">       3 is relu    </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">       4 is maxpool</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">       5 is conv2_1 (3, 3, 64, 128)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">       6 is relu</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">       7 is conv2_2 (3, 3, 128, 128)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">       8 is relu</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">       9 is maxpool</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">       10 is conv3_1 (3, 3, 128, 256)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">       11 is relu</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">       12 is conv3_2 (3, 3, 256, 256)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">       13 is relu</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">       14 is conv3_3 (3, 3, 256, 256)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">       15 is relu</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">       16 is conv3_4 (3, 3, 256, 256)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">       17 is relu</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">       18 is maxpool</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">       19 is conv4_1 (3, 3, 256, 512)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">       20 is relu</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">       21 is conv4_2 (3, 3, 512, 512)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">       22 is relu</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">       23 is conv4_3 (3, 3, 512, 512)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">       24 is relu</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">       25 is conv4_4 (3, 3, 512, 512)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">       26 is relu</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">       27 is maxpool</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">       28 is conv5_1 (3, 3, 512, 512)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">       29 is relu</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">       30 is conv5_2 (3, 3, 512, 512)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">       31 is relu</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">       32 is conv5_3 (3, 3, 512, 512)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">       33 is relu</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">       34 is conv5_4 (3, 3, 512, 512)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">       35 is relu</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">       36 is maxpool</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">       37 is fullyconnected (7, 7, 512, 4096)       38 is relu</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">       39 is fullyconnected (1, 1, 4096, 4096)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">       40 is relu</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">       41 is fullyconnected (1, 1, 4096, 1000)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">       42 is softmax</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">   """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">   vgg = scipy.io.loadmat(path)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">   vgg_layers = vgg['layers']   </span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">   def _weights(layer, expected_layer_name):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">       """       Return the weights and bias from the VGG model for a given layer.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">"""</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">       W = vgg_layers[0][layer][0][0][0][0][0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">       b = vgg_layers[0][layer][0][0][0][0][1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">       layer_name = vgg_layers[0][layer][0][0][-2]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">       assert layer_name == expected_layer_name</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">       return W, b</span><br/>  <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">   def _relu(conv2d_layer):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">       """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">       Return the RELU function wrapped over a TensorFlow layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.2">Expects a</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">       Conv2d layer input.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">       """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">       return tf.nn.relu(conv2d_layer)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">   def _conv2d(prev_layer, layer, layer_name):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">       """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">       Return the Conv2D layer using the weights, biases from the VGG</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">       model at 'layer'.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">       """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">       W, b = _weights(layer, layer_name)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">       W = tf.constant(W)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">       b = tf.constant(np.reshape(b, (b.size)))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">       return tf.nn.conv2d(</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">           prev_layer, filter=W, strides=[1, 1, 1, 1], padding='SAME') + b</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">   def _conv2d_relu(prev_layer, layer, layer_name):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">       """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">       Return the Conv2D + RELU layer using the weights, biases from the VGG</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">       model at 'layer'.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">       """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">       return _relu(_conv2d(prev_layer, layer, layer_name))</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">   def _avgpool(prev_layer):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">       """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">       Return the AveragePooling layer.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">       """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">       return tf.nn.avg_pool(prev_layer, ksize=[1, 2, 2, 1], strides=[1, 2, 2, 1], padding='SAME')</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">   # Constructs the graph model.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">   graph = {}</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">   graph['input']   = tf.Variable(np.zeros((1,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">                                            image_height, image_width, color_channels)),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">                                  dtype = 'float32')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">   graph['conv1_1']  = _conv2d_relu(graph['input'], 0, 'conv1_1')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">   graph['conv1_2']  = _conv2d_relu(graph['conv1_1'], 2, 'conv1_2')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">   graph['avgpool1'] = _avgpool(graph['conv1_2'])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">   graph['conv2_1']  = _conv2d_relu(graph['avgpool1'], 5, 'conv2_1')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">   graph['conv2_2']  = _conv2d_relu(graph['conv2_1'], 7, 'conv2_2')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">   graph['avgpool2'] = _avgpool(graph['conv2_2'])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">   graph['conv3_1']  = _conv2d_relu(graph['avgpool2'], 10, 'conv3_1')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">   graph['conv3_2']  = _conv2d_relu(graph['conv3_1'], 12, 'conv3_2')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">   graph['conv3_3']  = _conv2d_relu(graph['conv3_2'], 14, 'conv3_3')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">   graph['conv3_4']  = _conv2d_relu(graph['conv3_3'], 16, 'conv3_4')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">   graph['avgpool3'] = _avgpool(graph['conv3_4'])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">   graph['conv4_1']  = _conv2d_relu(graph['avgpool3'], 19, 'conv4_1')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">   graph['conv4_2']  = _conv2d_relu(graph['conv4_1'], 21, 'conv4_2')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">   graph['conv4_3']  = _conv2d_relu(graph['conv4_2'], 23, 'conv4_3')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">   graph['conv4_4']  = _conv2d_relu(graph['conv4_3'], 25, 'conv4_4')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">   graph['avgpool4'] = _avgpool(graph['conv4_4'])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">   graph['conv5_1']  = _conv2d_relu(graph['avgpool4'], 28, 'conv5_1')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">   graph['conv5_2']  = _conv2d_relu(graph['conv5_1'], 30, 'conv5_2')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">   graph['conv5_3']  = _conv2d_relu(graph['conv5_2'], 32, 'conv5_3')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">   graph['conv5_4']  = _conv2d_relu(graph['conv5_3'], 34, 'conv5_4')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">   graph['avgpool5'] = _avgpool(graph['conv5_4'])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">   return graph</span></pre>
<ol start="7">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">Define the content </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">loss</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1"> function as it has been described in the original paper:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">def content_loss_func(sess, model): </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">""" Content loss function as defined in the paper. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.2">""" </span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">def _content_loss(p, x): </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1"># N is the number of filters (at layer l). </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">N = p.shape[3] </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1"># M is the height times the width of the feature map (at layer l). </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">M = p.shape[1] * p.shape[2] return (1 / (4 * N * M)) * tf.reduce_sum(tf.pow(x - p, 2)) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">return _content_loss(sess.run(model['conv4_2']), model['conv4_2'])</span></pre>
<ol start="8">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">Define which VGG layers we are going to reuse. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.2">If we would like to have softer features, we will need to increase the weight of higher layers (</span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">conv5_1</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">) and decrease the weight of the lower layers (</span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">conv1_1</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.2">If we would like to have harder features, we need to do the opposite:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">STYLE_LAYERS = [ </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">('conv1_1', 0.5), </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">('conv2_1', 1.0), </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">('conv3_1', 1.5), </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">('conv4_1', 3.0), </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">('conv5_1', 4.0), </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">]</span></pre>
<ol start="9">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">Define the style loss function as it has been described in the original paper:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">def style_loss_func(sess, model):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">   """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">   Style loss function as defined in the paper.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">   """</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">   def _gram_matrix(F, N, M):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">    """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">       The gram matrix G.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">       """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">       Ft = tf.reshape(F, (M, N))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">       return tf.matmul(tf.transpose(Ft), Ft)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">   def _style_loss(a, x):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">       """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">       The style loss calculation.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">       """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">       # N is the number of filters (at layer l).</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">       N = a.shape[3]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">       # M is the height times the width of the feature map (at layer l).</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">       M = a.shape[1] * a.shape[2]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">       # A is the style representation of the original image (at layer l).</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">       A = _gram_matrix(a, N, M)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">       # G is the style representation of the generated image (at layer l).</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">       G = _gram_matrix(x, N, M)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1">       result = (1 / (4 * N**2 * M**2)) * tf.reduce_sum(tf.pow(G - A, 2))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">       return result</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">       E = [_style_loss(sess.run(model[layer_name]), model[layer_name])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">           for layer_name, _ in STYLE_LAYERS]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">       W = [w for _, w in STYLE_LAYERS]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1">       loss = sum([W[l] * E[l] for l in range(len(STYLE_LAYERS))])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">   return loss</span></pre>
<ol start="10">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">Define a function to generate a noise image and intermix it with the content image with a given ratio. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.2">Define two auxiliary methods to preprocess and save images:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">def generate_noise_image(content_image, noise_ratio = NOISE_RATIO):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1"> """   Returns a noise image intermixed with the content image at a certain ratio.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">"""</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1">   noise_image = np.random.uniform(</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">           -20, 20,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1">           (1,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">            content_image[0].shape[0],</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">            content_image[0].shape[1],</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">            content_image[0].shape[2])).astype('float32')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">   # White noise image from the content representation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.2">Take a weighted average</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">   # of the values</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">   input_image = noise_image * noise_ratio + content_image * (1 - noise_ratio)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">   return input_image</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">def process_image(image):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">   # Resize the image for convnet input, there is no change but just</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">   # add an extra dimension.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">   image = np.reshape(image, ((1,) + image.shape))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">   # Input to the VGG model expects the mean to be subtracted.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">   image = image - MEAN_VALUES</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1">   return image</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">def save_image(path, image):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">   # Output should add back the mean.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">   image = image + MEAN_VALUES</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">   # Get rid of the first useless dimension, what remains is the image.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">   image = image[0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">   image = np.clip(image, 0, 255).astype('uint8')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1">   scipy.misc.imsave(path, image)</span></pre>
<ol start="11">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">Start a TensorFlow interactive session:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">sess = tf.InteractiveSession()</span></pre>
<ol start="12">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">Load the processed content image and show it:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">content_image = load_image(CONTENT_IMAGE) imshow(content_image[0])</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">We get the output of the preceding code as follows (note that we used an image from https://commons.wikimedia.org/wiki/File:Marilyn_Monroe_in_1952.jpg) :</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1"><img height="155" width="125" src="assets/cbafb8f7-787c-4584-864f-3ad4c6acaeb3.png"/></span></div>
<ol start="13">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">Load the processed style image and show it:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">style_image = load_image(STYLE_IMAGE) imshow(style_image[0])</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">The out is as follows:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1"><img height="213" width="173" src="assets/b6919be8-dd15-4c8c-be82-2dc7b7cb8e1c.png"/></span></div>
<ol start="14">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">Load the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">model</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1"> and show it:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">model = load_vgg_model(VGG_MODEL, style_image[0].shape[0], style_image[0].shape[1], style_image[0].shape[2]) print(model)</span></pre>
<ol start="15">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">Generate a random noise image that is used to bootstrap the repainting:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1">input_image = generate_noise_image(content_image) imshow(input_image[0])</span></pre>
<ol start="16">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">Run TensorFlow sessions:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">sess.run(tf.initialize_all_variables())</span></pre>
<ol start="17">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">Construct the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1">content_loss</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1"> and </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1">sytle_loss</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1"> with respective images:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1"># Construct content_loss using content_image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.2">sess.run(model['input'].assign(content_image))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">content_loss = content_loss_func(sess, model) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1"># Construct style_loss using style_image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.2">sess.run(model['input'].assign(style_image)) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">style_loss = style_loss_func(sess, model)</span></pre>
<ol start="18">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">Construct the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">total_loss</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1"> as weighted combination of </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">content_loss</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1"> and </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">sytle_loss</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1"># Construct total_loss as weighted combination of content_loss and sytle_loss </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">total_loss = BETA * content_loss + ALPHA * style_loss</span></pre>
<ol start="19">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">Build an optimizer to minimize the total loss. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.2">In this case, we adopt the Adam optimizer:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1"># The content is built from one layer, while the style is from five </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1"># layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.2">Then we minimize the total_loss </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">optimizer = tf.train.AdamOptimizer(2.0) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">train_step = optimizer.minimize(total_loss)</span></pre>
<ol start="20">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">Bootstrap the network with the input image:</span></li>
</ol>
<pre style="padding-left: 60px" class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1">sess.run(tf.initialize_all_variables()) sess.run(model['input'].assign(input_image))</span></pre>
<ol start="21">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">Run the model for a fixed number of iterations and produce intermediate repainted images:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1">sess.run(tf.initialize_all_variables())</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1">sess.run(model['input'].assign(input_image))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1">print "started iteration"</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1">for it in range(ITERATIONS):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1">   sess.run(train_step)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">   print it , " "</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1">   if it%100 == 0:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">       # Print every 100 iteration.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1">       mixed_image = sess.run(model['input'])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1">       print('Iteration %d' % (it))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1">       print('sum : ',</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1">sess.run(tf.reduce_sum(mixed_image)))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">       print('cost: ', sess.run(total_loss))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1">       if not os.path.exists(OUTPUT_DIR):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1">           os.mkdir(OUTPUT_DIR)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.1">       filename = 'output/%d.png' % (it)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.1">       save_image(filename, mixed_image)</span></pre>
<ol start="22">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.1">In this image, we show how the content image has been repainted after 200, 400, and 600 iterations:</span></li>
</ol>
