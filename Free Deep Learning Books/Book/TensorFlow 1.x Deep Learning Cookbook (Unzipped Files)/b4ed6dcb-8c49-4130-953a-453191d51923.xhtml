<div style="margin-left: 2em">
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">TensorFlow has TensorBoard to provide a graphical image of the computation graph. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">This makes it convenient to understand, debug, and optimize complex neural network programs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">TensorBoard can also provide quantitative metrics about the execution of the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">It reads TensorFlow event files, which contain the summary data that you generate while running the TensorFlow Session.</span></p>
