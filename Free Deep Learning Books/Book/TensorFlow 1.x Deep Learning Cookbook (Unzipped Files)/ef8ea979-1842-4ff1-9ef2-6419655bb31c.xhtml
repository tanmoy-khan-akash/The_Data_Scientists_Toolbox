        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting ready</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">TensorFlow mobile Android apps are available on GitHub at the following address: </span><a href="https://github.com/tensorflow/tensorflow/tree/master/tensorflow/examples/android"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://github.com/TensorFlow/TensorFlow/tree/master/TensorFlow/examples/android</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> . </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">In October 2017, the page contained the following examples:</span></p>
<ul>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">TF Classify</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">: Uses the Google Inception model to classify camera frames in real time, displaying the top results in an overlay on the camera image.</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">TF Detect</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">: Demonstrates an SSD-Mobilenet model trained using the TensorFlow Object Detection API. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">This was introduced in speed/accuracy trade-offs for modern convolutional object detectors to localize and track objects (from 80 categories) in the camera preview in real time.</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">TF Stylize</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">: Uses a model based on </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">A Learned Representation For Artistic Style</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1"> to restyle the camera preview image to that of a number of different </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">art styles.</span></span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">TF Speech</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">: Runs a simple speech recognition model built in the audio training tutorial. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">Listens for a small set of words, and highlights them in the UI when they are recognized.</span></li>
</ul>


            </article>
