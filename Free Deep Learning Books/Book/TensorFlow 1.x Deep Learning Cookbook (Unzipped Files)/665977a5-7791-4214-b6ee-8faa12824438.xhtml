<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">In this recipe, we use </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">tflearn</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">--a higher-level framework--which abstracts some of the TensorFlow internals and allows us to focus on the definition of deep networks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">TFLearn is available at </span><a href="http://tflearn.org/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">http://tflearn.org/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> and this code is part of the standard distribution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">(</span><a href="https://github.com/tflearn/tflearn/tree/master/examples"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">https://github.com/tflearn/tflearn/tree/master/examples</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">)</span></p>
