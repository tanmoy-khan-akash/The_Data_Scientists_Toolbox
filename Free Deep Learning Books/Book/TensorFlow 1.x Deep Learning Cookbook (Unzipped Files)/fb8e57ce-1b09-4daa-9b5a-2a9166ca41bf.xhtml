        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Learning to beat the previous MNIST state-of-the-art results with Capsule Networks</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Capsule Networks (or CapsNets) is a very recent and innovative type of deep learning network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">This technique was introduced at the end of October 2017 in a seminal paper titled Dynamic Routing Between Capsules by Sara Sabour, Nicholas Frost and Geoffrey Hinton (</span><a href="https://arxiv.org/abs/1710.09829"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://arxiv.org/abs/1710.09829</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">Hinton is one of the fathers of Deep Learning and, therefore, the whole Deep Learning community is excited to see the progress made with capsules. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">Indeed, CapsNets are already beating the best CNN at MNIST classification which is... </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.4">well, impressive!</span></p>
<p class="mce-root"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">So what is the problem with CNNs?</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> In CNNs each layer </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">understands</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"> an image at a progressive level of granularity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">As we discussed in multiple recipes, the first layer will most likely recognize straight lines or simple curves and edges, while subsequent layers will start to understand more complex shapes such as rectangles and complex forms such as human faces.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Now, one critical operation used for CNNs is pooling. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">Pooling aims to create the positional invariance and it is generally used after each CNN layer to make any problem computationally tractable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">However, pooling introduces a significant problem because it forces us to lose all the positional data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.4">This is not good. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.5">Think about a face: it consists in two eyes, a mouth, and a nose, and what is important is that there is a spatial relationship between these parts (the mouth is below the nose, which is typically below the eyes). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.6">Indeed, Hinton said:</span></p>
<div class="packt_quote"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">The pooling operation used in convolutional neural networks is a big mistake and the fact that it works so well is a disaster.</span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Technically, we do not need positional invariance; instead, we need equivariance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">Equivariance is a fancy term for indicating that we want to understand the rotation or proportion change in an image, and we want to adapt the network accordingly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">In this way, the spatial positioning of the different components in an image is not lost.</span></p>
<p class="mce-root"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">So what is new with Capsule Networks? </span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">According to the authors, our brain has modules called </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">capsules</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">, and each capsule specializes in handling particular types of information. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">In particular, there are capsules that work well for understanding the concept of position, the concept of size, the concept of orientation, the concept of deformation, the textures, and so on and so forth. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.3">In addition to that, the authors suggest that our brain has particularly efficient mechanisms for dynamically routing each piece of information to the capsule, which is considered best suited for handling a particular type of information.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">So, the main difference between CNN and CapsNets is that with a CNN you keep adding layers for creating a deep network, while with CapsNet you nest a neural layer inside another. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">A capsule is a group of neurons and introduces more structure in the net; it produces a vector to signal the existence of an entity in the image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">In particular, Hinton uses the length of the activity vector to represent the probability that the entity exists, and its orientation to represent the instantiation parameters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.4">When multiple predictions agree, a higher-level capsule becomes active. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.5">For each possible parent, the capsule produces an additional prediction vector.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Now a second innovation comes in place: we will use dynamic routing across capsules and will no longer use the raw idea of pooling. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2">A lower-level capsule prefers to send its output to the higher-level capsule, and the activity vectors have a big scalar product, with the prediction coming from the lower-level capsule. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.3">The parent with the largest scalar prediction vector product increases the capsule bond. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.4">All the other parents decrease their bond. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.5">In other words, the idea is that if a higher-level capsule agrees with a lower level one, then it will ask to send more information of that type. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.6">If there is no agreement, it will ask to send less of them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.7">This dynamic routing using the agreement method is superior to the current mechanisms such as max-pooling and, according to Hinton, routing is ultimately a way to parse the image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.8">Indeed, Max-pooling is ignoring anything but the largest value, while dynamic routing selectively propagates information according to the agreement between lower layers and upper layers.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">A third difference is that a new nonlinear activation function has been introduced. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">Instead of adding a squashing function to each layer as in CNN, CapsNet adds a squashing function to a nested set of layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.3">The nonlinear activation function is represented in the following figure and it is called the squashing function (equation 1):</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1"><img class=" image-border" src="assets/8458f4ff-3e07-4dc7-999c-f7c2a45ba811.png"/></span></div>
<div class="packt_figref CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Squashing function as seen in Hinton's seminal paper</span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Moreover, Hinton and others show that a discriminatively trained, multi-layer capsule system achieves state-of-the-art performance on MNIST and is considerably better than a convolutional network at recognizing highly overlapping digits.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">The paper </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Dynamic Routing Between Capsules</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1"> shows us simple CapsNet architecture:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1"><img class=" image-border" src="assets/606af41e-dc21-4840-8303-ecbd138d170c.png"/></span></div>
<div class="packt_figure packt_figref CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">A simple CapsNet architecture</span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">The architecture is shallow, with only two convolutional layers and one fully connected layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">Conv1 has 256, 9 × 9 convolution kernels with a stride of 1, and ReLU activation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.3">The role of this layer is to convert pixel intensities to the activities of local feature detectors that are then used as input to the primary capsules. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.4">PrimaryCapsules is a convolutional capsule layer with 32 channels; each primary capsule contains eight convolutional units with a 9 × 9 kernel and a stride of 2</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">.</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1"> In total, PrimaryCapsules has [32, 6, 6] capsule outputs (each output is an 8D vector) and each capsule in the [6, 6] grid is sharing its weight with each other. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">The final layer (DigitCaps) has one 16D capsule per digit class and each one of these capsules receives input from all the other capsules in the layer below. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.3">Routing happens only between two consecutive capsule layers (such as PrimaryCapsules and DigitCaps).</span></p>


            </article>
