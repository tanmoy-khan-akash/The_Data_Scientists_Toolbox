                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How it works...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Neural networks store abstractions of the training images: lower layers memorize features such as lines and edges, while higher layers memorize more sophisticated images features such as eyes, faces, and noses. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">By applying a gradient ascent process, we maximize the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">loss</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> function and facilitate the discovery of a content image of patterns similar to the ones memorized by higher layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">This results into a dreaming where the network sees trippy images.</span></p>


            </article>

            
        </section>
