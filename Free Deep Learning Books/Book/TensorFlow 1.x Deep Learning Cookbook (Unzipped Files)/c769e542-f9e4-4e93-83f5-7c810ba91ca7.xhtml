        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Introduction</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">In this section, we will present a number of use cases for mobile deep learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">This is a very different situation from the desktop or cloud deep learning where GPUs and electricity are commonly available. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">In fact, on a mobile device, it is very important to preserve the battery and GPUs are frequently not available. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">However, deep learning can be very useful in a number of situations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">Let's review them:</span></p>
<ul>
<li class="mce-root"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Image recognition</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">: Modern phones have powerful cameras and users are keen to try effects on images and pictures. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">Frequently, it is also important to understand what is in the pictures, and there are multiple pre-trained models that can be adapted for this, as discussed in the chapters dedicated to CNNs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">A good example of a model used for image recognition is given at </span><a href="https://github.com/tensorflow/models/tree/master/official/resnet"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">https://github.com/TensorFlow/models/tree/master/official/resnet</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">.</span></span></a></li>
</ul>
<ul>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Object localization</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">: Identifying moving objects is a key operation and is required for video and image processing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">One can, for instance, imagine that if multiple persons are recognized in an image, then the camera will use multiple focus points. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">A collection of examples for object localization is given at </span><a href="https://github.com/tensorflow/models/tree/master/research/object_detection"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">https://github.com/TensorFlow/models/tree/master/research/object_detection.</span></a><a href="https://github.com/tensorflow/models/tree/master/research/object_detection"/></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Optical character recognition</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">: Recognizing handwritten characters is fundamental in for many activities such as text classification and recommendation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">Deep learning can provide fundamental help for carrying out these activities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">We looked at a few examples of MNIST recognition in the chapters dedicated to CNNs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.4">Information on MNIST can also be found at </span><a href="https://github.com/TensorFlow/models/tree/master/official/mnist" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">https://github.com/TensorFlow/models/tree/master/official/mnist</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">.</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Speech recognition</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">: Voice recognition is a common interface for accessing modern phones. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">Deep learning is therefore used to recognize voices and spoken commands. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.3">The progress made in this area over the last few years has been impressive.</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Translation</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">: Dealing with multiple languages is part of the modern multicultural world. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2">Phones are becoming more and more accurate for on-the-fly translations across languages, and deep learning has helped to break barriers, which was impossible to even imagine a few years ago. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.3">We looked at some examples of machine translation during the chapter dedicated to RNNs.</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Gesture recognition</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">: Phones are starting to use gestures as interfaces for receiving commands. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">Of course, there are models for this.</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Compression</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">: Compression is a key aspect in mobile phones. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">As you can imagine, it is beneficial to reduce the space before sending an image or a video over the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.3">Similarly, it might be convenient to compress data before storing locally on the device. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.4">In all these situations, deep learning can help. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.5">A model using RNNSs for compression is located at </span><a href="https://github.com/tensorflow/models/tree/master/research/compression"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">https://github.com/TensorFlow/models/tree/master/research/compression.</span></a></li>
</ul>


            </article>
