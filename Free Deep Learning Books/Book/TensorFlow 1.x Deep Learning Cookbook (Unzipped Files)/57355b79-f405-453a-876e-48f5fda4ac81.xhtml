        <title>Q learning to balance Cart-Pole</title>

        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Q learning to balance Cart-Pole</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">As discussed in the introduction, we have an environment described by a state </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">s</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> (</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">s</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">∈S where </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">S</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"> is the set of all possible states) and an agent that can perform an action </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">a</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"> (</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">a</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">∈A, where </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">A</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1"> is set of all possible actions) resulting in the movement of the agent from one state to another. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">The agent is rewarded for its action, and the goal of the agent is to maximize the reward. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.3">In Q learning, the agent learns the action to take (policy, π) by calculating the Quantity of a state-action combination that maximizes reward (</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">R</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">In making the choice of the action, the agent takes into account not only the present but discounted future rewards:</span></p>
<div class="CDPAlignCenter CDPAlign"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Q: S × A→R</span></em></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">The agent starts with some arbitrary initial value of </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Q</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">, and, as the agent selects an action </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">a</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1"> and receives a reward </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">r</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">, it updates the state </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">s'</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"> (which depends on the past state </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">s</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1"> and action </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">a</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">) and the </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">Q</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"> value:</span></p>
<div class="CDPAlignCenter CDPAlign"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">Q(s,a) = (1 - α)Q(s,a) + α [r + γ max</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">a' </span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Q(s',a') ]</span></em></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Here, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">α</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1"> is the learning rate and </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">γ</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1"> is the discount factor. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.2">The first term preserves the old value of </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Q</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">, and the second term provides an improved estimate of the Q value (it includes the present reward and discounted rewards for future actions). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.2">This will reduce the </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">Q</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1"> value when the resultant state is undesirable, thus ensuring that the agent will not choose the same action the next time this state is encountered. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.2">Similarly, when the resultant state is desirable, the corresponding </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">Q</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1"> value will increase.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">The simplest implementation of Q learning involves maintaining and updating a state-action value lookup table; the size of the table will be N × M where N is the number of all the possible states and M the number of all the possible actions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.2">For most environments, this table will be significantly large; the larger the table, the more time is needed to search and the more memory is needed to store the table and thus it is not a feasible solution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.3">In this recipe, we will use NN implementation of Q learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.4">Here, the neural networks are employed as a function approximator to predict the value function (Q). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.5">NN has output nodes equal to the number of possible actions, and their output signifies the value function of the corresponding action.</span></p>


            </article>

            
        </section>
