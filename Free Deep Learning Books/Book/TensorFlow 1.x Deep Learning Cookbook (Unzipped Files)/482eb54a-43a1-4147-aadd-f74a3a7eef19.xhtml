                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Introduction</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">TensorFlow is a powerful open source software library developed by the Google Brain team for </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">deep neural networks</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">DNNs</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">It was first made available under the Apache 2.x License in November 2015; as of today, its GitHub repository (</span><a href="https://github.com/tensorflow/tensorflow"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">https://github.com/tensorflow/tensorflow</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">) has more than 17,000 commits, with roughly 845 contributors in just two years. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">This by itself is a measure of both the popularity and performance of TensorFlow. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">The following graph shows a comparison of the popular deep learning frameworks where it is clearly visible that TensorFlow is the leader among them:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"><img height="279" width="438" src="assets/bef34f80-4861-4dee-93e3-95a9ba165525.png"/></span></div>
<div class="packt_figref CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">The Figure is based on data taken from the Github repositories of each as on 12 July 2017. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">Each Bubble has a legend: (Framework, contributors).</span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Let's first learn what exactly TensorFlow is and why is it so popular among DNN researchers and engineers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">TensorFlow, the open source deep learning library allows one to deploy deep neural networks computation on one or more CPU, GPUs in a server, desktop or mobile using the single TensorFlow API. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">You might ask, there are so many other deep learning libraries such as Torch, Theano, Caffe, and MxNet; what makes TensorFlow special? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.4">Most of other deep learning libraries like TensorFlow have auto-differentiation, many are open source, most support CPU/GPU options, have pretrained models, and support commonly used NN architectures like </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">recurrent neural networks</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">RNNs</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">), </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">convolutional neural networks</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">CNNs</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">), and </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">deep belief networks</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">DBNs</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.2">So, what more is there in TensorFlow? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.3">Let's list them for you:</span></p>
<ul>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">It works with all the cool languages. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.2">TensorFlow works with Python, C++, Java, R, and Go.</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">TensorFlow works on multiple platforms, even mobile and distributed.</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">It is supported by all cloud providers--AWS, Google, and Azure.</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Keras, a high-level neural network API, has been integrated with TensorFlow.</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">It has better computational graph visualizations because it is native while the equivalent in Torch/Theano is not nearly as cool to look at.</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">TensorFlow allows model deployment and ease of use in production.</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">TensorFlow has very good community support.</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">TensorFlow is more than a software library; it is a suite of software that includes TensorFlow, TensorBoard, and TensorServing.</span></li>
</ul>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">The Google research blog (</span><a href="https://research.googleblog.com/2016/11/celebrating-tensorflows-first-year.html"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">https://research.googleblog.com/2016/11/celebrating-tensorflows-first-year.html</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">) lists some of the fascinating projects done by people around the world using TensorFlow:</span></p>
<ul>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Google Translate is using TensorFlow and </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">tensor processing units</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">TPUs</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">)</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">Project Magenta, which can produce melodies using reinforcement learning-based models, employs TensorFlow</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Australian marine biologists are using TensorFlow to find and understand sea-cows, which are on the verge of extinction</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">A Japanese farmer used TensorFlow to develop an application to sort cucumbers using physical parameters like size and shape</span></li>
</ul>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">The list is long, and the possibilities in which one can use TensorFlow are even greater. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">This book aims to provide you with an understanding of TensorFlow as applied to deep learning models such that you can adapt them to your dataset with ease and develop useful applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.3">Each chapter contains a set of recipes which deal with the technical issues, the dependencies, the actual code, and its understanding. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.4">We have built the recipes one on another such that, by the end of each chapter, you have a fully functional deep learning model.</span></p>


            </article>
