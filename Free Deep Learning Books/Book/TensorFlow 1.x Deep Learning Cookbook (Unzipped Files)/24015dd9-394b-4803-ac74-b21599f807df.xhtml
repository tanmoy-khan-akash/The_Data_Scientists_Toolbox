                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">A mathematical example</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">One simple way to understand convolution is to think about a sliding window function applied to a matrix. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">In the following example, given the input matrix </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">I</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> and the kernel </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">K</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">, we get the convolved output. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">The 3 x 3 kernel </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">K</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"> (sometimes called </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">filter</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"> or </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">feature</span></strong> <strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">detector</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">) is multiplied element-wise with the input matrix to get one cell in the output convolved matrix. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">All the other cells are obtained by sliding the window on </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">I</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"><img height="142" width="198" class="aligncenter size-full wp-image-1253 image-border" src="assets/d70c6297-0661-4521-bcea-769d611267af.png"/></span></div>
<div class="packt_figref CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">An example of convolutional operation: in bold the cells involved in the computation</span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">In this example, we decided to stop the sliding window as soon as we touch the borders of </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">I</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1"> (so the output is 3 x 3). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">Alternatively, we could have chosen to pad the input with zeros (so that the output would have been 5 x 5). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.3">This decision relates to the </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">padding</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1"> choice adopted.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Another choice is about the </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">stride</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1"> which is about the type of shift adopted by our sliding windows. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">This can be one or more. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.3">A larger stride generates fewer applications of the kernel and a smaller output size, while a smaller stride generates more output and retains more information.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">The size of the filter, the stride, and the type of padding are hyperparameters that can be fine-tuned during the training of the network.</span></p>


            </article>
