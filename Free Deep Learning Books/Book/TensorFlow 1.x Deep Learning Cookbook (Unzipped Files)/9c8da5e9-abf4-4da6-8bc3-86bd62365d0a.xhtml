        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting ready...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Now that we have the basic architecture of VAEs, the question arises how can they be trained, since the maximum likelihood of the training data and posterior density are intractable? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">The network is trained by maximizing the lower bound of the log data likelihood. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Thus, the loss term consists of two components: generation loss, which is obtained from the decoder network through sampling, and the KL divergence term, also called the latent loss.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Generation loss ensures that the image generated by the decoder and the image used to train the network is the same, and latent loss ensures that the posterior distribution </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">qᵩ(z|x)</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> is close to the prior </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">p</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">ϴ</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">(z)</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">Since the encoder uses Gaussian distribution for sampling, the latent loss measures how closely the latent variables match a unit Gaussian.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Once the VAE is trained, we can use only the decoder network to generate new images.</span></p>


            </article>

            
        </section>
