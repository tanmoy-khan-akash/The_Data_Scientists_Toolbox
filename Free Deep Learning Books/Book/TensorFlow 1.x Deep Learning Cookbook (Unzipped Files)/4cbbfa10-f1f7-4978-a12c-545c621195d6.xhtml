            <article>
                
<p class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Feedback from our readers is always welcome. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Let us know what you think about this book-what you liked or disliked. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Reader feedback is important for us as it helps us develop titles that you will really get the most out of. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">To send us general feedback, simply e-mail </span><kbd><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">feedback@packtpub.com</span></span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">, and mention the book's title in the subject of your message. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">If there is a topic that you have expertise in and you are interested in either writing or contributing to a book, see our author guide at </span><span><a href="http://www.packtpub.com/authors" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">www.packtpub.com/authors</span></a></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> .</span></p>
