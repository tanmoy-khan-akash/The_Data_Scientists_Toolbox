        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How it works...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Batch AI manages the resources by itself, you just need to specify the job, the location of inputs and where to store the outputs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">If during the execution of the job you want to see the results, you can use the command:</span></p>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">az batchai job stream-file --job-name myjob --output-directory-id stdouterr --name stderr.txt</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Once the job is over, you delete both the job and the cluster using </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">az batchai job delete</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> and </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">az batchai cluster delete</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"> commands.</span></p>


            </article>

            
        </section>
    </body>
