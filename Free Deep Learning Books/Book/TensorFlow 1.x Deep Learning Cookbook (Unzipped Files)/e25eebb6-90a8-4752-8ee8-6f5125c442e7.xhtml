        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">There's more...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Anyone who sees the agent learn to play for the first time will be amazed by it--it seems so human-like. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">The initial moves are always clumsy; slowly, the agent learns which way to go, though it is slow and often misses the ball. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">However, as the learning continues, the agent becomes an expert.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Yet it is very unlike us; once we learn to play a game, we can easily use that knowledge in any other similar situation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">The RL agent will not be able to do so--even a simple thing such as changing the size of environment space will bring it back to zero. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">Transfer learning, a technique being investigated by researchers, can help the agent use the knowledge it learned in one environment space in another environment space, and perhaps pave the way for true artificial general intelligence one day.</span></p>


            </article>

            
        </section>
