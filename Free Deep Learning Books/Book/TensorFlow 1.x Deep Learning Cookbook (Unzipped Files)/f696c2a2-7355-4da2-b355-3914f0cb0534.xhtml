        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">There's more...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">In the preceding example, without preprocessing, the accuracy of the three data sets is roughly ~40 percent. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">But when we add preprocessing, the accuracy for the training data increases to 90 percent, but for validation and testing, we still get an accuracy of ~45 percent.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">There are many changes which can be introduced to improve the result. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">First, the dataset that we used in the recipe is the Kaggle dataset with only 22,000 images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">If you observe these images you will find the addition of the step of filtering only faces will improve the result. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.4">Another strategy, as mentioned in the following paper, is increasing the size of hidden layers instead of reducing them-</span><a href="https://www.cs.swarthmore.edu/~meeden/cs81/s14/papers/KevinVincent.pdf"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">https://www.cs.swarthmore.edu/~meeden/cs81/s14/papers/KevinVincent.pdf</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Another change that has been found really successful in identifying the emotions is using facial-keypoints instead of training for the whole face, </span><a href="http://cs229.stanford.edu/proj2010/McLaughlinLeBayanbat-RecognizingEmotionsWithDeepBeliefNets.pdf"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">http://cs229.stanford.edu/proj2010/McLaughlinLeBayanbat-RecognizingEmotionsWithDeepBeliefNets.pdf</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">.</span></p>
<p class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">With the preceding recipe, you can play around with these changes and explore how performance improves. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">May the GPU force be with you!</span></p>


            </article>

            
        </section>
