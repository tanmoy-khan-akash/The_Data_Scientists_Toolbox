                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">There's More...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">This whole chapter was about autoencoders, and, while right now they are used only for dimensionality reduction and information retrieval, they generate a lot of interest. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Firstly, because they are unsupervised, and secondly because they can be employed along with FCNs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">They can help us deal with the curse of dimensionality. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">Researchers have demonstrated that they can also be used for classification and anomaly detection.</span></p>


            </article>
