                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Advantages of TPUs</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The first and foremost advantage that TPUs offer over GPUs and CPUs is performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Google compared the TPU performance to a server-class Intel Haswell CPU and a NVIDIA K80 GPU running the benchmark code representative of 95% of the inference workload; it found that the TPU is 15-30 times faster than both NVIDIA's GPU and Intel's CPU.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">The second important parameter is the power consumption. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">It is important to reduce power consumption since it has a twofold energy benefit: not only does it reduce the amount of power consumed, it also saves power by reducing the cooling cost to dissipate the heat generated while processing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">The TPU/CPU per watt performance shows a 30-80 times improvement over other CPU and GPU configurations. </span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Another advantage of TPUs is their minimal and deterministic design since they have to execute only one task at a time.  </span></p>
<div class="packt_quote"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">As compared to CPUs and GPUs, the single-threaded TPU has none of the sophisticated microarchitectural features that consume transistors and energy to improve the average case but not the 99th-percentile case: no caches, branch prediction, out-of-order execution, multiprocessing, speculative prefetching, address coalescing, multithreading, context switching, and so forth. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">Minimalism is a virtue of domain-specific processors.</span></div>


            </article>

            
        </section>
