        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Learning to write as Shakespeare with RNNs</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">In this recipe, we will learn how to generate text similar to that written by William Shakespeare. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">The key idea is very simple: we take as input a real text written by Shakespeare and we give it as input to an RNN which will learn the sequences. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">This learning is then used to generate new text which looks like that written by the greatest writer in the English language.</span></p>
<div class="packt_tip"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">For the sake of simplicity, we will use the framework TFLearn (</span><a href="http://tflearn.org/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">http://tflearn.org/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">), which runs on top of TensorFlow. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">This example is part of the standard distribution and it is available at </span><a href="https://github.com/tflearn/tflearn/blob/master/examples/nlp/lstm_generator_shakespeare.py"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">https://github.com/tflearn/tflearn/blob/master/examples/nlp/lstm_generator_shakespeare.py</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> . </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">The model developed one is an RNN character-level language model where the sequences considered are sequences of characters and not words.</span></div>


            </article>

            
        </section>
