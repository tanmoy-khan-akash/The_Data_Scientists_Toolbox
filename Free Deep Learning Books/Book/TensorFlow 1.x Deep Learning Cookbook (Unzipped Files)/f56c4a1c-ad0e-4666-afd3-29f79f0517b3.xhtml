<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">In this recipe, we will use TFLearn for creating a sentiment analysis deep learning network based on CNNs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">As discussed in the previous section, our CNN will be in one dimension. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">We are going to use the IMDb dataset, a collection of 45,000 highly popular movie reviews for training, and 5,000 for testing.</span></p>
