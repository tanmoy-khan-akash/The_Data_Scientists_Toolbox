            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Above we learned how to use Microsoft Azure Batch AI for Distributed TensorFlow using Azure Command Line tool. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">We can do the same using Jupyter Notebook too. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">This will involve setting the Azure Active Directory, and making a new App registration. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">The details can be had at this link: </span><a href="https://docs.microsoft.com/en-us/azure/azure-resource-manager/resource-group-create-service-principal-portal"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://docs.microsoft.com/en-us/azure/azure-resource-manager/resource-group-create-service-principal-portal</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Azure BatchAI works with other AI deep learning libraries too, we suggest that you should go through the BatchAI Github for more details: </span><a href="https://github.com/Azure/BatchAI"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">https://github.com/Azure/BatchAI</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">.</span></p>
