                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How it works...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">CapsNets are very different from state-of-the-art deep learning networks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Instead of adding more layers and making the network deeper, CapsNets use a shallow network where capsule layers are nested inside other layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Each capsule specializes in detecting a specific entity in an image, and a dynamic routing mechanism is used to send the detected entity to parents layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">With CNNs you have to consider thousands of images from many different perspectives in order to recognize an object from different angles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">Hinton believes the redundancies in the layers will allow capsule networks to identify objects from multiple angles and in different scenarios with less data that is typically used by CNNs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.6">Let's examine the network as shown by tensorboad:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"><img class=" image-border" src="assets/23569842-8cea-4cde-a5ed-39ed16b08d7a.png"/></span></div>
<div class="packt_figref CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">An example of CapsNet as defined in the code and shown by tensorboard</span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">The results are impressive as shown in the following diagram taken from the seminal paper. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">CapsNet has a low test error (0.25 percent) on a three-layer network previously only achieved in deeper networks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.3">The baseline is a standard CNN with three convolutional layers of 256,256—128 channels. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.4">Each has 5 x 5 kernels and a stride of 1. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.5">The last convolutional layers are followed by two fully connected layers of size 328,192. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.6">The last fully connected layer is connected with dropout to a 10 class softmax layer with cross-entropy losses:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"><img class=" image-border" src="assets/19bafff9-7a12-40a4-91ef-68a4f2d51577.png"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Let's examine the reduction of margin loss, reconstruction loss, and total loss:</span></p>
