        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We proceed with the recipe as follows:</span></p>
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">The first step is to import all the packages that we will need:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">import tensorflow as tf</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">import numpy as np</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">import matplotlib.pyplot as plt</span></pre></div>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">In neural networks, all the inputs are added linearly to generate activity; for effective training, the inputs should be normalized, so we define a function to normalize the input data:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">def </span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">normalize(X):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">    """ Normalizes the array X"""</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">    mean = np.mean(X)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">    std = np.std(X)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">    X = (X - mean)/std</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">    return X</span></pre></div>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Now we load the Boston house price dataset using TensorFlow </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">contrib</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1"> datasets and separate it into </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">X_train</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1"> and </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Y_train</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">We can choose to normalize the data here:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1"># Data</span><br/></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">boston = tf.contrib.learn.datasets.load_dataset(</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">'boston'</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">X_train, Y_train = boston.data[:,5], boston.target</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">#X_train = normalize(X_train)  # This step is optional here</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">n_samples = len(X_train)</span></pre></div>
<ol start="4">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">We declare the TensorFlow placeholders for the training data:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1"># Placeholder for the Training Data</span><br/></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">X = tf.placeholder(tf.float32, name=</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">'X'</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">Y = tf.placeholder(tf.float32, name=</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">'Y'</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">)</span></pre></div>
<ol start="5">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">We create TensorFlow variables for weight and bias with initial value zero:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1"># Variables for coefficients initialized to 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">b = tf.Variable(0.0)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">w = tf.Variable(0.0)</span></pre></div>
<ol start="6">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">We define the linear regression model to be used for prediction:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1"># The Linear Regression Model</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">Y_hat = X * w + b</span></pre></div>
<ol start="7">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Define the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">loss</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1"> function:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><em> </em><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1"># Loss function</span><br/> </em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">loss = tf.square(Y - Y_hat, name=</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">'loss'</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">)</span></pre></div>
<ol start="8">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">We choose the gradient descent optimizer:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><em> </em><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1"># Gradient Descent with learning rate of 0.01 to minimize loss</span><br/> </em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">optimizer = tf.train.GradientDescentOptimizer(learning_rate=0.01).minimize(loss)</span></pre></div>
<ol start="9">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">Declare the initializing operator:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"># Initializing Variables</span><br/></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">init_op = tf.global_variables_initializer()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">total = []</span></pre></div>
<ol start="10">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">Now, we start the computation graph. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.2">We run the training for 100 epochs:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1"># Computation Graph</span><br/></em><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">with </span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">tf.Session() </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">as </span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">sess:</span><br/>    <em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1"># Initialize variables</span><br/>    </em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">sess.run(init_op)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">    writer = tf.summary.FileWriter(</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">'graphs'</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">, sess.graph)</span><br/>    <em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1"># train the model for 100 epochs</span><br/>    </em><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">for </span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">i </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">in </span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">range(100):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">        total_loss = 0</span><br/>        <strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">for </span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">x,y </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">in </span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">zip(X_train,Y_train):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">            _, l = sess.run ([optimizer, loss],            feed_dict={X:x, Y:y})</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">            total_loss += l</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">        total.append(total_loss / n_samples)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">        print(</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">'Epoch {0}: Loss {1}'</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">.format(i, total_loss/n_samples))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">     writer.close()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">     b_value, w_value = sess.run([b,w])</span></pre></div>
<ol start="11">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">View the result:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">Y_pred = X_train * w_value + b_value</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">print(</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">'Done'</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">)</span><br/><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1"># Plot the result</span><br/></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">plt.plot(X_train, Y_train, </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">'bo'</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">, label=</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">'Real Data'</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">plt.plot(X_train,Y_pred,  </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">'r'</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">, label=</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">'Predicted Data'</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">plt.legend()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">plt.show()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">plt.plot(total)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">plt.show()</span></pre></div>


            </article>
