        <title>Classifying videos with pre-trained nets in six different ways</title>

        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Classifying videos with pre-trained nets in six different ways</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Classifying videos is an area of active research because of a large amount of data needed for processing this type of media. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Memory requirements are frequently reaching the limits of modern GPUs and a distributed form of training on multiple machines might be required. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Research is currently exploring different directions with increased levels of complexity, let's review them.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">The first approach consists of classifying one video frame at a time by considering each of them as a separate image processed with a 2D CNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">This approach simply reduces the video classification problem to an image classification problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">Each video frame </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">emits</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> a classification output, and the video is classified by taking into account the more frequently chosen category for each frame.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">The second approach consists of creating one single network where a 2D CNN is combined with an RNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">The idea is that the CNN will take into account the image components and the RNN will take into account the sequence information for each video. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">This type of network can be very difficult to train because of the very high number of parameters to optimize.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">The third approach is to use a 3D ConvNet, where 3D ConvNets are an extension of 2D ConvNets operating on a 3D tensor (</span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">time</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">image_width</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">image_height</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">This approach is another natural extension of image classification, but again, 3D ConvNets might be hard to train.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">The fourth approach is based on smart intuition. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">Instead of using CNNs directly for classification, they can be used for storing offline features for each frame in the video. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.3">The idea is that feature extraction can be made very efficient with transfer learning, as shown in a previous recipe. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.4">After all of the features are extracted, they can be passed as a set of inputs into an RNN which will learn sequences across multiple frames and emit the final classification.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">The fifth approach is a simple variant of the fourth, where the final layer is an MLP instead of an RNN. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">In certain situations, this approach can be simpler and less expensive in terms of computational requirements.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">The sixth approach is a variant of the fourth, where the phase of feature extraction is realized with a 3D CNN which extracts spatial and visual features. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">These features are then passed to either an RNN or an MLP.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Deciding on the best approach is strictly dependant on your specific application and there is no definitive answer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2">The first three approaches are generally more computationally expensive, while the last three approaches are less expensive and frequently achieve better performance.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">In this recipe, we show how to use the sixth approach by describing the results presented in the paper </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Temporal Activity Detection in Untrimmed Videos with Recurrent Neural Networks</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">, Montes, Alberto and Salvador, Amaia and Pascual, Santiago and Giro-i-Nieto, Xavier, 2016 (</span><a href="https://arxiv.org/abs/1608.08128"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">https://arxiv.org/abs/1608.08128</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">) . </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.2">This work aims at solving the ActivityNet Challenge </span><a href="http://activity-net.org/challenges/2016/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">http://activity-net.org/challenges/2016/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.2">This challenge focuses on recognizing high-level and goal-oriented activities from user-generated videos, similar to those found in internet portals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.3">The challenge is tailored to 200 activity categories in two different tasks:</span></p>
<ul>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Untrimmed Classification Challenge: Given a long video, predict the labels of the activities present in the video</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Detection Challenge: Given a long video, predict the labels and temporal extents of the activities present in the video</span></li>
</ul>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">The architecture presented consists of two stages, as depicted in the following figure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">The first stage encodes the video information into a single vector representation for small video clips. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.3">To achieve that, the C3D network is used. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.4">The C3D network uses 3D convolutions to extract spatiotemporal features from the videos, which previously have been split into 16-frame clips.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">The second stage, once the video features are extracted, is that the activity on each clip is to be classified. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">To perform this classification an RNN is used, more specifically an LSTM network which tries to exploit long-term correlations and perform a prediction of the video sequence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.3">This stage is the one which has been trained:</span></p>

            </article>
