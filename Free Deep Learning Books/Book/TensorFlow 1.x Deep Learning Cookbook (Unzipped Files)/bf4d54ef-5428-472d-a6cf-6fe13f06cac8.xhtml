                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting ready</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Now that you have the AWS account and p2.xlarge instances available to you, you are ready to create your own instance from EC2 dashboard. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">The first step is selecting the machine image, as of now, Amazon offers special machine images preloaded with Deep learning libraries you can select the Ubuntu or Linux version. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Next, choose the GPU to compute instance type.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">You can review and launch the instance with default parameters, or you can configure the settings, choose the storage and configure the security group. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">Configuring the security group is important, by default SSH security group is set, but if you want to use Jupyter Notebook, you need to add a custom security group for port 8888, you have the option to choose the source from which you will log in to the instance, there are three possibilities Custom, Anywhere or My IP:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"><img class=" image-border" src="assets/10716413-09c1-49c7-9c5c-207de1610b48.png"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Finally, when you launch the instance, you will be asked to create a key pair, which allows you to login to the particular instance, you will need to create one key-pair and download the respective </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">.pem</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> file, this you will use for logging later.</span></p>


            </article>
