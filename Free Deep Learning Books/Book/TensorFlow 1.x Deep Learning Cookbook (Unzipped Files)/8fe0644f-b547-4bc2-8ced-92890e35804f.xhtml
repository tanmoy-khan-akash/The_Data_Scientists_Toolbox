<p class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">For this book, you will need Python version 3.5 (</span><a href="https://www.continuum.io/downloads" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://www.continuum.io/downloads</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">) along with TensorFlow (</span><a href="http://www.tensorflow.org" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">www.tensorflow.org</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">The following hardware specifications are recommended:</span></p>
<ul>
<li class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">CPU architecture: x86_64</span></li>
<li class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">System memory: 8-32 GB</span></li>
<li class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">CPUs: 4-8 cores</span></li>
<li class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">GPUs: (Optional, minimum NVDIA ® GTX 650)</span></li>
