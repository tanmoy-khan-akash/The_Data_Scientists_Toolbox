                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting ready</span></h1>

            <article>
                
<p><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Our response to a given input stimulus is governed by the activation function of our neurons. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Sometimes our response is a binary yes or no; for example, when presented with a joke, we either laugh or do not laugh. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">At other times, the response seems linear, for example, crying due to pain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">At times, the response seems to be bounded within a range.</span></span></p>
<p><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Mimicking similar behavior, many different activation functions are used by artificial neurons. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">In this recipe, you will learn how to define and use some of the common activation functions in TensorFlow.</span></span></p>


            </article>
