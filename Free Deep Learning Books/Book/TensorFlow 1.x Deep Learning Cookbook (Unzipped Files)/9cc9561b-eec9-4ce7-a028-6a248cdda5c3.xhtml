                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">TensorFlow, mobile, and the cloud</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">As discussed, phones typically do not have GPUs and it is important to save battery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">So many expensive computations need to be offloaded to the cloud to alleviate the cost. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Of course, it is a matter of compromising different factors including the cost of executing a deep learning model on mobile, the cost of moving data off to the cloud, the cost of the battery for this transfer, and the cost of cloud computing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">There is no single solution, and the optimal strategy depends on your particular situation.</span></p>


            </article>
