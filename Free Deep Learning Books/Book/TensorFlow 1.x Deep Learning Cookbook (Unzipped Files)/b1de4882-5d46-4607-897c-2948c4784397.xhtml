                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">There's more...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Predicting stock market values is a cool RNN application and there are a number of handy packages available, for instance:</span></p>
<ul>
<li class="MsoNormalCxSpMiddle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Drnns-prediction implements deep RNNs using the Keras neural networks library on the Daily News for Stock Market Prediction dataset from Kaggle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">The dataset task is to predict future movement of the DJIA using the current and previous day's news headlines as features. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">The open source code is available at </span><a href="https://github.com/jvpoulos/drnns-prediction"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">https://github.com/jvpoulos/drnns-prediction</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">.</span></li>
<li class="MsoNormalCxSpMiddle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Michael Luk wrote an interesting blog posting on how to predict Coca Cola stock volume based on RNNs: </span><a href="https://sflscientific.com/data-science-blog/2017/2/10/predicting-stock-volume-with-lstm"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">https://sflscientific.com/data-science-blog/2017/2/10/predicting-stock-volume-with-lstm</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">.</span></li>
<li class="MsoNormalCxSpLast"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Jakob Aungiers wrote another interesting blog posting on </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">LSTM Neural Network for Time Series Prediction</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">:</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1"> </span></em><a href="http://www.jakob-aungiers.com/articles/a/LSTM-Neural-Network-for-Time-Series-Prediction"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">http://www.jakob-aungiers.com/articles/a/LSTM-Neural-Network-for-Time-Series-Prediction</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">.</span></li>
</ul>
