<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Using CNN together with GANs results in a faster capacity to learn. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Let's look at a number of practical examples of different epochs to understand how the machine will learn to improve its writing process. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">For instance, compare the results achieved after four iterations in the following recipe with the results achieved after four iterations in the previous recipe. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">Do you see the difference? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">I wish that I could learn this art myself!</span></p>
