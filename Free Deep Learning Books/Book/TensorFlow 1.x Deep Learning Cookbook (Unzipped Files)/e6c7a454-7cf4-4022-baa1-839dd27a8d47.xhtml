<script xmlns="http://www.w3.org/1999/xhtml" type="text/javascript" src="js/kobo.js"/>

    <body>
        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We proceed with the recipe as follows:</span></p>
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">The first step is importing all the necessary modules:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">import tensorflow as tf</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">import numpy as np</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">from tensorflow.examples.tutorials.mnist import input_data</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">import matplotlib.pyplot as plt</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">%matplotlib inline</span></pre>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Load the dataset:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">mnist = input_data.read_data_sets("MNIST_data/")</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">trX, trY, teX, teY = mnist.train.images, mnist.train.labels, mnist.test.images, mnist.test.labels</span></pre>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Next, we define the class, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">StackedAutoencoder</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1"> . </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">The class </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">__init__</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> method contains a list containing a number of neurons in each autoencoder, starting from the first input autoencoder and the learning rate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">As each layer will have different dimensions for input and output, we choose a dictionary data structure to represent weights, biases, and inputs for each layer:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">class StackedAutoEncoder(object):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1"> def __init__(self, list1, eta = 0.02):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1"> """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1"> list1: [input_dimension, hidden_layer_1, ....,hidden_layer_n]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1"> """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1"> N = len(list1)-1</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1"> self._m = list1[0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1"> self.learning_rate = eta</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1"> # Create the Computational graph</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"> self._W = {}</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1"> self._b = {}</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1"> self._X = {}</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1"> self._X['0'] = tf.placeholder('float', [None, list1[0]])</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1"> for i in range(N):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1"> layer = '{0}'.format(i+1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"> print('AutoEncoder Layer {0}: {1} --&gt; {2}'.format(layer, list1[i], list1[i+1]))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1"> self._W['E' + layer] = tf.Variable(tf.random_normal(shape=(list1[i], list1[i+1])),name='WtsEncoder'+layer)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1"> self._b['E'+ layer] = tf.Variable(np.zeros(list1[i+1]).astype(np.float32),name='BiasEncoder'+layer)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1"> self._X[layer] = tf.placeholder('float', [None, list1[i+1]])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"> self._W['D' + layer] = tf.transpose(self._W['E' + layer]) # Shared weights</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1"> self._b['D' + layer] = tf.Variable(np.zeros(list1[i]).astype(np.float32),name='BiasDecoder' + layer)</span><br/>  <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1"> # Placeholder for inputs</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1"> self._X_noisy = tf.placeholder('float', [None, self._m])</span></pre>
<ol start="4">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">We build a computation graph to define the optimization parameters for each autoencoder while pretraining. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.2">It involves defining the reconstruction loss for each autoencoder when the output of the previous autoencoder's Encoder is its input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.3">To do this, we define the class methods, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">pretrain</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1"> and </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">one_pass</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">, which return the training ops and output of the Encoder respectively for each stacked autoencoder:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"> self.train_ops = {}</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1"> self.out = {}</span><br/> <br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1"> for i in range(N):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1"> layer = '{0}'.format(i+1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"> prev_layer = '{0}'.format(i)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1"> opt = self.pretrain(self._X[prev_layer], layer)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1"> self.train_ops[layer] = opt</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1"> self.out[layer] = self.one_pass(self._X[prev_layer], self._W['E'+layer], self._b['E'+layer], self._b['D'+layer])</span></pre>
<ol start="5">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">We build the computation graph for the fine-tuning of the complete stacked autoencoder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.2">To do this, we make use of the class methods, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">encoder</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"> and </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">decoder</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">self.y = self.encoder(self._X_noisy,N) #Encoder output </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">self.r = self.decoder(self.y,N) # Decoder ouput</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">optimizer = tf.train.AdamOptimizer(self.learning_rate) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">error = self._X['0'] - self.r # Reconstruction Error</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">self._loss = tf.reduce_mean(tf.pow(error, 2))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">self._opt = optimizer.minimize(self._loss)</span></pre>
<ol start="6">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Finally, we define the class method, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">fit</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">, to perform the batch-wise pretraining of each autoencoder, followed by fine-tuning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.2">While pretraining, we use the non-corrupted input, and for fine-tuning, we use the corrupted input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.3">This allows us to use the stacked autoencoder to reconstruct even from the noisy input:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">def fit(self, Xtrain, Xtr_noisy, layers, epochs = 1, batch_size = 100):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1"> N, D = Xtrain.shape</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1"> num_batches = N // batch_size</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1"> X_noisy = {}</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1"> X = {}</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1"> X_noisy ['0'] = Xtr_noisy</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1"> X['0'] = Xtrain</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1"> for i in range(layers):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1"> Xin = X[str(i)]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1"> print('Pretraining Layer ', i+1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1"> for e in range(5):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1"> for j in range(num_batches):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1"> batch = Xin[j * batch_size: (j * batch_size + batch_size)]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1"> self.session.run(self.train_ops[str(i+1)], feed_dict= {self._X[str(i)]: batch})</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"> print('Pretraining Finished')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1"> X[str(i+1)] = self.session.run(self.out[str(i+1)], feed_dict = {self._X[str(i)]: Xin})</span><br/> <br/> <br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1"> obj = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1"> for i in range(epochs):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1"> for j in range(num_batches):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1"> batch = Xtrain[j * batch_size: (j * batch_size + batch_size)]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1"> batch_noisy = Xtr_noisy[j * batch_size: (j * batch_size + batch_size)]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1"> _, ob = self.session.run([self._opt,self._loss], feed_dict={self._X['0']: batch, self._X_noisy: batch_noisy})</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1"> if j % 100 == 0 :</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1"> print('training epoch {0} batch {2} cost {1}'.format(i,ob, j)) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1"> obj.append(ob)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1"> return obj</span></pre>
<ol start="7">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">The different class methods are as follows:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">def encoder(self, X, N):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1"> x = X</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1"> for i in range(N):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1"> layer = '{0}'.format(i+1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1"> hiddenE = tf.nn.sigmoid(tf.matmul(x, self._W['E'+layer]) + self._b['E'+layer])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1"> x = hiddenE</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1"> return x</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">def decoder(self, X, N):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1"> x = X</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1"> for i in range(N,0,-1):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1"> layer = '{0}'.format(i)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1"> hiddenD = tf.nn.sigmoid(tf.matmul(x, self._W['D'+layer]) + self._b['D'+layer])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1"> x = hiddenD</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1"> return x</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">def set_session(self, session):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1"> self.session = session</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">def reconstruct(self,x, n_layers):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1"> h = self.encoder(x, n_layers)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1"> r = self.decoder(h, n_layers)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1"> return self.session.run(r, feed_dict={self._X['0']: x})</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">def pretrain(self, X, layer ):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1"> y = tf.nn.sigmoid(tf.matmul(X, self._W['E'+layer]) + self._b['E'+layer])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1"> r =tf.nn.sigmoid(tf.matmul(y, self._W['D'+layer]) + self._b['D'+layer])</span><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1"> # Objective Function</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1"> error = X - r # Reconstruction Error</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">  loss = tf.reduce_mean(tf.pow(error, 2))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1"> opt = tf.train.AdamOptimizer(.001).minimize(loss, var_list = </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1"> [self._W['E'+layer],self._b['E'+layer],self._b['D'+layer]])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">  return opt</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">def one_pass(self, X, W, b, c):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1"> h = tf.nn.sigmoid(tf.matmul(X, W) + b)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1"> return h</span></pre>
<ol start="8">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">We use the corruption function defined in the Denoising autoencoder recipe to corrupt the images and, finally, create a StackAutoencoder and train it:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">Xtrain = trX.astype(np.float32)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">Xtrain_noisy = corruption(Xtrain).astype(np.float32)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">Xtest = teX.astype(np.float32)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">Xtest_noisy = corruption(Xtest).astype(np.float32) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">_, m = Xtrain.shape</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">list1 = [m, 500, 50] # List with number of neurons in Each hidden layer, starting from input layer</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">n_layers = len(list1)-1</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">autoEncoder = StackedAutoEncoder(list1)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">#Initialize all variables</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">init = tf.global_variables_initializer()</span><br/><br/> <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">with tf.Session() as sess:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1"> sess.run(init)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1"> autoEncoder.set_session(sess)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1"> err = autoEncoder.fit(Xtrain, Xtrain_noisy, n_layers, epochs=30)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1"> out = autoEncoder.reconstruct(Xtest_noisy[0:100],n_layers)</span></pre>
<ol start="9">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">The reconstruction error versus epochs, as the stacked autoencoder is fine-tuned, is given here. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.2">You can see that, due to pretraining, we already start from a very low reconstruction loss:</span></li>
</ol>
