        <title>Long Short Term Memory (LSTM)</title>
        <link rel="stylesheet" href="css/style.css" type="text/css"/>

<!-- kobo-style -->
<script xmlns="http://www.w3.org/1999/xhtml" type="text/javascript" src="js/kobo.js"/>

        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Long Short Term Memory (LSTM)</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">An LSTM network can control when to let the input enter the neuron, when to remember what has been learned in the previous time step, and when to let the output pass on to the next timestamp. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">All these decisions are self-tuned and only based on the input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">At first glance, an LSTM looks difficult to understand but it is not. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">Let's use the following figure to explain how it works:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"><img height="187" width="256" src="assets/930273d1-d536-42bd-99ab-d02986f6705d.png"/></span></div>
<div class="packt_figref CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">An example of an LSTM cell</span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">First, we need a logistic function σ (see </span><a href="63cafe73-86d3-4ee1-929b-e45677956d9a.xhtml" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Chapter 2</span></a><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">, </span></span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Regression</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">) to compute a value between 0 and 1 and control which piece of information flows through the LSTM </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">gates</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">Remember that the logistic function is differentiable and therefore it allows backpropagation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">Then, we need an operator ⊗ that takes two matrices of the same dimensions and produces another matrix where each element </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">ij</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1"> is the product of the elements </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">ij</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">  of the original two matrices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">Similarly, we need an operator ⊕ that takes two matrices of the same dimensions and produces another matrix where each element </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">ij</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1"> is the sum of the elements </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">ij</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1"> of the original two matrices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">With these basic blocks, we consider the input X</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1"> at time i and simply juxtapose it with output Y</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">i-1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1"> from the previous step.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">The equation </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">f</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">t</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1"> = σ(W</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">f</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">.[y</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">i-1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">,x</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">t</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">] + b</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">f</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1"> is implements a logistic regression which controls the activation gate ⊗ and it is used to decide how much information from the </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">previous</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1"> candidate value C</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">i-1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1"> should be passed to the next candidate value C</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">i </span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">(here, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">W</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">f</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1"> and </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">b</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">f</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1"> are the weight matrix and the bias used for the logistic regression). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.2">If the logistic outputs 1, this would mean </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">don't forget</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"> the previous cell state C</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">i-1;</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1"> if it outputs 0, this would mean </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">forget</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1"> the previous cell state C</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">i-1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">Any number in (0,1) will represent the amount of information to be passed.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Then we have two equations: </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">s</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1"> = σ(W</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">s</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">[Y</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">i-1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">,x</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">]+b</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">s</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">) used to control via ⊗ how much of the information </span><span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">Ĉ</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1"> = tanh(W</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">C</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">.[Y</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">i-1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">,x</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">] + b</span><sub><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">c</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1"> </span></sub></em></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">produced by the </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">current</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"> cell should be added to the next candidate value C</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1"> via the operator ⊕ according to the scheme represented in the preceding figure.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">To implement what has discussed with the operators ⊕ and ⊗, we need another equation where the actual sums + and multiplications * take place:  </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1"> C</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">=f</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">t</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">*C</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">i-1 </span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">+ s</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">i</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">*Ĉ</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">i</span></sub></em></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">Finally, we need to decide which part of the current cell should be sent to the </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">Y</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">i</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1"> output. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.2">This is simple: we take a logistic regression equation </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">one more time </span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">and use this to control via an ⊗ operation which part of the candidate value should go to the output. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.2">Here, there is a little piece that deserves care and it is the use of the</span></span> <em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">tanh</span></em> <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">function to squash the output into [-1, 1]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.2">This latest step is described by the equation: </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1"><img height="20" width="129" class="fm-editor-equation" src="assets/3ee358ac-f71a-4d03-b74c-c170783a49fd.png"/></span><br/></span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">Now, I understand that this looks like a lot of math but there are two pieces of good news. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.2">First, the math part is not so difficult after all if you understand what the goal is that we want to achieve. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.3">Second, you can use LSTM cells as a blackbox drop-in replacement of standard RNN cells and immediately get the benefit of solving the problem of a vanishing gradient. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.4">For this reason, you really don't need to know all the math. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.5">You just take the TensorFlow LSTM implementation from the library and use it.</span></p>


            </article>

            
        </section>
