<p class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We have used Keras Applications, pre-trained Keras learning models that are made available alongside pre-trained weights. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">These models can be used for prediction, feature extraction, and fine-tuning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">In this case, we have used the model for prediction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">We will see in the next recipe how to use the model for fine-tuning and for building customized classifiers on datasets that were originally not available when the models were originally trained.</span></p>
