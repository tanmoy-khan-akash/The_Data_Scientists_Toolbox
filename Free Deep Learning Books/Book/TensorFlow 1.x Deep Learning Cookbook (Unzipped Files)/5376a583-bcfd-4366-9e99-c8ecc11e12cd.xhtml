        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How it works...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The key idea of keras-vis visualization for Dense layers is to generate an input image that maximizes the final Dense layer output corresponding to the bird class. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">So in reality what the module does is reverse the problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Given a specific trained Dense layer with its weight, a new synthetic image is generated which </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">best</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> fits the layer itself.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">A similar idea is used for each conv filter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">In this case, note that the first ConvNet layer is interpretable by simply visualizing its weights, as it is operating over raw pixels. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.3">Subsequent conv filters operate over the outputs of previous conv filters, and therefore visualizing them directly is not necessarily very interpretable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.4">However, if we consider each layer independently we can focus on generating only a synthetic input image which maximizes the filter output.</span></p>


            </article>

            
        </section>
