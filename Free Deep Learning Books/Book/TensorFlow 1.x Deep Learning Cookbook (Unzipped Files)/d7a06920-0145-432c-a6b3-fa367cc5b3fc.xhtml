                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Autoencoders</span></h1>
                </header>
            
            <article>
                
<p class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Autoencoders are feed-forward, non-recurrent neural networks, which learn by unsupervised learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">They have an inherent capability to learn a compact representation of data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">They are at the centre of deep belief networks and find applications in image reconstruction, clustering, machine translation, and much more. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">In this chapter, you will learn and implement different variants of autoencoders and eventually learn how to stack autoencoders. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">The chapter includes the following topics:</span></p>
<ul>
<li class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Vanilla autoencoder</span></li>
<li class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Sparse autoencoder</span></li>
<li class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Denoising autoencoder</span></li>
<li class="mce-root"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Convolutional autoencoders</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Stacked autoencoders</span></li>
</ul>


            </article>
