                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">There is more...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The keras-vis repository on GitHub (</span><a href="https://github.com/raghakot/keras-vis"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://github.com/raghakot/keras-vis</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">)  has a good set of visualization examples of how to inspect a network internally, including the very recent idea of attention maps, where the goal is to detect which part of an image contributed the most to the training of a specific category (for example, tigers) when images frequently contain other elements (for example, grass). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">The seed article is </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Deep Inside Convolutional Networks: Visualising Image Classification Models and Saliency Maps</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">, Karen Simonyan, Andrea Vedaldi, Andrew Zisserman (</span><a href="https://arxiv.org/abs/1312.6034"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">https://arxiv.org/abs/1312.6034</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">), and an example extracted from the Git repository is reported below where the network understands by itself what the most salient part in an image to </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">define</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"> a tiger is:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1"><img height="143" width="144" class=" image-border" src="assets/6f3615d0-e3ab-462c-8f9b-d15432b4cca6.png"/></span></div>
<div class="packt_figref CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">An example of saliency maps  as seen on </span><a href="https://github.com/raghakot/keras-vis"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">https://github.com/raghakot/keras-vis</span></a></div>
