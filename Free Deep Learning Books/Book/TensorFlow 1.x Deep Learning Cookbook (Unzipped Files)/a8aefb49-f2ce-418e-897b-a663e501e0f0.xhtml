        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting ready</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The network is first presented with </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">M</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> training pairs (</span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">X</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Y</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">), with </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">X</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"> as the input and </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Y</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1"> the desired output. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">The input is propagated from input via the activation function </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">g(h)</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1"> through the hidden layers, up to the output layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">The output </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Y</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">hat</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1"> is the output of the network, giving the error = </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Y- Y</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">hat</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">The </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">loss</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1"> function </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">J(W)</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1"> is as follows:</span></p>
<p style="padding-left: 180px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"><img class=" image-border" src="assets/fa600cc8-054b-49d3-b774-94863f05edb7.png"/></span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Here, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">i</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1"> varies over all the neurons of the output layer (1 to N). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">The change in weights </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">W</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">ij</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">, connecting </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">i</span></em><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">th</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1"> output layer neuron to </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">j</span></em><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">th</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1"> hidden layer neuron, can then be determined using the gradient of </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">J(W)</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1"> and employing the chain rule for differentiation:</span></p>
<p style="padding-left: 120px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"><img class=" image-border" src="assets/af595466-04c4-4e30-a829-b863903fa6a1.png"/></span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">Here, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">O</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">j</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"> is the output of the hidden layer neuron, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">j</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1"> and </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">h</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"> represent activity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">This was easy, but now how do we find the update for weights </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">W</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">jk</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1"> connecting the neuron </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">k</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1"> from </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">n</span></em><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">th</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1"> hidden layer to the neuron </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">j</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1"> of </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">n+1</span></em><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">th</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1"> hidden layer? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.2">The process is the same--we will use the gradient of the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">loss</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1"> function and chain rule for differentiation, but we will be calculating it for </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">W</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">jk</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"> this time:</span></p>
<p style="padding-left: 120px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1"><img class=" image-border" src="assets/634458d9-0a04-4b8a-a880-e422aeee7698.png"/></span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">Now that the equations are in place, let's see how to do it in TensorFlow. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.2">In this recipe, we work with our same old the MNIST dataset (</span><a href="http://yann.lecun.com/exdb/mnist/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">http://yann.lecun.com/exdb/mnist/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">).</span></p>


            </article>

            
        </section>
