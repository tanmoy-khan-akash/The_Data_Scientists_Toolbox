            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Content-aware fill is a tool used by photographers to fill in unwanted or missing parts of images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">The paper </span><a href="https://arxiv.org/abs/1607.07539"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Semantic Image Inpainting with Perceptual and Contextual Losses</span></em></a><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">,</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> by Raymond A. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">Yeh, Chen Chen, Teck Yian Lim, Alexander G. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.3">Schwing, Mark Hasegawa-Johnson, Minh N., 2016 uses a DCGAN for image completion, and it learns how to fill in parts of images.</span></p>


            </article>
