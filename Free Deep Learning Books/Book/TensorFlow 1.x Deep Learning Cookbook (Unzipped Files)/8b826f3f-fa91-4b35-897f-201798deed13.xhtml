        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We can proceed with the recipe as follows:</span></p>
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Load all the Keras modules needed by the recipe. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">These include spaCy for word embedding, VGG16 for image features extraction, and LSTM for language modeling. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">The remaining few additional modules are pretty standard:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">%matplotlib inline</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">import os, argparse</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">import numpy as np</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">import cv2 as cv2</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">import spacy as spacy</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">import matplotlib.pyplot as plt</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">from keras.models import Model, Input</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">from keras.layers.core import Dense, Dropout, Reshape</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">from keras.layers.recurrent import LSTM</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">from keras.layers.merge import concatenate</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">from keras.applications.vgg16 import VGG16</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">from keras.preprocessing import image</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">from keras.applications.vgg16 import preprocess_input</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">from sklearn.externals import joblib</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">import PIL.Image</span></pre>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Define a few constants. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">Note that we assume that our corpus of questions has </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">max_length_questions = 30</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1"> and we know that we are going to use VGG16 to extract 4,096 features describing our input image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">In addition, we know that the word embeddings are in a space of </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">length_feature_space = 300</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.2">Note that we are going to use a set of pre-trained weights downloaded from the internet (</span><a href="https://github.com/iamaaditya/VQA_Demo"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">https://github.com/iamaaditya/VQA_Demo</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">):</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"># mapping id -&gt; labels for categories</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">label_encoder_file_name =</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">'/Users/gulli/Books/TF/code/git/tensorflowBook/Chapter5/FULL_labelencoder_trainval.pkl'</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1"># max length across corpus</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">max_length_questions = 30</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1"># VGG output</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">length_vgg_features = 4096</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1"># Embedding outout</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">length_feature_space = 300</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1"># pre-trained weights</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">VQA_weights_file =</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">'/Users/gulli/Books/TF/code/git/tensorflowBook/Chapter5/VQA_MODEL_WEIGHTS.hdf5'</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">3. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.2">Use VGG16 for extracting features. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.3">Note that we explicitly extract them from the layer fc2. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.4">This function returns 4,096 features given an input image:</span></p>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">'''image features'''</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">def get_image_features(img_path, VGG16modelFull):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">'''given an image returns a tensor with (1, 4096) VGG16 features'''</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1"># Since VGG was trained as a image of 224x224, every new image</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1"># is required to go through the same transformation</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">img = image.load_img(img_path, target_size=(224, 224))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">x = image.img_to_array(img)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1"># this is required because of the original training of VGG was batch</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1"># even if we have only one image we need to be consistent</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">x = np.expand_dims(x, axis=0)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">x = preprocess_input(x)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">features = VGG16modelFull.predict(x)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">model_extractfeatures = Model(inputs=VGG16modelFull.input,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">outputs=VGG16modelFull.get_layer('fc2').output)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">fc2_features = model_extractfeatures.predict(x)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">fc2_features = fc2_features.reshape((1, length_vgg_features))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">return fc2_features</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Note that VGG16 is defined as follows:</span></p>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">Layer (type) Output Shape Param #</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1"> =================================================================</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1"> input_5 (InputLayer) (None, 224, 224, 3) 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1"> block1_conv1 (Conv2D) (None, 224, 224, 64) 1792</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1"> block1_conv2 (Conv2D) (None, 224, 224, 64) 36928</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1"> block1_pool (MaxPooling2D) (None, 112, 112, 64) 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"> block2_conv1 (Conv2D) (None, 112, 112, 128) 73856</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1"> block2_conv2 (Conv2D) (None, 112, 112, 128) 147584</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1"> block2_pool (MaxPooling2D) (None, 56, 56, 128) 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1"> block3_conv1 (Conv2D) (None, 56, 56, 256) 295168</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1"> block3_conv2 (Conv2D) (None, 56, 56, 256) 590080</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1"> block3_conv3 (Conv2D) (None, 56, 56, 256) 590080</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1"> block3_pool (MaxPooling2D) (None, 28, 28, 256) 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"> block4_conv1 (Conv2D) (None, 28, 28, 512) 1180160</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1"> block4_conv2 (Conv2D) (None, 28, 28, 512) 2359808</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1"> block4_conv3 (Conv2D) (None, 28, 28, 512) 2359808</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1"> block4_pool (MaxPooling2D) (None, 14, 14, 512) 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1"> block5_conv1 (Conv2D) (None, 14, 14, 512) 2359808</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1"> block5_conv2 (Conv2D) (None, 14, 14, 512) 2359808</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1"> block5_conv3 (Conv2D) (None, 14, 14, 512) 2359808</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1"> block5_pool (MaxPooling2D) (None, 7, 7, 512) 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1"> flatten (Flatten) (None, 25088) 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1"> fc1 (Dense) (None, 4096) 102764544</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1"> fc2 (Dense) (None, 4096) 16781312</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1"> predictions (Dense) (None, 1000) 4097000</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1"> =================================================================</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1"> Total params: 138,357,544</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1"> Trainable params: 138,357,544</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1"> Non-trainable params: 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1"> _________________________________________</span></pre>
<ol start="4">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">Use spaCy to get a word embedding and map the input question into a space (</span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">max_length_questions, 300</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">) where </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">max_length_questions</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1"> is the max length of questions in our corpus, and 300 is the dimension of embeddings produced by spaCy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.2">Internally, spaCy uses an algorithm called gloVe (</span><a href="http://nlp.stanford.edu/projects/glove/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">http://nlp.stanford.edu/projects/glove/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.2">gloVe reduces a given token to a 300-dimensional representation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.3">Note that the question is padded to the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">max_lengh_questions</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1"> with right 0 paddings:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">'''embedding'''</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">def get_question_features(question):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">''' given a question, a unicode string, returns the time series vector</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">with each word (token) transformed into a 300 dimension representation</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">calculated using Glove Vector '''</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">word_embeddings = spacy.load('en', vectors='en_glove_cc_300_1m_vectors')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">tokens = word_embeddings(question)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">ntokens = len(tokens)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">if (ntokens &gt; max_length_questions) :</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">ntokens = max_length_questions</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">question_tensor = np.zeros((1, max_length_questions, 300))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">for j in xrange(len(tokens)):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">question_tensor[0,j,:] = tokens[j].vector</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">return question_tensor</span></pre>
<ol start="5">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">Load an image and get its salient features by using the previously defined image feature extractor:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">image_file_name = 'girl.jpg'</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">img0 = PIL.Image.open(image_file_name)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">img0.show()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">#get the salient features</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">model = VGG16(weights='imagenet', include_top=True)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">image_features = get_image_features(image_file_name, model)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">print image_features.shape</span></pre>
<ol start="6">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">Write a question and get its salient features by using the previously defined sentence feature extractor:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">question = u"Who is in this picture?"</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">language_features = get_question_features(question)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">print language_features.shape</span></pre>
<ol start="7">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">Combine the two heterogeneous sets of features into one. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.2">In this network, we have three LSTM layers which will take the creation of our language model into account. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.3">Note that the LSTM will be discussed in detail in Chapter 6 and for now we only use them as black boxes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.4">The last LSTM returns 512 features which are then used as inputs to a sequence of Dense and Dropout layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.5">The last layer is a Dense one with a softmax activation function in a probability space of 1,000 potential answers:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">'''combine'''</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">def build_combined_model(</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">number_of_LSTM = 3,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">number_of_hidden_units_LSTM = 512,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">number_of_dense_layers = 3,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">number_of_hidden_units = 1024,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">activation_function = 'tanh',</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">dropout_pct = 0.5</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">#input image</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">input_image = Input(shape=(length_vgg_features,),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">name="input_image")</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">model_image = Reshape((length_vgg_features,),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">input_shape=(length_vgg_features,))(input_image)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">#input language</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">input_language = Input(shape=(max_length_questions,length_feature_space,),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">name="input_language")</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">#build a sequence of LSTM</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">model_language = LSTM(number_of_hidden_units_LSTM,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">return_sequences=True,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">name = "lstm_1")(input_language)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">model_language = LSTM(number_of_hidden_units_LSTM,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">return_sequences=True,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">name = "lstm_2")(model_language)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">model_language = LSTM(number_of_hidden_units_LSTM,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">return_sequences=False,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">name = "lstm_3")(model_language)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">#concatenate 4096+512</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">model = concatenate([model_image, model_language])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">#Dense, Dropout</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">for _ in xrange(number_of_dense_layers):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">model = Dense(number_of_hidden_units,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">kernel_initializer='uniform')(model)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">model = Dropout(dropout_pct)(model)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">model = Dense(1000,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">activation='softmax')(model)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">#create model from tensors</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">model = Model(inputs=[input_image, input_language], outputs = model)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">return model</span></pre>
<ol start="8">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">Build the combined network and show its summary just to understand how it looks internally. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.2">Load the pre-trained weights and compile the model by using the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">categorical_crossentropy</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1"> loss function, with the rmsprop optimizer:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">combined_model = build_combined_model()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">combined_model.summary()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">combined_model.load_weights(VQA_weights_file)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">combined_model.compile(loss='categorical_crossentropy', optimizer='rmsprop')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">____________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1"> Layer (type) Output Shape Param # Connected to</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1"> ====================================================================================================</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1"> input_language (InputLayer) (None, 30, 300) 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1"> ____________________________________________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1"> lstm_1 (LSTM) (None, 30, 512) 1665024 input_language[0][0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1"> ____________________________________________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1"> input_image (InputLayer) (None, 4096) 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1"> ____________________________________________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1"> lstm_2 (LSTM) (None, 30, 512) 2099200 lstm_1[0][0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1"> ____________________________________________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1"> reshape_3 (Reshape) (None, 4096) 0 input_image[0][0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1"> ____________________________________________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1"> lstm_3 (LSTM) (None, 512) 2099200 lstm_2[0][0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1"> ____________________________________________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1"> concatenate_3 (Concatenate) (None, 4608) 0 reshape_3[0][0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1"> lstm_3[0][0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1"> ____________________________________________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1"> dense_8 (Dense) (None, 1024) 4719616 concatenate_3[0][0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1"> ____________________________________________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1"> dropout_7 (Dropout) (None, 1024) 0 dense_8[0][0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1"> ____________________________________________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1"> dense_9 (Dense) (None, 1024) 1049600 dropout_7[0][0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1"> ____________________________________________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1"> dropout_8 (Dropout) (None, 1024) 0 dense_9[0][0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1"> ____________________________________________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1"> dense_10 (Dense) (None, 1024) 1049600 dropout_8[0][0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1"> ____________________________________________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1"> dropout_9 (Dropout) (None, 1024) 0 dense_10[0][0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1"> ____________________________________________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1"> dense_11 (Dense) (None, 1000) 1025000 dropout_9[0][0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1"> ====================================================================================================</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1"> Total params: 13,707,240</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1"> Trainable params: 13,707,240</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1"> Non-trainable params: 0</span></pre>
<ol start="9">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">Use the pre-trained combined network for making the prediction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.2">Note that in this case we use weights already available online for this network, but the interested reader can re-train the combined network on their own training set:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">y_output = combined_model.predict([image_features, language_features])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1"># This task here is represented as a classification into a 1000 top answers</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1"># this means some of the answers were not part of training and thus would</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1"># not show up in the result.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1"># These 1000 answers are stored in the sklearn Encoder class</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">labelencoder = joblib.load(label_encoder_file_name)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">for label in reversed(np.argsort(y_output)[0,-5:]):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">print str(round(y_output[0,label]*100,2)).zfill(5), "% ", labelencoder.inverse_transform(label)</span></pre>
