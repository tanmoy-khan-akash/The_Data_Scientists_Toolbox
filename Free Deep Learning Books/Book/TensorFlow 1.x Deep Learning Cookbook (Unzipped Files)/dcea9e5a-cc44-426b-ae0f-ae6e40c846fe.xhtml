<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The preceding code performs dimensionality reduction on the MNIST images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Each original image is of size 28 x 28; using the PCA method, we can reduce it to a smaller size. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Normally, for image data, dimensionality reduction is necessary. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">This is so because images are large in size and contain a significant amount of redundant data.</span></p>
