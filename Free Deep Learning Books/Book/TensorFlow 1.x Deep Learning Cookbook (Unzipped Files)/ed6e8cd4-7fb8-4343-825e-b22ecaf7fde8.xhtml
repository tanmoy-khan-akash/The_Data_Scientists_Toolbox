<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1"> </span></p>
<p class="mce-root"/>
<div class="mce-root packt_quote"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">This book is dedicated to my son Lorenzo - for your growing passion for algorithms - to my son Leonardo - for your curiosity to explore the world -, and to my daughter Aurora - for your love. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">A special thought to Elio and Maria, my father and my mother.</span></div>
<div class="mce-root packt_quote"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">All my royalties will go to </span><a href="https://theschoolfund.org"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">theschoolfund.org</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> a non-profit organization devoted to helping fund scholarships for high potential students who cannot afford to attend school.</span></div>
<div class="mce-root CDPAlignRight CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">- Antonio Gulli</span></div>
<div class="packt_quote"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">This book is dedicated to the loving memory of my mother Late Smt Swarnlata Kapoor, who instilled in me the value of education, and motivated me to continue learning despite odds, and my father Mr Anil Mohan Kapoor  for all his love and support.</span></div>
<div class="packt_quote"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">A part of my royalties will go to </span><a href="http://www.smilefoundationindia.org/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">smilefoundation.org</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"> a non-profit organization based in India working in the welfare projects on education, healthcare, livelihood, and women empowerment in remote villages and slums across different states of India.</span></div>
<div class="mce-root CDPAlignRight CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">- Amita Kapoor</span></div>
