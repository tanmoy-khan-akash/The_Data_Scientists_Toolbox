            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">In this recipe, we will use keras-vis (</span><a href="https://raghakot.github.io/keras-vis/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://raghakot.github.io/keras-vis/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">), an external Keras package for visually inspecting what a pre-built VGG16 network has learned in different filters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">The idea is to pick a specific ImageNet category and understand 'how' the VGG16 network has learned to represent it.</span></p>
