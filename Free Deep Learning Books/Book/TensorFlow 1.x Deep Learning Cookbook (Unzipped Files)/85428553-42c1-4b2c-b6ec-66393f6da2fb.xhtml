<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">K-means clustering is very popular because it is fast, simple, and robust. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">It also has some disadvantages: the biggest being that the user has to specify the number of clusters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Second, the algorithm does not guarantee global optima. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">Third, it is very sensitive to outliers.</span></p>
