        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We proceed with the recipe as follows:</span></p>
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Import matplotlib and the modules used by keras-vis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">In addition, also import the pre-built VGG16 module. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">Keras makes it easy to deal with this pre-built network:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">from matplotlib import pyplot as plt</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">from vis.utils import utils</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">from vis.utils.vggnet import VGG16</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">from vis.visualization import visualize_class_activation</span></pre>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Access the VGG16 network by using the pre-built layers included in Keras and trained with ImageNet weights:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"># Build the VGG16 network with ImageNet weights</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">model = VGG16(weights='imagenet', include_top=True)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">model.summary()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">print('Model loaded.')</span></pre>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">This is how the VGG16 network looks internally. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">We have many ConvNets, alternated with maxpool2D. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.3">Then, we have a Flatten layer followed by three Dense layers.  The last one is called </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">predictions</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">, and this layer should be able to detect high-level features such as faces or, in our case, the shape of a bird. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">Note that the top layer is explicitly included in our network because we want to visualize what it learned:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">_________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1"> Layer (type) Output Shape Param #</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1"> =================================================================</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1"> input_2 (InputLayer) (None, 224, 224, 3) 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1"> block1_conv1 (Conv2D) (None, 224, 224, 64) 1792</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1"> block1_conv2 (Conv2D) (None, 224, 224, 64) 36928</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1"> block1_pool (MaxPooling2D) (None, 112, 112, 64) 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1"> block2_conv1 (Conv2D) (None, 112, 112, 128) 73856</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1"> block2_conv2 (Conv2D) (None, 112, 112, 128) 147584</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1"> block2_pool (MaxPooling2D) (None, 56, 56, 128) 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1"> block3_conv1 (Conv2D) (None, 56, 56, 256) 295168</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1"> block3_conv2 (Conv2D) (None, 56, 56, 256) 590080</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1"> block3_conv3 (Conv2D) (None, 56, 56, 256) 590080</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1"> block3_pool (MaxPooling2D) (None, 28, 28, 256) 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"> block4_conv1 (Conv2D) (None, 28, 28, 512) 1180160</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1"> block4_conv2 (Conv2D) (None, 28, 28, 512) 2359808</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"> block4_conv3 (Conv2D) (None, 28, 28, 512) 2359808</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1"> block4_pool (MaxPooling2D) (None, 14, 14, 512) 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"> block5_conv1 (Conv2D) (None, 14, 14, 512) 2359808</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1"> block5_conv2 (Conv2D) (None, 14, 14, 512) 2359808</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1"> block5_conv3 (Conv2D) (None, 14, 14, 512) 2359808</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"> block5_pool (MaxPooling2D) (None, 7, 7, 512) 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1"> flatten (Flatten) (None, 25088) 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1"> fc1 (Dense) (None, 4096) 102764544</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1"> fc2 (Dense) (None, 4096) 16781312</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1"> predictions (Dense) (None, 1000) 4097000</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1"> =================================================================</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1"> Total params: 138,357,544</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1"> Trainable params: 138,357,544</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"> Non-trainable params: 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1"> _________________________________________________________________</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1"> Model loaded.</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">Visually, the network can be represented as shown in the following figure:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1"><img class=" image-border" src="assets/23b589e9-b3d4-4389-baa3-3a3d0aacb81c.png"/></span></div>
<div class="packt_figref CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">A VGG16 Network</span></div>
<ol start="4">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">Now let's focus on inspecting how the last prediction layer looks internally by focusing on American Dipper, which is the ID 20:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">layer_name = 'predictions'</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">layer_idx = [idx for idx, layer in enumerate(model.layers) if layer.name == layer_name][0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1"># Generate three different images of the same output index.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">vis_images = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">for idx in [20, 20, 20]:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">img = visualize_class_activation(model, layer_idx, filter_indices=idx, max_iter=500)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">img = utils.draw_text(img, str(idx))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">vis_images.append(img)</span></pre>
<ol start="5">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">Let's display the generated images for the specific layer given the features and observe how the concept of the </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">American Dipper</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1"> bird is internally </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">seen</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1"> by the network:</span></li>
</ol>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1"><img class=" image-border" src="assets/822b54c3-1532-4a32-bd82-6b36790239d3.png"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">So, this is how a bird is internally represented by a neural network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.2">It is a kind of trippy image, but I swear that no particular kind of artificial drug has been given to the network itself! </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.3">This is just what this particular kind of artificial network has naturally learned.</span></p>
<ol start="6">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">Are you are still curious to understand a bit more? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.2">Well, let's pick an earlier layer and represent how the network is internally seeing this same </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">American Dipper</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1"> training class:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">layer_name = 'block3_conv1'</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">layer_idx = [idx for idx, layer in enumerate(model.layers) if layer.name == layer_name][0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">vis_images = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">for idx in [20, 20, 20]:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">img = visualize_class_activation(model, layer_idx, filter_indices=idx, max_iter=500)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">img = utils.draw_text(img, str(idx))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">vis_images.append(img)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">stitched = utils.stitch_images(vis_images)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">plt.axis('off')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">plt.imshow(stitched)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">plt.title(layer_name)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">plt.show()</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">The following is the output of the preceding code:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1"><img height="114" width="276" class=" image-border" src="assets/34c93cb6-1445-40f2-a703-398913dd87db.png"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">As expected, this particular layer is learning very basic features such as curves. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.2">However, the true power of ConvNets is that the network infers more and more sophisticated features the deeper we go into the models.</span></p>
