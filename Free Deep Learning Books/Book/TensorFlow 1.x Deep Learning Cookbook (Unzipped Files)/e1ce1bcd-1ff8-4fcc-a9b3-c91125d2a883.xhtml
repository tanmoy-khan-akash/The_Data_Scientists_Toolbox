                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Introduction</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">In this chapter, we will discuss how </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Generative Adversarial Networks</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">GANs</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">) are used for deep learning in domains where the key method is to train an image generator by simultaneously training a discriminator to challenge </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">the latter </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">for improvement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">The same </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">method </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">can be applied to domains different from Images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">In addition, we will discuss the Variational Autoencoder.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">GANs have been defined as </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">the most interesting idea in the last 10 years in ML</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1"> (</span><a href="https://www.quora.com/What-are-some-recent-and-potentially-upcoming-breakthroughs-in-deep-learning"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">https://www.quora.com/What-are-some-recent-and-potentially-upcoming-breakthroughs-in-deep-learning</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">)  by Yann LeCun, one of the fathers of Deep Learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">GANs are able to learn how to reproduce synthetic data which looks real. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.3">For instance, computers can learn how to paint and create realistic images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.4">The idea was originally proposed by Ian Goodfellow who worked with the University of Montreal, Google Brain, and recently with OpenAI (</span><a href="https://openai.com/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">https://openai.com/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">).</span></p>


            </article>
