        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How it works...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The task of Visual Question Answering is tackled by using a combination of different deep neural networks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">A pre-trained VGG16 has been used to extract features from images, and a sequence of LSTM has been used to extract features from questions previously mapped into an embedding space. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">VGG16 is a CNN used for image feature extraction, while LSTM is an RNN used for extracting temporal features representing the sequences. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.4">The combination of these two is currently the state of the art for dealing with this type of network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.5">A multi-layered perceptron with dropout is then added on top of the combined models in order to form our deep network.</span></p>


            </article>

            
        </section>
