    <body>
        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We proceed with the recipe as follows:</span></p>
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Clone the code from github:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">git clone </span><a href="https://github.com/TengdaHan/GAN-TensorFlow"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">https://github.com/TengdaHan/GAN-TensorFlow</span></a></pre>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Define a Xavier initializer as described in the paper </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Understanding the difficulty of training deep feedforward neural networks (2009) by Xavier Glorot, Yoshua</span></em> <em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Bengio, http://citeseerx.ist.psu.edu/viewdoc/download?doi=10.1.1.207.2059&amp;rep=rep1&amp;type=pdf </span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> The initializers are proven to allow better convergence for GANs:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">def xavier_init(size):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">  in_dim = size[0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">  xavier_stddev = 1. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">/ tf.sqrt(in_dim / 2.)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">  return xavier_stddev</span></pre>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Define the generator for the input X. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">First we define a matrix W1 with the dimension [100, K=128], initialized according to a normal distribution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.3">Note that 100 is an arbitrary value for Z, the initial noise used by our generator. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.4">Then, we define the bias B1 with the dimension [K=256]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.5">Similarly, we define a matrix W2 with the dimension [</span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">K=128</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">L=784</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">] and a bias B2 with the dimension [L=784]. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">The two matrices W1 and W2 are initialized by using the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">xavier_init</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1"> defined in step 1, while B1 and B2 are initialized by using </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">tf.constant_initializer()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.2">After that, we compute the multiplication between matrices </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">X * W1</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">, sum the bias of B1, and pass it through a RELU activation function for obtaining fc1. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.2">This dense layer is then connected with the next dense layer which was created by multiplying the matrices fc1 with W2 and summing the bias of B2. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.3">The result is then passed via a sigmoid function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.4">These steps are used to define our two layers' neural network used for the generator:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">def generator(X):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">  with tf.variable_scope('generator'): </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">    K = 128</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">    L = 784</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">    W1 = tf.get_variable('G_W1', [100, K],</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">  initializer=tf.random_normal_initializer(stddev=xavier_init([100,   K])))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">    B1 = tf.get_variable('G_B1', [K],       initializer=tf.constant_initializer())</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">    W2 = tf.get_variable('G_W2', [K, L],</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">    initializer=tf.random_normal_initializer(stddev=xavier_init([K,   L])))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">    B2 = tf.get_variable('G_B2', [L],    initializer=tf.constant_initializer())</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">    # summary</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">    tf.summary.histogram('weight1', W1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">    tf.summary.histogram('weight2', W2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">    tf.summary.histogram('biases1', B1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">    tf.summary.histogram('biases2', B2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">    fc1 = tf.nn.relu((tf.matmul(X, W1) + B1))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">    fc2 = tf.matmul(fc1, W2) + B2</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">    prob = tf.nn.sigmoid(fc2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">    return prob</span></pre>
<ol start="4">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Define the discriminator for input X. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.2">In principle, this is very similar to the generator. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.3">The main difference is that if the parameter reuse is true, then we call </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">scope.reuse_variables()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1"> to trigger a reuse. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.2">Then we define two dense layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.3">The first layer uses a matrix W1 of dimensions [</span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">J=784</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">K=128</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">] with a bias B1 of dimension [</span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">K=128</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">], and it is based on the standard multiplication of X by W1. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.2">This result is added to B1 and passed to a RELU activation function for getting the result fc1. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.3">The second one uses a matrix W2 of the dimension [</span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">K=128</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">L=1</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">] with a bias B2 of dimension [</span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">L=1</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">], and it is based on the standard multiplication of fc1 by W2. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.2">This result is added to B2 and passed to a sigmoid function:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">def discriminator(X, reuse=False):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">  with tf.variable_scope('discriminator'):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">    if reuse:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">      tf.get_variable_scope().reuse_variables()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">    J = 784</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">    K = 128</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">    L = 1</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">    W1 = tf.get_variable('D_W1', [J, K],</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">    initializer=tf.random_normal_initializer(stddev=xavier_init([J,  K])))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">    B1 = tf.get_variable('D_B1', [K],    initializer=tf.constant_initializer())</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">    W2 = tf.get_variable('D_W2', [K, L],</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">initializer=tf.random_normal_initializer(stddev=xavier_init([K, L])))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">    B2 = tf.get_variable('D_B2', [L],  initializer=tf.constant_initializer())</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">    # summary</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">    tf.summary.histogram('weight1', W1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">    tf.summary.histogram('weight2', W2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">    tf.summary.histogram('biases1', B1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">    tf.summary.histogram('biases2', B2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">    fc1 = tf.nn.relu((tf.matmul(X, W1) + B1))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">    logits = tf.matmul(fc1, W2) + B2</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">    prob = tf.nn.sigmoid(logits)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">    return prob, logits</span></pre>
<ol start="5">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">Now let's define some useful additional functions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.2">First, we import a bunch of standard modules:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">import tensorflow as tf</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">import numpy as np</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">import matplotlib.pyplot as plt</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">import matplotlib.gridspec as gridspec</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">import os</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">import argparse</span></pre>
<ol start="6">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">Then we read the data from the MNIST dataset and define an auxiliary function for plotting samples:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">def read_data():</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">  from tensorflow.examples.tutorials.mnist import input_data</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">  mnist = input_data.read_data_sets("../MNIST_data/", one_hot=True)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">  return mnist</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">def plot(samples):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">  fig = plt.figure(figsize=(8, 8))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">  gs = gridspec.GridSpec(8, 8)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">  gs.update(wspace=0.05, hspace=0.05)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">  for i, sample in enumerate(samples):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">    ax = plt.subplot(gs[i])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">    plt.axis('off')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">    ax.set_xticklabels([])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">    ax.set_yticklabels([])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">    ax.set_aspect('equal')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">    plt.imshow(sample.reshape(28, 28), cmap='Greys_r')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">  return fig</span></pre>
<ol start="7">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">Now let's define the training function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.2">First, let's read the MNIST data, and then define a matrix X of shape 28 x 28 with one channel for a standard MNIST handwritten character. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.3">Then let's define a z noise vector of size 100—a common choice proposed in the seminal GANs paper. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.4">The next step is to call the generator on z and assign the result to G. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.5">After that, we pass X to the discriminator without reuse. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.6">Then we pass the forged/fake G result to </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">the discriminator, </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">reusing the learned weight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.2">One important aspect of this is how we chose the loss function for the discriminator, which is a sum of two cross entropies: one for real characters, where all the real MNIST characters have a label set to one, and one for forged characters, where all the forged characters have a label set to zero. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.3">The discriminator and the generator run in an alternate sequence for 100,000 steps. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.4">Every 500 steps, a sample is drawn from the learned distribution for printing what that generator has learned so far. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.5">This is what defines a new epoch, and the results are shown in the next section. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.6">Let's see the code snippet which implements what we just described.</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">def train(logdir, batch_size):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">  from model_fc import discriminator, generator</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">  mnist = read_data()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">  with tf.variable_scope('placeholder'):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">    # Raw image</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">    X = tf.placeholder(tf.float32, [None, 784])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">    tf.summary.image('raw image', tf.reshape(X, [-1, 28, 28, 1]), 3)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">   # Noise</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">   z = tf.placeholder(tf.float32, [None, 100]) # noise</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">   tf.summary.histogram('Noise', z)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">  with tf.variable_scope('GAN'):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">    G = generator(z)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">    D_real, D_real_logits = discriminator(X, reuse=False)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">    D_fake, D_fake_logits = discriminator(G, reuse=True)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">    tf.summary.image('generated image', tf.reshape(G, [-1, 28, 28, 1]), 3)</span><br/>  <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">  with tf.variable_scope('Prediction'):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">    tf.summary.histogram('real', D_real) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">    tf.summary.histogram('fake', D_fake)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">  with tf.variable_scope('D_loss'):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">    d_loss_real = tf.reduce_mean(</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">    tf.nn.sigmoid_cross_entropy_with_logits(</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">    logits=D_real_logits, labels=tf.ones_like(D_real_logits)))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">    d_loss_fake = tf.reduce_mean(</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">    tf.nn.sigmoid_cross_entropy_with_logits(</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">     logits=D_fake_logits, labels=tf.zeros_like(D_fake_logits)))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">    d_loss = d_loss_real + d_loss_fake</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">  tf.summary.scalar('d_loss_real', d_loss_real)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">  tf.summary.scalar('d_loss_fake', d_loss_fake)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">  tf.summary.scalar('d_loss', d_loss)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">  with tf.name_scope('G_loss'):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">    g_loss = tf.reduce_mean(tf.nn.sigmoid_cross_entropy_with_logits</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">   (logits=D_fake_logits, labels=tf.ones_like(D_fake_logits)))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">    tf.summary.scalar('g_loss', g_loss)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">    tvar = tf.trainable_variables()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">    dvar = [var for var in tvar if 'discriminator' in var.name]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">    gvar = [var for var in tvar if 'generator' in var.name]</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">  with tf.name_scope('train'):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">    d_train_step = tf.train.AdamOptimizer().minimize(d_loss,   var_list=dvar)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">    g_train_step = tf.train.AdamOptimizer().minimize(g_loss,  var_list=gvar)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">  sess = tf.Session()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">  init = tf.global_variables_initializer()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">  sess.run(init)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">  merged_summary = tf.summary.merge_all()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">  writer = tf.summary.FileWriter('tmp/mnist/'+logdir)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">  writer.add_graph(sess.graph)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">  num_img = 0</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">  if not os.path.exists('output/'):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">    os.makedirs('output/')</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">  for i in range(100000):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">    batch_X, _ = mnist.train.next_batch(batch_size)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">    batch_noise = np.random.uniform(-1., 1., [batch_size, 100])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">    if i % 500 == 0:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">     samples = sess.run(G, feed_dict={z: np.random.uniform(-1., 1., [64, 100])})</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">     fig = plot(samples)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">     plt.savefig('output/%s.png' % str(num_img).zfill(3),    bbox_inches='tight')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">     num_img += 1</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">    plt.close(fig)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">  _, d_loss_print = sess.run([d_train_step, d_loss],</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">feed_dict={X: batch_X, z: batch_noise})</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">  _, g_loss_print = sess.run([g_train_step, g_loss],</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">  feed_dict={z: batch_noise})</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">  if i % 100 == 0:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">    s = sess.run(merged_summary, feed_dict={X: batch_X, z: batch_noise})</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">    writer.add_summary(s, i)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">    print('epoch:%d g_loss:%f d_loss:%f' % (i, g_loss_print, d_loss_print))</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">  if __name__ == '__main__':</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">    parser = argparse.ArgumentParser(description='Train vanila GAN using fully-connected layers networks')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">    parser.add_argument('--logdir', type=str, default='1', help='logdir for Tensorboard, give a string')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">    parser.add_argument('--batch_size', type=int, default=64, help='batch size: give a int')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">    args = parser.parse_args()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">    train(logdir=args.logdir, batch_size=args.batch_size)</span></pre>
