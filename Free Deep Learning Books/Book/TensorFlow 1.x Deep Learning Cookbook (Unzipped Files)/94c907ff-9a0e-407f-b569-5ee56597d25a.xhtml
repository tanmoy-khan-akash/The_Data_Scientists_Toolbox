                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Single layer perceptron</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">A simple perceptron is a single-layered neural network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">It uses the threshold activation function and, as proved by the Marvin Minsky paper, can solve only linearly separable problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">While this limits the applications of single layer perceptron to only linearly separable problems, it is still always amazing to see it learn.</span></p>


            </article>
