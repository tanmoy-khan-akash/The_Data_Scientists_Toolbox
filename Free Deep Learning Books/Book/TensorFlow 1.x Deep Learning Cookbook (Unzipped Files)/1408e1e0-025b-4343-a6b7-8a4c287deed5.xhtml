        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">About the Reviewers</span></h1>
                </header>
            
            <article>
                
<p><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Narotam Singh</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> has been with India Meteorological Department, Ministry of Earth Sciences, India, since 1996. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">He has been actively involved with various technical programs and training of officers of GoI in the field of information technology and communication. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.3">He did his post-graduation in the field of electronics in 1996 and both diploma and post-graduate diploma in the field of computer engineering in 1994 and 1997 respectively. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.4">He is currently working in the enigmatic field of neural networks, machine learning, and deep learning.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> </span></p>
<p><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Nick McClure</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> is currently a senior data scientist at PayScale Inc in Seattle, Washington, USA. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">Previously, he worked at Zillow and Caesar’s Entertainment.  He has degrees in applied mathematics from the University of Montana and the College of Saint Benedict and Saint John’s University. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">Nick has also authored </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">TensorFlow Machine Learning Cookbook</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"> by Packt Publishing.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">He has a passion for learning and advocating for analytics, machine learning, and artificial intelligence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">Nick occasionally puts his thoughts and musings on his blog, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">fromdata.org</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">, or through his Twitter account at </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">@nfmcclure</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1"> </span></p>
<p class="mce-root"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Corrado Zoccolo</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> is a Senior Staff Software Engineer at Google, with 10+ years of experience in distributed indexing and information retrieval systems.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1"> </span></p>
<div class="packt_quote"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">I would like to show my gratitude to the many people who helped me succeed in my studies and my carreer, in particular: my wife Ermelinda, that supported me over the many years I dedicated to computer science; Prof. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">Marco Vanneschi who introduced me to the beautiful world of Distributed Systems; my first manager at Google, Peter Dickman, who set me on the right track for my career, and all my colleagues from which I keep learning every day.</span></div>


            </article>
