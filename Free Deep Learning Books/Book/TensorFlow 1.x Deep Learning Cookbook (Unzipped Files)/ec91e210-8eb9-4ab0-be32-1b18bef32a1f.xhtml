                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting ready</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">We will consider the Boston housing price dataset (</span><a href="http://lib.stat.cmu.edu/datasets/boston"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">http://lib.stat.cmu.edu/datasets/boston</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">) collected by Harrison and Rubinfield in 1978. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">The dataset contains 506 sample cases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">Each house is assigned 14 attributes:</span></p>
<ul>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">CRIM</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">: per capita crime rate by town</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">ZN</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">: Proportion of residential land zoned for lots over 25,000 sq.ft</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">INDUS</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">: Proportion of non-retail business acres per town</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">CHAS</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">: Charles River dummy variable (1 if tract bounds river; 0 otherwise)</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">NOX</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">: Nitric oxide concentration (parts per 10 million)</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">RM</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">: Average number of rooms per dwelling</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">AGE</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">: Proportion of owner-occupied units built prior to 1940</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">DIS</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">: Weighted distances to five Boston employment centres</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">RAD</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">: Index of accessibility to radial highways</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">TAX</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">: Full-value property-tax rate per $10,000</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">PTRATIO</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">: Pupil-teacher ratio by town</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">B</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">: 1000(Bk - 0.63)^2 where Bk is the proportion of blacks by town</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">LSTAT</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">: percent lower status of the population</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">MEDV</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">: Median value of owner-occupied homes in $1,000's</span></li>
</ul>


            </article>

            
        </section>
    </body>
