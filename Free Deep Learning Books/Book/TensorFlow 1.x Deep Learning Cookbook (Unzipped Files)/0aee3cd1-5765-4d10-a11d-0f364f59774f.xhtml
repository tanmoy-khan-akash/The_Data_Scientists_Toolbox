                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">There's more...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">It is worth remembering that seq2seq can be used for more than just Machine Translation. Let's see some examples:</span></p>
<ul>
<li class="MsoNormalCxSpMiddle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Lukasz Kaiser, in </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Grammar as a Foreign Language</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> (</span><a href="https://arxiv.org/abs/1412.7449"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">https://arxiv.org/abs/1412.7449</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">), uses the seq2seq model to build a constituency parser. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">A constituency parse tree breaks text into subphrases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.3">Non-terminals in the tree are types of phrases, the terminals are the words in the sentence, and the edges are unlabeled.</span></li>
<li class="MsoNormalCxSpMiddle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Another application of seq2seq is SyntaxNet, aka Parsey McParserFace, (a syntactic parser; </span><a href="https://research.googleblog.com/2016/05/announcing-syntaxnet-worlds-most.html"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">https://research.googleblog.com/2016/05/announcing-syntaxnet-worlds-most.html</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">), which is a key first component in many NLU systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">Given a sentence as input, it tags each word with a </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">part-of-speech</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">POS</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">) tag that describes the word's syntactic function, and it determines the syntactic relationships between words in the sentence, represented in the dependency parse tree. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">These syntactic relationships are directly related to the underlying meaning of the sentence in question.</span></li>
</ul>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">The following figure gives us a good idea of the concept:</span></p>
