        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Here is how we proceed with the recipe:</span></p>
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">The first step is to import all the packages that we will need:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">import</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> tensorflow as tf</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> import numpy as np</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> import matplotlib.pyplot as plt</span></pre></div>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">We need to normalize the feature data since the data ranges of all the features are varied. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">We define a normalize function for it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">Also, here we combine the bias to weights by adding another input always fixed to one value; to do this we define the function </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">append_bias_reshape()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">This technique is sometimes used to simplify programming:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">def normalize(X)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">    """ Normalizes the array X """</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">    mean = np.mean(X)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">    std = np.std(X)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">    X = (X - mean)/std</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">    return X</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">def append_bias_reshape(features,labels):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">    m = features.shape[0]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">    n = features.shape[1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">    x = np.reshape(np.c_[np.ones(m),features],[m,n + 1])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">    y = np.reshape(labels,[m,1])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">    return x, y</span></pre></div>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Now we load the Boston house price dataset using TensorFlow contrib datasets and separate it into </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">X_train</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1"> and </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Y_train</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">Observe that this time, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">X_train</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1"> contains all features. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">We can choose to normalize the data here, we also use append the bias and reshape the data for the network:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1"># Data</span><br/></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">boston = tf.contrib.learn.datasets.load_dataset(</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">'boston'</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">X_train, Y_train = boston.data, boston.target</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">X_train = normalize(X_train)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">X_train, Y_train = append_bias_reshape(X_train, Y_train)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">m = len(X_train)  </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">#Number of training examples</span><br/></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">n = 13 + 1   </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1"># Number of features + bias</span></em></pre></div>
<ol start="4">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Declare the TensorFlow placeholders for the training data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.2">Observe the change in the shape of the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">X</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1"> placeholder.</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1"># Placeholder for the Training Data</span><br/></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">X = tf.placeholder(tf.float32, name=</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">'X'</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">, shape=[m,n])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">Y = tf.placeholder(tf.float32, name=</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">'Y'</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">)</span></pre></div>
<ol start="5">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">We create TensorFlow variables for weight and bias. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.2">This time, weights are initialized with random numbers:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1"># Variables for coefficients</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">w = tf.Variable(tf.random_normal([n,1]))</span></pre></div>
<ol start="6">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">Define the linear regression model to be used for prediction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.2">Now we need matrix multiplication to do the task:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"># The Linear Regression Model</span><br/></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Y_hat = tf.matmul(X, w) </span></pre></div>
<ol start="7">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">For better differentiation, we define the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">loss</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1"> function:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1"># Loss function</span><br/></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">loss = tf.reduce_mean(tf.square(Y - Y_hat, name=</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">'loss'</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">))</span></pre></div>
<ol start="8">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Choose the right optimizer:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1"># Gradient Descent with learning rate of 0.01 to minimize loss</span><br/></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">optimizer = tf.train.GradientDescentOptimizer(learning_rate=0.01).minimize(loss)</span></pre></div>
<ol start="9">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">Define the initialization operator:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1"># Initializing Variables</span><br/></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">init_op = tf.global_variables_initializer()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">total = []</span></pre></div>
<ol start="10">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">Start the computational graph:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">with</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1"> tf.Session() </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">as</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1"> sess:</span><br/>    <em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1"># Initialize variables</span><br/>    </em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">sess.run(init_op)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">    writer = tf.summary.FileWriter(</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">'graphs'</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">, sess.graph)</span><br/>     <em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"># train the model for 100 epcohs</span><br/>    </em><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">for</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1"> i </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">in</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1"> range(100):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">       _, l = sess.run([optimizer, loss], feed_dict={X: X_train, Y: Y_train})</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">       total.append(l)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">       print(</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">'Epoch {0}: Loss {1}'</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">.format(i, l))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">     writer.close()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">     w_value, b_value = sess.run([w, b])</span></pre></div>
<ol start="11">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">Plot the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">loss</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1"> function:</span></li>
</ol>
<div>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">plt.plot(total)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">plt.show()</span></pre></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">Here too, we find that loss decreases as the training progresses:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1"><img height="295" width="396" src="assets/5d071a85-6b69-4ce4-b92d-549d40b40356.png"/></span></div>


            </article>
