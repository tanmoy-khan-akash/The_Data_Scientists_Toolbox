        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting ready</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">As mentioned in the previous recipe, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Q learning to balance CartPole</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">, for Atari games such as Pac-Man or Breakout, we need to preprocess the observation state space, which consists of 33,600 pixels with 3 RGB values. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">Each of these pixels can take any value between 0 and 255. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">Our </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">preprocess</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> function should be able to quantize the pixel possible values and, at the same time, reduce the observation state space.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">We make use of Scipy's </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">imresize</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> function to downsample the image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">The following functions </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">preprocess</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1"> the image before it is fed to the DQN:</span></p>
<pre><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">def </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">preprocess(img):</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">img_temp</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1"> = img[</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">31</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">:</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">195</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">]  </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1"># Choose the important area of the image</span><br/></span><span>    </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">img_temp</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1"> = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">img_temp</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">.mean(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">axis</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">2</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">)  </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1"># Convert to Grayscale#</span><br/></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">    # Downsample image using nearest neighbour interpolation</span><br/></span><span>    </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">img_temp</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"> = imresize(</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">img_temp</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">size</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">=(IM_SIZE, IM_SIZE), </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">interp</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">'nearest'</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">)</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">return </span></span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">img_temp</span><br/></span></pre>
<p><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">IM_SIZE</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1"> is a global parameter--in the code, we take its value to be 80. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.2">The function has comments describing each process. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.3">Here, you can see the observation space before and after the preprocessing:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"><img src="assets/1986c35e-a3c2-478b-946c-234b2d685e7b.png"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">Another important thing to note is that the present observation space does not give a complete picture of the game; for example, seeing the preceding figure, you cannot determine whether the paddle was moving toward left or right. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.2">Thus, to completely understand the present state of the game, we need to consider the sequences of actions and observations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.3">In the recipe, we consider four sequences of actions and observations to determine the current situation and train the agent. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.4">This is accomplished with the help of the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">state_update</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1"> function, which </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">appends the present observation state to the </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">previous</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1"> state, thus generating a sequence of states:</span></span></p>
<pre><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">def </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">update_state(state, obs):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">    obs_small = </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">preprocess</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">(obs)</span><br/>    <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">return </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">np.append(state[</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">:], np.expand_dims(obs_small, </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">0</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">), </span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">axis</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">=</span><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">0</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">)</span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">Lastly, to deal with the stability issues while training, we use the concept of </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">target_network</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">, which is a copy of the DQN but is not updated as often. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.2">We use the target network to generate the target value function for the DQN network, while the DQN is updated at each step/episode and the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">target_network</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1"> is updated (made the same as DQN) after a regular interval. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.2">As all updates take place within the TensorFlow session, we use the name scope to differentiate the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">target_network</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1"> and DQN network.</span></p>


            </article>

            
        </section>
