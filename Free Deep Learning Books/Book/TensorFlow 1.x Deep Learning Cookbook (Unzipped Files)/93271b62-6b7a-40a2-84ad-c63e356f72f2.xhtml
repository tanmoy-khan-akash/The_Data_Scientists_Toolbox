                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Xception</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Xception is an extension of Inception, introduced in </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Xception: Deep Learning with Depthwise Separable Convolutions</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">, François Chollet, 2016, </span><a href="https://arxiv.org/abs/1610.02357"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">https://arxiv.org/abs/1610.02357</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> . </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">Xception uses a new concept called depthwise separable convolution operation which allows it to outperform Inception-v3 on a large image classification dataset comprising 350 million images and 17,000 classes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">Since the Xception architecture has the same number of parameters as Inception-v3, the performance gains are not due to increased capacity but rather to a more efficient use of model parameters.</span></p>


            </article>
