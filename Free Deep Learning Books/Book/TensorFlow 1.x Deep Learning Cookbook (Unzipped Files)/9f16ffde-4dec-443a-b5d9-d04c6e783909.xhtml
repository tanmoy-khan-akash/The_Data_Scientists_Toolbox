                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Average pooling</span></h1>

            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Another choice is average-pooling, which simply aggregates a region into the average values of the activation observed in that region.</span></p>
<div class="packt_infobox"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">TensorFlow implements a large number of pooling layers and a complete list is available online. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">(</span><a href="https://www.tensorflow.org/api_guides/python/nn#Pooling"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">https://www.tensorflow.org/api_guides/python/nn#Pooling</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">)  In short, all the pooling operations are nothing more than a summary operation on a given region.</span></div>
