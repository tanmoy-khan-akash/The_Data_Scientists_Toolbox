<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">As the first step we need to have an Azure account: if you do not already have one, you can create one for free here: </span><a href="https://azure.microsoft.com/en-us/services/batch-ai/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">https://azure.microsoft.com/en-us/services/batch-ai/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">The Azure offers $200 credit for 30 days to new users. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">This recipe will follow the example provided by Microsoft Azure to run MNIST on two GPUs using TensorFlow distributed, the relevant codes are available on Github: </span><a href="https://github.com/Azure/batch-shipyard/tree/master/recipes/TensorFlow-Distributed"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">https://github.com/Azure/batch-shipyard/tree/master/recipes/TensorFlow-Distributed</span></a></p>
