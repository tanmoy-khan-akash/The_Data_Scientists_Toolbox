                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">There is more...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">As soon as we learn how to create a compact representation of audio via dilated convolutions, we can play with these learnings and have fun. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">You will find very cool demos on the internet:</span></p>
<ol>
<li class="MsoNormalCxSpMiddle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">For instance, you can see how the model learns the sound of different musical instruments: (</span><a href="https://magenta.tensorflow.org/nsynth"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">https://magenta.tensorflow.org/nsynth</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">) </span></li>
</ol>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"><img height="370" width="440" class=" image-border" src="assets/9090591a-d0d7-41d2-ae68-f06f4626d09e.png"/></span></div>
<ol start="2">
<li class="MsoNormalCxSpMiddle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Then, you can see how one model learned in one context can be </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">re-mixed</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> in another context. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">For instance, by changing the speaker identity, we can use WaveNet to say the same thing in different voices (</span><a href="https://deepmind.com/blog/wavenet-generative-model-raw-audio/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">https://deepmind.com/blog/wavenet-generative-model-raw-audio/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">) .</span></li>
<li class="MsoNormalCxSpMiddle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Another very interesting experiment is to learn models for musical instruments and then re-mix them in a such a way that we can create new musical instruments that have never been heard before. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">This is really cool, and it opens the path to a new range of possibilities that the ex-radio DJ sitting in me cannot resist being super excited about. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.3">For instance, in this example, we combine a sitar with an electric guitar, and this is a kind of cool new musical instrument. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.4">Not excited enough? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.5">So what about combining a bowed bass with a dog's bark? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.6">(</span><a href="https://aiexperiments.withgoogle.com/sound-maker/view/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">https://aiexperiments.withgoogle.com/sound-maker/view/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">)  Have fun!:</span></li>
</ol>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1"><img height="184" width="251" class=" image-border" src="assets/012fc57d-4750-42f9-974a-de4333bc4283.png"/></span></div>


            </article>
