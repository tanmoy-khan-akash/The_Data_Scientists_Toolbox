        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">There's More...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">CAE has been used by researchers for semantic segmentation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">An interesting read is a 2015 paper by Badrinayanan et al, Segnet: </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">a Deep Convolutional Encoder-Decoder Architecture for Image Segmentation</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> (</span><a href="https://arxiv.org/pdf/1511.00561.pdf"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">https://arxiv.org/pdf/1511.00561.pdf</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">The network uses the convolutional layers of VGG16 as its Encoder Network and contains a hierarchy of decoders, one corresponding to each encoder as its Decoder Network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">The decoders use the max-pooling indices received from the corresponding Encoder and perform nonlinear upsampling of the input feature map. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.4">The link of the paper is given in the See Also section of this recipe along with the GitHub link.</span></p>


            </article>

            
        </section>
