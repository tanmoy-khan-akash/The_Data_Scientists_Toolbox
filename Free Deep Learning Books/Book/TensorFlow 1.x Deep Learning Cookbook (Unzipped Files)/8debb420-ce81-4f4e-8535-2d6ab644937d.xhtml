                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">There is more...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">As of 2017, the problem of "computer vision" meant that the problem of finding patterns in an image can be considered as solved, and this problem has an impact on our lives. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">For instance:</span></p>
<ul>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> The paper </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Dermatologist-level classification of skin cancer with deep neural networks,</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> Andre Esteva, Brett Kuprel, Roberto A. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.2">Novoa, Justin Ko, Susan M. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.3">Swetter, Helen M. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.4">Blau &amp; Sebastian Thrun, 2017 </span><a href="https://www.nature.com/nature/journal/v542/n7639/full/nature21056.html"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">https://www.nature.com/nature/journal/v542/n7639/full/nature21056.html</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> trains a CNN using a dataset of 129,450 clinical images consisting of 2,032 different diseases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">They test the results against 21 board-certified dermatologists on biopsy-proven clinical images with two critical binary classification use cases: keratinocyte carcinomas versus benign seborrheic keratoses; and malignant melanomas versus benign nevi. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.3">The CNN achieves performance on par with all tested experts across both tasks, demonstrating an artificial intelligence capable of classifying skin cancer with a level of competence comparable to dermatologists.</span></li>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">The paper </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">High-Resolution Breast Cancer Screening with Multi-View Deep Convolutional Neural Networks</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">, Krzysztof J. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">Geras, Stacey Wolfson, S. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">Gene Kim, Linda Moy, Kyunghyun Cho, </span><a href="https://arxiv.org/abs/1703.07047"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">https://arxiv.org/abs/1703.07047</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1"> promises to improve the breast cancer screening process through its innovative architecture, which can handle the four standard views, or angles, without sacrificing a high resolution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">As opposed to the commonly used DCN architectures for natural images, which work with images of 224 x 224 pixels, the MV-DCN is also capable of using a resolution of 2600 x 2000 pixels.</span></li>
</ul>


            </article>
