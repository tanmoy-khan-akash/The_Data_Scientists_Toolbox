        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Siamese Network</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Siamese Networks are a special type of neural networks introduced by Yann LeCun and his colleagues in NIPS 1994 (</span><a href="http://www.worldscientific.com/doi/pdf/10.1142/S0218001493000339"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">http://www.worldscientific.com/doi/pdf/10.1142/S0218001493000339</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">The basic idea behind them is that like the 'Siamese Twins', the network consists of two different Neural Networks, both sharing the same architecture and weights.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Here, you can see the Siamese architecture:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"><img height="325" width="372" src="assets/15b0d10f-3abe-4254-87dd-e3cb5ad93494.png"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">During the training phase the pair-network is presented with a training pair </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">(X</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">, X</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">2</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">)</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">, where the two inputs are different yet similar, for example, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">X</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> = He is smart</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">, and </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">X</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">2</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1"> = He is a wise man</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">The two neural networks will produce two different results; the combined network can be thought of as a scalar </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">energy function</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1"> measuring the similarity between the training pair </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">(X</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">, X</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">2</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">)</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">, defined as:</span></p>
<div style="padding-left: 210px" class="mce-root CDPAlignLeft CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1"><img height="22" width="191" class="alignnone size-full wp-image-1082 image-border" src="assets/7ae40c9e-adb2-4c8b-bb4d-1dab0e5c19b0.png"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">The goal of the Siamese network is that the energy between the training-pair </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">(X</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">, X</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">2</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">)</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1"> should be less than energy between any other imposter pair </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">(X</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"><img height="20" width="14" class="alignnone size-full wp-image-1084 image-border" src="assets/614c63fc-d9d0-4c05-b5b9-f5f579dca4eb.png"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">)</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">This is achieved by using a </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">contrastive loss function</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1"> for training.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">During the training phase the network is given as input a training pair, and a label associated with it, telling it is a genuine pair or an impostor pair: </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">(X</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">, X</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">2</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">, Y)</span><sup><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">i</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1"> </span></sup></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">is the </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">i</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">th</span></sup></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1"> training sample. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.2">The contrastive Loss function is calculated:</span></p>
<p style="padding-left: 210px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">L </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1"><img height="20" width="187" class="alignnone size-full wp-image-1083 image-border" src="assets/32f13c94-c144-4116-bd64-e97805948eb6.png"/></span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">where, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1"><img height="20" width="364" class="alignnone size-full wp-image-1085 image-border" src="assets/633e200a-ea56-49bd-9669-15c9effa8a56.png"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">with </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">L</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">G</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1"> being the partial loss for a genuine pair, and </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">L</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">I</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1"> the partial loss for an impostor pair and </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">P</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1"> the number of training samples. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.2">The label Y has a value 0 when the pairs are genuine and has value 1 when the presented pairs are imposter pairs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.3">The partial loss </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">L</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">G</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1"> and </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">L</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">I </span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">should be designed in such a manner that the minimization of contrastive loss </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">L(W)</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1"> will decrease the energy of genuine pairs and increase the energy of imposter pairs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.2">This is achieved by choosing the partial loss </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">L</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">G</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1"> as monotonically increasing and partial loss L</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">I</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1"> as monotonically decreasing f. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.2">One possible choice is using cosine similarity for calculating the partial loss.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">The weights are adjusted using the backpropagation algorithm.</span></p>


            </article>
