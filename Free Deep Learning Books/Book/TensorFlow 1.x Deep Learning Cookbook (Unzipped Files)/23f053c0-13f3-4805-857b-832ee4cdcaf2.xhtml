        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Introduction</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Neural networks, also conventionally known as </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">connectionist models</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">, are inspired by the human brain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">Like the human brain, neural networks are a collection of a large number of artificial neurons connected to each other via synaptic strengths called </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">weights</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">Just as we learn through examples provided to us by our elders, artificial neural networks learn by examples presented to them as training datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">With a sufficient number of training datasets, artificial neural networks can generalize the information and can then be employed for unseen data as well. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.4">Awesome, they sound like magic!</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Neural networks are not new; the first neural network model, McCulloch Pitts (MCP) (</span><a href="http://vordenker.de/ggphilosophy/mcculloch_a-logical-calculus.pdf"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">http://vordenker.de/ggphilosophy/mcculloch_a-logical-calculus.pdf</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">) Model, was proposed as early as 1943. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">(Yes, even before the first computer was built!) The model could perform logical operations like AND/OR/NOT. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">The MCP model had fixed weights and biases; there was no learning possible. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.4">This problem was resolved a few years later by Frank Rosenblatt in 1958 (</span><a href="https://blogs.umass.edu/brain-wars/files/2016/03/rosenblatt-1957.pdf"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">https://blogs.umass.edu/brain-wars/files/2016/03/rosenblatt-1957.pdf</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">He proposed the first learning neural network called </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Perceptron</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">From that time, it was known that adding multiple layers of neurons and building a deep and dense network will help neural networks solve complex tasks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">Just as a mother is proud of her child's achievements, scientists and engineers made tall claims about what they can achieve using </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Neural Networks</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">NN</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">) (</span><a href="https://www.youtube.com/watch?v=jPHUlQiwD9Y"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">https://www.youtube.com/watch?v=jPHUlQiwD9Y</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">The claims were not false, but it was simply not possible to accomplish them at that time because of the hardware computation limitation and complex network structure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.3">This resulted in what is known as the </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">AI Winters</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1"> in the 1970s and 1980s; during these chills, the progress in this field slowed down due to very little or almost no funding to AI-based projects.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">With the advent of DNNs and GPUs, the situation changed; today we have networks that can perform better with less tuning parameters, techniques like dropout and transfer learning the further reduce the training time, and lastly, the hardware companies that are coming up with specialized hardware chips to perform fast NN-based computations.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">The artificial neuron is at the heart of all neural networks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.2">It consists of two major components--an adder that (weighted) sums all the inputs to this neuron, and a processing unit that takes the weighted sum and generates an output based on a predefined function, called </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">activation function</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.2">Each artificial neuron has its own set of weights and thresholds (biases); it learns these weights and thresholds through different learning algorithms:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1"><img height="190" width="399" src="assets/b0e25ccb-1d0e-41a6-ab13-0a509b2239ba.png"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Source: </span><a href="https://commons.wikimedia.org/wiki/File:Rosenblattperceptron.png"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">https://commons.wikimedia.org/wiki/File:Rosenblattperceptron.png</span></a></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">When only one layer of such neurons is present, it is called Perceptron. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">The input layer is called the </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">zeroth layer</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"> as it simply buffers the input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.2">The only layer of neurons present form the output layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.3">Each neuron of the output layer has its own weights and thresholds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.4">When many such layers are present, the network is termed </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">multi-layered perceptron</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">MLP</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.2">An MLP has one or more hidden layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.3">These hidden layers have a different number of hidden neurons. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.4">The neurons of each hidden layer have the same activation function:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1"><img height="263" width="451" src="assets/aa3bbbc4-cb14-4d86-bae9-70156e72a876.png"/></span></div>
<p><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">The preceding figure shows an MLP with four inputs, five hidden layers, each with 4, 5, 6, 4, and 3 neurons respectively, and three neurons in the output layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.2">In MLP, all neurons of the lower layer are connected to all the neurons of the layer just above it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.3">Therefore, MLPs are also called </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">fully connected layers</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.2">The flow of information in MLPs is always from input to output; there are no feedback or jumps present, therefore these networks are also known as </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">feedforward networks</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">.</span></span></p>
<p><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">Perceptrons are trained using </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">gradient descent algorithms</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">In </span><a href="63cafe73-86d3-4ee1-929b-e45677956d9a.xhtml" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">Chapter 2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">Regression</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">, you learned about gradient descent; here we look at it a little deeper. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">Perceptrons learn through supervised learning algorithms, that is, the network is provided by the desired output for all the inputs present in the training dataset. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.3">At the output, we define an error function or objective function </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">J(W)</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">, such that when the network has completely learned all the training data, the objective function will be minimum.</span></span></p>
<p><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">The weights of the output layer and the hidden layers are updated such that the gradient of the objective function decreases:</span></span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1"><img height="211" width="498" src="assets/07dc4ed4-a2e2-4b9f-aec8-8a12b52508af.png"/></span></div>
<p><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">To understand it better, visualize a landscape full of hills, plateaus, and pits. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.2">The goal is to come to the ground (global minima of the objective function). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.3">If you are standing on top and you have to come down, it is an obvious choice that you will move down the hill, that is, toward the negative slope (or negative gradient). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.4">In the same manner, the weights in the Perceptron are changed proportionally to the negative of the gradient of the objective function.</span></span></p>
<p><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">The higher the value of the gradient, the larger will be the change in weight values and vice versa. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">Now, all this is quite fine, but we can land up with problems when we reach plateaus as the gradient is zero and hence there is no change in weights. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.3">We can also land in problems when we enter a small pit (local minima) because when we try to move to either side, the gradient will increase, forcing the network to stay in the pit.</span></span></p>
<p><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">As discussed in </span><a href="63cafe73-86d3-4ee1-929b-e45677956d9a.xhtml" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">Chapter 2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">Regression</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">, there are various variants of gradient descent aimed at increasing convergence and that avoid the problem of getting stuck at local minima or plateaus (adding momentum, variable learning rate).</span></span></p>
<p><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">TensorFlow calculates these gradients automatically with the help of different optimizers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.2">The important thing to note, however, is that as TensorFlow will calculate gradients, which will involve derivatives of the activation functions as well, it is important that the activation function you choose is differentiable and preferably has a non-zero gradient throughout the training scenario.</span></span></p>
<p><span class="FigurePACKTChar"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">One of the major ways gradient descent for perceptrons differ from </span><a href="63cafe73-86d3-4ee1-929b-e45677956d9a.xhtml" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">Chapter 2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">Regression</span></em><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">,</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"> applications is that the objective function is defined for the output layer, but is used to find the weight change of the neurons of the hidden layers as well. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.2">This is done using the </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">backpropagation</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">BPN</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">) algorithm, where the error at the output is propagated backwards to the hidden layers and used to determine the weight change. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.2">You will learn more about it soon.</span></span></p>


            </article>
