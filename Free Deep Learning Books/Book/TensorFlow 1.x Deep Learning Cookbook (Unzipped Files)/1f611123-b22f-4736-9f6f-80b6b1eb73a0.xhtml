    <body>
        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Any deep learning network consists of four important components: Dataset, defining the model (network structure), Training/Learning, and Prediction/Evaluation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">We can do all these in TensorFlow; let's see how:</span></p>
<ul>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Dataset</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">: DNNs depend on large amounts of data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">The data can be collected or generated or one can also use standard datasets available. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">TensorFlow supports three main methods to read the data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.4">There are different datasets available; some of the datasets we will be using to train the models built in this book are as follows:</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">MNIST</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">: It is the largest database of handwritten digits (0 - 9). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">It consists of a training set of 60,000 examples and a test set of 10,000 examples. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">The dataset is maintained at Yann LeCun's home page (</span><a href="http://yann.lecun.com/exdb/mnist/" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">http://yann.lecun.com/exdb/mnist/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">The dataset is included in the TensorFlow library in </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">tensorflow.examples.tutorials.mnist</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">.</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">CIFAR10</span></strong><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">: This dataset contains 60,000 32 x 32 color images in 10 classes, with 6,000 images per class. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">The training set contains 50,000 images and test dataset--10,000 images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.3">The ten classes of the dataset are: airplane, automobile, bird, cat, deer, dog, frog, horse, ship, and truck. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.4">The data is maintained by the Computer Science Department, University of Toronto (</span></span><a href="https://www.cs.toronto.edu/~kriz/cifar.html"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">https://www.cs.toronto.edu/~kriz/cifar.html</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">).</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">WORDNET</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">: This is a lexical database of English. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">It contains nouns, verbs, adverbs, and adjectives, grouped into sets of cognitive synonyms (Synsets), that is, words that represent the same concept, for example, shut and close or car and automobile are grouped into unordered sets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">It contains 155,287 words organised in 117,659 synsets for a total of 206,941 word-sense pairs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.4">The data is maintained by Princeton University (</span><a href="https://wordnet.princeton.edu/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">https://wordnet.princeton.edu/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">).</span></li>
</ul>
<ul>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">ImageNET</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">: This is an image dataset organized according to the WORDNET hierarchy (only nouns at present). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">Each meaningful concept (synset) is described by multiple words or word phrases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.3">Each synset is represented on average by 1,000 images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.4">At present, it has 21,841 synsets and a total of 14,197,122 images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.5">Since 2010, an annual </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">ImageNet Large Scale Visual Recognition Challenge</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">ILSVRC</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">) has been organized to classify images in one of the 1,000 object categories. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.2">The work is sponsored by Princeton University, Stanford University, A9, and Google (</span><a href="http://www.image-net.org/" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">http://www.image-net.org/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">).</span></li>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">YouTube-8M</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">: This is a large-scale labelled video dataset consisting of millions of YouTube videos. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">It has about 7 million YouTube video URLs classified into 4,716 classes, organized into 24 top-level categories. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.3">It also provides preprocessing support and frame-level features. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.4">The dataset is maintained by Google Research (</span><a href="https://research.google.com/youtube8m/" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">https://research.google.com/youtube8m/</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">).</span></li>
</ul>
<p><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">Reading the data:</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"> The data can be read in three ways in TensorFlow--feeding through </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">feed_dict</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">, reading from files, and using preloaded data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">We will be using the components described in this recipe throughout the book for reading, and feeding the data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.3">In the next steps, you will learn each one of them.</span><strong><br/></strong></p>
<ol>
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Feeding:</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"> In this case, data is provided while running each step, using the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">feed_dict</span></kbd> <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">argument</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1"> in the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">run()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"> or </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">eval()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1"> function call. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">This is done with the help of placeholders and this method allows us to pass Numpy arrays of data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.3">Consider the following part of code using TensorFlow:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">... </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">y = tf.placeholder(tf.float32) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">x = tf.placeholder(tf.float32). </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">... </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">with tf.Session as sess: </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">   X_Array = some Numpy Array </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">   Y_Array = other Numpy Array </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">   loss= ... </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">sess.run(loss,feed_dict = {x: X_Array, y: Y_Array}). </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">... </span></pre>
<p style="padding-left: 90px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">Here, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">x</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1"> and </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">y</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1"> are the placeholders; using them, we pass on the array containing </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">X</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1"> values and the array containing </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">Y</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1"> values with the help of </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">feed_dict</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">.</span></p>
<ol start="2">
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">Reading from files</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">: This method is used when the dataset is very large to ensure that not all data occupies the memory at once (imagine the 60 GB YouTube-8m dataset). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.2">The process of reading from files can be done in the following steps:</span></li>
</ol>
<ul>
<li style="list-style-type: none">
<ul style="padding-left: 1px">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">A list of filenames is created using either string Tensor </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">["file0", "file1"]</span></kbd> <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">or</span></span> <kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">[("file%d"i) for in in range(2)]</span></kbd> <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">or using the</span></span> <kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">files = tf.train.match_filenames_once('*.JPG')</span></kbd> <span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">function.</span></span></li>
</ul>
</li>
</ul>
<ul>
<li style="list-style-type: none">
<ul style="padding-left: 1px">
<li>
<p><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">Filename queue</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">: A queue is created to keep the filenames until the reader needs them using the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">tf.train.string_input_producer</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1"> function:</span></p>
</li>
</ul>
</li>
</ul>
<pre style="padding-left: 90px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">filename_queue = tf.train.string_input_producer(files) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1"># where files is the list of filenames created above </span></pre>
<p style="padding-left: 120px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">This function also provides an option to shuffle and set a maximum number of epochs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.2">The whole list of filenames is added to the queue for each epoch. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.3">If the shuffling option is selected (</span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">shuffle=True</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">), then filenames are shuffled in each epoch.</span></p>
<ul>
<li style="list-style-type: none">
<ul style="padding-left: 1px">
<li>
<p><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">Reader</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1"> is defined and used to read from files from the filename queue. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.2">The reader is selected based on the input file format. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.3">The read method a key identifying the file and record (useful while debugging) and a scalar string value. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.4">For example, in the case of </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">.csv</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1"> file formats:</span></p>
</li>
</ul>
</li>
</ul>
<pre style="padding-left: 90px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">reader = tf.TextLineReader() </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">key, value = reader.read(filename_queue)</span></pre>
<ul style="padding-left: 1px">
<li style="list-style-type: none">
<ul>
<li>
<p><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">Decoder</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">: One or more decoder and conversion ops are then used to decode the </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">value</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1"> string into Tensors that make up the training example:</span></p>
</li>
</ul>
</li>
</ul>
<pre style="padding-left: 90px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">record_defaults = [[1], [1], [1]]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">col1, col2, col3 = tf.decode_csv(value, record_defaults=record_defaults) </span><br/> </pre>
<ol start="3">
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">Preloaded data</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">: This is used when the dataset is small and can be loaded fully in the memory. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.2">For this, we can store data either in a constant or variable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.3">While using a variable, we need to set the trainable flag to False so that the data does not change while training. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.4">As TensorFlow constants:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1"># Preloaded data as constant</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">training_data = ... </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">training_labels = ... </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">with tf.Session as sess: </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">   x_data = tf.Constant(training_data) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">   y_data = tf.Constant(training_labels) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">...</span></pre>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1"># Preloaded data as Variables</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">training_data = ... </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">training_labels = ... </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">with tf.Session as sess: </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">   data_x = tf.placeholder(dtype=training_data.dtype, shape=training_data.shape) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">   data_y = tf.placeholder(dtype=training_label.dtype, shape=training_label.shape) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">   x_data = tf.Variable(data_x, trainable=False, collections[]) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">   y_data = tf.Variable(data_y, trainable=False, collections[]) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">... </span></pre>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">Conventionally, the data is divided into three parts--training data, validation data, and test data.</span></p>
<ol start="4">
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">Defining the model</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">: A computational graph is built describing the network structure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.2">It involves specifying the hyperparameters, variables, and placeholders sequence in which information flows from one set of neurons to another and a loss/error function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.3">You will learn more about the computational graphs in a later section of this chapter.</span></li>
</ol>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1"> </span></p>
<ol start="5">
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">Training/Learning</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">: The learning in DNNs is normally based on the gradient descent algorithm, (it will be dealt in detail in </span><a href="63cafe73-86d3-4ee1-929b-e45677956d9a.xhtml" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">Chapter 2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">, </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">Regression</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">) where the aim is to find the training variables (weights/biases) such that the error or loss (as defined by the user in step 2) is minimized. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.2">This is achieved by initializing the variables and using </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">run()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">with tf.Session as sess: </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">   .... </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">   sess.run(...) </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">   ... </span></pre>
<ol start="6">
<li><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">Evaluating the model</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">: Once the network is trained, we evaluate the network using </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">predict()</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1"> on validation data and test data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.2">The evaluations give us an estimate of how well our model fits the dataset. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.3">We can thus avoid the common mistakes of overfitting or underfitting. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.4">Once we are satisfied with our model, we can deploy it in production.</span></li>
</ol>
