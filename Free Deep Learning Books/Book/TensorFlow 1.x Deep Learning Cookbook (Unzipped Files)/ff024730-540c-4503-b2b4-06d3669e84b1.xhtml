        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Convolutional autoencoders</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Researchers have found that </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Convolutional Neural Networks</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">CNN</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">) work best with images because they can extract the spatial information hidden in the image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">It is thus natural to assume that if encoder and decoder network consists of CNN, it will work better than the rest of the autoencoders, and so we have </span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Convolutional Autoencoders</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"> (</span><strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">CAE</span></strong><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">In Chapter 4, </span><a href="885c3359-3cc4-4b32-a186-f6e98b3ac4a9.xhtml"><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Convolutional Neural Networks</span></em></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">, the process of convolution and max-pooling was explained, which we will use as a base to understand how convolutional autoencoders work.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">A CAE is one where both the encoder and decoder are CNN networks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">The convolutional network of the encoder learns to encode the input as a set of signals and then the decoder CNN tries to reconstruct the input from them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.3">They work as general purpose feature extractors and learn the optimal filters needed to capture the features from the input.</span></p>


            </article>
