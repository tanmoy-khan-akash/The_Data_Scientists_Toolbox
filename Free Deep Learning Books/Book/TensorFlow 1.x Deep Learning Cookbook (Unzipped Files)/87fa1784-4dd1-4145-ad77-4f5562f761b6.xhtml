                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Meta-learning blocks</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">In </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Learning Transferable Architectures for Scalable Image Recognition</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">, Barret Zoph, Vijay Vasudevan, Jonathon Shlens, Quoc V. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">Le, 2017 </span><a href="https://arxiv.org/abs/1707.07012" target="_blank"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">https://arxiv.org/abs/1707.07012</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">propose to learn an architectural building block on a small dataset that can be transferred to a large dataset. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">The authors propose to search for the best convolutional layer (or cell) on the CIFAR-10 dataset and then apply this learned cell to the ImageNet dataset by stacking together more copies of this cell, each with their own parameters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.4">Precisely, all convolutional networks are made of convolutional layers (or cells) with identical structures but different weights. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.5">Searching for the best convolutional architectures is therefore reduced to searching for the best cell structures, which is faster more likely to generalize to other problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.6">Although the cell is not learned directly on ImageNet, an architecture constructed from the best learned cell achieves, among the published work, state-of-the-art accuracy of 82.7 percent top-1 and 96.2 percent top-5 on ImageNet. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.7">The model is 1.2 percent better in top-1 accuracy than the best human-invented architectures while having 9 billion fewer FLOPS—a reduction of 28% from the previous state of the art model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.8">What is also important to notice is that the model learned with RNN+RL (Recurrent Neural Networks + Reinforcement Learning) is beating the baseline represented by Random Search (RL) as shown in the figure taken from the paper. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.9">In the mean performance of the top-5 and top-25 models identified in RL versus RS, RL is always winning:</span></p>

            </article>
