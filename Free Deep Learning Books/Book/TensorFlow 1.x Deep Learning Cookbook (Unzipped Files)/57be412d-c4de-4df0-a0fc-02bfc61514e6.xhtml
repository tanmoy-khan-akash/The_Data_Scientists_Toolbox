        <section>

                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">How to do it...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Here is how is how we proceed with the recipe:</span></p>
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Clone the code from github under an Apache Licence:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">git clone https://github.com/naturomics/CapsNet-Tensorflow.git</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"> $ cd CapsNet-Tensorflow</span></pre>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Download MNIST and create the appropriate structure:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">mkdir -p data/mnist</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">wget -c -P data/mnist \\</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">http://yann.lecun.com/exdb/mnist/{train-images-idx3-ubyte.gz,train-labels-idx1-ubyte.gz,t10k-images-idx3-ubyte.gz,t10k-labels-idx1-ubyte.gz}</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">gunzip data/mnist/*.gz</span></pre>
<ol start="3">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Start the training process:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">python main.py</span></pre>
<ol start="4">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Let's see the code used for defining a capsule. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">Each capsule takes a 4D tensor as input and returns a 4D tensor. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.3">It is possible to define a capsule as either a fully connected network (the DigiCaps) or a convolutional one (the Primary Capsules). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.4">Note that Primary is a collection of ConvNets and after them the nonlinear squashing function is applied. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.5">Primary capsules will communicate with DigiCaps via dynamic routing:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1"># capsLayer.py</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">#</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">import numpy as np</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">import tensorflow as tf</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">from config import cfg</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">epsilon = 1e-9</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">class CapsLayer(object):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">''' Capsule layer.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Args:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">input: A 4-D tensor.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">num_outputs: the number of capsule in this layer.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">vec_len: integer, the length of the output vector of a capsule.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">layer_type: string, one of 'FC' or "CONV", the type of this layer,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">fully connected or convolution, for the future expansion capability</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">with_routing: boolean, this capsule is routing with the</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">lower-level layer capsule.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Returns:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">A 4-D tensor.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">'''</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">def __init__(self, num_outputs, vec_len, with_routing=True, layer_type='FC'):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">  self.num_outputs = num_outputs</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">  self.vec_len = vec_len</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">  self.with_routing = with_routing</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">  self.layer_type = layer_type</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">def __call__(self, input, kernel_size=None, stride=None):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">'''</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">The parameters 'kernel_size' and 'stride' will be used while 'layer_type' equal 'CONV'</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">'''</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">  if self.layer_type == 'CONV':</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">    self.kernel_size = kernel_size</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">    self.stride = stride</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">    if not self.with_routing:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">    # the PrimaryCaps layer, a convolutional layer</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">    # input: [batch_size, 20, 20, 256]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">      assert input.get_shape() ==  [cfg.batch_size, 20, 20, 256]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">      capsules = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">      for i in range(self.vec_len):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">        # each capsule i: [batch_size, 6, 6, 32]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">        with tf.variable_scope('ConvUnit_' + str(i)):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">          caps_i = tf.contrib.layers.conv2d(input,      self.num_outputs,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">self.kernel_size, self.stride,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">padding="VALID")</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">          caps_i = tf.reshape(caps_i, shape=(cfg.batch_size, -1, 1, 1))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">          capsules.append(caps_i)</span><br/>      <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">      assert capsules[0].get_shape() == [cfg.batch_size, 1152, 1, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1"># [batch_size, 1152, 8, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">      capsules = tf.concat(capsules, axis=2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">      capsules = squash(capsules)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">      assert capsules.get_shape() == [cfg.batch_size, 1152, 8, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">      return(capsules)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">  if self.layer_type == 'FC':</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">    if self.with_routing:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">      # the DigitCaps layer, a fully connected layer</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">      # Reshape the input into [batch_size, 1152, 1, 8, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">      self.input = tf.reshape(input, shape=(cfg.batch_size, -1, 1, input.shape[-2].value, 1))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">    with tf.variable_scope('routing'):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">      # b_IJ: [1, num_caps_l, num_caps_l_plus_1, 1, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">      b_IJ = tf.constant(np.zeros([1, input.shape[1].value,    self.num_outputs, 1, 1], dtype=np.float32))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">      capsules = routing(self.input, b_IJ)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">      capsules = tf.squeeze(capsules, axis=1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">    return(capsules)</span></pre>
<ol start="5">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">The routing algorithm is described in the paper </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">Dynamic Routing Between Capsules</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1"> and the relevant section of the paper has been explained, together with the definition of Equation 2 and Equation 3. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.2">The goal of the routing algorithm is to pass information from lower layer capsules into higher-level ones and </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">understand</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1"> where there is agreement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.2">The agreement is computed by simply using a scalar product between the current output </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">v</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">j</span></sub></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1"> of each capsule </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">j</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1"> in the layer above, and the prediction  </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1"><img height="28" width="32" class="fm-editor-equation" src="assets/110afe2a-0de8-4ce1-a0ca-4e9ff6f7d5d7.png"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">made by the capsule </span><em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">i</span></em><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">:</span></li>
</ol>
<table>
<tbody>
<tr>
<td>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1"><img class=" image-border" src="assets/3e855c22-8c24-4f2c-a2c2-2ec2abe382ae.png"/></span></div>
</td>
</tr>
<tr>
<td>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1"><img class=" image-border" src="assets/ba247207-8cba-4016-9519-5623712ac87e.png"/></span></div>
</td>
</tr>
<tr>
<td>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1"><img class=" image-border" src="assets/ae5aab27-b9ef-49d7-aa4f-6de8cbd86bfa.png"/></span></div>
</td>
</tr>
</tbody>
</table>
<div class="CDPAlignCenter CDPAlign"/>
<p style="padding-left: 30px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">The following method implements the steps described in Procedure 1 in the preceding images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.2">Note that the input is a 4D tensor from 1,152 capsules in the layer l. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.3">The output is a Tensor of shape </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">[batch_size, 1, length(v_j)=16, 1]</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1"> representing the vector output `v_j` of capsule j in the layer l+1:</span></p>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">def routing(input, b_IJ):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">''' The routing algorithm.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">Args:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">input: A Tensor with [batch_size, num_caps_l=1152, 1, length(u_i)=8, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">shape, num_caps_l meaning the number of capsule in the layer l.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">Returns:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">A Tensor of shape [batch_size, num_caps_l_plus_1, length(v_j)=16, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">representing the vector output `v_j` in the layer l+1</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">Notes:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">u_i represents the vector output of capsule i in the layer l, and</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">v_j the vector output of capsule j in the layer l+1.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">'''</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">  # W: [num_caps_j, num_caps_i, len_u_i, len_v_j]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">  W = tf.get_variable('Weight', shape=(1, 1152, 10, 8, 16), dtype=tf.float32,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">  initializer=tf.random_normal_initializer(stddev=cfg.stddev))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">  # Eq.2, calc u_hat</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">  # do tiling for input and W before matmul</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">  # input =&gt; [batch_size, 1152, 10, 8, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">  # W =&gt; [batch_size, 1152, 10, 8, 16]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">  input = tf.tile(input, [1, 1, 10, 1, 1])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">  W = tf.tile(W, [cfg.batch_size, 1, 1, 1, 1])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">  assert input.get_shape() == [cfg.batch_size, 1152, 10, 8, 1]</span><br/>  <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">  # in last 2 dims:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">  # [8, 16].T x [8, 1] =&gt; [16, 1] =&gt; [batch_size, 1152, 10, 16, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">  u_hat = tf.matmul(W, input, transpose_a=True)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">  assert u_hat.get_shape() == [cfg.batch_size, 1152, 10, 16, 1]</span><br/>  <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">  # line 3,for r iterations do</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">  for r_iter in range(cfg.iter_routing):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">    with tf.variable_scope('iter_' + str(r_iter)):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">      # line 4:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">      # =&gt; [1, 1152, 10, 1, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">      c_IJ = tf.nn.softmax(b_IJ, dim=2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">      c_IJ = tf.tile(c_IJ, [cfg.batch_size, 1, 1, 1, 1])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">      assert c_IJ.get_shape() == [cfg.batch_size, 1152, 10, 1, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">      # line 5:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">      # weighting u_hat with c_IJ, element-wise in the last two dims</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">      # =&gt; [batch_size, 1152, 10, 16, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">      s_J = tf.multiply(c_IJ, u_hat)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">      # then sum in the second dim, resulting in [batch_size, 1, 10, 16, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">      s_J = tf.reduce_sum(s_J, axis=1, keep_dims=True)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">      assert s_J.get_shape() == [cfg.batch_size, 1, 10, 16, 16</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">      # line 6:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">      # squash using Eq.1,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">      v_J = squash(s_J)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">      assert v_J.get_shape() == [cfg.batch_size, 1, 10, 16, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">      # line 7:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">      # reshape &amp; tile v_j from [batch_size ,1, 10, 16, 1] to [batch_size, 10, 1152, 16, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">      # then matmul in the last tow dim: [16, 1].T x [16, 1] =&gt; [1, 1], reduce mean in the</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">      # batch_size dim, resulting in [1, 1152, 10, 1, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">      v_J_tiled = tf.tile(v_J, [1, 1152, 1, 1, 1])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">      u_produce_v = tf.matmul(u_hat, v_J_tiled, transpose_a=True)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">      assert u_produce_v.get_shape() == [cfg.batch_size, 1152, 10, 1, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">      b_IJ += tf.reduce_sum(u_produce_v, axis=0, keep_dims=True)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">  return(v_J)</span></pre>
<ol start="6">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">Now let us review the nonlinear activation squashing function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.2">The input is a 4D vector with the shape </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">[batch_size, num_caps, vec_len, 1]</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1"> and the output is a 4-D tensor with the same shape as a vector but squashed in the third and fourth dimensions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.2">Given a vector input, the goal is to compute the value represented in the Equation 1 which is shown as follows:</span></li>
</ol>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1"><img class=" image-border" src="assets/5f34ce65-7b14-49ba-8306-4363f511eeba.png"/></span></div>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">def squash(vector):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">'''Squashing function corresponding to Eq. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.2">1</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">Args:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">vector: A 5-D tensor with shape [batch_size, 1, num_caps, vec_len, 1],</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">Returns:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">A 5-D tensor with the same shape as vector but squashed in 4rd and 5th dimensions.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">'''</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">  vec_squared_norm = tf.reduce_sum(tf.square(vector), -2, keep_dims=True)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">  scalar_factor = vec_squared_norm / (1 + vec_squared_norm) / tf.sqrt(vec_squared_norm + epsilon)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">  vec_squashed = scalar_factor * vector # element-wise</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">return(vec_squashed)</span></pre>
<ol start="7">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">During the previous steps, we have defined what a capsule is, the dynamic routing algorithm among capsules, and the nonlinear squashing function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.2">Now we can define the proper CapsNet. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.3">A loss function is built for training and the Adam Optimizer is chosen. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.4">The method </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">build_arch(...)</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1"> defines the CapsNet represented in the following figure:</span></li>
</ol>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1"><img class=" image-border" src="assets/23a91cd5-8c50-4e92-82bd-7af58ec34e02.png"/></span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">Note that the paper describes a technique of reconstruction as a regularization method. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.2">From the paper:</span></p>
<div class="packt_quote"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">We use an additional reconstruction loss to encourage the digit capsules to encode the instantiation parameters of the input digit. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.2">During training, we mask out all but the activity vector of the correct digit capsule.</span></div>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">Then we use this activity vector to reconstruct.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">The output of the digit capsule is fed into a decoder consisting of three fully connected layers that model the pixel intensities as described in Fig. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.2">2. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.3">We minimize the sum of squared differences between the output of the logistic units and the pixel intensities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.4">We scale down this reconstruction loss by 0.0005 so that it does not dominate the margin loss during training. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.5">The method </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">build_arch(..)</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1"> implemented as follows is also used for creating the Decoder:</span></p>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1"><img class=" image-border" src="assets/10c4db98-f00c-4813-8452-4fcc86fc5d61.png"/></span></div>
<div class="packt_figure"/>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">#capsNet.py</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">#</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">import tensorflow as tf</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">from config import cfg</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">from utils import get_batch_data</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">from capsLayer import CapsLayer</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">epsilon = 1e-9</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">class CapsNet(object):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">  def __init__(self, is_training=True):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">    self.graph = tf.Graph()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">    with self.graph.as_default():</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">      if is_training:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">        self.X, self.labels = get_batch_data()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">        self.Y = tf.one_hot(self.labels, depth=10, axis=1, dtype=tf.float32)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">        self.build_arch()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">        self.loss()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">        self._summary()</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">        # t_vars = tf.trainable_variables()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">        self.global_step = tf.Variable(0, name='global_step', trainable=False)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">        self.optimizer = tf.train.AdamOptimizer()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">        self.train_op =    self.optimizer.minimize(self.total_loss, global_step=self.global_step) # var_list=t_vars)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">      elif cfg.mask_with_y:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">        self.X = tf.placeholder(tf.float32,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">          shape=(cfg.batch_size, 28, 28, 1))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">        self.Y = tf.placeholder(tf.float32, shape=(cfg.batch_size, 10, 1))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">        self.build_arch()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">      else:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">        self.X = tf.placeholder(tf.float32,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">        shape=(cfg.batch_size, 28, 28, 1))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">        self.build_arch()</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">      tf.logging.info('Setting up the main structure')</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">def build_arch(self):</span><br/>  <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">  with tf.variable_scope('Conv1_layer'):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">    # Conv1, [batch_size, 20, 20, 256]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">    conv1 = tf.contrib.layers.conv2d(self.X, num_outputs=256,</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">       kernel_size=9, stride=1, </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">       padding='VALID')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">    assert conv1.get_shape() == [cfg.batch_size, 20, 20, 256]# Primary Capsules layer, return [batch_size, 1152, 8, 1]</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">  with tf.variable_scope('PrimaryCaps_layer'):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">    primaryCaps = CapsLayer(num_outputs=32, vec_len=8,   with_routing=False, layer_type='CONV')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">    caps1 = primaryCaps(conv1, kernel_size=9, stride=2)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">    assert caps1.get_shape() == [cfg.batch_size, 1152, 8, 1]</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">  # DigitCaps layer, return [batch_size, 10, 16, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">  with tf.variable_scope('DigitCaps_layer'):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">    digitCaps = CapsLayer(num_outputs=10, vec_len=16,   with_routing=True, layer_type='FC')</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">    self.caps2 = digitCaps(caps1)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">  # Decoder structure in Fig. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.2">2</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">  # 1. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.2">Do masking, how:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">  with tf.variable_scope('Masking'):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1">    # a). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.2">calc ||v_c||, then do softmax(||v_c||)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">    # [batch_size, 10, 16, 1] =&gt; [batch_size, 10, 1, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">    self.v_length = tf.sqrt(tf.reduce_sum(tf.square(self.caps2),</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">axis=2, keep_dims=True) + epsilon)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">    self.softmax_v = tf.nn.softmax(self.v_length, dim=1)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1">    assert self.softmax_v.get_shape() == [cfg.batch_size, 10, 1, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">    # b). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.2">pick out the index of max softmax val of the 10 caps</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">    # [batch_size, 10, 1, 1] =&gt; [batch_size] (index)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">    self.argmax_idx = tf.to_int32(tf.argmax(self.softmax_v, axis=1))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">    assert self.argmax_idx.get_shape() == [cfg.batch_size, 1, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">    self.argmax_idx = tf.reshape(self.argmax_idx, shape=(cfg.batch_size, )) .  </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1">    # Method 1.</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">   if not cfg.mask_with_y:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1">     # c). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.2">indexing</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">     # It's not easy to understand the indexing process with  argmax_idx</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">     # as we are 3-dim animal</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">     masked_v = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">     for batch_size in range(cfg.batch_size):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">       v = self.caps2[batch_size][self.argmax_idx[batch_size], :]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">       masked_v.append(tf.reshape(v, shape=(1, 1, 16, 1)))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">       self.masked_v = tf.concat(masked_v, axis=0)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">       assert self.masked_v.get_shape() == [cfg.batch_size, 1, 16, 1]</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">   # Method 2. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.2">masking with true label, default mode</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">   else:</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">     self.masked_v = tf.matmul(tf.squeeze(self.caps2), tf.reshape(self.Y, (-1, 10, 1)), transpose_a=True)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">     self.v_length = tf.sqrt(tf.reduce_sum(tf.square(self.caps2), axis=2, keep_dims=True) + epsilon)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">  # 2. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.2">Reconstruct the MNIST images with 3 FC layers</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1">  # [batch_size, 1, 16, 1] =&gt; [batch_size, 16] =&gt; [batch_size, 512] </span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">  with tf.variable_scope('Decoder'):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">    vector_j = tf.reshape(self.masked_v, shape=(cfg.batch_size, -1))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">    fc1 = tf.contrib.layers.fully_connected(vector_j, num_outputs=512)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">    assert fc1.get_shape() == [cfg.batch_size, 512]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">    fc2 = tf.contrib.layers.fully_connected(fc1, num_outputs=1024)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">    assert fc2.get_shape() == [cfg.batch_size, 1024]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1">    self.decoded = tf.contrib.layers.fully_connected(fc2, num_outputs=784, activation_fn=tf.sigmoid)</span></pre>
<ol start="8">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">Another important part defined in the paper is the margin loss function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.2">This is explained in the snippet quote from the paper below (Equation 4) and implemented in the loss(..) method which consists of three losses, the margin loss, the reconstruction loss and the total loss:</span></li>
</ol>
<div class="CDPAlignCenter CDPAlign"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1"><img class=" image-border" src="assets/20736fea-ef6c-43ae-9106-602a15f34251.png"/></span></div>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">def loss(self):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">  # 1. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.2">The margin loss</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">  # [batch_size, 10, 1, 1]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">  # max_l = max(0, m_plus-||v_c||)^2</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">  max_l = tf.square(tf.maximum(0., cfg.m_plus - self.v_length))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">  # max_r = max(0, ||v_c||-m_minus)^2</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">  max_r = tf.square(tf.maximum(0., self.v_length - cfg.m_minus))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">  assert max_l.get_shape() == [cfg.batch_size, 10, 1, 1]</span><br/>  <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">  # reshape: [batch_size, 10, 1, 1] =&gt; [batch_size, 10]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">  max_l = tf.reshape(max_l, shape=(cfg.batch_size, -1))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">  max_r = tf.reshape(max_r, shape=(cfg.batch_size, -1))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">  # calc T_c: [batch_size, 10]</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">  T_c = self.Y</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1">  # [batch_size, 10], element-wise multiply</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">  L_c = T_c * max_l + cfg.lambda_val * (1 - T_c) * max_r</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">  self.margin_loss = tf.reduce_mean(tf.reduce_sum(L_c, axis=1))</span><br/>  <br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">  # 2. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.2">The reconstruction loss</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1">  orgin = tf.reshape(self.X, shape=(cfg.batch_size, -1))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">  squared = tf.square(self.decoded - orgin)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1">  self.reconstruction_err = tf.reduce_mean(squared)</span><br/><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">  # 3. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.2">Total loss</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">  # The paper uses sum of squared error as reconstruction   error, but we</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">  # have used reduce_mean in `# 2 The reconstruction loss` to calculate</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">  # mean squared error. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.2">In order to keep in line with the paper,the</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">  # regularization scale should be 0.0005*784=0.392</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">  self.total_loss = self.margin_loss + cfg.regularization_scale * self.reconstruction_err</span></pre>
<ol start="9">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">In addition, it might be convenient to define </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">a _summary(...)</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1"> method to report the losses and the accuracy:</span></li>
</ol>
<pre><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">#Summary</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">def _summary(self):</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">  train_summary = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">  train_summary.append(tf.summary.scalar('train/margin_loss', self.margin_loss))train_summary.append(tf.summary.scalar('train/reconstruction_loss', self.reconstruction_err))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">  train_summary.append(tf.summary.scalar('train/total_loss', self.total_loss))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">  recon_img = tf.reshape(self.decoded, shape=(cfg.batch_size, 28, 28, 1))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1">  train_summary.append(tf.summary.image('reconstruction_img', recon_img))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">  correct_prediction = tf.equal(tf.to_int32(self.labels), self.argmax_idx)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">  self.batch_accuracy = tf.reduce_sum(tf.cast(correct_prediction, tf.float32))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">  self.test_acc = tf.placeholder_with_default(tf.constant(0.), shape=[])</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">  test_summary = []</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1">  test_summary.append(tf.summary.scalar('test/accuracy', self.test_acc))</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">  self.train_summary = tf.summary.merge(train_summary)</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1">  self.test_summary = tf.summary.merge(test_summary)</span></pre>
