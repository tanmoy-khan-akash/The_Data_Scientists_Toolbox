<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Our one hidden layer multilayered perceptron gave an accuracy of 84.45 on training data and 92.1 on test data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">It is good but not good enough. The MNIST database is used as a benchmark for classification problems in machine learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Next, we see how using TensorFlow's built-in optimizer affects network performance.</span></p>
