                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">There's more...</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">If you want to build directly from a TensorFlow source then you need to install Bazel and TensorFlow. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.2">Bazel is a fast, scalable, multi-language, and extensible build system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.3">Google uses the build tool Blaze internally and released the open source part of the Blaze tool as Bazel; the name is an anagram of Blaze.</span></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">This page will guide you through the process: </span><a href="https://github.com/tensorflow/tensorflow/tree/master/tensorflow/examples/android/"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">https://github.com/TensorFlow/TensorFlow/tree/master/TensorFlow/examples/android/.</span></a></p>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">If you are running macOS, the process is very simple:</span></p>
<ol>
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Install Bazel by following the instructions at </span><a href="https://docs.bazel.build/versions/master/install.html"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">https://docs.bazel.build/versions/master/install.html</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"> . </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">For macOS, we are going to use Homebrew:</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">/usr/bin/ruby -e "$(curl -fsSL \</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"> https://raw.githubusercontent.com/Homebrew/install/master/install)"</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">brew install bazel</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">bazel version</span><br/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">brew upgrade bazel</span></pre>
<ol start="2">
<li><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Clone the TensorFlow distribution from GitHub.</span></li>
</ol>
<pre style="padding-left: 60px"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">git clone https://github.com/TensorFlow/TensorFlow.git</span></pre>


            </article>
