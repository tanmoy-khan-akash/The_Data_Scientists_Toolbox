                            <header>
                    <h1 class="header-title"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Getting ready</span></h1>
                </header>
            
            <article>
                
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">The first thing to do is install OpenAI Gym; a minimal installation can be done using </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">pip install gym</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">The OpenAI gym provides a variety of environments, such as Atari, board games, and 2D or 3D physics engines. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">The minimal installation works on Windows and supports only basic environments--algorithmic, </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">toy_text</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">, and </span><kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">classic_control</span></kbd><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">--but if you want to explore other environments, they will need more dependencies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">The full make is supported in OS X and Ubuntu. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">Detailed instructions can be read at OpenAI Gym's GitHub link (</span><a href="https://github.com/openai/gym#installing-dependencies-for-specific-environments"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">https://github.com/openai/gym#installing-dependencies-for-specific-environments</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">).</span></p>


            </article>

            
        </section>
