                            <header>
                    <h1 class="header-title">Data redundancy</h1>
                </header>
            
            <article>
                
<p>Duplicates are common in data. Care should be taken so that the data present in the training, validation, and test sets are unique. If there are duplicates, then the model may not generalize well on unseen data.</p>


            </article>
