                    <h1 class="header-title">Encoder </h1>
                </header>
            
            <article>
                
<p>For an image captioning system, we will preferably use a trained architecture, such as ResNet or Inception, for extracting features from the image. Like we did for the ensemble model, we can output a fixed vector length by using a linear layer, and then make that linear layer trainable.</p>
