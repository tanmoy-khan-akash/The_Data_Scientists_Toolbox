                    <h1 class="header-title">Leaky ReLU</h1>
                </header>
            
            <article>
                
<p>Leaky ReLU is an attempt to solve a dying problem where, instead of saturating to zero, we saturate to a very small number such as 0.001. For some use cases, this activation function provides a superior performance to others, but it is not consistent.</p>
